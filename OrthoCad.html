<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORTHO / 2D drafting</title>
<style>
  :root{
    /* 2026 neutral CAD shell: dark surfaces, restrained blue state, low contrast transitions */
    color-scheme:dark;
    --ground:#191c21;
    --panel:#252a31;
    --panel-2:#20252c;
    --panel-3:#2b3038;
    --raised:#303640;
    --raised-2:#363d47;
    --rule:#3b424c;
    --rule-soft:#303741;
    --ink:#e5e9ef;
    --ink-dim:#a7b0bd;
    --ink-faint:#77818f;
    --pen:#62a6e8;
    --pen-strong:#78b7f1;
    --pen-soft:#263c50;
    --snap:#54c7c4;
    --alert:#ef8178;
    --grid-minor:#22272e;
    --grid-major:#2d343d;
    --axis:#46515e;
    --ui:"Segoe UI Variable", "Segoe UI", Inter, Arial, sans-serif;
    --mono:"Cascadia Mono", Consolas, "Courier New", monospace;
    --draft:"Arial", "Segoe UI", sans-serif;
    --shadow:0 8px 24px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--panel-2);color:var(--ink);font-family:var(--ui);font-size:12px;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  button,input,select{font-family:var(--ui)}
  button{color:inherit}
  #app{
    --ribbon-h:101px;
    --optbar-h:31px;
    --status-h:26px;
    --cmd-h:34px;
    display:grid;grid-template-columns:1fr 238px;
    grid-template-rows:34px var(--ribbon-h) var(--optbar-h) minmax(0,1fr) var(--status-h) var(--cmd-h);
    grid-template-areas:"top top" "ribbon ribbon" "optbar optbar" "canvas right" "status right" "cmd cmd";
    height:100%;background:var(--panel-2);
  }

  /* ---- application / document bar ---- */
  #top{
    grid-area:top;display:flex;align-items:center;gap:6px;background:#22272e;
    border-bottom:1px solid var(--rule-soft);padding:0 7px;box-shadow:0 1px 0 rgba(255,255,255,.02) inset;
  }
  .brand{
    height:100%;display:flex;align-items:center;gap:7px;padding:0 10px 0 4px;
    border-right:1px solid var(--rule-soft);color:var(--ink-dim);font-size:11.5px;
  }
  .brand::before{
    content:"O";display:grid;place-items:center;width:20px;height:20px;border-radius:4px;
    background:#2d6fa8;color:#f3f8fd;font-weight:700;font-size:11px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .brand b{font-weight:600;letter-spacing:.01em;color:var(--ink)}
  .workspace-tag{
    color:var(--ink-faint);font-size:10.5px;padding:3px 7px;border-right:1px solid var(--rule-soft);margin-right:2px;
  }
  .doc-tab{
    height:27px;min-width:190px;max-width:390px;display:flex;align-items:center;gap:7px;padding:0 10px;
    background:#2b3038;border:1px solid #39414b;border-bottom-color:#2b3038;border-radius:5px 5px 0 0;
    color:var(--ink-dim);position:relative;align-self:flex-end;
  }
  .doc-tab::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pen);opacity:.85;flex:0 0 auto}
  .filename{color:var(--ink-faint);font-size:11px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #fname{font-weight:500;color:var(--ink)}
  .spacer{flex:1}
  #counts{color:var(--ink-faint);font-size:10.5px;margin-right:4px}
  .top-action{
    height:25px;min-width:28px;padding:0 7px;border:1px solid transparent;border-radius:4px;background:transparent;
    color:var(--ink-dim);font-size:11px;cursor:pointer;
  }
  .top-action:hover{background:var(--raised);border-color:var(--rule);color:var(--ink)}
  .top-action[aria-pressed="true"]{background:var(--pen-soft);border-color:#365b7a;color:var(--pen-strong)}
  .top-action:focus-visible{outline:1px solid var(--pen);outline-offset:1px}

  /* ---- ribbon ---- */
  #ribbon{
    grid-area:ribbon;background:var(--panel);border-bottom:1px solid var(--rule);
    display:flex;flex-direction:column;box-shadow:0 3px 10px rgba(0,0,0,.08);overflow:hidden;min-height:0;
  }
  .rtabs{
    display:flex;gap:2px;padding:3px 7px 0;background:#23282f;border-bottom:1px solid var(--rule-soft);min-height:29px;
  }
  .rtab{
    font:inherit;font-size:11px;background:transparent;border:0;border-bottom:2px solid transparent;
    color:var(--ink-dim);padding:5px 10px 6px;cursor:pointer;border-radius:3px 3px 0 0;
  }
  .rtab:hover{color:var(--ink);background:#2c323a}
  .rtab[aria-selected="true"]{color:var(--ink);background:#2a3037;border-bottom-color:var(--pen)}
  .rtab:focus-visible{outline:1px solid var(--pen);outline-offset:-2px}
  .rpanels{
    display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;min-height:68px;padding:3px 5px 2px;
    scrollbar-width:thin;scrollbar-color:#4a5360 transparent;
  }
  .rpanel{
    display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--rule-soft);
    padding:2px 6px 0;flex:0 0 auto;
  }
  .rpanel:last-child{border-right:0}
  .rpanel-body{display:flex;align-items:flex-start;gap:2px;flex:1}
  .rpanel-label{text-align:center;font-size:9px;color:var(--ink-faint);padding:2px 1px 1px}
  .rcols{display:flex;flex-direction:column;gap:0}.rrow{display:flex;gap:1px}
  .big,.small{
    font:inherit;background:transparent;border:1px solid transparent;border-radius:4px;color:var(--ink-dim);
    cursor:pointer;display:flex;align-items:center;transition:background .08s linear,color .08s linear,border-color .08s linear;
  }
  .big{flex-direction:column;justify-content:flex-start;width:54px;min-height:52px;padding:4px 2px 2px;gap:2px;font-size:9.5px;line-height:1.08;text-align:center}
  .small{gap:4px;padding:2px 5px 2px 3px;font-size:10px;line-height:1.1;min-width:84px;min-height:19px;text-align:left}
  .big svg,.small svg{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .big svg{width:24px;height:24px}.small svg{width:14px;height:14px}
  .big:hover,.small:hover{color:var(--ink);background:var(--raised);border-color:#414a56}
  .big[aria-pressed="true"],.small[aria-pressed="true"]{color:#dceeff;background:var(--pen-soft);border-color:#3c6788;box-shadow:inset 0 0 0 1px rgba(98,166,232,.08)}
  .big:focus-visible,.small:focus-visible{outline:1px solid var(--pen);outline-offset:1px}
  .big .alias,.small .alias{color:inherit;opacity:.55;font-size:8.5px}
  .rpanel select,.rpanel input{
    background:#1f242a;border:1px solid var(--rule);border-radius:4px;color:var(--ink);font-size:10px;padding:2px 5px;height:21px;max-width:132px;
  }
  .rpanel select:focus,.rpanel input:focus{outline:1px solid var(--pen);outline-offset:-1px;border-color:var(--pen)}
  .rstack{display:flex;flex-direction:column;gap:2px}

  /* compact mode: keep tabs and contextual bar, surrender vertical space to drawing */
  #app.ribbon-compact .rpanels{display:none}
  #app.ribbon-compact #ribbon{box-shadow:none}
  /* no ghost row when the current tool has no contextual controls */
  #app:has(#optbar:empty){--optbar-h:0px}
  #app.bottom-compact{--status-h:0px}
  #app.bottom-compact #status{display:none}

  /* ---- contextual tool strip ---- */
  #optbar{
    grid-area:optbar;background:#20252c;border-bottom:1px solid var(--rule);display:flex;align-items:center;
    gap:10px;padding:4px 9px;font-size:11px;color:var(--ink-dim);overflow-x:auto;white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.018);
  }
  #optbar:empty{display:none}
  #optbar .context-name{
    display:inline-flex;align-items:center;height:21px;padding:0 8px 0 6px;margin-right:2px;border-right:1px solid var(--rule);
    color:#cfe5fa;font-weight:600;font-size:10.5px;
  }
  #optbar .context-name::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--pen);margin-right:7px}
  #optbar .oh{color:var(--ink-faint);text-transform:none;font-size:10px;letter-spacing:0;font-weight:500}
  #optbar label{display:flex;align-items:center;gap:5px;cursor:default;flex:0 0 auto}
  #optbar input[type=checkbox]{accent-color:#4d91cf;width:13px;height:13px;cursor:pointer;flex:0 0 auto}
  #optbar input[type=number],#optbar select{
    background:#191e24;border:1px solid var(--rule);border-radius:4px;color:var(--ink);font-size:10.5px;padding:2px 5px;height:22px;width:66px;
  }
  #optbar select{width:auto;min-width:82px}
  #optbar input:disabled{background:#20242a;color:#606a77;opacity:1}
  #optbar input:focus,#optbar select:focus{outline:1px solid var(--pen);outline-offset:-1px;border-color:var(--pen)}
  #optbar .swatch{width:11px;height:11px;border-radius:2px;border:1px solid #59636f;flex:0 0 auto}

  /* ---- canvas ---- */
  #stage{grid-area:canvas;position:relative;overflow:hidden;background:var(--ground);box-shadow:inset 0 0 0 1px rgba(255,255,255,.012)}
  #stage::before{
    content:"MODEL";position:absolute;left:9px;top:8px;z-index:2;pointer-events:none;color:#687381;font-size:9px;font-weight:600;
    letter-spacing:.08em;background:rgba(25,28,33,.72);border:1px solid #303741;border-radius:3px;padding:3px 5px;
  }
  canvas{display:block;width:100%;height:100%;cursor:crosshair;font-family:var(--draft)}
  canvas.panning{cursor:grabbing}canvas.picking{cursor:default}

  /* ---- viewport splitters: resize top ribbon and bottom command/status stack ---- */
  .shell-resizer{
    position:absolute;left:0;right:0;height:8px;z-index:20;cursor:row-resize;touch-action:none;
    background:transparent;outline:none;
  }
  .shell-resizer-top{top:0}
  .shell-resizer-bottom{bottom:0}
  .shell-resizer::after{
    content:"";position:absolute;left:50%;top:3px;transform:translateX(-50%);width:54px;height:2px;
    border-radius:2px;background:#53606d;opacity:.16;transition:opacity .12s linear,width .12s linear,background .12s linear;
  }
  .shell-resizer:hover::after,.shell-resizer:focus-visible::after,.shell-resizer.dragging::after{
    opacity:.9;width:86px;background:var(--pen);
  }
  body.shell-resizing{cursor:row-resize!important;user-select:none}
  body.shell-resizing *{cursor:row-resize!important}

  /* ---- status strip ---- */
  #status{
    grid-area:status;background:#20252c;border-top:1px solid var(--rule);display:flex;align-items:center;gap:0;padding:0 6px;
    font-size:10.5px;color:var(--ink-dim);overflow:hidden;min-height:0;
  }
  .coord{color:var(--ink-faint);min-width:184px;font-family:var(--mono);font-size:10px}.coord b{color:#cdd5df;font-weight:400}
  .toggles{display:flex;gap:2px;margin-left:auto;height:100%;align-items:center}
  .tg{
    font:inherit;font-size:9.5px;text-transform:none;background:transparent;border:1px solid transparent;border-radius:3px;color:var(--ink-faint);
    padding:2px 7px;cursor:pointer;min-width:38px;height:20px;
  }
  .tg:hover{background:var(--raised);color:var(--ink)}
  .tg[aria-pressed="true"]{color:#cde9ff;border-color:#355b79;background:#263c50}
  .tg:focus-visible{outline:1px solid var(--pen);outline-offset:1px}

  /* ---- right properties palette ---- */
  #right{
    grid-area:right;background:#21262d;border-left:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden;
    box-shadow:-6px 0 18px rgba(0,0,0,.06);
  }
  .sect-head{
    display:flex;align-items:center;justify-content:space-between;padding:6px 8px 5px;font-size:10.5px;font-weight:600;color:#cbd2dc;
    background:#272c33;border-top:1px solid rgba(255,255,255,.02);border-bottom:1px solid var(--rule-soft);
  }
  .sect-head button{
    font:inherit;font-size:14px;line-height:1;background:transparent;border:1px solid transparent;border-radius:3px;color:var(--ink-faint);cursor:pointer;padding:0 4px;
  }
  .sect-head button:hover{background:var(--raised);border-color:var(--rule);color:var(--ink)}
  #layers{overflow-y:auto;flex:0 1 auto;max-height:30%}#styles{overflow-y:auto;flex:0 1 auto;max-height:26%}
  .style-row,.layer{display:flex;align-items:center;gap:5px;padding:4px 7px;cursor:pointer;border-bottom:1px solid #292f36;background:#20252b}
  .style-row:hover,.layer:hover{background:#292f37}
  .style-row.current,.layer.current{background:#26394a;box-shadow:inset 2px 0 0 var(--pen)}
  .style-row.current .sname,.layer.current .lname{color:#e5f2ff;font-weight:600}
  .sname,.lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;color:#c1c8d1}
  .sweight{width:40px;background:#191e24;border:1px solid var(--rule);border-radius:3px;color:var(--ink);font:inherit;font-size:10px;padding:1px 3px;height:19px}
  .sweight:focus{outline:1px solid var(--pen);outline-offset:-1px;border-color:var(--pen)}
  .spat{width:30px;height:16px;flex:0 0 auto;background:#191e24;border:1px solid var(--rule);border-radius:3px;color:var(--ink-dim);cursor:pointer;position:relative}
  .spat:hover{background:var(--raised);border-color:#4c5865}.spat svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.5}
  .swatch{width:10px;height:10px;border-radius:2px;flex:0 0 auto;border:1px solid #69737f}
  .licon{width:16px;text-align:center;color:var(--ink-faint);font-size:10px;background:none;border:none;border-radius:2px;cursor:pointer;font-family:var(--ui)}
  .licon:hover{color:var(--ink);background:var(--raised)}.licon.on{color:var(--pen-strong)}.layer.hidden .lname{color:#68717d;text-decoration:line-through}

  #props{flex:1;overflow-y:auto;padding:0 0 8px;background:#20252b}
  .row{display:grid;grid-template-columns:82px minmax(0,1fr);align-items:center;gap:0;padding:0;font-size:10.5px;border-bottom:1px solid #2a3037;min-height:25px}
  .row label{color:#7f8996;padding:5px 7px;font-size:9.8px;text-transform:none;border-right:1px solid #2d343c;height:100%;display:flex;align-items:center}
  .row input[type=number],.row input[type=text],.row select{min-width:0;background:#1a1f25;border:0;border-radius:0;color:#dce1e8;font:inherit;font-size:10.5px;padding:4px 6px;height:24px;width:100%}
  .row input:hover,.row select:hover{background:#20262d}.row input:focus,.row select:focus{outline:1px solid var(--pen);outline-offset:-1px;background:#1d242b}
  #props .hint .small{display:inline-flex;min-width:0;width:auto;padding:5px 8px;margin:2px 3px 2px 0;vertical-align:middle;background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;color:var(--ink-dim)}#props .hint .small:hover{color:var(--ink);background:#343a43}
  .hint{padding:7px 8px;color:#6e7884;font-size:9.8px;line-height:1.45}.hint kbd{background:#2d333b;border:1px solid #434c57;border-radius:3px;padding:0 3px;color:#aeb7c2;font-family:var(--mono);font-size:9px}

  /* ---- command line ---- */
  #cmd{
    grid-area:cmd;background:#1d2228;border-top:1px solid var(--rule);display:flex;align-items:center;padding:0 7px;gap:7px;font-family:var(--mono);
    box-shadow:0 -4px 12px rgba(0,0,0,.06);overflow:hidden;min-height:0;
  }
  #prompt{color:#8cc5f3;white-space:nowrap;font-size:10.5px;font-family:var(--mono);font-weight:600}
  #cmdin{flex:1;background:#171b20;border:1px solid #39414a;border-radius:4px;color:#e1e7ef;font-family:var(--mono);font-size:10.5px;padding:3px 6px;height:23px}
  #cmdin:focus{outline:1px solid var(--pen);outline-offset:-1px;border-color:var(--pen);background:#191f25}
  #cmdin::placeholder{color:#59636f}
  #echo{color:#737d89;font-size:9.8px;white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis;text-align:right;font-family:var(--mono)}
  #echo.warn{color:var(--alert)}

  @media (max-width:900px){
    #app{grid-template-columns:1fr;grid-template-areas:"top" "ribbon" "optbar" "canvas" "status" "cmd"}
    #right{display:none}.small{min-width:0}.workspace-tag{display:none}.doc-tab{min-width:140px}
  }
  @media (prefers-reduced-motion:no-preference){.big,.small,.rtab,.tg,.top-action{transition:background .08s linear,color .08s linear,border-color .08s linear}}
</style>
</head>
<body>
<div id="app">

  <div id="top">
    <div class="brand"><b>ORTHO</b></div>
    <span class="workspace-tag">2D Drafting</span>
    <div class="doc-tab"><span class="filename" id="fname">untitled.dxf &middot; units mm</span></div>
    <span class="spacer"></span>
    <span class="filename" id="counts"></span>
    <button class="top-action" id="btn-compact" aria-pressed="false" title="Compact ribbon">Compact</button>
  </div>

  <div id="ribbon">
    <div class="rtabs" id="rtabs" role="tablist"></div>
    <div class="rpanels" id="rpanels"></div>
  </div>

  <div id="optbar"></div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="shell-resizer shell-resizer-top" id="resize-top" role="separator" aria-orientation="horizontal" aria-label="Resize ribbon" tabindex="0" title="Drag to resize ribbon · double-click to reset"></div>
    <div class="shell-resizer shell-resizer-bottom" id="resize-bottom" role="separator" aria-orientation="horizontal" aria-label="Resize command and status area" tabindex="0" title="Drag to resize bottom controls · double-click to reset"></div>
  </div>

  <div id="status">
    <span class="coord">X <b id="rx">0.000</b>&nbsp;&nbsp;Y <b id="ry">0.000</b></span>
    <span class="coord" id="rextra"></span>
    <span class="toggles">
      <button class="tg" id="tg-ortho" aria-pressed="false" title="F8">Ortho</button>
      <button class="tg" id="tg-grid" aria-pressed="true" title="F9">Grid</button>
      <button class="tg" id="tg-osnap" aria-pressed="true" title="F3">Osnap</button>
      <button class="tg" id="tg-edge" aria-pressed="true" title="Snap to strong edges in the reference image (F6)">Edge</button>
      <button class="tg" id="tg-weld" aria-pressed="true" title="Coincident points move together (F4)">Weld</button>
    </span>
  </div>

  <div id="right">
    <div class="sect-head"><span>Layers</span><button id="btn-addlayer" title="Add layer">+</button></div>
    <div id="layers"></div>
    <div class="sect-head"><span>Line Styles</span><button id="btn-addstyle" title="Add line style">+</button></div>
    <div id="styles"></div>
    <div class="sect-head"><span id="prop-title">Drawing</span></div>
    <div id="props"></div>
  </div>

  <div id="cmd">
    <span id="prompt">Command:</span>
    <input id="cmdin" autocomplete="off" spellcheck="false" placeholder="tool name, or  x,y   @dx,dy   len&lt;ang">
    <span id="echo"></span>
  </div>
</div>

<input type="file" id="filein" accept=".dxf,.DXF" style="display:none">
<input type="file" id="imagein" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" style="display:none">

<script>
"use strict";
/* ============================================================ constants */
const ACI = [
  {i:1,n:"red",     c:"#ff0000"},
  {i:2,n:"yellow",  c:"#ffff00"},
  {i:3,n:"green",   c:"#00ff00"},
  {i:4,n:"cyan",    c:"#00ffff"},
  {i:5,n:"blue",    c:"#4a6cff"},
  {i:6,n:"magenta", c:"#ff00ff"},
  {i:7,n:"white",   c:"#e8edf4"},
  {i:8,n:"grey",    c:"#808080"},
  {i:9,n:"ltgrey",  c:"#c0c0c0"},
  {i:30,n:"orange", c:"#ff7f00"}
];
const aciColor = i => (ACI.find(a=>a.i===i)||ACI[6]).c;

/* ============================================================ state */
const S = {
  ents: [],
  layers: [
    {name:"0",     aci:7, on:true, lock:false},
    {name:"WALLS", aci:4, on:true, lock:false},
    {name:"DIMS",  aci:2, on:true, lock:false}
  ],
  cur: 0,
  sel: new Set(),
  view: {cx:0, cy:0, s:2},
  tool: "select",
  ortho: false,
  gridSnap: true,
  osnap: true,
  gridStep: 10,
  textHeight: 2.5,
  refImage: null,      // tracing underlay; transform/crop metadata lives on the object
  edgeAssist: true,
  edgeThreshold: 62,
  groupSeq: 1,
  pending: [],        // picked points for the active tool
  base: null,         // move/copy base point
  mouse: {x:0,y:0, sx:0, sy:0},
  snapHit: null,
  hover: -1,
  band: null,         // window-select rubber band
  ask: null,          // pending command-bar question {label, cb}
  op: {},             // scratch state for multi-step modify tools
  weld: true,         // coincident points move together
  lastOffset: 100, lastFillet: 50, lastChamfer: 50,
  styles:[
    {name:"Thin Lines",    w:0.10, aci:7, pat:null},
    {name:"Medium Lines",  w:0.25, aci:7, pat:null},
    {name:"Wide Lines",    w:0.53, aci:7, pat:null},
    {name:"Thin Dashed",   w:0.10, aci:7, pat:[3,2]},
    {name:"Hidden",        w:0.18, aci:8, pat:[2,1.5]},
    {name:"Overhead",      w:0.18, aci:4, pat:[6,2,1,2]},
    {name:"Centreline",    w:0.13, aci:3, pat:[12,2,2,2]},
    {name:"Demolished",    w:0.18, aci:1, pat:[8,2,1,2,1,2]},
    {name:"Area Boundary", w:0.53, aci:6, pat:[10,3]}
  ],
  curStyle: 1,

/* ============================================================ geometry */
const V  = (x,y)=>({x,y});
const sub=(a,b)=>V(a.x-b.x,a.y-b.y);
const add=(a,b)=>V(a.x+b.x,a.y+b.y);
const mul=(a,k)=>V(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const norm=a=>{const l=len(a)||1;return V(a.x/l,a.y/l)};
const perp=a=>V(-a.y,a.x);
const ang =(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const TAU=Math.PI*2;
const wrap=a=>{a%=TAU;return a<0?a+TAU:a};
const deg=r=>r*180/Math.PI, rad=d=>d*Math.PI/180;

function ptSegDist(p,a,b){
  const ab=sub(b,a), t=Math.max(0,Math.min(1,(sub(p,a).x*ab.x+sub(p,a).y*ab.y)/(ab.x*ab.x+ab.y*ab.y||1)));
  return dist(p, add(a,mul(ab,t)));
}
function circumcenter(a,b,c){
  const d=2*(a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y));
  if(Math.abs(d)<1e-9) return null;
  const ux=((a.x**2+a.y**2)*(b.y-c.y)+(b.x**2+b.y**2)*(c.y-a.y)+(c.x**2+c.y**2)*(a.y-b.y))/d;
  const uy=((a.x**2+a.y**2)*(c.x-b.x)+(b.x**2+b.y**2)*(a.x-c.x)+(c.x**2+c.y**2)*(b.x-a.x))/d;
  return V(ux,uy);
}
/* 3-point arc -> {c,r,a0,a1} CCW from a0 to a1 passing through mid */
function arc3(p1,pm,p2){
  const c=circumcenter(p1,pm,p2); if(!c) return null;
  const r=dist(c,p1);
  let a0=wrap(ang(c,p1)), a1=wrap(ang(c,p2)), am=wrap(ang(c,pm));
  const inCCW=(s,e,t)=>{const S1=wrap(e-s), T=wrap(t-s); return T<=S1};
  if(!inCCW(a0,a1,am)){const t=a0;a0=a1;a1=t;}
  return {c,r,a0,a1};
}
function arcContains(e,a){
  const sweep=wrap(e.a1-e.a0);
  return wrap(a-e.a0) <= sweep+1e-9;
}
const MM=3.7795;                       /* print mm -> screen px */
function ellPts(e,n){
  n=n||72;
  const co=Math.cos(e.rot||0), si=Math.sin(e.rot||0), out=[];
  const sw=(e.sw==null?TAU:e.sw), a0=e.a0||0;
  const steps=Math.max(8, Math.round(n*Math.abs(sw)/TAU));
  for(let k=0;k<=steps;k++){
    const th=a0+sw*k/steps, x=e.rx*Math.cos(th), y=e.ry*Math.sin(th);
    out.push(V(e.c.x+x*co-y*si, e.c.y+x*si+y*co));
  }
  return out;
}
function splPts(e){
  const p=e.pts, n=p.length;
  if(n<3) return p.slice();
  const cl=!!e.closed, out=[];
  const at=i=> cl ? p[(i%n+n)%n] : p[Math.max(0,Math.min(n-1,i))];
  const last = cl? n-1 : n-2;
  for(let i=0;i<=last;i++){
    const p0=at(i-1),p1=at(i),p2=at(i+1),p3=at(i+2);
    for(let k=0;k<12;k++){
      const t=k/12,t2=t*t,t3=t2*t;
      out.push(V(
        0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
        0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)));
    }
  }
  out.push(cl? at(0) : p[n-1]);
  return out;
}
function flatten(e){
  if(e.t==="ellipse") return ellPts(e);
  if(e.t==="spline")  return splPts(e);
  if(e.t==="circle")  return ellPts({c:e.c,rx:e.r,ry:e.r,rot:0,a0:0,sw:TAU});
  if(e.t==="arc")     return ellPts({c:e.c,rx:e.r,ry:e.r,rot:0,a0:e.a0,sw:wrap(e.a1-e.a0)});
  return entPoints(e);
}
function entPoints(e){
  switch(e.t){
    case "line": return [e.a,e.b];
    case "pline": return e.pts.slice();
    case "circle": return [];
    case "arc": return [V(e.c.x+e.r*Math.cos(e.a0),e.c.y+e.r*Math.sin(e.a0)),
                         V(e.c.x+e.r*Math.cos(e.a1),e.c.y+e.r*Math.sin(e.a1))];
    case "dim": return [e.a,e.b];
    case "text": return [e.p];
    case "spline": return e.pts.slice();
    case "ellipse":
      return (e.sw!=null && Math.abs(Math.abs(e.sw)-TAU)>1e-9) ? [ellPts(e,4)[0], ellPts(e,4).slice(-1)[0]] : [];
  }
  return [];
}
function entMids(e){
  const out=[];
  if(e.t==="line") out.push(mul(add(e.a,e.b),.5));
  if(e.t==="dim")  out.push(mul(add(e.a,e.b),.5));
  if(e.t==="pline"){
    const n=e.pts.length;
    for(let i=0;i<n-1;i++) out.push(mul(add(e.pts[i],e.pts[i+1]),.5));
    if(e.closed&&n>2) out.push(mul(add(e.pts[n-1],e.pts[0]),.5));
  }
  return out;
}
function entCenters(e){
  if(e.t==="circle"||e.t==="arc"||e.t==="ellipse") return [e.c];
  return [];
}
function entQuads(e){
  if(e.t==="circle") return [V(e.c.x+e.r,e.c.y),V(e.c.x-e.r,e.c.y),V(e.c.x,e.c.y+e.r),V(e.c.x,e.c.y-e.r)];
  if(e.t==="ellipse"){
    const co=Math.cos(e.rot||0), si=Math.sin(e.rot||0), q=[];
    for(const [x,y] of [[e.rx,0],[-e.rx,0],[0,e.ry],[0,-e.ry]])
      q.push(V(e.c.x+x*co-y*si, e.c.y+x*si+y*co));
    return q;
  }
  return [];
}
function entHit(e,p,tol){
  switch(e.t){
    case "line": return ptSegDist(p,e.a,e.b)<=tol;
    case "dim":  return ptSegDist(p,e.a,e.b)<=tol*3;
    case "pline":{
      const n=e.pts.length;
      for(let i=0;i<n-1;i++) if(ptSegDist(p,e.pts[i],e.pts[i+1])<=tol) return true;
      if(e.closed&&n>2&&ptSegDist(p,e.pts[n-1],e.pts[0])<=tol) return true;
      return false;
    }
    case "circle": return Math.abs(dist(p,e.c)-e.r)<=tol;
    case "arc": {
      if(Math.abs(dist(p,e.c)-e.r)>tol) return false;
      return arcContains(e,wrap(ang(e.c,p)));
    }
    case "text": return dist(p,e.p)<=Math.max(tol, e.h);
    case "ellipse": case "spline":{
      const P=flatten(e);
      for(let i=0;i<P.length-1;i++) if(ptSegDist(p,P[i],P[i+1])<=tol) return true;
      if(e.t==="spline"&&e.closed&&P.length>2&&ptSegDist(p,P[P.length-1],P[0])<=tol) return true;
      return false;
    }
  }
  return false;
}
function entBox(e){
  const pts=[];
  if(e.t==="circle"||e.t==="arc"){
    pts.push(V(e.c.x-e.r,e.c.y-e.r),V(e.c.x+e.r,e.c.y+e.r));
  } else pts.push(...entPoints(e));
  if(e.t==="pline") pts.push(...e.pts);
  if(e.t==="ellipse"||e.t==="spline") pts.push(...flatten(e));
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  for(const p of pts){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}
  return {x0,y0,x1,y1};
}
function moveEnt(e,d){
  const m=p=>add(p,d);
  if(e.a) e.a=m(e.a); if(e.b) e.b=m(e.b);
  if(e.c) e.c=m(e.c); if(e.p) e.p=m(e.p);
  if(e.pts) e.pts=e.pts.map(m);
  return e;
}

/* ============================================================ view */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=window.devicePixelRatio||1;
  const r=cv.parentElement.getBoundingClientRect();
  W=Math.max(1,Math.round(r.width)); H=Math.max(1,Math.round(r.height));
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}
const X = wx => (wx - S.view.cx)*S.view.s + W/2;
const Y = wy => H/2 - (wy - S.view.cy)*S.view.s;
const wX = sx => (sx - W/2)/S.view.s + S.view.cx;
const wY = sy => S.view.cy - (sy - H/2)/S.view.s;
const px = n => n/S.view.s;   // pixels -> world units

/* ============================================================ history */
function snap(){
  S.undo.push(JSON.stringify(S.ents));
  if(S.undo.length>120) S.undo.shift();
  S.redo.length=0;
}
function undo(){
  if(!S.undo.length) return echo("Nothing to undo","warn");
  S.redo.push(JSON.stringify(S.ents));
  S.ents=JSON.parse(S.undo.pop()); S.sel.clear(); resetNudge(); draw(); updateProps(); echo("Undo");
}
function redo(){
  if(!S.redo.length) return echo("Nothing to redo","warn");
  S.undo.push(JSON.stringify(S.ents));
  S.ents=JSON.parse(S.redo.pop()); S.sel.clear(); resetNudge(); draw(); updateProps(); echo("Redo");
}

/* ============================================================ snapping */
function gridPitch(){
  let g=S.gridStep;
  while(g*S.view.s < 7)  g*=(String(g)[0]==="1"?2:(String(g)[0]==="2"?2.5:2));
  while(g*S.view.s > 70) g/=(String(g)[0]==="1"?2:(String(g)[0]==="2"?2.5:2));
  return g;
}
function resolveSnap(w){
  S.snapHit=null;
  const tol=px(11);
  if(S.osnap){
    let best=null, bestd=tol, bestk=0;
    const rank={end:4,center:3,quad:2,mid:1};
    for(const e of S.ents){
      const L=S.layers[e.li]; if(!L||!L.on) continue;
      const groups=[["end",entPoints(e)],["mid",entMids(e)],["center",entCenters(e)],["quad",entQuads(e)]];
      for(const [kind,pts] of groups){
        for(const p of pts){
          const d=dist(p,w);
          if(d<=tol && (d<bestd-1e-9 || (Math.abs(d-bestd)<1e-9 && rank[kind]>bestk))){
            best={p,kind}; bestd=d; bestk=rank[kind];
          }
        }
      }
    }
    if(best){ S.snapHit=best; return best.p; }
  }
  if(S.edgeAssist && S.refImage && S.refImage.visible){
    const ep=resolveImageEdgeSnap(w);
    if(ep){ S.snapHit={p:ep,kind:"edge"}; return ep; }
  }
  if(S.gridSnap){
    const g=gridPitch();
    return V(Math.round(w.x/g)*g, Math.round(w.y/g)*g);
  }
  return w;
}
function applyOrtho(p, from){
  if(!S.ortho||!from) return p;
  return Math.abs(p.x-from.x) >= Math.abs(p.y-from.y) ? V(p.x, from.y) : V(from.x, p.y);
}
function cursorPoint(){
  const raw=V(wX(S.mouse.sx), wY(S.mouse.sy));
  // Reference-image transform tools deliberately ignore drafting snaps.
  if(["imgcal","imgmove","imgstraight","imgcrop"].includes(S.tool)) return raw;
  let p=resolveSnap(raw);
  const from=S.pending.length? S.pending[S.pending.length-1] : (S.base||null);
  if(S.ortho && from && !S.snapHit) p=applyOrtho(p,from);
  return p;
}

/* ---- reference image geometry + raster edge assist -------------------- */
function refWorldToPixel(R,p){
  if(!R||!R.img||!(R.w>0)||!(R.h>0)) return null;
  const v=sub(p,V(R.x,R.y)), co=Math.cos(R.rot||0), si=Math.sin(R.rot||0);
  // inverse world rotation
  const lx=v.x*co+v.y*si, ly=-v.x*si+v.y*co;
  return V((lx/R.w+.5)*R.img.naturalWidth, (.5-ly/R.h)*R.img.naturalHeight);
}
function refPixelToWorld(R,px0,py0){
  const lx=(px0/R.img.naturalWidth-.5)*R.w, ly=(.5-py0/R.img.naturalHeight)*R.h;
  const co=Math.cos(R.rot||0), si=Math.sin(R.rot||0);
  return V(R.x+lx*co-ly*si, R.y+lx*si+ly*co);
}
function refPixelInCrop(R,x,y){
  const c=R.crop; return !c || (x>=c.sx && x<=c.sx+c.sw && y>=c.sy && y<=c.sy+c.sh);
}
function prepareReferenceEdges(R){
  if(!R||!R.img||!R.img.complete) return;
  const nw=R.img.naturalWidth, nh=R.img.naturalHeight, maxDim=1400;
  const k=Math.min(1,maxDim/Math.max(nw,nh));
  const ew=Math.max(8,Math.round(nw*k)), eh=Math.max(8,Math.round(nh*k));
  const c=document.createElement("canvas"); c.width=ew; c.height=eh;
  const g=c.getContext("2d",{willReadFrequently:true});
  g.drawImage(R.img,0,0,ew,eh);
  const d=g.getImageData(0,0,ew,eh).data, gray=new Uint8Array(ew*eh), edge=new Uint8Array(ew*eh);
  for(let i=0,j=0;i<d.length;i+=4,j++) gray[j]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;
  for(let y=1;y<eh-1;y++) for(let x=1;x<ew-1;x++){
    const i=y*ew+x;
    const gx=Math.abs(gray[i+1]-gray[i-1]), gy=Math.abs(gray[i+ew]-gray[i-ew]);
    edge[i]=Math.min(255,gx+gy);
  }
  R.edge={w:ew,h:eh,data:edge};
}
function resolveImageEdgeSnap(w){
  const R=S.refImage; if(!R||!R.edge||R.locked===undefined&&!R.img) return null;
  const p=refWorldToPixel(R,w); if(!p||!refPixelInCrop(R,p.x,p.y)) return null;
  const E=R.edge, ex=p.x/R.img.naturalWidth*E.w, ey=p.y/R.img.naturalHeight*E.h;
  const worldRad=px(11), edgePxWorld=R.w/E.w;
  const rr=Math.max(2,Math.min(18,Math.ceil(worldRad/Math.max(1e-9,edgePxWorld))));
  let best=null, bestScore=1e18;
  const x0=Math.max(1,Math.floor(ex-rr)),x1=Math.min(E.w-2,Math.ceil(ex+rr));
  const y0=Math.max(1,Math.floor(ey-rr)),y1=Math.min(E.h-2,Math.ceil(ey+rr));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const mag=E.data[y*E.w+x]; if(mag<S.edgeThreshold) continue;
    const npX=(x+.5)/E.w*R.img.naturalWidth, npY=(y+.5)/E.h*R.img.naturalHeight;
    if(!refPixelInCrop(R,npX,npY)) continue;
    const dd=(x-ex)*(x-ex)+(y-ey)*(y-ey);
    // nearest strong edge wins, with a small preference for stronger pixels
    const score=dd-mag*.0025;
    if(score<bestScore){bestScore=score;best=[npX,npY];}
  }
  return best?refPixelToWorld(R,best[0],best[1]):null;
}
