const SELOPS=["move","copy","mirror","rotate","scale","array","explode"];
// scale intentionally not pts:1 any more - see feed()/commit() for its own point-count logic
const PICKTOOLS=["trimcorner","trimsingle","trimmultiple","offset","fillet","chamfer","pickLines"];
function setTool(t){
  S.pending=[]; S.base=null; S.band=null; S.op={}; S.ask=null; S.chainPrev=null; resetNudge();
  if(["imgmove","imgcal","imgstraight","imgcrop"].includes(t) && !S.refImage){ echo("Load a reference image first","warn"); t="select"; }
  if(["imgmove","imgcal","imgstraight","imgcrop"].includes(t) && S.refImage && S.refImage.locked){ echo("Reference image is locked","warn"); t="select"; }
  if(SELOPS.includes(t) && !S.sel.size){
    echo("Select objects first","warn"); S.tool="select"; paintRibbon(); paintOptbar(); setPrompt(); draw(); return;
  }
  if(!SELOPS.includes(t) && t!=="select") S.sel.clear();
  S.tool=t;
  paintRibbon(); paintOptbar(); setPrompt(); draw();
  document.getElementById("cmdin").focus();
  if(t==="explode"){ explodeSel(); S.tool="select"; paintRibbon(); setPrompt(); return; }
  if(t==="array")  { askArray(); return; }
  if(t==="offset"){
    S.op={stage:"pick", d:S.lastOffset};
    say("Pick object to offset");
    return; }
  if(t==="pickLines"){
    S.op={stage:"pick", d:Math.max(0,S.drawOffset)};
    say("Pick a line to offset");
    return; }
  if(t==="fillet"||t==="chamfer"){
    S.op={r: t==="fillet"? S.lastFillet : S.lastChamfer};
    say("Pick first line");
    return; }
}
function say(t){ S.op.prompt=t; document.getElementById("prompt").textContent=t+":"; }
function askArray(){
  requestString("Columns,Rows", "3,2", v=>{
    const m=/^(\d+)\s*,\s*(\d+)$/.exec(v.trim());
    if(!m){ echo("Give it as columns,rows","warn"); setTool("select"); return; }
    const cols=+m[1], rows=+m[2];
    if(cols*rows>4000){ echo("That is over 4000 copies","warn"); setTool("select"); return; }
    requestString("Column spacing,Row spacing", "1000,1000", v2=>{
      const n=/^(-?[\d.]+)\s*,\s*(-?[\d.]+)$/.exec(v2.trim());
      if(!n){ echo("Give it as dx,dy","warn"); setTool("select"); return; }
      const dx=parseFloat(n[1]), dy=parseFloat(n[2]);
      snap();
      const src=[...S.sel].map(i=>S.ents[i]);
      let made=0;
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
        if(!r&&!c) continue;
        const batch=cloneEntitiesFreshGroups(src);
        for(const e of batch){ S.ents.push(moveEnt(e,V(c*dx,r*dy))); made++; }
      }
      S.sel.clear(); draw(); updateProps();
      echo("Array: "+made+" copies");
      S.tool="select"; paintRibbon(); setPrompt();
    });
  });
}

/* command-bar question: modals are blocked in sandboxed frames, so ask here */
function requestString(label, initial, cb){
  S.ask={label,cb};
  document.getElementById("prompt").textContent=label+":";
  const el=document.getElementById("cmdin");
  el.value=initial||""; el.focus(); el.select();
}
function setPrompt(){
  if(S.ask){ document.getElementById("prompt").textContent=S.ask.label+":"; return; }
  if(S.op && S.op.prompt){ document.getElementById("prompt").textContent=S.op.prompt+":"; return; }
  const T=TOOLS[S.tool];
  if(!T.prompts){ document.getElementById("prompt").textContent="Command:"; return; }
  const i=Math.min(S.pending.length + (S.base?1:0), T.prompts.length-1);
  let txt = T.pts===0 ? "Command:" : T.prompts[i]+":";
  if((S.tool==="pline"||S.tool==="spline")&&S.pending.length) txt="Next point or Enter to finish:";
  if(S.tool==="line"&&S.chain&&S.pending.length) txt="Next point or Enter to finish chain:";
  if((S.tool==="move"||S.tool==="copy")) txt = (S.base?"Destination":"Base point")+":";
  document.getElementById("prompt").textContent=txt;
}
function echo(m,cls){
  const el=document.getElementById("echo");
  el.textContent=m||""; el.className=cls||"";
}

/* commit a picked point into the active tool */
function feed(p){
  const T=TOOLS[S.tool];
  if(S.tool==="select"){ return; }
  if(S.tool==="move"||S.tool==="copy"){
    if(!S.base){ S.base=p; setPrompt(); return; }
    const d=sub(p,S.base); snap();
    if(S.tool==="move"){
      const w=applyDelta([...S.sel], d, true);
      echo("Moved "+S.sel.size+" object(s)"+(w?"  ("+w+" joined point"+(w>1?"s":"")+" followed)":""));
      S.base=null;
    } else {
      const copies=cloneEntitiesFreshGroups([...S.sel].map(i=>S.ents[i])).map(e=>moveEnt(e,d));
      S.ents.push(...copies);
      echo("Copied "+S.sel.size+" object(s)");
      if(!S.copyMultiple){ setTool("select"); return; }
      /* Multiple: base stays fixed, so the next click is another destination from the same origin */
    }
    setPrompt(); draw(); updateProps();
    return;
  }
  if(S.tool==="line" && S.chain) return feedChainLine(p);
  if(S.tool==="scale"){
    S.pending.push(p);
    const need = S.scaleMode==="numerical" ? 1 : 3;
    if(S.pending.length>=need) commit(); else setPrompt();
    draw();
    return;
  }
  if(TOOLS[S.tool].pts===-1){                       // pline / spline: unlimited points
    if(S.pending.length && dist(S.pending[S.pending.length-1],p)<1e-9) return;
    S.pending.push(p); setPrompt(); draw(); return;
  }
  S.pending.push(p);
  if(T.pts>0 && S.pending.length>=T.pts) commit();
  else setPrompt();
  draw();
}
/* Revit-style Chain: each segment commits immediately as its own line entity,
   sharing an endpoint with the last (weld picks that up), instead of building
   one polyline. Radius auto-fillets the corner between consecutive segments. */
function feedChainLine(p){
  if(!S.pending.length){ S.pending=[applyDrawOffsetStart(p)]; setPrompt(); draw(); return; }
  let a=S.pending[0], b=p;
  if(S.drawOffset){ const o=drawOffsetVec(a,b); a=add(a,o); b=add(b,o); }
  if(dist(a,b)>1e-9){
    snap();
    S.ents.push({t:"line", li:S.cur, si:S.curStyle, a, b});
    const newIdx=S.ents.length-1;
    if(S.useRadius && S.chainRadius>0 && S.chainPrev!=null){
      filletPair(S.chainPrev, S.ents[S.chainPrev].a, newIdx, b, S.chainRadius, false, true);
    }
    S.chainPrev=newIdx;
  }
  S.pending=[p]; setPrompt(); draw();
}
function applyDrawOffsetStart(p){ return p; }
function drawOffsetVec(a,b){
  const d=norm(sub(b,a)); if(!isFinite(d.x)) return V(0,0);
  return mul(perp(d), S.drawOffset);
}
function commit(){
  const P=S.pending, li=S.cur, si=S.curStyle;
  let e=null;
  switch(S.tool){
    case "imgmove": {
      if(!S.refImage){ S.pending=[]; setTool("select"); return; }
      const d=sub(P[1],P[0]);
      S.refImage.x+=d.x; S.refImage.y+=d.y;
      S.pending=[]; echo("Reference image moved"); setTool("select"); updateProps(); draw(); return;
    }
    case "imgcal": {
      if(!S.refImage){ S.pending=[]; setTool("select"); return; }
      const a=V(P[0].x,P[0].y), b=V(P[1].x,P[1].y), measured=dist(a,b);
      S.pending=[];
      if(measured<1e-9){ echo("Calibration points are coincident","warn"); setTool("select"); return; }
      requestString("Known distance in mm", measured.toFixed(3), v=>{
        const actual=parseFloat(v);
        if(!(actual>0)){ echo("Known distance must be greater than zero","warn"); setTool("select"); return; }
        const k=actual/measured, R=S.refImage;
        R.x=a.x+(R.x-a.x)*k; R.y=a.y+(R.y-a.y)*k;
        R.w*=k; R.h*=k;
        echo("Reference calibrated: "+fmt(measured)+" -> "+fmt(actual)+" mm");
        setTool("select"); updateProps(); draw();
      });
      return;
    }
    case "imgstraight": {
      const R=S.refImage; S.pending=[];
      if(!R||R.locked){ echo("Reference image is unavailable or locked","warn"); setTool("select"); return; }
      const a=P[0], b=P[1], th=ang(a,b);
      if(dist(a,b)<1e-9){echo("Pick two different points","warn");setTool("select");return;}
      const target=Math.round(th/(Math.PI/2))*(Math.PI/2), dth=target-th;
      const v=sub(V(R.x,R.y),a), co=Math.cos(dth), si=Math.sin(dth);
      R.x=a.x+v.x*co-v.y*si; R.y=a.y+v.x*si+v.y*co; R.rot=(R.rot||0)+dth;
      echo("Reference straightened by "+fmt(deg(dth))+"°"); setTool("select"); updateProps(); draw(); return;
    }
    case "imgcrop": {
      const R=S.refImage; S.pending=[];
      if(!R||R.locked){ echo("Reference image is unavailable or locked","warn"); setTool("select"); return; }
      const a=refWorldToPixel(R,P[0]), b=refWorldToPixel(R,P[1]);
      if(!a||!b){setTool("select");return;}
      const nw=R.img.naturalWidth, nh=R.img.naturalHeight;
      const x0=Math.max(0,Math.min(nw,Math.min(a.x,b.x))), x1=Math.max(0,Math.min(nw,Math.max(a.x,b.x)));
      const y0=Math.max(0,Math.min(nh,Math.min(a.y,b.y))), y1=Math.max(0,Math.min(nh,Math.max(a.y,b.y)));
      if(x1-x0<4||y1-y0<4){echo("Crop is too small","warn");setTool("select");return;}
      R.crop={sx:x0,sy:y0,sw:x1-x0,sh:y1-y0};
      echo("Reference cropped to working area"); setTool("select"); updateProps(); draw(); return;
    }
    case "line": {
      let a=P[0], b=P[1];
      if(S.drawOffset){ const o=drawOffsetVec(a,b); a=add(a,o); b=add(b,o); }
      if(dist(a,b)>1e-9) e={t:"line",li,si,a,b};
      break;
    }
    case "rect": e={t:"pline",li,si,closed:true,pts:[
        V(P[0].x,P[0].y),V(P[1].x,P[0].y),V(P[1].x,P[1].y),V(P[0].x,P[1].y)]}; break;
    case "circle":{const r=dist(P[0],P[1]); if(r>1e-9) e={t:"circle",li,si,c:P[0],r};break;}
    case "arc":{const a=arc3(P[0],P[2],P[1]); if(a) e={t:"arc",li,si,...a}; break;}
    case "arccenter":{
      const r=dist(P[0],P[1]);
      if(r>1e-9) e={t:"arc",li,si,c:P[0],r,a0:wrap(ang(P[0],P[1])),a1:wrap(ang(P[0],P[2]))};
      break;
    }
    case "ellipse": case "pellipse":{
      const rx=dist(P[0],P[1]), rot=ang(P[0],P[1]);
      const axisDir=V(Math.cos(rot),Math.sin(rot)), nrm=perp(axisDir);
      const v1=sub(P[2],P[0]), ry=Math.abs(v1.x*nrm.x+v1.y*nrm.y);
      if(rx<1e-9||ry<1e-9){ echo("Ellipse has zero width","warn"); break; }
      if(S.tool==="ellipse"){ e={t:"ellipse",li,si,c:P[0],rx,ry,rot,a0:0,sw:TAU}; break; }
      const localAngle=q=>{ const v=sub(q,P[0]); return Math.atan2((v.x*nrm.x+v.y*nrm.y)/ry, (v.x*axisDir.x+v.y*axisDir.y)/rx); };
      const a0=wrap(localAngle(P[3])), a1=wrap(localAngle(P[4]));
      e={t:"ellipse",li,si,c:P[0],rx,ry,rot,a0,sw:wrap(a1-a0)};
      break;
    }
    case "polygon":{
      const n=S.polySides, R=dist(P[0],P[1]), a0=ang(P[0],P[1]);
      if(R<1e-9){ echo("Polygon has zero size","warn"); break; }
      const circumR = S.polyInscribed? R : R/Math.cos(Math.PI/n);
      const rotOff = S.polyInscribed? 0 : Math.PI/n;
      const pts=[];
      for(let k=0;k<n;k++){ const th=a0-rotOff+k*(TAU/n); pts.push(V(P[0].x+circumR*Math.cos(th), P[0].y+circumR*Math.sin(th))); }
      e={t:"pline",li,si,closed:true,pts};
      break;
    }
    case "pline": if(P.length>1) e={t:"pline",li,si,closed:false,pts:P.slice()}; break;
    case "spline": if(P.length>1){
        const closed=dist(P[0],P[P.length-1])<=px(11);
        e={t:"spline",li,si,closed,pts:closed?P.slice(0,-1):P.slice()};
      } break;
    case "dim":{
      const d=norm(sub(P[1],P[0])), n=perp(d), off=(sub(P[2],P[0]).x*n.x+sub(P[2],P[0]).y*n.y);
      e={t:"dim",li,a:P[0],b:P[1],off,h:S.textHeight}; break;
    }
    case "mirror":{
      const A=P[0], B=P[1];
      if(dist(A,B)<1e-9){ echo("Mirror line has no length","warn"); S.pending=[]; return; }
      snap();
      const src=[...S.sel].map(i=>S.ents[i]);
      const made=(S.copyMirror?cloneEntitiesFreshGroups(src):src.map(clone)).map(e=>mirEnt(e,A,B));
      if(S.copyMirror) S.ents.push(...made);
      else { const keep=S.ents.filter((_,i)=>!S.sel.has(i)); S.ents=keep.concat(made); }
      S.pending=[]; setTool("select"); draw(); updateProps();
      echo((S.copyMirror?"Mirrored a copy of ":"Mirrored ")+made.length+" object(s)");
      return;
    }
    case "rotate":{
      const th=ang(P[0],P[1]);
      snap();
      if(S.copyRotate) S.ents.push(...cloneEntitiesFreshGroups([...S.sel].map(i=>S.ents[i])).map(e=>rotEnt(e,P[0],th)));
      else for(const i of S.sel) rotEnt(S.ents[i],P[0],th);
      S.pending=[]; draw(); updateProps();
      echo((S.copyRotate?"Rotated a copy of ":"Rotated ")+S.sel.size+" object(s) by "+fmt(deg(wrap(th)))+"\u00B0");
      return;
    }
    case "scale":{
      snap();
      let k, desc;
      if(S.scaleMode==="numerical"){
        k=S.lastScaleFactor;
        if(!k||k===0){ echo("Set a scale factor first","warn"); S.pending=[]; return; }
        desc="by "+fmt(k);
      } else {
        const origin=P[0], from=dist(origin,P[1]), to=dist(origin,P[2]);
        if(from<1e-9){ echo("Reference point is on the origin","warn"); S.pending=[]; return; }
        k=to/from; S.lastScaleFactor=k;
        desc="by "+fmt(k)+"  ("+fmt(from)+" \u2192 "+fmt(to)+")";
      }
      for(const i of S.sel) sclEnt(S.ents[i],P[0],k);
      S.pending=[]; draw(); updateProps();
      echo("Scaled "+S.sel.size+" object(s) "+desc);
      return;
    }
    case "text":{
      const at=P[0];
      S.pending=[];
      requestString("Text", "", s=>{
        if(s){ snap(); S.ents.push({t:"text",li,p:at,h:S.textHeight,s,rot:0}); echo("Text added"); }
        setPrompt(); draw();
      });
      return;
    }
  }
  if(e){ snap(); S.ents.push(e); echo(TOOLS[S.tool].label+" added"); }
  S.pending=[]; setPrompt(); draw();
}
function finishPline(){
  if((S.tool==="pline"||S.tool==="spline")&&S.pending.length>1) commit();
  else { S.pending=[]; setPrompt(); draw(); }
}
function finishChain(){
  S.pending=[]; S.chainPrev=null; setPrompt(); draw();
}
function cancel(){
  if(S.ask){ S.ask=null; setPrompt(); echo(""); return; }
  S.pending=[]; S.base=null; S.band=null; S.op={}; S.chainPrev=null;
  if(S.tool!=="select") setTool("select"); else { S.sel.clear(); draw(); updateProps(); }
  echo("");
}
function eraseSel(){
  if(!S.sel.size) return;
  snap();
  const keep=S.ents.filter((_,i)=>!S.sel.has(i));
  const n=S.sel.size; S.ents=keep; S.sel.clear(); resetNudge(); draw();
  echo("Erased "+n+" object(s)");
}


/* ============================================================ intersections */
function lineLineInt(p1,p2,p3,p4){
  const d1=sub(p2,p1), d2=sub(p4,p3), den=d1.x*d2.y-d1.y*d2.x;
  if(Math.abs(den)<1e-12) return null;
  const dp=sub(p3,p1);
  const t=(dp.x*d2.y-dp.y*d2.x)/den, u=(dp.x*d1.y-dp.y*d1.x)/den;
  return {p:add(p1,mul(d1,t)), t, u};
}
function lineCircleInt(p1,p2,c,r){
  const d=sub(p2,p1), f=sub(p1,c);
  const A=d.x*d.x+d.y*d.y, B=2*(f.x*d.x+f.y*d.y), C=f.x*f.x+f.y*f.y-r*r;
  let disc=B*B-4*A*C; if(disc<0||A<1e-18) return [];
  disc=Math.sqrt(disc);
  const ts=[(-B-disc)/(2*A)];
  if(disc>1e-12) ts.push((-B+disc)/(2*A));
  return ts.map(t=>({t,p:add(p1,mul(d,t))}));
}
function circleCircleInt(c1,r1,c2,r2){
  const D=dist(c1,c2);
  if(D<1e-12 || D>r1+r2+1e-12 || D<Math.abs(r1-r2)-1e-12) return [];
  const a=(r1*r1-r2*r2+D*D)/(2*D), h=Math.sqrt(Math.max(0,r1*r1-a*a));
  const u=norm(sub(c2,c1)), pm=add(c1,mul(u,a)), n=perp(u);
  return h<1e-12 ? [pm] : [add(pm,mul(n,h)), sub(pm,mul(n,h))];
}
function curvesOf(e){
  switch(e.t){
    case "line":   return [{k:"seg",a:e.a,b:e.b}];
    case "circle": return [{k:"circ",c:e.c,r:e.r}];
    case "arc":    return [{k:"arc",c:e.c,r:e.r,a0:e.a0,a1:e.a1}];
    case "pline":{
      const out=[], n=e.pts.length;
      for(let i=0;i<n-1;i++) out.push({k:"seg",a:e.pts[i],b:e.pts[i+1]});
      if(e.closed&&n>2) out.push({k:"seg",a:e.pts[n-1],b:e.pts[0]});
      return out;
    }
    case "ellipse": case "spline":{
      const P=flatten(e), out=[];
      for(let i=0;i<P.length-1;i++) out.push({k:"seg",a:P[i],b:P[i+1]});
      if(e.t==="spline"&&e.closed&&P.length>2) out.push({k:"seg",a:P[P.length-1],b:P[0]});
      return out;
    }
  }
  return [];
}
function onCurve(C,p,ext){
  if(ext) return true;
  if(C.k==="seg"){
    const d=sub(C.b,C.a), L2=d.x*d.x+d.y*d.y||1;
    const t=((p.x-C.a.x)*d.x+(p.y-C.a.y)*d.y)/L2;
    return t>=-1e-7 && t<=1+1e-7;
  }
  if(C.k==="circ") return true;
  if(C.k==="arc")  return arcContains({a0:C.a0,a1:C.a1}, wrap(ang(C.c,p)));
  return false;
}
function curveInt(A,B,extA,extB){
  let pts=[];
  if(A.k==="seg"&&B.k==="seg"){ const r=lineLineInt(A.a,A.b,B.a,B.b); if(r) pts=[r.p]; }
  else if(A.k==="seg") pts=lineCircleInt(A.a,A.b,B.c,B.r).map(o=>o.p);
  else if(B.k==="seg") pts=lineCircleInt(B.a,B.b,A.c,A.r).map(o=>o.p);
  else pts=circleCircleInt(A.c,A.r,B.c,B.r);
  return pts.filter(p=>onCurve(A,p,extA)&&onCurve(B,p,extB));
}
function entInt(e1,e2,ext1,ext2){
  const out=[];
  for(const A of curvesOf(e1)) for(const B of curvesOf(e2)) out.push(...curveInt(A,B,ext1,ext2));
  return out;
}
function paramOn(e,p){
  if(e.t==="line"){ const d=sub(e.b,e.a); return ((p.x-e.a.x)*d.x+(p.y-e.a.y)*d.y)/(d.x*d.x+d.y*d.y||1); }
  if(e.t==="circle") return wrap(ang(e.c,p));
  if(e.t==="arc")    return wrap(ang(e.c,p)-e.a0);
  return 0;
}
function projOnLine(e,p){
  const d=sub(e.b,e.a), t=((p.x-e.a.x)*d.x+(p.y-e.a.y)*d.y)/(d.x*d.x+d.y*d.y||1);
  return add(e.a,mul(d,t));
}
function drawingSpan(){
  if(!S.ents.length) return 1000;
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  for(const e of S.ents){const b=entBox(e);
    x0=Math.min(x0,b.x0);y0=Math.min(y0,b.y0);x1=Math.max(x1,b.x1);y1=Math.max(y1,b.y1);}
  return Math.max(1000, Math.hypot(x1-x0,y1-y0)*20);
}
function others(idx){
  return S.ents.map((e,j)=>({e,j})).filter(o=>o.j!==idx && (S.layers[o.e.li]||{on:true}).on);
}

/* ============================================================ welding */
/* Coincident points move together: this is what makes attached walls and
   their dimensions follow when one wall is moved. */
function nodeRefs(e){
  const out=[];
  const R=(get,set)=>out.push({p:get,set});
  switch(e.t){
    case "line": case "dim": R(e.a,v=>e.a=v); R(e.b,v=>e.b=v); break;
    case "text": R(e.p,v=>e.p=v); break;
    case "circle": case "arc": R(e.c,v=>e.c=v); break;
    case "pline": case "spline": e.pts.forEach((p,i)=>R(p,v=>e.pts[i]=v)); break;
    case "ellipse": R(e.c,v=>e.c=v); break;
  }
  return out;
}
const WELD_TOL=1e-6;
function applyDelta(indices,d,weld){
  const idx=new Set(indices);
  const anchors=[];
  for(const i of idx){ const e=S.ents[i]; if(!e) continue;
    anchors.push(...entPoints(e), ...entCenters(e)); }
  for(const i of idx) if(S.ents[i]) moveEnt(S.ents[i],d);
  if(!weld || !S.weld) return 0;
  let welded=0;
  S.ents.forEach((e,j)=>{
    if(idx.has(j)) return;
    if((S.layers[e.li]||{}).lock) return;
    for(const ref of nodeRefs(e)){
      if(anchors.some(a=>Math.abs(a.x-ref.p.x)<WELD_TOL && Math.abs(a.y-ref.p.y)<WELD_TOL)){
        ref.set(add(ref.p,d)); welded++;
      }
    }
  });
  return welded;
}

/* ============================================================ transforms */
function mapEnt(e,M){
  if(e.a) e.a=M(e.a); if(e.b) e.b=M(e.b);
  if(e.c) e.c=M(e.c); if(e.p) e.p=M(e.p);
  if(e.pts) e.pts=e.pts.map(M);
  return e;
}
function rotEnt(e,base,th){
  const c=Math.cos(th), s=Math.sin(th);
  mapEnt(e,p=>{const v=sub(p,base); return add(base,V(v.x*c-v.y*s, v.x*s+v.y*c));});
  if(e.t==="arc"){ e.a0=wrap(e.a0+th); e.a1=wrap(e.a1+th); }
  if(e.t==="ellipse") e.rot=(e.rot||0)+th;
  if(e.t==="text") e.rot=(e.rot||0)+th;
  return e;
}
function sclEnt(e,base,k){
  mapEnt(e,p=>add(base,mul(sub(p,base),k)));
  if(e.r!=null) e.r*=Math.abs(k);
  if(e.rx!=null){ e.rx*=Math.abs(k); e.ry*=Math.abs(k); }
  if(e.h!=null) e.h*=Math.abs(k);
  if(e.off!=null) e.off*=k;
  return e;
}
function mirEnt(e,A,B){
  const phi=ang(A,B), c2=Math.cos(2*phi), s2=Math.sin(2*phi);
  mapEnt(e,p=>{const v=sub(p,A); return add(A,V(v.x*c2+v.y*s2, v.x*s2-v.y*c2));});
  if(e.t==="arc"){ const a0=wrap(2*phi-e.a1), a1=wrap(2*phi-e.a0); e.a0=a0; e.a1=a1; }
  if(e.t==="ellipse"){ const sw=e.sw==null?TAU:e.sw; e.a0=-( (e.a0||0)+sw ); e.rot=2*phi-(e.rot||0); }
  if(e.t==="text") e.rot=wrap(2*phi-(e.rot||0));
  if(e.t==="dim")  e.off=-e.off;
  return e;
}
const clone=e=>JSON.parse(JSON.stringify(e));
function freshGroupId(){ return "G"+(S.groupSeq++); }
function cloneEntitiesFreshGroups(src){
  const remap=new Map();
  return src.map(e=>{
    const c=clone(e);
    if(c.gid){ if(!remap.has(c.gid)) remap.set(c.gid,freshGroupId()); c.gid=remap.get(c.gid); }
    return c;
  });
}
function groupIndices(gid){
  const out=[]; if(!gid) return out;
  S.ents.forEach((e,i)=>{if(e.gid===gid)out.push(i)}); return out;
}
function expandSelectionGroups(){
  const gids=new Set([...S.sel].map(i=>S.ents[i]&&S.ents[i].gid).filter(Boolean));
  for(const gid of gids) for(const i of groupIndices(gid)) S.sel.add(i);
}
function groupSelection(){
  if(S.sel.size<2) return echo("Select two or more objects to group","warn");
  requestString("Group name", "Group "+S.groupSeq, name=>{
    snap();
    const gid=freshGroupId(), nm=(name||gid).trim()||gid;
    for(const i of S.sel){ if(S.ents[i]){S.ents[i].gid=gid;S.ents[i].gname=nm;} }
    draw(); updateProps(); echo("Grouped "+S.sel.size+" objects as "+nm);
  });
}
function ungroupSelection(){
  if(!S.sel.size) return echo("Select a group first","warn");
  expandSelectionGroups(); let n=0; snap();
  for(const i of S.sel){ const e=S.ents[i]; if(e&&e.gid){delete e.gid;delete e.gname;n++;} }
  draw(); updateProps(); echo(n?"Ungrouped "+n+" objects":"Selection is not grouped");
}

/* ============================================================ modify ops */
/* Revit's Trim/Extend to Corner: pick the part of each of two elements you want
   to keep, and both get pulled in or pushed out - whichever each one needs - to
   meet at a single clean joint. This is fillet with a zero radius: filletPair's
   cut() already sets each near endpoint to the corner regardless of whether that
   endpoint currently falls short of it (extend) or past it (trim). */
function trimExtendCorner(i1,p1,i2,p2){
  const ok=filletPair(i1,p1,i2,p2,0,false);
  if(ok) echo("Joined at corner");
}

/* Shared by Trim/Extend Single Element and Trim/Extend Multiple Elements: move
   the picked-near end of a line or arc to meet ONE boundary reference. Also
   auto-detects trim vs extend from geometry - there is no separate mode. */
function trimExtendToBoundary(ti,bi,pickPt){
  const e=S.ents[ti], b=S.ents[bi];
  if(ti===bi) return echo("Pick a different element as the target","warn");
  if(!(e.t==="line"||e.t==="arc")) return echo("Trim/Extend works on lines and arcs","warn");
  const cand=entInt(e,b,true,true);
  if(!cand.length) return echo("That boundary does not reach this element","warn");
  const tp=paramOn(e,pickPt);
  let best=null, bd=1e18;
  for(const q of cand){ const d=Math.abs(paramOn(e,q)-tp); if(d<bd){ bd=d; best=q; } }
  /* Which end moves depends on which side of the BOUNDARY's own crossing point the
     pick falls on - not a fixed midpoint of the target's current extent. Comparing
     against 0.5 only ever looked right for extend (target entirely on one side); a
     boundary crossing off-centre needs the comparison to be against its own param. */
  const tBoundary=paramOn(e,best);
  snap();
  if(e.t==="line"){
    if(tp<tBoundary) e.b=best; else e.a=best;
  } else {
    const a0new=wrap(ang(e.c,best));
    if(tp<tBoundary) e.a1=a0new; else e.a0=a0new;
  }
  S.sel.clear(); draw(); updateProps(); echo("Trimmed/extended to boundary");
  return true;
}
function offsetEnt(e,d,side){
  if(e.t==="line"){
    const n=perp(norm(sub(e.b,e.a)));
    const sg=Math.sign(sub(side,e.a).x*n.x+sub(side,e.a).y*n.y)||1;
    const o=mul(n,d*sg);
    return {t:"line",li:e.li,si:e.si,a:add(e.a,o),b:add(e.b,o)};
  }
  if(e.t==="circle"||e.t==="arc"){
    const sg = dist(side,e.c)>e.r ? 1 : -1;
    const r=e.r+d*sg;
    if(r<=1e-9) return null;
    return e.t==="circle" ? {t:"circle",li:e.li,si:e.si,c:e.c,r}
                          : {t:"arc",li:e.li,si:e.si,c:e.c,r,a0:e.a0,a1:e.a1};
  }
  if(e.t==="pline"){
    const segs=curvesOf(e);
    if(!segs.length) return null;
    let nearest=0, nd=1e18;
    segs.forEach((C,i)=>{const q=ptSegDist(side,C.a,C.b); if(q<nd){nd=q;nearest=i;}});
    const C0=segs[nearest], n0=perp(norm(sub(C0.b,C0.a)));
    const sg=Math.sign(sub(side,C0.a).x*n0.x+sub(side,C0.a).y*n0.y)||1;
    const off=segs.map(C=>{const n=perp(norm(sub(C.b,C.a))), o=mul(n,d*sg);
      return {a:add(C.a,o), b:add(C.b,o)};});
    const pts=[];
    const closed=!!e.closed;
    if(!closed) pts.push(off[0].a);
    for(let i=0;i<off.length-(closed?0:1);i++){
      const A=off[i], B=off[(i+1)%off.length];
      const X=lineLineInt(A.a,A.b,B.a,B.b);
      pts.push(X? X.p : A.b);
    }
    if(!closed) pts.push(off[off.length-1].b);
    if(closed) pts.unshift(pts.pop());
    return {t:"pline",li:e.li,si:e.si,closed,pts};
  }
  return null;
}
function filletPair(i1,p1,i2,p2,r,chamfer,silent){
  const e1=S.ents[i1], e2=S.ents[i2];
  const bail=msg=>{ if(!silent) echo(msg,"warn"); return false; };
  if(e1.t!=="line"||e2.t!=="line") return bail((chamfer?"Chamfer":"Fillet")+" works on two lines");
  const X=lineLineInt(e1.a,e1.b,e2.a,e2.b);
  if(!X) return bail("Those lines are parallel");
  const P=X.p;
  const u1=norm(sub(projOnLine(e1,p1),P)), u2=norm(sub(projOnLine(e2,p2),P));
  if(!isFinite(u1.x)||!isFinite(u2.x)) return bail("Pick away from the corner");
  let th=Math.acos(Math.max(-1,Math.min(1,u1.x*u2.x+u1.y*u2.y)));
  if(th<1e-6||Math.abs(th-Math.PI)<1e-6) return bail("Those lines are collinear");
  let t = chamfer ? r : r/Math.tan(th/2);
  const room = Math.min(dist(e1.a,e1.b), dist(e2.a,e2.b)) * 0.95;
  if(t>room){ if(silent) return bail("Radius too large for that corner"); t=Math.max(0,room); r = chamfer? t : t*Math.tan(th/2); }
  const T1=add(P,mul(u1,t)), T2=add(P,mul(u2,t));
  const cut=(e,u,T)=>{
    const da=sub(e.a,P).x*u.x+sub(e.a,P).y*u.y, db=sub(e.b,P).x*u.x+sub(e.b,P).y*u.y;
    if(da>db) e.b=T; else e.a=T;
  };
  snap();
  cut(e1,u1,T1); cut(e2,u2,T2);
  if(r>1e-9){
    if(chamfer) S.ents.push({t:"line",li:e1.li,si:e1.si,a:T1,b:T2});
    else{
      const bis=norm(add(u1,u2)), cen=add(P,mul(bis,r/Math.sin(th/2)));
      const mid=add(cen,mul(norm(sub(P,cen)),r));
      const A=arc3(T1,mid,T2);
      if(A) S.ents.push({t:"arc",li:e1.li,si:e1.si,...A});
    }
  }
  if(!silent){ S.sel.clear(); draw(); updateProps(); echo(chamfer?"Chamfered":"Filleted"); }
  return true;
}
function explodeSel(){
  if(!S.sel.size) return echo("Select objects first","warn");
  snap();
  const out=[], idx=new Set(S.sel);
  let n=0;
  S.ents.forEach((e,i)=>{
    if(!idx.has(i)) return out.push(e);
    if(e.t==="pline"||e.t==="ellipse"||e.t==="spline"){
      const segs=curvesOf(e);
      segs.forEach(C=>out.push({t:"line",li:e.li,si:e.si,a:C.a,b:C.b}));
      n++;
    } else if(e.t==="dim"){
      const {d,p1,p2,o}=dimGeom(e), nn=norm(o), h=e.h||S.textHeight;
      out.push({t:"line",li:e.li,a:add(e.a,mul(o,.06)),b:add(p1,mul(nn,h*.6))});
      out.push({t:"line",li:e.li,a:add(e.b,mul(o,.06)),b:add(p2,mul(nn,h*.6))});
      out.push({t:"line",li:e.li,a:p1,b:p2});
      const tk=h*.6;
      for(const q of [p1,p2])
        out.push({t:"line",li:e.li,a:add(q,mul(add(d,perp(d)),tk)),b:sub(q,mul(add(d,perp(d)),tk))});
      out.push({t:"text",li:e.li,p:mul(add(p1,p2),.5),h,s:dist(e.a,e.b).toFixed(1),rot:0});
      n++;
    } else out.push(e);
  });
  S.ents=out; S.sel.clear(); draw(); updateProps();
  echo(n?("Exploded "+n+" object(s)"):"Nothing there to explode");
}

/* ---- arrow-key nudge ---------------------------------------------------- */
const fmt = n => { const s=n.toFixed(4).replace(/\.?0+$/,""); return s==="-0"?"0":s; };
let nudgeAt=0, nudgeSum=null;
function resetNudge(){ nudgeAt=0; nudgeSum=null; }
function nudgeStep(e){
  let s = S.gridSnap ? gridPitch() : Math.max(1e-9, S.gridStep);
  if(e.shiftKey) s*=10;
  if(e.ctrlKey||e.metaKey) s/=10;
  return s;
}
function nudge(dx,dy,e){
  if(!S.sel.size) return;
  const live=[...S.sel].filter(i=>S.ents[i] && !(S.layers[S.ents[i].li]||{}).lock);
  if(!live.length) return echo("Selection is on a locked layer","warn");
  const st=nudgeStep(e), d=V(dx*st, dy*st);
  const now=Date.now();
  if(now-nudgeAt>700 || !nudgeSum){ snap(); nudgeSum=V(0,0); }   // one undo per burst
  nudgeAt=now;
  const w=applyDelta(live, d, true);
  nudgeSum=add(nudgeSum,d);
  if(w) echo("Nudge "+fmt(nudgeSum.x)+", "+fmt(nudgeSum.y)+"   "+w+" joined point"+(w>1?"s":"")+" followed");
  draw(); updateProps();
  if(!w) echo("Nudge "+fmt(nudgeSum.x)+", "+fmt(nudgeSum.y)+"   step "+fmt(st));
}

/* ============================================================ render */
function draw(){
  const cnt=document.getElementById("counts");
  if(cnt) cnt.textContent=S.ents.length+" objects \u00B7 "+S.layers.length+" layers"+(S.refImage?(" \u00B7 reference"+(S.refImage.locked?" locked":"")):"");
  ctx.clearRect(0,0,W,H);
  drawReferenceImage();
  drawGrid();
  const tol=px(6);
  S.ents.forEach((e,i)=>{
    const L=S.layers[e.li]||S.layers[0];
    if(!L.on) return;
    const selected=S.sel.has(i);
    const hot = i===S.hover || i===S.op.first;
    const st = styleOf(e);
    ctx.strokeStyle = selected ? getCSS("--pen") : hot ? getCSS("--snap")
                    : aciColor(st? st.aci : L.aci);
    ctx.fillStyle   = ctx.strokeStyle;
    ctx.lineWidth   = (selected||hot) ? 2 : (st? Math.max(1, st.w*MM) : 1.15);
    ctx.setLineDash(selected?[6,3]:hot?[3,3]:(st&&st.pat? st.pat.map(v=>v*MM) : []));
    paintEnt(e);
    ctx.setLineDash([]);
    if(selected) grips(e);
  });
  drawPreview();
  drawBand();
  drawSnapMarker();
  drawCross();
}
function drawReferenceImage(){
  const R=S.refImage;
  if(!R||!R.visible||!R.img||!R.img.complete) return;
  ctx.save();
  ctx.globalAlpha=Math.max(0.05,Math.min(1,R.opacity));
  ctx.imageSmoothingEnabled=true;
  const filters={normal:"none",fade:"grayscale(.25) contrast(.8) brightness(1.12)",gray:"grayscale(1) contrast(1.08)",contrast:"grayscale(1) contrast(1.65) brightness(1.05)",invert:"grayscale(1) invert(1) contrast(1.15)"};
  ctx.filter=filters[R.mode||"normal"]||"none";
  ctx.translate(X(R.x),Y(R.y)); ctx.rotate(-(R.rot||0));
  const sc=S.view.s, nw=R.img.naturalWidth, nh=R.img.naturalHeight;
  if(R.crop){
    const c=R.crop, dx=(-R.w/2+c.sx/nw*R.w)*sc, dy=(-R.h/2+c.sy/nh*R.h)*sc;
    ctx.drawImage(R.img,c.sx,c.sy,c.sw,c.sh,dx,dy,c.sw/nw*R.w*sc,c.sh/nh*R.h*sc);
  } else ctx.drawImage(R.img,-R.w*sc/2,-R.h*sc/2,R.w*sc,R.h*sc);
  ctx.restore();
}
function styleOf(e){ return (e.si!=null && S.styles[e.si]) ? S.styles[e.si] : null; }
function getCSS(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}

function drawGrid(){
  const g=gridPitch();
  const x0=wX(0), x1=wX(W), y0=wY(H), y1=wY(0);
  ctx.lineWidth=1;
  for(let pass=0;pass<2;pass++){
    const step = pass? g*10 : g;
    if(step*S.view.s < (pass?24:6)) continue;
    ctx.strokeStyle = pass? getCSS("--grid-major") : getCSS("--grid-minor");
    ctx.beginPath();
    for(let x=Math.ceil(x0/step)*step; x<=x1; x+=step){
      if(!pass && Math.abs(x/(step*10) - Math.round(x/(step*10)))<1e-6) continue;
      const sx=Math.round(X(x))+.5; ctx.moveTo(sx,0); ctx.lineTo(sx,H);
    }
    for(let y=Math.ceil(y0/step)*step; y<=y1; y+=step){
      if(!pass && Math.abs(y/(step*10) - Math.round(y/(step*10)))<1e-6) continue;
      const sy=Math.round(Y(y))+.5; ctx.moveTo(0,sy); ctx.lineTo(W,sy);
    }
    ctx.stroke();
  }
  ctx.strokeStyle=getCSS("--axis"); ctx.beginPath();
  const ax=Math.round(X(0))+.5, ay=Math.round(Y(0))+.5;
  if(ax>0&&ax<W){ctx.moveTo(ax,0);ctx.lineTo(ax,H);}
  if(ay>0&&ay<H){ctx.moveTo(0,ay);ctx.lineTo(W,ay);}
  ctx.stroke();
}
function paintEnt(e){
  ctx.beginPath();
  switch(e.t){
    case "line": ctx.moveTo(X(e.a.x),Y(e.a.y)); ctx.lineTo(X(e.b.x),Y(e.b.y)); ctx.stroke(); break;
    case "pline":{
      e.pts.forEach((p,i)=> i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y)));
      if(e.closed) ctx.closePath();
      ctx.stroke(); break;
    }
    case "circle": ctx.arc(X(e.c.x),Y(e.c.y),e.r*S.view.s,0,TAU); ctx.stroke(); break;
    case "arc": ctx.arc(X(e.c.x),Y(e.c.y),e.r*S.view.s,-e.a1,-e.a0); ctx.stroke(); break;
    case "text": paintText(e); break;
    case "dim": paintDim(e); break;
    case "ellipse": case "spline":{
      const P=flatten(e);
      P.forEach((p,i)=> i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y)));
      if(e.t==="spline"&&e.closed) ctx.closePath();
      ctx.stroke(); break;
    }
  }
}
function paintText(e){
  ctx.save();
  ctx.translate(X(e.p.x),Y(e.p.y)); ctx.rotate(-(e.rot||0));
  ctx.font = Math.max(7,e.h*S.view.s)+"px "+getCSS("--draft");
  ctx.textBaseline="alphabetic";
  ctx.fillText(e.s,0,0);
  ctx.restore();
}
function dimGeom(e){
  const d=norm(sub(e.b,e.a)), n=perp(d);
  const o=mul(n,e.off);
  return {d,n,p1:add(e.a,o),p2:add(e.b,o),o};
}
function paintDim(e){
  const {d,p1,p2,o}=dimGeom(e);
  const ext=px(4);
  ctx.beginPath();
  ctx.moveTo(X(e.a.x+o.x*.06),Y(e.a.y+o.y*.06));
  ctx.lineTo(X(p1.x+norm(o).x*ext),Y(p1.y+norm(o).y*ext));
  ctx.moveTo(X(e.b.x+o.x*.06),Y(e.b.y+o.y*.06));
  ctx.lineTo(X(p2.x+norm(o).x*ext),Y(p2.y+norm(o).y*ext));
  ctx.moveTo(X(p1.x),Y(p1.y)); ctx.lineTo(X(p2.x),Y(p2.y));
  ctx.stroke();
  const t=px(3);
  for(const p of [p1,p2]){
    const a=add(p,mul(add(d,perp(d)),t)), b=sub(p,mul(add(d,perp(d)),t));
    ctx.beginPath(); ctx.moveTo(X(a.x),Y(a.y)); ctx.lineTo(X(b.x),Y(b.y)); ctx.stroke();
  }
  const mid=mul(add(p1,p2),.5), val=dist(e.a,e.b).toFixed(1);
  let r=-ang(p1,p2); if(r>Math.PI/2) r-=Math.PI; if(r<-Math.PI/2) r+=Math.PI;
  ctx.save();
  ctx.translate(X(mid.x),Y(mid.y)); ctx.rotate(r);
  ctx.font=Math.max(8,(e.h||S.textHeight)*S.view.s)+"px "+getCSS("--draft");
  ctx.textAlign="center"; ctx.textBaseline="bottom";
  ctx.fillText(val,0,-2);
  ctx.restore();
}
function grips(e){
  ctx.fillStyle=getCSS("--pen");
  for(const p of [...entPoints(e),...entCenters(e)]){
    ctx.fillRect(Math.round(X(p.x))-3,Math.round(Y(p.y))-3,6,6);
  }
}
function drawPreview(){
  const P=S.pending;
  const c=cursorPoint();
  ctx.strokeStyle=getCSS("--pen"); ctx.fillStyle=getCSS("--pen"); ctx.lineWidth=1;
  ctx.setLineDash([4,3]);
  if((S.tool==="move"||S.tool==="copy")&&S.base){
    const d=sub(c,S.base);
    ctx.save(); ctx.globalAlpha=.65;
    for(const i of S.sel){ const g=moveEnt(JSON.parse(JSON.stringify(S.ents[i])),d); paintEnt(g); }
    ctx.restore();
    ctx.beginPath(); ctx.moveTo(X(S.base.x),Y(S.base.y)); ctx.lineTo(X(c.x),Y(c.y)); ctx.stroke();
  }
  if((S.tool==="offset"||S.tool==="pickLines") && S.op.stage==="side" && S.ents[S.op.ent]){
    const src=S.ents[S.op.ent];
    let d=S.op.d;
    if(S.tool==="offset" && S.offsetMode==="graphical"){
      d = src.t==="line" ? ptSegDist(c,src.a,src.b) : Math.abs(dist(c,src.c)-src.r);
    }
    if(d>0){
      ctx.save(); ctx.globalAlpha=.8;
      if(src.t==="line"){
        const tr=traceChainPoints(S.op.ent);
        const segs=offsetChain(tr.idxs,tr.pts,tr.closed,d,c);
        if(segs) segs.forEach(sg=>paintEnt(sg));
      } else {
        const g=offsetEnt(src,d,c);
        if(g) paintEnt(g);
      }
      ctx.restore();
    }
  }
  if(S.tool==="line" && S.chain && S.pending.length){
    let a=S.pending[0], b=c;
    if(S.drawOffset){ const o=drawOffsetVec(a,b); a=add(a,o); b=add(b,o); }
    seg(a,b);
    if(S.useRadius && S.chainRadius>0 && S.chainPrev!=null){
      ctx.save(); ctx.globalAlpha=.55;
      ctx.beginPath(); ctx.arc(X(a.x),Y(a.y), Math.max(3,S.chainRadius*S.view.s*0.35), 0, TAU); ctx.stroke();
      ctx.restore();
    }
  }
  if(S.tool==="mirror" && P.length===1){
    const A=P[0];
    if(dist(A,c)>1e-9){
      ctx.save(); ctx.globalAlpha=.6;
      for(const i of S.sel) paintEnt(mirEnt(clone(S.ents[i]),A,c));
      ctx.restore();
    }
  }
  if(S.tool==="rotate" && P.length===1){
    const th=ang(P[0],c);
    ctx.save(); ctx.globalAlpha=.6;
    for(const i of S.sel) paintEnt(rotEnt(clone(S.ents[i]),P[0],th));
    ctx.restore();
    ctx.beginPath(); ctx.arc(X(P[0].x),Y(P[0].y),Math.min(60,dist(P[0],c)*S.view.s),-th,0);
    ctx.stroke();
  }
  if(S.tool==="scale" && P.length>=1){
    if(S.scaleMode==="numerical"){
      const k=S.lastScaleFactor||1;
      ctx.save(); ctx.globalAlpha=.6;
      for(const i of S.sel) paintEnt(sclEnt(clone(S.ents[i]),P[0],k));
      ctx.restore();
    } else if(P.length===1){
      seg(P[0],c);
    } else if(P.length===2){
      seg(P[0],P[1]); seg(P[0],c);
      const from=dist(P[0],P[1]), to=dist(P[0],c);
      if(from>1e-9){
        const k=to/from;
        ctx.save(); ctx.globalAlpha=.6;
        for(const i of S.sel) paintEnt(sclEnt(clone(S.ents[i]),P[0],k));
        ctx.restore();
      }
    }
  }
  if(P.length){
    switch(S.tool){
      case "line": {
        let a=P[0], b=c;
        if(S.drawOffset){ const o=drawOffsetVec(a,b); a=add(a,o); b=add(b,o); }
        seg(a,b);
        break;
      }
      case "rect": {const a=P[0]; box(a,c); break;}
      case "circle": ctx.beginPath(); ctx.arc(X(P[0].x),Y(P[0].y),dist(P[0],c)*S.view.s,0,TAU); ctx.stroke(); seg(P[0],c); break;
      case "pline": {
        ctx.beginPath();
        P.forEach((p,i)=> i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y)));
        ctx.lineTo(X(c.x),Y(c.y)); ctx.stroke(); break;
      }
      case "arc":
        if(P.length===1) seg(P[0],c);
        else{ const a=arc3(P[0],c,P[1]);
          if(a){ctx.beginPath();ctx.arc(X(a.c.x),Y(a.c.y),a.r*S.view.s,-a.a1,-a.a0);ctx.stroke();} }
        break;
      case "mirror": if(P.length===1) seg(P[0],c); break;
      case "rotate": if(P.length===1) seg(P[0],c); break;
      case "imgcal": case "imgmove": case "imgstraight": if(P.length===1) seg(P[0],c); break;
      case "imgcrop": if(P.length===1){
        const R=S.refImage, a=refWorldToPixel(R,P[0]), b=refWorldToPixel(R,c);
        if(a&&b){
          const cs=[[Math.min(a.x,b.x),Math.min(a.y,b.y)],[Math.max(a.x,b.x),Math.min(a.y,b.y)],[Math.max(a.x,b.x),Math.max(a.y,b.y)],[Math.min(a.x,b.x),Math.max(a.y,b.y)]].map(q=>refPixelToWorld(R,q[0],q[1]));
          ctx.beginPath(); cs.forEach((q,i)=>i?ctx.lineTo(X(q.x),Y(q.y)):ctx.moveTo(X(q.x),Y(q.y)));ctx.closePath();ctx.stroke();
        }
      } break;
      case "spline": {
        if(P.length>1){ ctx.beginPath();
          const pv=splPts({pts:P.concat([c]),closed:false});
          pv.forEach((p,i)=> i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y)));
          ctx.stroke();
        } else seg(P[0],c);
        break;
      }
      case "ellipse": case "pellipse": {
        if(P.length===1) seg(P[0],c);
        else if(P.length===2){
          const rx=dist(P[0],P[1]), rot=ang(P[0],P[1]);
          const nrm=perp(V(Math.cos(rot),Math.sin(rot)));
          const v=sub(c,P[0]), ry=Math.abs(v.x*nrm.x+v.y*nrm.y);
          const pv=ellPts({c:P[0],rx,ry,rot,a0:0,sw:TAU});
          ctx.beginPath(); pv.forEach((p,i)=> i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y))); ctx.stroke();
        } else if(P.length>=3){
          const rx=dist(P[0],P[1]), rot=ang(P[0],P[1]);
          const axisDir=V(Math.cos(rot),Math.sin(rot)), nrm=perp(axisDir);
          const v1=sub(P[2],P[0]), ry=Math.abs(v1.x*nrm.x+v1.y*nrm.y);
          if(S.tool==="pellipse" && P.length>=4){
            const localAngle=q=>{ const v2=sub(q,P[0]); return Math.atan2((v2.x*nrm.x+v2.y*nrm.y)/(ry||1),(v2.x*axisDir.x+v2.y*axisDir.y)/(rx||1)); };
            const a0=wrap(localAngle(P[3])), a1=wrap(localAngle(c));
            const pv=ellPts({c:P[0],rx,ry,rot,a0,sw:wrap(a1-a0)});
            ctx.beginPath(); pv.forEach((p,i)=> i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y))); ctx.stroke();
          } else {
            const pv=ellPts({c:P[0],rx,ry,rot,a0:0,sw:TAU});
            ctx.beginPath(); pv.forEach((p,i)=> i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y))); ctx.stroke();
          }
        }
        break;
      }
      case "polygon": {
        const n=S.polySides, R=dist(P[0],c);
        if(R>1e-9){
          const a0=ang(P[0],c);
          const circumR=S.polyInscribed? R : R/Math.cos(Math.PI/n);
          const rotOff=S.polyInscribed? 0 : Math.PI/n;
          ctx.beginPath();
          for(let k=0;k<=n;k++){ const th=a0-rotOff+(k%n)*(TAU/n);
            const p=V(P[0].x+circumR*Math.cos(th),P[0].y+circumR*Math.sin(th));
            k?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y)); }
          ctx.stroke();
        }
        break;
      }
      case "arccenter": {
        if(P.length===1) seg(P[0],c);
        else{
          const r=dist(P[0],P[1]);
          ctx.beginPath(); ctx.arc(X(P[0].x),Y(P[0].y),r*S.view.s, -wrap(ang(P[0],c)), -wrap(ang(P[0],P[1])));
          ctx.stroke();
        }
        break;
      }
      case "dim":
        if(P.length===1) seg(P[0],c);
        else{
          const d=norm(sub(P[1],P[0])), n=perp(d);
          const off=sub(c,P[0]).x*n.x+sub(c,P[0]).y*n.y;
          paintDim({t:"dim",a:P[0],b:P[1],off,h:S.textHeight});
        }
        break;
    }
    for(const p of P){ ctx.fillRect(Math.round(X(p.x))-2,Math.round(Y(p.y))-2,4,4); }
  }
  ctx.setLineDash([]);
  function seg(a,b){ctx.beginPath();ctx.moveTo(X(a.x),Y(a.y));ctx.lineTo(X(b.x),Y(b.y));ctx.stroke();}
  function box(a,b){ctx.beginPath();ctx.rect(X(Math.min(a.x,b.x)),Y(Math.max(a.y,b.y)),
    Math.abs(b.x-a.x)*S.view.s,Math.abs(b.y-a.y)*S.view.s);ctx.stroke();}
}
function drawBand(){
  if(!S.band) return;
  const {a,b}=S.band, cross=b.x<a.x;
  ctx.setLineDash(cross?[5,3]:[]);
  ctx.strokeStyle=cross?getCSS("--snap"):getCSS("--pen");
  ctx.fillStyle=(cross?"rgba(63,208,201,.07)":"rgba(224,163,60,.07)");
  const x=X(Math.min(a.x,b.x)), y=Y(Math.max(a.y,b.y));
  const w=Math.abs(b.x-a.x)*S.view.s, h=Math.abs(b.y-a.y)*S.view.s;
  ctx.fillRect(x,y,w,h); ctx.strokeRect(x,y,w,h);
  ctx.setLineDash([]);
}
function drawSnapMarker(){
  if(!S.snapHit) return;
  const {p,kind}=S.snapHit, sx=X(p.x), sy=Y(p.y), r=5;
  ctx.strokeStyle=getCSS("--snap"); ctx.lineWidth=1.4; ctx.beginPath();
  if(kind==="end") ctx.rect(sx-r,sy-r,r*2,r*2);
  else if(kind==="mid"){ctx.moveTo(sx-r,sy+r);ctx.lineTo(sx,sy-r);ctx.lineTo(sx+r,sy+r);ctx.closePath();}
  else if(kind==="center") ctx.arc(sx,sy,r,0,TAU);
  else if(kind==="edge"){ctx.moveTo(sx-r,sy-r);ctx.lineTo(sx+r,sy+r);ctx.moveTo(sx+r,sy-r);ctx.lineTo(sx-r,sy+r);}
  else {ctx.moveTo(sx,sy-r-1);ctx.lineTo(sx+r+1,sy);ctx.lineTo(sx,sy+r+1);ctx.lineTo(sx-r-1,sy);ctx.closePath();}
  ctx.stroke();
}
function drawCross(){
  const c=cursorPoint(), sx=Math.round(X(c.x))+.5, sy=Math.round(Y(c.y))+.5;
  ctx.strokeStyle="rgba(201,209,220,.28)"; ctx.lineWidth=1; ctx.beginPath();
  ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke();
}

/* ============================================================ picking */
function pickAt(w, additive){
  resetNudge();
  const tol=px(7);
  for(let i=S.ents.length-1;i>=0;i--){
    const e=S.ents[i], L=S.layers[e.li];
    if(!L||!L.on||L.lock) continue;
    if(entHit(e,w,tol)){
      if(!additive) S.sel.clear();
      const ids=e.gid?groupIndices(e.gid):[i], removing=additive && ids.every(j=>S.sel.has(j));
      for(const j of ids){ if(removing) S.sel.delete(j); else S.sel.add(j); }
      return true;
    }
  }
  if(!additive) S.sel.clear();
  return false;
}
function pickBox(a,b,additive){
  resetNudge();
  const cross=b.x<a.x;
  const x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y);
  if(!additive) S.sel.clear();
  S.ents.forEach((e,i)=>{
    const L=S.layers[e.li]; if(!L||!L.on||L.lock) return;
    const bb=entBox(e);
    const inside = bb.x0>=x0&&bb.x1<=x1&&bb.y0>=y0&&bb.y1<=y1;
    const overlap= !(bb.x1<x0||bb.x0>x1||bb.y1<y0||bb.y0>y1);
    if(cross?overlap:inside) S.sel.add(i);
  });
  expandSelectionGroups();
}

function hitIndex(p){
  const tol=px(7);
  for(let i=S.ents.length-1;i>=0;i--){
    const e=S.ents[i], L=S.layers[e.li];
    if(!L||!L.on||L.lock) continue;
    if(entHit(e,p,tol)) return i;
  }
  return -1;
}
function doPick(i,p,shift){
  const t=S.tool;
  if(i<0){ echo("Nothing under the cursor","warn"); return; }
  if(t==="trimcorner"){
    if(S.op.first==null){ S.op.first=i; S.op.firstPt=p; say("Pick the part of the second element to keep"); draw(); return; }
    if(i===S.op.first){ echo("Pick a different element","warn"); return; }
    trimExtendCorner(S.op.first,S.op.firstPt,i,p);
    S.op={}; say("Pick the part of the first element to keep");
    return;
  }
  if(t==="trimsingle"||t==="trimmultiple"){
    if(S.op.boundary==null){ S.op.boundary=i; say("Pick the element to trim or extend"); draw(); return; }
    if(i===S.op.boundary){ echo("Pick a different element","warn"); return; }
    trimExtendToBoundary(i,S.op.boundary,p);
    if(t==="trimsingle") setTool("select");
    else say("Pick another element to trim/extend to the same boundary");
    return;
  }
  if(t==="offset"||t==="pickLines"){
    if(S.op.stage!=="side"){ S.op.ent=i; S.op.stage="side"; say("Pick the side to offset toward"); draw(); return; }
    return;
  }
  if(t==="fillet"||t==="chamfer"){
    if(S.op.first==null){ S.op.first=i; S.op.firstPt=p; say("Pick second line"); draw(); return; }
    if(i===S.op.first){ echo("Pick a different line","warn"); return; }
    filletPair(S.op.first,S.op.firstPt,i,p,S.op.r,t==="chamfer");
    S.op={r:S.op.r}; say("Pick first line");
    return;
  }
}

/* Trace a connected run of coincident "line" entities in both directions from
   startIdx, the way Revit's Offset detects a whole chained wall/line run and
   offsets it as one mitred unit instead of one segment at a time. Any other
   entity type, or a branch/dead end, stops the trace at length 1. */
function traceChainPoints(startIdx){
  const e0=S.ents[startIdx];
  if(e0.t!=="line") return {idxs:[startIdx], pts:null, closed:false};
  const used=new Set([startIdx]);
  const idxs=[startIdx];
  let pts=[e0.a,e0.b];
  const step=(atFront)=>{
    for(;;){
      const tip = atFront ? pts[0] : pts[pts.length-1];
      const cands=[];
      S.ents.forEach((e,i)=>{
        if(used.has(i)||e.t!=="line") return;
        if(dist(e.a,tip)<WELD_TOL) cands.push({i,next:e.b});
        else if(dist(e.b,tip)<WELD_TOL) cands.push({i,next:e.a});
      });
      if(cands.length!==1) return;
      used.add(cands[0].i);
      if(atFront){ idxs.unshift(cands[0].i); pts.unshift(cands[0].next); }
      else       { idxs.push(cands[0].i);    pts.push(cands[0].next); }
    }
  };
  step(false); step(true);
  let closed=false;
  if(idxs.length>2 && dist(pts[0],pts[pts.length-1])<WELD_TOL){ closed=true; pts=pts.slice(0,-1); }
  return {idxs, pts, closed};
}
/* Offset a whole traced chain as one mitred shape, then hand back one new
   "line" entity per original segment (chains stay separate elements, the
   same way Chain-mode drawing keeps them separate for weld to act on). */
function offsetChain(idxs,pts,closed,d,side){
  const first=S.ents[idxs[0]];
  const fake={t:"pline", li:first.li, si:first.si, closed, pts};
  const off=offsetEnt(fake,d,side);
  if(!off) return null;
  const segs=[], n=off.pts.length;
  for(let k=0;k<n-1;k++) segs.push({t:"line", li:fake.li, si:fake.si, a:off.pts[k], b:off.pts[k+1]});
  if(closed) segs.push({t:"line", li:fake.li, si:fake.si, a:off.pts[n-1], b:off.pts[0]});
  return segs;
}
/* offset's second click is a side point, not an entity, so it is handled here */
function offsetSide(p){
  const src=S.ents[S.op.ent];
  if(!src){ echo("Object went away","warn"); setTool("select"); return; }
  const picking = S.tool==="pickLines";

  let d=S.op.d;
  if(S.tool==="offset" && S.offsetMode==="graphical"){
    d = src.t==="line" ? ptSegDist(p,src.a,src.b) : Math.abs(dist(p,src.c)-src.r);
  }
  if(!(d>0)){ echo("Offset distance must be greater than zero","warn"); return; }

  let idxs, segs;
  if(src.t==="line"){
    const tr=traceChainPoints(S.op.ent);
    idxs=tr.idxs;
    segs=offsetChain(idxs,tr.pts,tr.closed,d,p);
    if(!segs) return echo("Cannot offset that far inward","warn");
  } else {
    const out=offsetEnt(src,d,p);
    if(!out) return echo("Cannot offset that far inward","warn");
    idxs=[S.op.ent]; segs=[out];
  }
  if(picking) segs.forEach(sg=>{ sg.li=S.cur; sg.si=S.curStyle; });  /* Pick Lines: active style, not the source's */

  snap();
  if(S.tool==="offset" && !S.copyOffset){
    idxs.forEach((idx,k)=>Object.assign(S.ents[idx],segs[k]));
    echo("Moved to offset "+fmt(d)+(idxs.length>1?"  ("+idxs.length+"-segment chain)":""));
  } else {
    S.ents.push(...segs);
    echo((picking?"Placed at offset ":"Offset by ")+fmt(d)+(idxs.length>1?"  ("+idxs.length+"-segment chain)":""));
  }
  draw(); updateProps();
  S.op={stage:"pick", d}; say(picking?"Pick a line to offset":"Pick object to offset");
}

/* ============================================================ pointer */
let panning=false, panFrom=null, downAt=null, dragging=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);
  const r=cv.getBoundingClientRect();
  S.mouse.sx=e.clientX-r.left; S.mouse.sy=e.clientY-r.top;
  if(e.button===1 || (e.button===0&&e.altKey)){
    panning=true; panFrom={x:e.clientX,y:e.clientY,cx:S.view.cx,cy:S.view.cy};
    cv.classList.add("panning"); e.preventDefault(); return;
  }
  if(e.button===2){
    if(S.tool==="pline"||S.tool==="spline") finishPline();
    else if(S.tool==="line"&&S.chain) finishChain();
    else cancel();
    return;
  }
  if(e.button!==0) return;
  downAt={sx:S.mouse.sx, sy:S.mouse.sy, w:cursorPoint(), shift:e.shiftKey};
  dragging=false;
});
window.addEventListener("pointermove",e=>{
  const r=cv.getBoundingClientRect();
  S.mouse.sx=e.clientX-r.left; S.mouse.sy=e.clientY-r.top;
  if(panning&&panFrom){
    S.view.cx=panFrom.cx-(e.clientX-panFrom.x)/S.view.s;
    S.view.cy=panFrom.cy+(e.clientY-panFrom.y)/S.view.s;
    draw(); return;
  }
  if(downAt && !dragging && Math.hypot(S.mouse.sx-downAt.sx,S.mouse.sy-downAt.sy)>4) dragging=true;
  if(downAt && dragging && S.tool==="select"){
    S.band={a:downAt.w, b:V(wX(S.mouse.sx),wY(S.mouse.sy))};
  }
  S.hover = (TOOLS[S.tool].pick && !((S.tool==="offset"||S.tool==="pickLines")&&S.op.stage==="side"))
    ? hitIndex(V(wX(S.mouse.sx),wY(S.mouse.sy))) : -1;
  readout(); draw();
});
window.addEventListener("pointerup",e=>{
  if(panning){ panning=false; panFrom=null; cv.classList.remove("panning"); return; }
  if(!downAt) return;
  const w=cursorPoint();
  if(S.tool==="select"){
    if(dragging && S.band){ pickBox(S.band.a,S.band.b,downAt.shift); S.band=null; }
    else pickAt(downAt.w, downAt.shift);
    updateProps();
  } else if(TOOLS[S.tool].pick){
    if(!dragging){
      if((S.tool==="offset"||S.tool==="pickLines") && S.op.stage==="side") offsetSide(w);
      else doPick(hitIndex(downAt.w), w, e.shiftKey||downAt.shift);
    }
  } else {
    if(!dragging) feed(w);
  }
  downAt=null; dragging=false; draw();
});
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const before=V(wX(mx),wY(my));
  const k=Math.pow(1.0016, -e.deltaY);
  S.view.s=Math.min(4000,Math.max(0.002,S.view.s*k));
  const after=V(wX(mx),wY(my));
  S.view.cx += before.x-after.x; S.view.cy += before.y-after.y;
  readout(); draw();
},{passive:false});
cv.addEventListener("dblclick",()=>{
  if(S.tool==="pline"||S.tool==="spline") finishPline();
  else if(S.tool==="line"&&S.chain) finishChain();
});

function readout(){
  const c=cursorPoint();
  document.getElementById("rx").textContent=c.x.toFixed(3);
  document.getElementById("ry").textContent=c.y.toFixed(3);
  const from=S.pending.length?S.pending[S.pending.length-1]:S.base;
  const ex=document.getElementById("rextra");
  if(from){
    const d=dist(from,c), a=wrap(ang(from,c));
    ex.innerHTML="L <b>"+d.toFixed(3)+"</b>&nbsp;&nbsp;A <b>"+deg(a).toFixed(2)+"&deg;</b>";
  } else ex.innerHTML="1:"+ (1/S.view.s).toFixed(3) + " &nbsp; grid "+gridPitch()+"mm";
}

/* ============================================================ zoom helpers */
function zoomExtents(){
  if(!S.ents.length){ S.view={cx:0,cy:0,s:2}; draw(); return; }
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  for(const e of S.ents){ const b=entBox(e);
    x0=Math.min(x0,b.x0);y0=Math.min(y0,b.y0);x1=Math.max(x1,b.x1);y1=Math.max(y1,b.y1); }
  const w=Math.max(x1-x0,1), h=Math.max(y1-y0,1);
  S.view.s=Math.min(W/w, H/h)*0.86;
  S.view.cx=(x0+x1)/2; S.view.cy=(y0+y1)/2;
  draw();
}

/* ============================================================ command line */
const cmdin=document.getElementById("cmdin");
cmdin.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  e.preventDefault();
  const raw=cmdin.value.trim(); cmdin.value="";
  if(S.ask){ const {cb}=S.ask; S.ask=null; cb(raw); setPrompt(); return; }
  if(!raw){
    if(S.tool==="pline"||S.tool==="spline") finishPline();
    else if(S.tool==="line"&&S.chain) finishChain();
    return;
  }
  handleCommand(raw);
});
function parsePoint(str){
  const s=str.replace(/\s+/g,"");
  const last=S.pending.length?S.pending[S.pending.length-1]:S.base;
  let m;
  if((m=/^@?(-?[\d.]+)<(-?[\d.]+)$/.exec(s))){
    if(!last) return null;
    const d=parseFloat(m[1]), a=rad(parseFloat(m[2]));
    return V(last.x+d*Math.cos(a), last.y+d*Math.sin(a));
  }
  if((m=/^@(-?[\d.]+),(-?[\d.]+)$/.exec(s))){
    if(!last) return null;
    return V(last.x+parseFloat(m[1]), last.y+parseFloat(m[2]));
  }
  if((m=/^(-?[\d.]+),(-?[\d.]+)$/.exec(s))) return V(parseFloat(m[1]),parseFloat(m[2]));
  if((m=/^(-?[\d.]+)$/.exec(s))){
    if(!last) return null;
    const d=parseFloat(m[1]);
    const dir=norm(sub(applyOrtho(V(wX(S.mouse.sx),wY(S.mouse.sy)),last),last));
    if(!isFinite(dir.x)||(dir.x===0&&dir.y===0)) return null;
    return add(last,mul(dir,d));
  }
  return null;
}
const ALIAS={};
for(const [id,T] of Object.entries(TOOLS)){
  ALIAS[id]=id;
  if(T.alias) ALIAS[T.alias.toLowerCase()]=id;
}
Object.assign(ALIAS,{li:"line",p:"pline",rec:"rect",ci:"circle",dli:"dim",txt:"text",
  sel:"select",cha:"chamfer",mi:"mirror",ro:"rotate",
  sc:"scale",ar:"array",x:"explode",e:"erase"});
function handleCommand(raw){
  const s=raw.toLowerCase();
  if(S.tool==="rotate" && S.pending.length===1 && /^-?[\d.]+$/.test(s)){
    const th=rad(parseFloat(s));
    snap();
    if(S.copyRotate) S.ents.push(...cloneEntitiesFreshGroups([...S.sel].map(i=>S.ents[i])).map(e=>rotEnt(e,S.pending[0],th)));
    else for(const i of S.sel) rotEnt(S.ents[i],S.pending[0],th);
    S.pending=[]; draw(); updateProps(); setPrompt();
    return echo((S.copyRotate?"Rotated a copy of ":"Rotated ")+S.sel.size+" object(s) by "+s+"\u00B0");
  }
  const p=parsePoint(raw);
  if(p && S.tool!=="select" && !TOOLS[S.tool].pick){ feed(p); readout(); return; }
  if(ALIAS[s]==="erase") return eraseSel();
  if(ALIAS[s]) return setTool(ALIAS[s]);
  for(const [id,A] of Object.entries(ACTIONS)){
    if(s===id.toLowerCase() || (A.alias&&s===A.alias.toLowerCase())) return A.run();
  }
  switch(s){
    case "erase": case "del": return eraseSel();
    case "weld": return toggle("weld");
    case "u": case "undo": return undo();
    case "redo": return redo();
    case "z": case "ze": case "zoom": return zoomExtents();
    case "ortho": return toggle("ortho");
    case "grid": return toggle("gridSnap");
    case "osnap": return toggle("osnap");
    case "all": S.sel=new Set(S.ents.map((_,i)=>i)); draw(); updateProps(); return echo(S.sel.size+" selected");
    case "img": case "image": return document.getElementById("imagein").click();
    case "imgshow": return toggleReferenceImage();
    case "imgdel": return removeReferenceImage();
    case "dxf": return exportDXF();
    case "svg": return exportSVG();
  }
  if(/^grid\s+[\d.]+$/.test(s)){ S.gridStep=parseFloat(s.split(/\s+/)[1])||10; draw(); return echo("Grid "+S.gridStep+"mm"); }
  if(/^layer\s+/.test(s)){
    const n=raw.slice(6).trim().toUpperCase();
    const i=S.layers.findIndex(l=>l.name.toUpperCase()===n);
    if(i<0) return echo("No layer "+n,"warn");
    S.cur=i; paintLayers(); return echo("Current layer "+S.layers[i].name);
  }
  echo("Unknown: "+raw,"warn");
}

const TGID={ortho:"tg-ortho",gridSnap:"tg-grid",osnap:"tg-osnap",edgeAssist:"tg-edge",weld:"tg-weld"};
const TGNAME={ortho:"Ortho",gridSnap:"Grid snap",osnap:"Object snap",edgeAssist:"Reference edge assist",weld:"Weld"};
function toggle(k){
  S[k]=!S[k];
  syncToggles();
  echo(TGNAME[k]+" "+(S[k]?"on":"off"));
  draw();
}
document.getElementById("tg-ortho").onclick=()=>toggle("ortho");
document.getElementById("tg-grid").onclick =()=>toggle("gridSnap");

/* ============================================================ keyboard */
window.addEventListener("keydown",e=>{
  const typing = !!S.ask || (document.activeElement===cmdin && cmdin.value.length>0);
  if(e.key==="Escape"){ cmdin.value=""; cancel(); return; }
  if(e.key==="F8"){ e.preventDefault(); return toggle("ortho"); }
  if(e.key==="F9"){ e.preventDefault(); return toggle("gridSnap"); }
  if(e.key==="F3"){ e.preventDefault(); return toggle("osnap"); }
  if(e.key==="F4"){ e.preventDefault(); return toggle("weld"); }
  if(e.key==="F6"){ e.preventDefault(); return toggle("edgeAssist"); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); return e.shiftKey?redo():undo(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){ e.preventDefault(); return redo(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="a"){ e.preventDefault(); S.sel=new Set(S.ents.map((_,i)=>i)); draw(); updateProps(); return; }
  if(e.key==="Delete"||e.key==="Backspace"){ if(!typing){ e.preventDefault(); eraseSel(); } return; }
  if(typing) return;
  const NUD={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];
  if(NUD){
    if(!S.sel.size || S.pending.length || S.base) return;
    e.preventDefault(); return nudge(NUD[0],NUD[1],e);
  }
  const k=e.key.toUpperCase();
  for(const [id,T] of Object.entries(TOOLS)) if(T.hot===k){ e.preventDefault(); return setTool(id); }
  if(k==="Z"&&!e.ctrlKey&&!e.metaKey){ e.preventDefault(); zoomExtents(); }
});

let ribbonTab="Home";
function itemOf(id){ return TOOLS[id] || ACTIONS[id]; }
function mkBtn(id,big){
  const T=itemOf(id), b=document.createElement("button");
  b.className=big?"big":"small"; b.dataset.item=id;
  const hot = T.hot? " or press "+T.hot : "";
  b.title=T.label+"   type "+(T.alias||id)+hot;
  b.innerHTML='<svg viewBox="0 0 20 20" aria-hidden="true">'+T.svg+'</svg><span>'+
    T.label.replace(/,.*$/,"").replace(/\s*\(.*\)$/,"")+'</span>';
  b.onclick=()=>{ if(TOOLS[id]) setTool(id); else ACTIONS[id].run(); paintRibbon(); };
  return b;
}
function paintRibbon(){
  const tabs=document.getElementById("rtabs");
  if(!tabs.childElementCount){
    for(const name of Object.keys(RIBBON)){
      const b=document.createElement("button");
      b.className="rtab"; b.textContent=name; b.setAttribute("role","tab");
      b.onclick=()=>{ ribbonTab=name; paintRibbon(); };
      tabs.append(b);
    }
  }
  [...tabs.children].forEach(b=>b.setAttribute("aria-selected",String(b.textContent===ribbonTab)));

  const host=document.getElementById("rpanels");
  host.innerHTML="";
  for(const P of RIBBON[ribbonTab]){
    const panel=document.createElement("div"); panel.className="rpanel";
    const body=document.createElement("div"); body.className="rpanel-body";
    if(P.big) body.append(mkBtn(P.big,true));
    if(P.small){
      const cols=document.createElement("div"); cols.className="rcols";
      for(let i=0;i<P.small.length;i+=3){
        const row=document.createElement("div"); row.className="rrow";
        const col=document.createElement("div"); col.className="rcols";
        P.small.slice(i,i+3).forEach(id=>col.append(mkBtn(id,false)));
        row.append(col); cols.append(row);
      }
      // lay the groups of three out side by side
      cols.className="rrow";
      body.append(cols);
    }
    if(P.custom==="layers")  body.append(layerWidget());
    if(P.custom==="style")   body.append(styleWidget());
    if(P.custom==="toggles") body.append(toggleWidget());
    if(P.custom==="grid")    body.append(gridWidget());
    const lab=document.createElement("div"); lab.className="rpanel-label"; lab.textContent=P.name;
    panel.append(body,lab); host.append(panel);
  }
  host.querySelectorAll(".big,.small").forEach(b=>{
    if(TOOLS[b.dataset.item]) b.setAttribute("aria-pressed",String(b.dataset.item===S.tool));
  });
  cv.className = S.tool==="select" ? "picking" : "";
}

/* ============================================================ options bar
   Context controls for the active tool, the way Revit's Options Bar sits
   under the ribbon and changes per tool. Chain/Radius drive the Line tool's
   chained-segment drawing; Offset drives both the Line tool and Pick Lines. */
function paintOptbar(){
  const host=document.getElementById("optbar");
  host.innerHTML="";
  const activeTool=TOOLS[S.tool];
  if(activeTool && (S.tool!=="select" || S.sel.size)){
    const context=document.createElement("span");
    context.className="context-name";
    context.textContent=activeTool.label.replace(/,.*/,"");
    host.append(context);
  }
  const num=(label,val,step,set,disabled)=>{
    const wrap=document.createElement("label");
    const sp=document.createElement("span"); sp.textContent=label; sp.className="oh";
    const i=document.createElement("input"); i.type="number"; i.step=step||"any"; i.value=val; i.disabled=!!disabled;
    i.onchange=()=>{ const v=parseFloat(i.value); if(isFinite(v)) set(v); paintOptbar(); };
    wrap.append(sp,i); return wrap;
  };
  const chk=(label,val,set)=>{
    const wrap=document.createElement("label");
    const i=document.createElement("input"); i.type="checkbox"; i.checked=!!val;
    i.onchange=()=>{ set(i.checked); paintOptbar(); draw(); };
    const sp=document.createElement("span"); sp.textContent=label;
    wrap.append(i,sp); return wrap;
  };
  const radio=(options,val,set)=>{
    const wrap=document.createElement("div"); wrap.className="rrow";
    for(const [v,l] of options){
      const b=document.createElement("button"); b.className="small"; b.style.minWidth="0";
      b.textContent=l; b.setAttribute("aria-pressed", String(val===v));
      b.onclick=()=>{ set(v); paintOptbar(); draw(); };
      wrap.append(b);
    }
    return wrap;
  };
  if(S.tool==="line"){
    host.append(chk("Chain", S.chain, v=>{S.chain=v; S.pending=[]; S.chainPrev=null; setPrompt(); draw();}));
    host.append(num("Offset", S.drawOffset, "any", v=>S.drawOffset=v));
    host.append(chk("Radius", S.useRadius, v=>S.useRadius=v));
    host.append(num("", S.chainRadius, "any", v=>S.chainRadius=Math.max(0,v), !S.useRadius));
  } else if(S.tool==="pickLines"){
    host.append(num("Offset", S.drawOffset, "any", v=>{S.drawOffset=v; if(S.op) S.op.d=Math.max(0,v);}));
  } else if(S.tool==="offset"){
    host.append(radio([["numerical","Numerical"],["graphical","Graphical"]], S.offsetMode, v=>S.offsetMode=v));
    if(S.offsetMode==="numerical")
      host.append(num("Offset", S.op.d!=null?S.op.d:S.lastOffset, "any",
        v=>{ S.lastOffset=v; if(S.op) S.op.d=v; }));
    host.append(chk("Copy", S.copyOffset, v=>S.copyOffset=v));
  } else if(S.tool==="fillet"||S.tool==="chamfer"){
    host.append(num(S.tool==="fillet"?"Radius":"Distance",
      S.op.r!=null? S.op.r : (S.tool==="fillet"?S.lastFillet:S.lastChamfer), "any",
      v=>{ const r=Math.max(0,v); if(S.op) S.op.r=r; if(S.tool==="fillet") S.lastFillet=r; else S.lastChamfer=r; }));
  } else if(S.tool==="scale"){
    host.append(radio([["graphical","Graphical"],["numerical","Numerical"]], S.scaleMode,
      v=>{ S.scaleMode=v; S.pending=[]; setPrompt(); draw(); }));
    if(S.scaleMode==="numerical") host.append(num("Scale", S.lastScaleFactor, "any", v=>S.lastScaleFactor=v));
  } else if(S.tool==="copy"){
    host.append(chk("Multiple", S.copyMultiple, v=>S.copyMultiple=v));
  } else if(S.tool==="rotate"){
    host.append(chk("Copy", S.copyRotate, v=>S.copyRotate=v));
  } else if(S.tool==="mirror"){
    host.append(chk("Copy", S.copyMirror, v=>S.copyMirror=v));
  } else if(S.tool==="polygon"){
    host.append(num("Sides", S.polySides, "1", v=>S.polySides=Math.max(3,Math.min(64,Math.round(v)))));
    const wrap=document.createElement("label"); const sp=document.createElement("span"); sp.className="oh"; sp.textContent="";
    const sel=document.createElement("select");
    for(const [v,l] of [["1","Inscribed"],["0","Circumscribed"]]){
      const o=document.createElement("option"); o.value=v; o.textContent=l;
      if((v==="1")===S.polyInscribed) o.selected=true; sel.append(o);
    }
    sel.onchange=()=>{ S.polyInscribed=sel.value==="1"; draw(); };
    wrap.append(sp,sel); host.append(wrap);
  } else if(S.tool==="select" && S.sel.size===1){
    const e=S.ents[[...S.sel][0]];
    if(e && e.si!=null){
      const lab=document.createElement("span"); lab.className="oh"; lab.textContent="Line style";
      const sw=document.createElement("span"); sw.className="swatch";
      const st=S.styles[e.si]; if(st) sw.style.background=aciColor(st.aci);
      const nm=document.createElement("span"); nm.textContent=st? st.name : "";
      host.append(lab,sw,nm);
    }
  }
}

/* ============================================================ layers UI */
function paintLayers(){
  if(ribbonTab==="Home") paintRibbon();
  const host=document.getElementById("layers"); host.innerHTML="";
  S.layers.forEach((L,i)=>{
    const d=document.createElement("div");
    d.className="layer"+(i===S.cur?" current":"")+(L.on?"":" hidden");
    d.onclick=ev=>{ if(ev.target.closest(".licon")) return; S.cur=i; paintLayers(); };
    const sw=document.createElement("span"); sw.className="swatch"; sw.style.background=aciColor(L.aci);
    sw.title="ACI "+L.aci+" - click to change";
    sw.onclick=ev=>{ ev.stopPropagation();
      const k=ACI.findIndex(a=>a.i===L.aci); L.aci=ACI[(k+1)%ACI.length].i; paintLayers(); draw(); };
    const nm=document.createElement("span"); nm.className="lname"; nm.textContent=L.name;
    nm.title="Double-click to rename";
    nm.ondblclick=ev=>{ ev.stopPropagation();
      requestString("Rename layer", L.name, v=>{
        if(v) L.name=v.trim().toUpperCase()||L.name;
        paintLayers(); draw(); }); };
    const vis=document.createElement("button"); vis.className="licon"+(L.on?" on":"");
    vis.textContent=L.on?"\u25CF":"\u25CB"; vis.title="Show / hide";
    vis.onclick=ev=>{ev.stopPropagation(); L.on=!L.on; paintLayers(); draw();};
    const lk=document.createElement("button"); lk.className="licon"+(L.lock?" on":"");
    lk.textContent=L.lock?"\u25A0":"\u25A1"; lk.title="Lock / unlock";
    lk.onclick=ev=>{ev.stopPropagation(); L.lock=!L.lock; paintLayers();};
    d.append(sw,nm,vis,lk); host.append(d);
  });
}
document.getElementById("btn-addlayer").onclick=()=>{
  requestString("New layer name", "LAYER"+S.layers.length, n=>{
    if(!n) return;
    S.layers.push({name:n.trim().toUpperCase(),aci:ACI[S.layers.length%ACI.length].i,on:true,lock:false});
    S.cur=S.layers.length-1; paintLayers(); echo("Layer "+S.layers[S.cur].name+" added");
  });
};

/* ============================================================ line styles UI
   Mirrors the Layers list: swatch cycles colour, weight is a typed mm value,
   the little dashed-line button cycles a small preset list of dash patterns. */
const PAT_PRESETS=[null,[3,2],[2,1.5],[6,2,1,2],[12,2,2,2],[8,2,1,2,1,2],[10,3]];
function patKey(p){ return p? p.join(",") : "solid"; }
function nextPattern(p){
  const idx=PAT_PRESETS.findIndex(x=>patKey(x)===patKey(p));
  return PAT_PRESETS[(idx+1+PAT_PRESETS.length)%PAT_PRESETS.length];
}
function paintStyles(){
  if(ribbonTab==="Home") paintRibbon();
  const host=document.getElementById("styles"); host.innerHTML="";
  S.styles.forEach((st,i)=>{
    const d=document.createElement("div");
    d.className="style-row"+(i===S.curStyle?" current":"");
    d.onclick=ev=>{ if(ev.target.closest("input,.spat,.swatch")) return; S.curStyle=i; paintStyles(); };
    const sw=document.createElement("span"); sw.className="swatch"; sw.style.background=aciColor(st.aci);
    sw.title="ACI "+st.aci+" - click to change";
    sw.onclick=ev=>{ ev.stopPropagation();
      const k=ACI.findIndex(a=>a.i===st.aci); st.aci=ACI[(k+1)%ACI.length].i; paintStyles(); draw(); };
    const nm=document.createElement("span"); nm.className="sname"; nm.textContent=st.name;
    nm.title="Double-click to rename";
    nm.ondblclick=ev=>{ ev.stopPropagation();
      requestString("Rename line style", st.name, v=>{ if(v) st.name=v.trim()||st.name; paintStyles(); draw(); }); };
    const w=document.createElement("input"); w.className="sweight"; w.type="number"; w.step="0.01"; w.min="0.01";
    w.value=st.w; w.title="Line weight, mm";
    w.onclick=ev=>ev.stopPropagation();
    w.onchange=()=>{ const v=parseFloat(w.value); if(isFinite(v)&&v>0) st.w=v; else w.value=st.w; draw(); };
    const pat=document.createElement("button"); pat.className="spat"; pat.title="Click to cycle the dash pattern";
    pat.innerHTML='<svg viewBox="0 0 28 14"><line x1="2" y1="7" x2="26" y2="7" stroke-dasharray="'+(st.pat?st.pat.join(","):"")+'"/></svg>';
    pat.onclick=ev=>{ ev.stopPropagation(); st.pat=nextPattern(st.pat); paintStyles(); draw(); };
    d.append(sw,nm,w,pat); host.append(d);
  });
}
document.getElementById("btn-addstyle").onclick=()=>{
  requestString("New line style name", "Style "+S.styles.length, n=>{
    if(!n) return;
    S.styles.push({name:n.trim(), w:0.25, aci:ACI[S.styles.length%ACI.length].i, pat:null});
    S.curStyle=S.styles.length-1; paintStyles(); echo("Line style "+S.styles[S.curStyle].name+" added");

      host.append(num("Image Y",R.y,v=>{if(!R.locked)R.y=v}));

      host.append(num("Rotation °",deg(R.rot||0),v=>{if(!R.locked)R.rot=rad(v)}));
      host.append(choice("Display",R.mode||"normal",[["normal","Normal"],["fade","Fade"],["gray","Greyscale"],["contrast","High contrast"],["invert","Invert"]],v=>R.mode=v));

      host.append(controls);

        const by=id=>document.getElementById(id);
        if(by("prop-imgcal"))by("prop-imgcal").onclick=()=>setTool("imgcal");
        if(by("prop-imgstraight"))by("prop-imgstraight").onclick=()=>setTool("imgstraight");
        if(by("prop-imgcrop"))by("prop-imgcrop").onclick=()=>setTool("imgcrop");

      "<kbd>&larr;&uarr;&rarr;&darr;</kbd> nudge selection &middot; <kbd>Shift</kbd> &times;10 &middot; <kbd>Ctrl</kbd> &divide;10<br>"+
      "<b style=\"color:var(--snap)\">Weld</b> on: points sharing a corner move together, so<br>"+

      "Type command aliases: <kbd>TR</kbd> corner &middot; <kbd>TRS</kbd>/<kbd>TRM</kbd> to boundary &middot; <kbd>O</kbd> <kbd>F</kbd> <kbd>CHA</kbd> <kbd>MI</kbd> <kbd>RO</kbd> <kbd>SC</kbd> <kbd>AR</kbd> <kbd>X</kbd><br>"+
      "Drop a PNG/JPG on the canvas as a tracing underlay &middot; <kbd>IMGCAL</kbd> scale &middot; <kbd>IMGSTRAIGHT</kbd> straighten &middot; <kbd>IMGCROP</kbd> crop<br>"+
      "<kbd>F8</kbd> ortho &middot; <kbd>F9</kbd> grid &middot; <kbd>F3</kbd> osnap &middot; <kbd>F6</kbd> image-edge snap<br>"+
      "Type <kbd>x,y</kbd> <kbd>@dx,dy</kbd> <kbd>len&lt;ang</kbd> or a bare length<br>"+

    host.append(h);

  function mkrow(label){ const d=document.createElement("div"); d.className="row";

    const d=mkrow(label), i=document.createElement("input");
    i.type="number"; i.step="any"; i.value=Number(val).toFixed(4).replace(/\.?0+$/,"");
    i.onchange=()=>{ const v=parseFloat(i.value); if(isFinite(v)){ set(v); draw(); updateProps(); } };

    const d=mkrow(label), i=document.createElement("input");
    i.type="text"; i.value=val;
    i.onchange=()=>{ set(i.value); draw(); }; d.append(i); return d;

    sel.onchange=()=>{ snap(); e.si=+sel.value; draw(); };
