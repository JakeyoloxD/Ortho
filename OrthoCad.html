}

/* ============================================================ DXF export (R12 / AC1009) */
function dxfName(n){ return (n||"0").toUpperCase().replace(/[^A-Z0-9_$-]/g,"_").slice(0,31)||"L"; }
function exportDXF(){
  const L=[];
  const g=(c,v)=>{ L.push(String(c)); L.push(String(v)); };
  let x0=0,y0=0,x1=100,y1=100;
  if(S.ents.length){
    x0=1e18;y0=1e18;x1=-1e18;y1=-1e18;
    for(const e of S.ents){const b=entBox(e);
      x0=Math.min(x0,b.x0);y0=Math.min(y0,b.y0);x1=Math.max(x1,b.x1);y1=Math.max(y1,b.y1);}
  }

  /* every S.styles entry gets its own named LTYPE, so a dashed/hidden/centreline
     style drawn here still looks right when the file is opened in AutoCAD */
  const usedLt=new Set(["CONTINUOUS"]);
  const ltNames=S.styles.map(st=>{
    let base=dxfName(st.name), nm=base, k=2;
    while(usedLt.has(nm)) nm=base.slice(0,27)+"_"+(k++);
    usedLt.add(nm); return nm;
  });

  g(0,"SECTION"); g(2,"HEADER");
  g(9,"$ACADVER"); g(1,"AC1009");
  g(9,"$EXTMIN"); g(10,x0); g(20,y0); g(30,0.0);
  g(9,"$EXTMAX"); g(10,x1); g(20,y1); g(30,0.0);
  g(0,"ENDSEC");

  g(0,"SECTION"); g(2,"TABLES");
  g(0,"TABLE"); g(2,"LTYPE"); g(70,1+S.styles.length);
  g(0,"LTYPE"); g(2,"CONTINUOUS"); g(70,0); g(3,"Solid line"); g(72,65); g(73,0); g(40,0.0);
  S.styles.forEach((st,i)=>{
    const pat=st.pat, name=ltNames[i];
    if(!pat||!pat.length){
      g(0,"LTYPE"); g(2,name); g(70,0); g(3,st.name); g(72,65); g(73,0); g(40,0.0);
    } else {
      const els=pat.map((v,k)=> k%2? -Math.abs(v) : Math.abs(v));
      const total=els.reduce((a,v)=>a+Math.abs(v),0);
      g(0,"LTYPE"); g(2,name); g(70,0); g(3,st.name); g(72,65); g(73,els.length); g(40,total);
      for(const el of els) g(49,el);
    }
  });
  g(0,"ENDTAB");
  g(0,"TABLE"); g(2,"LAYER"); g(70,S.layers.length);
  for(const l of S.layers){
    g(0,"LAYER"); g(2,dxfName(l.name)); g(70,l.lock?4:0); g(62, l.on? l.aci : -l.aci); g(6,"CONTINUOUS");
  }
  g(0,"ENDTAB"); g(0,"ENDSEC");

  g(0,"SECTION"); g(2,"ENTITIES");
  for(const e of S.ents){
    const ly=dxfName((S.layers[e.li]||S.layers[0]).name);
    switch(e.t){
      case "line": line(e.a,e.b,ly,e.si); break;
      case "circle": g(0,"CIRCLE"); g(8,ly); style(e.si); g(10,e.c.x); g(20,e.c.y); g(30,0.0); g(40,e.r); break;
      case "arc": g(0,"ARC"); g(8,ly); style(e.si); g(10,e.c.x); g(20,e.c.y); g(30,0.0); g(40,e.r);
                  g(50,deg(e.a0)); g(51,deg(e.a1)); break;
      case "pline":{
        g(0,"POLYLINE"); g(8,ly); style(e.si); g(66,1); g(10,0.0); g(20,0.0); g(30,0.0); g(70,e.closed?1:0);
        for(const p of e.pts){ g(0,"VERTEX"); g(8,ly); style(e.si); g(10,p.x); g(20,p.y); g(30,0.0); }
        g(0,"SEQEND"); g(8,ly); break;
      }
      case "ellipse": case "spline":{
        const pts=flatten(e);
        g(0,"POLYLINE"); g(8,ly); style(e.si); g(66,1); g(10,0.0); g(20,0.0); g(30,0.0);
        g(70,(e.t==="spline"&&e.closed)?1:0);
        for(const p of pts){ g(0,"VERTEX"); g(8,ly); style(e.si); g(10,p.x); g(20,p.y); g(30,0.0); }
        g(0,"SEQEND"); g(8,ly); break;
      }
      case "text": text(e.p,e.s,e.h,deg(e.rot||0),ly,0); break;
      case "dim":{
        const {d,p1,p2,o}=dimGeom(e), n=norm(o), ext=Math.max(2,e.h||2.5);
        line(add(e.a,mul(o,.06)), add(p1,mul(n,ext*.6)), ly);
        line(add(e.b,mul(o,.06)), add(p2,mul(n,ext*.6)), ly);
        line(p1,p2,ly);
        const t=(e.h||2.5)*.6;
        for(const p of [p1,p2]) line(add(p,mul(add(d,perp(d)),t)), sub(p,mul(add(d,perp(d)),t)), ly);
        const mid=mul(add(p1,p2),.5);
        let r=deg(ang(p1,p2)); if(r>90) r-=180; if(r<-90) r+=180;
        const up=mul(n,(e.h||2.5)*.35);
        text(add(mid,up), dist(e.a,e.b).toFixed(1), e.h||2.5, r, ly, 1);
        break;
      }
    }
  }
  g(0,"ENDSEC"); g(0,"EOF");
  download(L.join("\r\n")+"\r\n","drawing.dxf","application/dxf");
  echo("Exported "+S.ents.length+" objects to DXF R12");

  function style(si){ if(si==null) return; const st=S.styles[si]; if(!st) return; g(62,st.aci); g(6,ltNames[si]); }
  function line(a,b,ly,si){ g(0,"LINE"); g(8,ly); style(si); g(10,a.x); g(20,a.y); g(30,0.0); g(11,b.x); g(21,b.y); g(31,0.0); }
  function text(p,s,h,rot,ly,center){
    g(0,"TEXT"); g(8,ly); g(10,p.x); g(20,p.y); g(30,0.0); g(40,h); g(1,String(s));
    if(rot) g(50,rot);
    if(center){ g(72,1); g(11,p.x); g(21,p.y); g(31,0.0); }
  }
}

/* ============================================================ DXF import */
function importDXF(txt){
  const lines=txt.split(/\r\n|\r|\n/);
  const pairs=[];
  for(let i=0;i+1<lines.length;i+=2){
    const c=parseInt(lines[i].trim(),10);
    if(isNaN(c)) continue;
    pairs.push([c, lines[i+1]]);
  }
  const ents=[], layerNames=[];
  let i=0, inEnt=false;
  const layerIndex=n=>{
    const N=(n||"0").toUpperCase();
    let k=S.layers.findIndex(l=>l.name.toUpperCase()===N);
    if(k<0){ S.layers.push({name:N,aci:ACI[S.layers.length%ACI.length].i,on:true,lock:false});
             k=S.layers.length-1; }
    return k;
  };
  // locate ENTITIES section
  for(;i<pairs.length;i++){
    if(pairs[i][0]===2 && pairs[i][1].trim().toUpperCase()==="ENTITIES"){ i++; break; }
  }
  let cur=null, verts=null, plineLayer=0, plineClosed=false;
  const flush=()=>{ if(cur) ents.push(cur); cur=null; };
  for(;i<pairs.length;i++){
    const [c,vRaw]=pairs[i], v=vRaw.trim();
    if(c===0){
      const type=v.toUpperCase();
      if(type==="ENDSEC") { flush(); break; }
      if(verts && type!=="VERTEX"){
        if(verts.pts.length>1) ents.push({t:"pline",li:plineLayer,closed:plineClosed,pts:verts.pts});
        verts=null;
      }
      flush();
      if(type==="LINE")    cur={t:"line",li:0,a:V(0,0),b:V(0,0)};
      else if(type==="CIRCLE") cur={t:"circle",li:0,c:V(0,0),r:1};
      else if(type==="ARC")    cur={t:"arc",li:0,c:V(0,0),r:1,a0:0,a1:0};
      else if(type==="TEXT"||type==="MTEXT") cur={t:"text",li:0,p:V(0,0),h:2.5,s:"",rot:0};
      else if(type==="LWPOLYLINE") cur={t:"pline",li:0,closed:false,pts:[],_lw:true};
      else if(type==="POLYLINE"){ verts={pts:[]}; plineClosed=false; plineLayer=0; cur=null; }
      else if(type==="VERTEX"){ if(verts) verts.pts.push(V(0,0)); cur=null; }
      continue;
    }
    if(verts && !cur){
      const p=verts.pts[verts.pts.length-1];
      if(c===8) plineLayer=layerIndex(v);
      if(c===70 && !p) plineClosed=(parseInt(v,10)&1)===1;
      if(p){ if(c===10) p.x=parseFloat(v); if(c===20) p.y=parseFloat(v); }
      continue;
    }
    if(!cur) continue;
    const f=parseFloat(v);
    switch(c){
      case 8: cur.li=layerIndex(v); break;
      case 1: if(cur.t==="text") cur.s=v.replace(/\\[A-Za-z][^;]*;/g,""); break;
      case 10:
        if(cur.t==="line") cur.a.x=f;
        else if(cur.t==="text") cur.p.x=f;
        else if(cur._lw) cur.pts.push(V(f,0));
        else cur.c.x=f;
        break;
      case 20:
        if(cur.t==="line") cur.a.y=f;
        else if(cur.t==="text") cur.p.y=f;
        else if(cur._lw){ const p=cur.pts[cur.pts.length-1]; if(p) p.y=f; }
        else cur.c.y=f;
        break;
      case 11: if(cur.t==="line") cur.b.x=f; break;
      case 21: if(cur.t==="line") cur.b.y=f; break;
      case 40: if(cur.t==="text") cur.h=f||2.5; else if("r" in cur) cur.r=f; break;
      case 50: if(cur.t==="arc") cur.a0=wrap(rad(f)); else if(cur.t==="text") cur.rot=rad(f); break;
      case 51: if(cur.t==="arc") cur.a1=wrap(rad(f)); break;
      case 70: if(cur._lw) cur.closed=(parseInt(v,10)&1)===1; break;
    }
  }
  if(verts && verts.pts.length>1) ents.push({t:"pline",li:plineLayer,closed:plineClosed,pts:verts.pts});
  for(const e of ents) delete e._lw;
  const good=ents.filter(e=> e.t!=="pline" || e.pts.length>1);
  if(!good.length){ echo("No supported entities found in that DXF","warn"); paintLayers(); return; }
  snap();
  S.ents.push(...good);
  paintLayers(); zoomExtents(); updateProps();
  echo("Imported "+good.length+" objects");
}

/* ============================================================ SVG export */
function exportSVG(){
  let x0=0,y0=0,x1=100,y1=100;
  if(S.ents.length){
    x0=1e18;y0=1e18;x1=-1e18;y1=-1e18;
    for(const e of S.ents){const b=entBox(e);
      x0=Math.min(x0,b.x0);y0=Math.min(y0,b.y0);x1=Math.max(x1,b.x1);y1=Math.max(y1,b.y1);}
  }
  const pad=Math.max(5,(x1-x0+y1-y0)*.03);
  x0-=pad;y0-=pad;x1+=pad;y1+=pad;
  const w=x1-x0,h=y1-y0, sw=(Math.max(w,h)/900).toFixed(4);
  const o=[`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x0} ${-y1} ${w} ${h}" width="${w}mm" height="${h}mm">`,
    `<g fill="none" stroke-width="${sw}" stroke-linecap="round">`];
  const P=p=>`${p.x} ${-p.y}`;
  for(const e of S.ents){
    const L=S.layers[e.li]||S.layers[0]; if(!L.on) continue;
    const col=aciColor(L.aci)==="#e8edf4"?"#000000":aciColor(L.aci);
    const st=`stroke="${col}"`;
    if(e.t==="line") o.push(`<line x1="${e.a.x}" y1="${-e.a.y}" x2="${e.b.x}" y2="${-e.b.y}" ${st}/>`);
    if(e.t==="circle") o.push(`<circle cx="${e.c.x}" cy="${-e.c.y}" r="${e.r}" ${st}/>`);
    if(e.t==="pline") o.push(`<path d="M ${e.pts.map(P).join(" L ")}${e.closed?" Z":""}" ${st}/>`);
    if(e.t==="arc"){
      const a=V(e.c.x+e.r*Math.cos(e.a0),e.c.y+e.r*Math.sin(e.a0));
      const b=V(e.c.x+e.r*Math.cos(e.a1),e.c.y+e.r*Math.sin(e.a1));
      const large=wrap(e.a1-e.a0)>Math.PI?1:0;
      o.push(`<path d="M ${P(a)} A ${e.r} ${e.r} 0 ${large} 0 ${P(b)}" ${st}/>`);
    }
    if(e.t==="text") o.push(`<text x="${e.p.x}" y="${-e.p.y}" font-size="${e.h}" font-family="monospace" fill="${col}" stroke="none">${esc(e.s)}</text>`);
    if(e.t==="dim"){
      const {p1,p2}=dimGeom(e), mid=mul(add(p1,p2),.5);
      o.push(`<line x1="${p1.x}" y1="${-p1.y}" x2="${p2.x}" y2="${-p2.y}" ${st}/>`);
      o.push(`<text x="${mid.x}" y="${-mid.y-(e.h||2.5)*.4}" font-size="${e.h||2.5}" text-anchor="middle" font-family="monospace" fill="${col}" stroke="none">${dist(e.a,e.b).toFixed(1)}</text>`);
    }
  }
  o.push("</g></svg>");
  download(o.join("\n"),"drawing.svg","image/svg+xml");
  echo("Exported SVG");
  function esc(s){return String(s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}
}


/* ============================================================ PDF vector import
   Planning drawings are vector PDFs, so the linework is already in the file as
   path operators. This reads the content streams directly - no tracing, no OCR.
   Flate is handled by the browser's own DecompressionStream. */
const PDFIN = (()=>{

function latin1(bytes){
  let out="", CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) out+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return out;
}
async function inflate(bytes){
  if(typeof DecompressionStream==="undefined") return null;
  for(const fmt of ["deflate","deflate-raw"]){
    try{
      const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream(fmt));
      return new Uint8Array(await new Response(st).arrayBuffer());
    }catch(err){}
  }
  return null;
}
function a85(str){
  str=str.replace(/\s/g,"").replace(/^<~/,""); const end=str.indexOf("~>");
  if(end>=0) str=str.slice(0,end);
  const out=[]; let i=0;
  while(i<str.length){
    if(str[i]==="z"){ out.push(0,0,0,0); i++; continue; }
    const chunk=str.slice(i,i+5); i+=5;
    const pad=5-chunk.length;
    let v=0; for(let k=0;k<5;k++) v=v*85+((chunk.charCodeAt(k)||117)-33);
    const b=[v>>>24&255,v>>>16&255,v>>>8&255,v&255];
    out.push(...b.slice(0,4-pad));
  }
  return new Uint8Array(out);
}

function lzw(data, early){
  const out=[];
  let dict=[], bitbuf=0, bits=0, codeLen=9, prev=null;
  const reset=()=>{ dict=[]; for(let i=0;i<256;i++) dict.push([i]); dict.push(null,null); codeLen=9; prev=null; };
  reset();
  for(let i=0;i<data.length;i++){
    bitbuf=((bitbuf<<8)|data[i])>>>0; bits+=8;
    while(bits>=codeLen){
      const code=(bitbuf>>>(bits-codeLen))&((1<<codeLen)-1); bits-=codeLen;
      if(code===256){ reset(); continue; }
      if(code===257){ return new Uint8Array(out); }
      let entry;
      if(code<dict.length && dict[code]) entry=dict[code];
      else if(prev) entry=prev.concat(prev[0]);
      else continue;
      for(const b of entry) out.push(b);
      if(prev) dict.push(prev.concat(entry[0]));
      prev=entry;
      if(dict.length>=(1<<codeLen)-(early?1:0) && codeLen<12) codeLen++;
    }
  }
  return new Uint8Array(out);
}

/* ---- lexer shared by object bodies and content streams ---- */
function lex(s){
  const T=[]; let i=0; const n=s.length;
  const DELIM=/[\s()<>\[\]{}\/%]/;
  while(i<n){
    const c=s[i];
    if(c===" "||c==="\n"||c==="\r"||c==="\t"||c==="\f"||c==="\0"){i++;continue;}
    if(c==="%"){ while(i<n&&s[i]!=="\n"&&s[i]!=="\r") i++; continue; }
    if(c==="/"){ let j=i+1; while(j<n&&!DELIM.test(s[j])) j++;
      T.push({t:"name",v:decodeURIComponent(s.slice(i+1,j).replace(/#([0-9a-f]{2})/gi,"%$1"))}); i=j; continue; }
    if(c==="("){
      let j=i+1,d=1,out="";
      while(j<n&&d>0){
        const ch=s[j];
        if(ch==="\\"){
          const e=s[j+1];
          if(e>="0"&&e<="7"){ let o=""; let k=j+1;
            while(k<n&&o.length<3&&s[k]>="0"&&s[k]<="7"){o+=s[k];k++;}
            out+=String.fromCharCode(parseInt(o,8)); j=k; continue; }
          out+=({n:"\n",r:"\r",t:"\t",b:"\b",f:"\f"}[e]!==undefined?{n:"\n",r:"\r",t:"\t",b:"\b",f:"\f"}[e]:e)||"";
          j+=2; continue;
        }
        if(ch==="("){d++;out+=ch;}
        else if(ch===")"){d--; if(d) out+=ch;}
        else out+=ch;
        j++;
      }
      T.push({t:"str",v:out}); i=j; continue;
    }
    if(c==="<"&&s[i+1]==="<"){ T.push({t:"op",v:"<<"}); i+=2; continue; }
    if(c===">"&&s[i+1]===">"){ T.push({t:"op",v:">>"}); i+=2; continue; }
    if(c==="<"){ let j=s.indexOf(">",i); if(j<0) j=n;
      const hex=s.slice(i+1,j).replace(/[^0-9a-fA-F]/g,""); let out="";
      for(let k=0;k+1<hex.length;k+=2) out+=String.fromCharCode(parseInt(hex.substr(k,2),16));
      T.push({t:"str",v:out,hex:true}); i=j+1; continue; }
    if(c==="["||c==="]"||c==="{"||c==="}"){ T.push({t:"op",v:c}); i++; continue; }
    if(/[-+.\d]/.test(c)){ let j=i; while(j<n&&/[-+.\d]/.test(s[j])) j++;
      const v=parseFloat(s.slice(i,j)); T.push({t:"num",v:isFinite(v)?v:0}); i=j; continue; }
    let j=i; while(j<n&&!DELIM.test(s[j])) j++;
    if(j===i){ i++; continue; }
    T.push({t:"op",v:s.slice(i,j)}); i=j;
  }
  return T;
}
/* ---- object value parser ---- */
function parseVal(T,i){
  const tk=T[i];
  if(!tk) return [null,i+1];
  if(tk.t==="num"){
    if(T[i+1]&&T[i+1].t==="num"&&T[i+2]&&T[i+2].t==="op"&&T[i+2].v==="R")
      return [{ref:tk.v}, i+3];
    return [tk.v, i+1];
  }
  if(tk.t==="name") return [{name:tk.v}, i+1];
  if(tk.t==="str")  return [tk.v, i+1];
  if(tk.t==="op"&&tk.v==="<<"){
    const d={}; i++;
    while(i<T.length && !(T[i].t==="op"&&T[i].v===">>")){
      if(T[i].t!=="name"){ i++; continue; }
      const k=T[i].v; let v; [v,i]=parseVal(T,i+1); d[k]=v;
    }
    return [d, i+1];
  }
  if(tk.t==="op"&&tk.v==="["){
    const a=[]; i++;
    while(i<T.length && !(T[i].t==="op"&&T[i].v==="]")){ let v; [v,i]=parseVal(T,i); a.push(v); }
    return [a, i+1];
  }
  if(tk.t==="op"&&(tk.v==="true"||tk.v==="false")) return [tk.v==="true", i+1];
  return [null, i+1];
}

/* ---- matrices ---- */
const M_ID=[1,0,0,1,0,0];
const mmul=(m,n)=>[
  m[0]*n[0]+m[1]*n[2],      m[0]*n[1]+m[1]*n[3],
  m[2]*n[0]+m[3]*n[2],      m[2]*n[1]+m[3]*n[3],
  m[4]*n[0]+m[5]*n[2]+n[4], m[4]*n[1]+m[5]*n[3]+n[5]];
const mapp=(m,x,y)=>({x:m[0]*x+m[2]*y+m[4], y:m[1]*x+m[3]*y+m[5]});
const mscale=m=>Math.sqrt(Math.abs(m[0]*m[3]-m[1]*m[2]))||1;

/* ---- main ---- */
async function read(bytes, log){
  const str=latin1(bytes);
  const objs=new Map();
  const re=/(\d+)\s+(\d+)\s+obj\b/g;
  let m;
  while((m=re.exec(str))){
    const id=+m[1], bodyStart=m.index+m[0].length;
    const endObj=str.indexOf("endobj", bodyStart);
    const sIdx=str.indexOf("stream", bodyStart);
    const hasStream = sIdx>=0 && (endObj<0 || sIdx<endObj);
    const head=str.slice(bodyStart, hasStream? sIdx : (endObj<0? bodyStart+4096 : endObj));
    let dict=null;
    try{ dict=parseVal(lex(head),0)[0]; }catch(err){}
    const rec={id, dict};
    if(hasStream){
      let p=sIdx+6;
      if(str[p]==="\r") p++;
      if(str[p]==="\n") p++;
      rec.start=p;
      let len = dict && typeof dict.Length==="number" ? dict.Length : null;
      let ok = len!==null && /^\s*endstream/.test(str.slice(p+len, p+len+20));
      if(!ok){
        const e=str.indexOf("endstream", p);
        len = e<0 ? 0 : e-p;
        while(len>0 && (str[p+len-1]==="\n"||str[p+len-1]==="\r")) len--;
      }
      rec.end=p+len;
    }
    objs.set(id, rec);
  }
  const resolve=v=> (v&&typeof v==="object"&&"ref" in v) ? (objs.get(v.ref)||{}).dict : v;

  async function streamData(rec){
    if(rec.data!==undefined) return rec.data;
    let raw=bytes.subarray(rec.start, rec.end);
    let f=rec.dict&&rec.dict.Filter;
    const filters = !f ? [] : (Array.isArray(f)? f : [f]).map(x=>x&&x.name).filter(Boolean);
    for(const fl of filters){
      if(fl==="FlateDecode"){ const out=await inflate(raw); if(!out){ rec.data=null; return null; } raw=out; }
      else if(fl==="ASCII85Decode") raw=a85(latin1(raw));
      else if(fl==="LZWDecode"){
        const dp=(rec.dict&&rec.dict.DecodeParms)||{};
        raw=lzw(raw, (dp.EarlyChange===undefined?1:dp.EarlyChange)!==0);
      }
      else if(fl==="ASCIIHexDecode"){
        const h=latin1(raw).replace(/[^0-9a-fA-F]/g,""); const o=new Uint8Array(h.length>>1);
        for(let k=0;k<o.length;k++) o[k]=parseInt(h.substr(k*2,2),16); raw=o;
      }
      else { rec.data=null; return null; }
    }
    rec.data=raw; return raw;
  }
  function noteUndecoded(rec){
    out.undecoded++;
    const f=rec.dict&&rec.dict.Filter;
    for(const x of (Array.isArray(f)?f:[f])) if(x&&x.name) out.filters.add(x.name);
  }

  /* expand compressed object streams so page dictionaries are visible */
  for(const rec of [...objs.values()]){
    if(!rec.dict || !rec.dict.Type || rec.dict.Type.name!=="ObjStm") continue;
    const data=await streamData(rec); if(!data) continue;
    const txt=latin1(data);
    const N=rec.dict.N|0, First=rec.dict.First|0;
    const nums=lex(txt.slice(0,First)).filter(t=>t.t==="num").map(t=>t.v);
    for(let k=0;k<N;k++){
      const id=nums[k*2], off=nums[k*2+1];
      if(id===undefined||off===undefined) continue;
      if(objs.has(id)&&objs.get(id).dict) continue;
      try{ objs.set(id,{id, dict:parseVal(lex(txt.slice(First+off, First+off+8192)),0)[0]}); }catch(err){}
    }
  }

  /* pages */
  let pages=[...objs.values()].filter(r=>r.dict&&r.dict.Type&&r.dict.Type.name==="Page");
  const out={subpaths:[], texts:[], images:0, pages:0, box:null, undecoded:0, filters:new Set()};

  const emitFor = async (content, resources, baseCTM, box)=>{
    await runContent(content, resources, baseCTM, out, 0, objs, resolve, streamData);
  };

  if(pages.length){
    out.pages=pages.length;
    const pg=pages[0];                       // first page only
    let box=resolve(pg.dict.MediaBox)||[0,0,595,842];
    box=box.map(v=>typeof v==="number"?v:0);
    out.box=box;
    let contents=pg.dict.Contents;
    const parts=[];
    const list=Array.isArray(contents)?contents:[contents];
    for(const c of list){
      const r=c&&c.ref!==undefined?objs.get(c.ref):null;
      if(r&&r.start!==undefined){ const d=await streamData(r); if(d) parts.push(latin1(d)); else noteUndecoded(r); }
    }
    const res=resolve(pg.dict.Resources)||{};
    await emitFor(parts.join("\n"), res, M_ID, box);
  } else {
    /* no page dictionaries reachable: parse every content-looking stream */
    log("No page tree found, scanning every stream");
    for(const rec of objs.values()){
      if(rec.start===undefined) continue;
      const sub=rec.dict&&rec.dict.Subtype&&rec.dict.Subtype.name;
      if(sub==="Image"){ out.images++; continue; }
      const d=await streamData(rec); if(!d){ noteUndecoded(rec); continue; }
      const txt=latin1(d);
      if(!/(^|\s)(re|m|l|c)\s/.test(txt)) continue;
      await emitFor(txt, resolve(rec.dict&&rec.dict.Resources)||{}, M_ID, null);
    }
    out.pages=1;
  }
  return out;
}

/* ---- content stream interpreter ---- */
async function runContent(src, res, ctm, out, depth, objs, resolve, streamData){
  if(depth>8 || !src) return;
  const T=lex(src);
  let st=[], path=[], cur=null, start=null;
  let stroke=[0,0,0], fill=[0,0,0];
  let tm=M_ID.slice(), tlm=M_ID.slice(), fsize=10, lead=0, inText=false;
  const gs=[];
  const ops=[];
  const P=(x,y)=>mapp(ctm,x,y);
  const bez=(p0,p1,p2,p3,arr)=>{
    for(let k=1;k<=12;k++){ const t=k/12,u=1-t;
      arr.push({x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,
                y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y}); }
  };
  const emit=(useFill)=>{
    const col=useFill?fill:stroke;
    for(const sp of path){
      if(sp.pts.length<2) continue;
      out.subpaths.push({pts:sp.pts, closed:!!sp.closed||!!useFill, col});
    }
    path=[]; cur=null;
  };
  const num=k=>{ const v=ops[ops.length-k]; return typeof v==="number"?v:0; };

  for(let i=0;i<T.length;i++){
    const tk=T[i];
    if(tk.t!=="op"){ ops.push(tk.t==="name"?{name:tk.v}:tk.v); if(ops.length>64) ops.shift(); continue; }
    const v=tk.v;
    if(v==="["||v==="]"||v==="<<"||v===">>"){ ops.push(v); if(ops.length>64) ops.shift(); continue; }
    switch(v){
      case "q": gs.push({ctm:ctm.slice(),stroke:stroke.slice(),fill:fill.slice()}); break;
      case "Q": { const g=gs.pop(); if(g){ctm=g.ctm;stroke=g.stroke;fill=g.fill;} break; }
      case "cm": ctm=mmul([num(6),num(5),num(4),num(3),num(2),num(1)],ctm); break;
      case "m": cur={pts:[P(num(2),num(1))]}; path.push(cur); break;
      case "l": if(cur) cur.pts.push(P(num(2),num(1))); break;
      case "c": if(cur&&cur.pts.length){ const p0=cur.pts[cur.pts.length-1];
          bez(p0,P(num(6),num(5)),P(num(4),num(3)),P(num(2),num(1)),cur.pts); } break;
      case "v": if(cur&&cur.pts.length){ const p0=cur.pts[cur.pts.length-1];
          bez(p0,p0,P(num(4),num(3)),P(num(2),num(1)),cur.pts); } break;
      case "y": if(cur&&cur.pts.length){ const p0=cur.pts[cur.pts.length-1], p3=P(num(2),num(1));
          bez(p0,P(num(4),num(3)),p3,p3,cur.pts); } break;
      case "h": if(cur) cur.closed=true; break;
      case "re": {
        const x=num(4),y=num(3),w=num(2),h=num(1);
        cur={pts:[P(x,y),P(x+w,y),P(x+w,y+h),P(x,y+h)],closed:true};
        path.push(cur); break;
      }
      case "n": path=[]; cur=null; break;
      case "S": case "s": if(v==="s"&&cur) cur.closed=true; emit(false); break;
      case "f": case "F": case "f*": emit(true); break;
      case "B": case "B*": case "b": case "b*": emit(true); break;
      case "W": case "W*": break;
      case "G": stroke=[num(1),num(1),num(1)]; break;
      case "g": fill=[num(1),num(1),num(1)]; break;
      case "RG": stroke=[num(3),num(2),num(1)]; break;
      case "rg": fill=[num(3),num(2),num(1)]; break;
      case "K": { const k=num(1); stroke=[(1-num(4))*(1-k),(1-num(3))*(1-k),(1-num(2))*(1-k)]; break; }
      case "k": { const k=num(1); fill=[(1-num(4))*(1-k),(1-num(3))*(1-k),(1-num(2))*(1-k)]; break; }
      case "BT": inText=true; tm=M_ID.slice(); tlm=M_ID.slice(); break;
      case "ET": inText=false; break;
      case "Tf": fsize=num(1)||10; break;
      case "TL": lead=num(1); break;
      case "Td": tlm=mmul([1,0,0,1,num(2),num(1)],tlm); tm=tlm.slice(); break;
      case "TD": lead=-num(1); tlm=mmul([1,0,0,1,num(2),num(1)],tlm); tm=tlm.slice(); break;
      case "Tm": tlm=[num(6),num(5),num(4),num(3),num(2),num(1)]; tm=tlm.slice(); break;
      case "T*": tlm=mmul([1,0,0,1,0,-lead],tlm); tm=tlm.slice(); break;
      case "Tj": case "'": case "\"": {
        if(v!=="Tj"){ tlm=mmul([1,0,0,1,0,-lead],tlm); tm=tlm.slice(); }
        const sv=ops[ops.length-1];
        if(typeof sv==="string") pushText(sv);
        break;
      }
      case "TJ": {
        let j=ops.length-1, depthA=0, parts=[];
        while(j>=0){ const o=ops[j];
          if(o==="]"){depthA++;} else if(o==="["){depthA--; if(depthA===0) break;}
          else if(typeof o==="string") parts.unshift(o);
          j--; }
        if(parts.length) pushText(parts.join(""));
        break;
      }
      case "Do": {
        const nm=ops[ops.length-1];
        const xod=resolve((res||{}).XObject)||{};
        const ref=nm&&nm.name?xod[nm.name]:null;
        const rec=ref&&ref.ref!==undefined?objs.get(ref.ref):null;
        if(rec&&rec.dict){
          const sub=rec.dict.Subtype&&rec.dict.Subtype.name;
          if(sub==="Image") out.images++;
          else if(rec.start!==undefined){
            const d=await streamData(rec);
            if(d){
              const mtx=resolve(rec.dict.Matrix);
              const M=Array.isArray(mtx)&&mtx.length===6?mtx.map(Number):M_ID;
              await runContent(latin1(d), resolve(rec.dict.Resources)||res,
                               mmul(M,ctm), out, depth+1, objs, resolve, streamData);
            }
          }
        }
        break;
      }
      case "BI": {
        out.images++;
        while(i<T.length && !(T[i].t==="op"&&T[i].v==="EI")) i++;
        break;
      }
    }
    ops.length=0;
  }
  function pushText(sv){
    const clean=[...sv].filter(ch=>{const c=ch.charCodeAt(0); return c>=32&&c<127;}).join("");
    if(clean.replace(/\s/g,"").length < Math.ceil(sv.length*0.5)) return;   // CID gibberish
    if(!clean.trim()) return;
    const M=mmul(tm,ctm);
    out.texts.push({p:mapp(M,0,0), h:Math.abs(fsize*mscale(M)), s:clean,
                    rot:Math.atan2(M[1],M[0])});
    tm=mmul([1,0,0,1,fsize*0.5*clean.length,0],tm);
  }
}

/* ---- colour -> nearest ACI ---- */
function toACI(col){
  const hex=c=>Math.max(0,Math.min(255,Math.round(c*255)));
  const r=hex(col[0]),g=hex(col[1]),b=hex(col[2]);
  if(r>235&&g>235&&b>235) return 7;
  if(r<25&&g<25&&b<25) return 7;
  let best=7,bd=1e18;
  for(const a of ACI){
    const R=parseInt(a.c.substr(1,2),16),G=parseInt(a.c.substr(3,2),16),B=parseInt(a.c.substr(5,2),16);
    const d=(R-r)**2+(G-g)**2+(B-b)**2;
    if(d<bd){bd=d;best=a.i;}
  }
  return best;
}
return {read, toACI, latin1, lex, parseVal, mmul, mapp};
})();

const MAX_PDF_ENTS=40000;
async function importPDF(file){
  echo("Reading "+file.name+" ...");
  let data;
  try{ data=new Uint8Array(await file.arrayBuffer()); }
  catch(err){ return echo("Could not read that file","warn"); }
  if(PDFIN.latin1(data.subarray(0,8)).indexOf("%PDF")<0) return echo("That is not a PDF","warn");
  if(typeof DecompressionStream==="undefined")
    return echo("This browser cannot inflate PDF streams","warn");
  let res;
  try{ res=await PDFIN.read(data, m=>echo(m)); }
  catch(err){ console.error(err); return echo("Could not parse that PDF: "+err.message,"warn"); }

  if(!res.subpaths.length){
    if(res.undecoded)
      return echo("Could not decode "+res.undecoded+" stream(s) using "+
        ([...res.filters].join(", ")||"an unknown filter")+" - that encoding is not supported","warn");
    return echo(res.images
      ? "No vector linework - that looks like a scanned drawing, so there is nothing to extract"
      : "No vector linework found in that PDF","warn");
  }
  pdfPending={res, name:file.name};
  requestString("Drawing scale 1:N  (page is "+
    (res.box? Math.round((res.box[2]-res.box[0])*25.4/72)+"x"+Math.round((res.box[3]-res.box[1])*25.4/72)+"mm" : "unknown")+
    ")", "100", v=>placePDF(parseFloat(v)));
}
let pdfPending=null;
function placePDF(scale){
  if(!pdfPending) return;
  if(!isFinite(scale)||scale<=0) scale=1;
  const {res,name}=pdfPending; pdfPending=null;
  const K=(25.4/72)*scale;
  const ox=res.box?res.box[0]:0, oy=res.box?res.box[1]:0;
  const T=p=>V((p.x-ox)*K, (p.y-oy)*K);

  const layerFor=aci=>{
    const nm="PDF-"+(ACI.find(a=>a.i===aci)||{n:"7"}).n.toUpperCase();
    let i=S.layers.findIndex(L=>L.name===nm);
    if(i<0){ S.layers.push({name:nm,aci,on:true,lock:false}); i=S.layers.length-1; }
    return i;
  };
  snap();
  let made=0, skipped=0;
  for(const sp of res.subpaths){
    if(made>=MAX_PDF_ENTS){ skipped++; continue; }
    const pts=sp.pts.map(T);
    const ded=[pts[0]];
    for(let i=1;i<pts.length;i++)
      if(Math.abs(pts[i].x-ded[ded.length-1].x)>1e-7||Math.abs(pts[i].y-ded[ded.length-1].y)>1e-7)
        ded.push(pts[i]);
    if(ded.length<2) continue;
    const li=layerFor(PDFIN.toACI(sp.col));
    if(ded.length===2) S.ents.push({t:"line",li,a:ded[0],b:ded[1]});
    else S.ents.push({t:"pline",li,closed:!!sp.closed,pts:ded});
    made++;
  }
  let txt=0;
  const tli=layerFor(2);
  for(const t of res.texts){
    if(made+txt>=MAX_PDF_ENTS) break;
    const h=t.h*K;
    if(!(h>0)||!isFinite(h)) continue;
    S.ents.push({t:"text",li:tli,p:T(t.p),h,s:t.s,rot:t.rot||0});
    txt++;
  }
  S.sel.clear(); paintLayers(); zoomExtents(); updateProps();
  echo(name+": "+made+" objects, "+txt+" labels at 1:"+scale+
       (skipped?"  ("+skipped+" over the "+MAX_PDF_ENTS+" cap)":"")+
       (res.images?"  ["+res.images+" raster image(s) ignored]":""));
}

/* ============================================================ file io */
function download(text,name,mime){
  const b=new Blob([text],{type:mime}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function loadReferenceImage(file){
  if(!file||!(/^image\/(png|jpeg|webp)$/i.test(file.type)||/\.(png|jpe?g|webp)$/i.test(file.name))) return echo("Use a PNG, JPG or WebP image","warn");
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const viewW=W/S.view.s, viewH=H/S.view.s;
      const maxW=Math.max(10,viewW*0.72), maxH=Math.max(10,viewH*0.72);
      let w=maxW, h=w*(img.naturalHeight/img.naturalWidth);
      if(h>maxH){ h=maxH; w=h*(img.naturalWidth/img.naturalHeight); }
      S.refImage={img,name:file.name,x:S.view.cx,y:S.view.cy,w,h,opacity:0.48,visible:true,locked:false,rot:0,crop:null,mode:"fade"};
      prepareReferenceEdges(S.refImage);
      draw(); updateProps(); paintRibbon();
      echo("Reference loaded. Calibrate: click two known points, then enter their real distance in mm.");
    };
    img.onerror=()=>echo("Could not decode that image","warn");
    img.src=String(reader.result);
  };
  reader.readAsDataURL(file);
}
function toggleReferenceImage(){
  if(!S.refImage) return echo("No reference image loaded","warn");
  S.refImage.visible=!S.refImage.visible; draw(); updateProps(); echo("Reference image "+(S.refImage.visible?"shown":"hidden"));
}
function toggleReferenceLock(){
  if(!S.refImage) return echo("No reference image loaded","warn");
  S.refImage.locked=!S.refImage.locked;
  if(S.refImage.locked && ["imgmove","imgcal","imgstraight","imgcrop"].includes(S.tool)) setTool("select");
  draw(); updateProps(); paintRibbon(); echo("Reference image "+(S.refImage.locked?"locked":"unlocked"));
}
function resetReferenceCrop(){
  if(!S.refImage) return echo("No reference image loaded","warn");
  if(S.refImage.locked) return echo("Unlock the reference image first","warn");
  S.refImage.crop=null; draw(); updateProps(); echo("Reference crop reset");
}
function removeReferenceImage(){
  if(!S.refImage) return echo("No reference image loaded","warn");
  S.refImage=null; draw(); updateProps(); paintRibbon(); echo("Reference image removed");
}
document.getElementById("imagein").onchange=e=>{
  const f=e.target.files[0]; e.target.value="";
  if(f) loadReferenceImage(f);
};
document.getElementById("filein").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ importDXF(String(r.result)); document.getElementById("fname").textContent=f.name+" \u00B7 units mm"; };
  r.readAsText(f);
  e.target.value="";
};
function newDrawing(){
  snap(); S.ents=[]; S.sel.clear(); S.refImage=null; S.groupSeq=1; S.view={cx:0,cy:0,s:2};
  document.getElementById("fname").textContent="untitled.dxf \u00B7 units mm";
  draw(); updateProps(); echo("New drawing");
}
function newFile(){
  if(!S.ents.length) return newDrawing();
  requestString("Discard current drawing? y/n", "", v=>{
    if(/^y/i.test(v)) newDrawing(); else echo("Kept");
  });
}
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("drop",e=>{
  e.preventDefault();
  const f=e.dataTransfer.files[0]; if(!f) return;
  if(/^image\/(png|jpeg|webp)$/i.test(f.type)||/\.(png|jpe?g|webp)$/i.test(f.name)) return loadReferenceImage(f);
  if(/\.dxf$/i.test(f.name)){ const r=new FileReader(); r.onload=()=>importDXF(String(r.result)); r.readAsText(f); return; }
  echo("Drop a PNG/JPG/WebP reference image or DXF","warn");
});

/* ============================================================ shell preferences + resizable chrome */
const compactButton=document.getElementById("btn-compact");
const appShell=document.getElementById("app");
const topResizer=document.getElementById("resize-top");
const bottomResizer=document.getElementById("resize-bottom");
const UI_DEFAULT={ribbon:101,bottom:60};
const UI_LIMIT={ribbonMin:29,ribbonMax:240,bottomMin:28,bottomMax:180};
let expandedRibbonHeight=UI_DEFAULT.ribbon;
let bottomHeight=UI_DEFAULT.bottom;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function storeShellPrefs(){
  try{ localStorage.setItem("ortho.shell.v1",JSON.stringify({ribbon:expandedRibbonHeight,bottom:bottomHeight,compact:appShell.classList.contains("ribbon-compact")})); }catch(_){}
}
function refreshCompactButton(){
  const on=appShell.classList.contains("ribbon-compact");
  compactButton.setAttribute("aria-pressed",String(on));
  compactButton.textContent=on?"Expand":"Compact";
  compactButton.title=on?"Expand ribbon":"Compact ribbon";
}
function applyRibbonHeight(h,persist=true){
  h=clamp(Math.round(h),UI_LIMIT.ribbonMin,UI_LIMIT.ribbonMax);
  const compact=h<=34;
  appShell.classList.toggle("ribbon-compact",compact);
  if(compact){
    appShell.style.setProperty("--ribbon-h",UI_LIMIT.ribbonMin+"px");
  }else{
    expandedRibbonHeight=h;
    appShell.style.setProperty("--ribbon-h",h+"px");
  }
  refreshCompactButton();
  if(persist) storeShellPrefs();
  requestAnimationFrame(resize);
}
function setCompactRibbon(on){
  if(on){
    appShell.classList.add("ribbon-compact");
    appShell.style.setProperty("--ribbon-h",UI_LIMIT.ribbonMin+"px");
  }else{
    appShell.classList.remove("ribbon-compact");
    appShell.style.setProperty("--ribbon-h",expandedRibbonHeight+"px");
  }
  refreshCompactButton();storeShellPrefs();requestAnimationFrame(resize);
}
function applyBottomHeight(total,persist=true){
  total=clamp(Math.round(total),UI_LIMIT.bottomMin,UI_LIMIT.bottomMax);
  bottomHeight=total;
  const compact=total<48;
  appShell.classList.toggle("bottom-compact",compact);
  if(compact){
    appShell.style.setProperty("--status-h","0px");
    appShell.style.setProperty("--cmd-h",total+"px");
  }else{
    const status=26;
    appShell.style.setProperty("--status-h",status+"px");
    appShell.style.setProperty("--cmd-h",Math.max(22,total-status)+"px");
  }
  if(persist) storeShellPrefs();
  requestAnimationFrame(resize);
}
function restoreShellPrefs(){
  let p=null;
  try{ p=JSON.parse(localStorage.getItem("ortho.shell.v1")||"null"); }catch(_){}
  if(p&&Number.isFinite(p.ribbon)) expandedRibbonHeight=clamp(p.ribbon,35,UI_LIMIT.ribbonMax);
  if(p&&Number.isFinite(p.bottom)) bottomHeight=clamp(p.bottom,UI_LIMIT.bottomMin,UI_LIMIT.bottomMax);
  applyBottomHeight(bottomHeight,false);
  if(p&&p.compact) setCompactRibbon(true); else applyRibbonHeight(expandedRibbonHeight,false);
}
function beginShellDrag(kind,e){
  if(e.button!==0) return;
  e.preventDefault();
  const handle=kind==="top"?topResizer:bottomResizer;
  handle.setPointerCapture(e.pointerId);handle.classList.add("dragging");document.body.classList.add("shell-resizing");
  const y0=e.clientY;
  const start=kind==="top"?(appShell.classList.contains("ribbon-compact")?UI_LIMIT.ribbonMin:parseFloat(getComputedStyle(appShell).getPropertyValue("--ribbon-h"))||expandedRibbonHeight):bottomHeight;
  const move=ev=>{
    const dy=ev.clientY-y0;
    if(kind==="top") applyRibbonHeight(start+dy,false);
    else applyBottomHeight(start-dy,false);
  };
  const end=ev=>{
    handle.removeEventListener("pointermove",move);handle.removeEventListener("pointerup",end);handle.removeEventListener("pointercancel",end);
    handle.classList.remove("dragging");document.body.classList.remove("shell-resizing");storeShellPrefs();
    try{handle.releasePointerCapture(ev.pointerId)}catch(_){}
  };
  handle.addEventListener("pointermove",move);handle.addEventListener("pointerup",end);handle.addEventListener("pointercancel",end);
}
function splitterKeys(kind,e){
  if(!["ArrowUp","ArrowDown","Home","End"].includes(e.key)) return;
  e.preventDefault();
  const step=e.shiftKey?24:8;
  if(kind==="top"){
    let h=appShell.classList.contains("ribbon-compact")?UI_LIMIT.ribbonMin:(parseFloat(getComputedStyle(appShell).getPropertyValue("--ribbon-h"))||expandedRibbonHeight);
    if(e.key==="ArrowUp") h-=step; else if(e.key==="ArrowDown") h+=step; else if(e.key==="Home") h=UI_LIMIT.ribbonMin; else h=UI_LIMIT.ribbonMax;
    applyRibbonHeight(h);
  }else{
    let h=bottomHeight;
    if(e.key==="ArrowUp") h+=step; else if(e.key==="ArrowDown") h-=step; else if(e.key==="Home") h=UI_LIMIT.bottomMin; else h=UI_LIMIT.bottomMax;
    applyBottomHeight(h);
  }
}

topResizer.addEventListener("pointerdown",e=>beginShellDrag("top",e));
bottomResizer.addEventListener("pointerdown",e=>beginShellDrag("bottom",e));
topResizer.addEventListener("keydown",e=>splitterKeys("top",e));
bottomResizer.addEventListener("keydown",e=>splitterKeys("bottom",e));
topResizer.addEventListener("dblclick",()=>{expandedRibbonHeight=UI_DEFAULT.ribbon;applyRibbonHeight(UI_DEFAULT.ribbon)});
bottomResizer.addEventListener("dblclick",()=>applyBottomHeight(UI_DEFAULT.bottom));
compactButton.addEventListener("click",()=>setCompactRibbon(!appShell.classList.contains("ribbon-compact")));
document.getElementById("rtabs").addEventListener("dblclick",()=>setCompactRibbon(!appShell.classList.contains("ribbon-compact")));
restoreShellPrefs();

/* ============================================================ boot */
if(window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById("stage"));
else window.addEventListener("resize",resize);
paintRibbon(); paintLayers(); paintStyles(); paintOptbar(); updateProps(); setPrompt();
resize(); readout();
cmdin.focus();
</script>
