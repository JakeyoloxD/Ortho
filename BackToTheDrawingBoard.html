/* ---- entity clipboard ------------------------------------------------- */
let clipMem=null;
function clipCopy(cut){
  expandSelectionGroups();
  if(!S.sel.size) return echo("Select something first","warn");
  const src=[...S.sel].map(i=>S.ents[i]).filter(Boolean);
  let payload;
  try{ payload={app:FILE_TAG, kind:"clip", ents:JSON.parse(JSON.stringify(src))}; }
  catch(_){ return echo("That selection cannot be copied","warn"); }
  clipMem=payload;
  try{ localStorage.setItem(CLIPKEY,JSON.stringify(payload)); }catch(_){}
  if(cut){ eraseSel(); echo("Cut "+src.length+" object(s)"); }
  else echo("Copied "+src.length+" object(s)");
}
function clipRead(){
  if(clipMem) return clipMem;
  try{
    const t=localStorage.getItem(CLIPKEY);
    if(t && t.length<=SEC.MAX_DOC){
      const d=safeParse(t);
      if(d && d.kind==="clip" && Array.isArray(d.ents))
        return {kind:"clip", ents:sanitizeEnts(d.ents,S.layers.length,S.styles.length)};
    }
  }catch(_){}
  return null;
}
function clipPaste(){
  const d=clipRead();
  if(!d || !d.ents.length) return echo("Clipboard is empty","warn");
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  for(const e of d.ents){
    const q=entBox(e);
    if(q && isFinite(q.x0)){ x0=Math.min(x0,q.x0); y0=Math.min(y0,q.y0); x1=Math.max(x1,q.x1); y1=Math.max(y1,q.y1); }
  }
  const centre = isFinite(x0) ? V((x0+x1)/2,(y0+y1)/2) : V(0,0);
  const dlt=sub(cursorPoint(),centre);
  snap();
  const copies=cloneEntitiesFreshGroups(d.ents.map(clone)).map(e=>moveEnt(e,dlt));
  for(const e of copies){
    if(!(e.li>=0) || e.li>=S.layers.length) e.li=S.cur;
    if(e.si!=null && e.si>=S.styles.length) e.si=S.curStyle;
  }
  const base=S.ents.length;
  S.ents.push(...copies);
  S.sel=new Set(copies.map((_,k)=>base+k));
  setTool("select"); draw(); updateProps();
  echo("Pasted "+copies.length+" object(s)");
}

/* ---- layer delete ----------------------------------------------------- */
function deleteLayer(i){
  if(!S.layers[i]) return;
  if(S.layers.length<2) return echo("A drawing needs at least one layer","warn");
  const nm=S.layers[i].name, n=S.ents.filter(e=>e.li===i).length;
  const go=()=>{
    snap();
    S.ents=S.ents.filter(e=>e.li!==i);
    for(const e of S.ents) if(e.li>i) e.li--;
    S.layers.splice(i,1);
    if(S.cur>i) S.cur--;
    if(S.cur>=S.layers.length) S.cur=S.layers.length-1;
    S.sel.clear(); flowPrune(); resetNudge();
    paintLayers(); draw(); updateProps();
    echo("Deleted layer "+nm+(n?" and "+n+" object"+(n>1?"s":""):""));
  };
  if(n) requestString("Delete layer "+nm+" and its "+n+" object"+(n>1?"s":"")+"?  y/n","",v=>{
    if(/^y/i.test(String(v||""))) go(); else echo("Layer kept");
    setPrompt();
  });
  else go();
}

/* ============================================================ GRIPS
   One table describes every draggable handle in the app. gripSet returns the
   handle positions plus the setter that consumes a new world point, so the
   drag loop never needs to know what kind of thing it is holding.            */
let gripDrag=null;

function gripSet(e){
  const G=[], push=(p,set)=>{ if(p && isFinite(p.x) && isFinite(p.y)) G.push({x:p.x,y:p.y,set}); };
  switch(e.t){
    case "line":
      push(e.a,q=>e.a=q); push(e.b,q=>e.b=q); break;
    case "pline": case "spline":
      e.pts.forEach((p,k)=>push(p,q=>{ e.pts[k]=q; })); break;
    case "circle":
      push(e.c,q=>e.c=q);
      push(V(e.c.x+e.r,e.c.y), q=>{ e.r=Math.max(1e-9,dist(e.c,q)); }); break;
    case "arc": {
      push(e.c,q=>e.c=q);
      push(V(e.c.x+e.r*Math.cos(e.a0), e.c.y+e.r*Math.sin(e.a0)), q=>{ e.a0=wrap(ang(e.c,q)); });
      push(V(e.c.x+e.r*Math.cos(e.a1), e.c.y+e.r*Math.sin(e.a1)), q=>{ e.a1=wrap(ang(e.c,q)); });
      const mid=wrap(e.a0+wrap(e.a1-e.a0)/2);
      push(V(e.c.x+e.r*Math.cos(mid), e.c.y+e.r*Math.sin(mid)), q=>{ e.r=Math.max(1e-9,dist(e.c,q)); });
      break; }
    case "ellipse": {
      const ax=V(Math.cos(e.rot||0),Math.sin(e.rot||0)), ny=perp(ax);
      push(e.c,q=>e.c=q);
      push(add(e.c,mul(ax,e.rx)), q=>{ e.rx=Math.max(1e-9,dist(e.c,q)); });
      push(add(e.c,mul(ny,e.ry)), q=>{ e.ry=Math.max(1e-9,dist(e.c,q)); });
      break; }
    case "text": push(e.p,q=>e.p=q); break;
    case "dim": {
      push(e.a,q=>e.a=q); push(e.b,q=>e.b=q);
      const d=norm(sub(e.b,e.a)), nn=perp(d), mid=mul(add(e.a,e.b),.5);
      push(add(mid,mul(nn,e.off||0)), q=>{
        const dd=norm(sub(e.b,e.a)), n2=perp(dd), v=sub(q,e.a);
        e.off=v.x*n2.x+v.y*n2.y;
      });
      break; }
    case "ink":
      if(e.pts.length){
        push(e.pts[0], q=>{ e.pts[0]=q; });
        push(e.pts[e.pts.length-1], q=>{ e.pts[e.pts.length-1]=q; });
      }
      break;
    case "mshape": push(e.a,q=>e.a=q); push(e.b,q=>e.b=q); break;
    case "mtext":  push(e.p,q=>e.p=q); if(e.lead) push(e.lead,q=>e.lead=q); break;
    case "node":
      for(const [g,hx,hy] of [["nw",-1,1],["ne",1,1],["se",1,-1],["sw",-1,-1]])
        push(V(e.p.x+hx*e.w/2, e.p.y+hy*e.h/2), q=>flowResizeTo(e,g,q));
      break;
    case "edge": {
      const wp=e.wp||[];
      wp.forEach((p,k)=>push(p,q=>{ e.wp[k]=q; }));
      for(const gh of edgeGhosts(e)){
        const k=gh.k;
        G.push({
          x:gh.x, y:gh.y, ghost:true,
          insert(q){
            if(!e.wp) e.wp=[];
            e.wp.splice(k,0,V(q.x,q.y));
            this.set=p=>{ e.wp[k]=p; };
          },
          set(){}
        });
      }
      break; }
  }
  return G;
}
function paintGrips(e){
  const G=gripSet(e);
  ctx.save();
  for(const g of G){
    const x=Math.round(X(g.x)), y=Math.round(Y(g.y));
    if(g.ghost){
      ctx.strokeStyle=getCSS("--pen"); ctx.lineWidth=1; ctx.setLineDash([]);
      const gh=S.touchUI?6:3.5;
      ctx.beginPath(); ctx.moveTo(x,y-gh); ctx.lineTo(x+gh,y); ctx.lineTo(x,y+gh); ctx.lineTo(x-gh,y);
      ctx.closePath(); ctx.stroke();
    } else {
      const h=S.touchUI?5:3;
      ctx.fillStyle=getCSS("--pen");
      ctx.fillRect(x-h,y-h,h*2,h*2);
    }
  }
  ctx.restore();
}
function gripHitAt(sx,sy){
  if(S.tool!=="select" || !S.sel.size) return null;
  for(const i of S.sel){
    const e=S.ents[i];
    if(!e) continue;
    const L=S.layers[e.li];
    if(L && (!L.on || L.lock)) continue;
    for(const g of gripSet(e))
      if(Math.hypot(X(g.x)-sx, Y(g.y)-sy)<=tolPx(9)) return {e,g,i};
  }
  return null;
}
function gripBegin(sx,sy){
  const h=gripHitAt(sx,sy);
  if(!h) return false;
  snap();
  gripDrag=h;
  return true;
}
function gripMove(){
  const q=cursorPoint();
  const g=gripDrag.g;
  if(g.ghost && !g._made){ g._made=true; g.insert(q); }
  g.set(q);
  readout(); draw();
}
function gripEnd(){
  const e=gripDrag.e;
  gripDrag=null;
  if(e && e.t==="node") flowFit(e);
  draw(); updateProps();
  echo("Edited "+(e? (flowIsEnt(e)? flowEntName(e).toLowerCase() : mkIsEnt(e)? mkEntName(e).toLowerCase() : e.t) : "object"));
}

/* ============================================================ SWIMLANES */
function laneHeader(e){
  const t=Math.min(e.fs*2.4, (e.dir==="h"? e.w : e.h)*0.2);
  return Math.max(e.fs*1.6, t);
}
function laneHeaderRect(e){
  const hb=laneHeader(e);
  const x0=e.p.x-e.w/2, x1=e.p.x+e.w/2, y0=e.p.y-e.h/2, y1=e.p.y+e.h/2;
  return e.dir==="h" ? {x0, y0, x1:x0+hb, y1} : {x0, y0:y1-hb, x1, y1};
}
function flowPaintLane(e,selected,hot){
  const s=S.view.s, m=e.mk||{};
  const x=X(e.p.x-e.w/2), y=Y(e.p.y+e.h/2), w=e.w*s, h=e.h*s;
  const hb=laneHeader(e)*s;
  ctx.save();
  ctx.setLineDash([]);
  ctx.lineWidth=Math.max(1,(m.w||0)*s);
  ctx.strokeStyle= hot? getCSS("--snap") : (m.line||"#2d6fa8");
  ctx.globalAlpha=0.10; ctx.fillStyle=m.fill||"#f4f7fb";
  ctx.fillRect(x,y,w,h);
  ctx.globalAlpha=0.90;
  if(e.dir==="h") ctx.fillRect(x,y,hb,h); else ctx.fillRect(x,y,w,hb);
  ctx.globalAlpha=1;
  ctx.strokeRect(x,y,w,h);
  ctx.beginPath();
  if(e.dir==="h"){ ctx.moveTo(x+hb,y); ctx.lineTo(x+hb,y+h); }
  else { ctx.moveTo(x,y+hb); ctx.lineTo(x+w,y+hb); }
  ctx.stroke();
  if(e.s){
    ctx.fillStyle=m.text||"#16202b";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font=Math.max(7,e.fs*s)+"px "+getCSS("--draft");
    if(e.dir==="h"){
      ctx.translate(x+hb/2, y+h/2); ctx.rotate(-Math.PI/2);
      ctx.fillText(e.s,0,0);
    } else ctx.fillText(e.s, x+w/2, y+hb/2);
  }
  ctx.restore();
}
/* A lane picks up whatever is standing in it, so dragging the lane drags the
   column. Membership is by centre point, decided at drag time. */
function laneExpand(indices){
  const set=new Set(indices);
  const lanes=[...set].map(i=>S.ents[i]).filter(e=>e && e.t==="node" && e.k==="lane");
  if(!lanes.length) return [...set];
  S.ents.forEach((e,j)=>{
    if(set.has(j) || !e) return;
    const L=S.layers[e.li];
    if(L && (!L.on || L.lock)) return;
    let c=null;
    if(e.t==="node") c=e.p;
    else { const b=entBox(e); if(b && isFinite(b.x0)) c=V((b.x0+b.x1)/2,(b.y0+b.y1)/2); }
    if(!c) return;
    for(const ln of lanes){
      if(ln===e) continue;
      if(Math.abs(c.x-ln.p.x)<=ln.w/2 && Math.abs(c.y-ln.p.y)<=ln.h/2){ set.add(j); return; }
    }
  });
  return [...set];
}

/* ============================================================ WAYPOINTS
   The logical chain is anchor -> waypoints -> anchor. Elbows are generated on
   top of it, so a waypoint index always matches a chain segment index and the
   ghost handles line up with what you see.                                   */
function flowDirTo(from,to,route){
  const d=sub(to,from);
  if(route!=="ortho") return d;
  return Math.abs(d.x)>=Math.abs(d.y) ? V(d.x<0?-1:1,0) : V(0,d.y<0?-1:1);
}
function edgeChain(e){
  const A=flowEnd(e.from), B=flowEnd(e.to);
  if(!A||!B) return null;
  const wp=(e.wp||[]).filter(p=>p && isFinite(p.x));
  const firstT=wp.length? wp[0] : B.c;
  const lastT =wp.length? wp[wp.length-1] : A.c;
  const pa=A.node? flowRayExit(A.node, flowDirTo(A.c,firstT,e.route)) : A.c;
  const pb=B.node? flowRayExit(B.node, flowDirTo(B.c,lastT,e.route)) : B.c;
  return [pa,...wp,pb];
}
/* One ghost handle per logical segment, parked on the middle of the drawn
   sub-path for that segment so it sits on the line you can actually see. */
function edgeGhosts(e){
  const chain=edgeChain(e);
  if(!chain) return [];
  const R=flowRoute(e)||chain;
  if(chain.length===2){ const m=flowRouteMid(R); return [{x:m.x,y:m.y,k:0}]; }
  const idxOf=(p,from)=>{
    let bi=from, bd=1e18;
    for(let i=from;i<R.length;i++){ const d=dist(R[i],p); if(d<bd){ bd=d; bi=i; } }
    return bi;
  };
  const out=[];
  let ri=0;
  for(let k=0;k<chain.length-1;k++){
    const ni=idxOf(chain[k+1],ri);
    const seg=(ni>ri)? R.slice(ri,ni+1) : [chain[k],chain[k+1]];
    const m=flowRouteMid(seg);
    out.push({x:m.x,y:m.y,k});
    ri=Math.max(ni,ri);
  }
  return out;
}
function edgeElbows(chain){
  const out=[chain[0]];
  for(let k=0;k<chain.length-1;k++){
    const p=chain[k], q=chain[k+1];
    if(Math.abs(q.x-p.x)>1e-9 && Math.abs(q.y-p.y)>1e-9)
      out.push(Math.abs(q.x-p.x)>=Math.abs(q.y-p.y) ? V(q.x,p.y) : V(p.x,q.y));
    out.push(q);
  }
  return out;
}
function flowClearWaypoints(){
  const sel=[...S.sel].map(i=>S.ents[i]).filter(e=>e && e.t==="edge" && e.wp && e.wp.length);
  const list=sel.length? sel : S.ents.filter(e=>e.t==="edge" && e.wp && e.wp.length);
  if(!list.length) return echo("No connector has waypoints","warn");
  snap();
  let n=0;
  for(const e of list){ n+=e.wp.length; delete e.wp; }
  draw(); updateProps();
  echo("Cleared "+n+" waypoint"+(n>1?"s":""));
}

   Touch is not a mouse with fat fingers - it has no hover, no modifier keys,
   no right click, and the thing you are aiming at is under your hand. This
   block adds the missing input model rather than restyling the old one:

     - an aim offset so the point you are placing is above your fingertip
     - a floating action cluster carrying Finish, Cancel, Undo and the
       modifiers that used to live on the keyboard

/* ============================================================ SECURITY
   Threat model for a single-file offline app: everything dangerous arrives as
   a FILE or as localStorage the user did not write. A .b2db, a DXF, an image
   or a clipboard blob can all be crafted. The three things they could do
   before this block existed:

     1. break out of an attribute in exported SVG (`stroke="${col}"`) and land
        script in a file the user then opens in a browser
     2. point the reference image at a remote URL, giving a crafted drawing a
        silent network beacon and tainting the canvas so PNG export dies
     3. set __proto__ through JSON.parse + Object.assign

   The rule below: nothing from a file is trusted until it has been through
   sanitizeDoc/sanitizeEnts, and nothing reaches an SVG attribute without
   okColor() or xmlAttr().                                                   */

const SEC={
  MAX_DOC:  48*1024*1024,
  MAX_IMAGE:24*1024*1024,
  MAX_DXF:  48*1024*1024,
  MAX_ENTS: 60000,
  MAX_PTS:  20000,
  MAX_LAYERS: 512,
  MAX_STYLES: 128,
  MAX_TEXT: 4096,
  MAX_COORD: 1e9,
  MAX_PDF: 32*1024*1024,
  MAX_INFLATE: 64*1024*1024,   // a 2 KB deflate stream can become gigabytes
  MAX_SUBPATHS: 400000,
  MAX_DEPTH: 8,
  MAX_KEYS: 256

/* Every importer funnels through here so no single path can blow the document
   out past the entity ceiling, however it got its geometry. */
function capImport(list){
  const room=Math.max(0, SEC.MAX_ENTS - S.ents.length);
  if(list.length>room){
    echo("Import truncated at "+room+" objects (document limit "+SEC.MAX_ENTS+")","warn");
    return list.slice(0,room);
  }
  return list;
}
const BAD_KEYS=new Set(["__proto__","constructor","prototype"]);
const HEX_RE=/^#(?:[0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i;
const RGB_RE=/^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(?:,\s*(?:0|1|0?\.\d+)\s*)?\)$/i;

const DATA_IMG_RE=/^data:image\/(?:png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+/=]+$/i;

/* ---- primitives -------------------------------------------------------- */
function okColor(v,fb){
  fb=fb===undefined?"#000000":fb;
  if(typeof v!=="string") return fb;
  const s=v.trim();
  if(s.length>64) return fb;
  if(HEX_RE.test(s)) return s;
  if(RGB_RE.test(s)) return s;
  if(NAMED_OK.has(s.toLowerCase())) return s.toLowerCase();
  return fb;
}
/* Labels can also be typed or pasted straight into the app, not only imported,
   so the spoofing strip is repeated on the way out. Export is the last place
   text can still be made to read as something it is not. */
function xmlText(s){
  return String(s==null?"":s).replace(SPOOF_RE,"")
    .replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}
function xmlAttr(s){
  return String(s==null?"":s)
    .replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function dxfStr(s){

    .replace(/[\u0000-\u001f]/g,"").replace(SPOOF_RE,"").slice(0,SEC.MAX_TEXT);

function safeNum(v,fb,lim){

    return JSON.parse(txt,function(k,v){ return BAD_KEYS.has(k)? undefined : v; });
  }catch(_){ return null; }
}
function mergePlain(target,src,allow,depth){
  depth=depth||0;

  if(!src || typeof src!=="object" || Array.isArray(src)) return;
  for(const k of Object.keys(src).slice(0,SEC.MAX_KEYS)){
    if(BAD_KEYS.has(k)) continue;
    if(allow && !allow.has(k)) continue;
    const v=src[k];
    const t=typeof v;
    if(t==="string"){ target[k]=safeStr(v,256); }
    else if(t==="number"){ if(Number.isFinite(v)) target[k]=v; }
    else if(t==="boolean"){ target[k]=v; }
    else if(v && t==="object" && !Array.isArray(v)){

/* ---- file gatekeeping -------------------------------------------------- */
function checkUpload(f,extRe,maxBytes,label){
  if(!f) return false;
  if(typeof f.size==="number" && f.size>maxBytes){
    echo(label+" is too large ("+(f.size/1048576).toFixed(1)+" MB, limit "+(maxBytes/1048576|0)+" MB)","warn");
    return false;
  }
  if(!extRe.test(String(f.name||""))){
    echo("Wrong file type for "+label,"warn");
    return false;
  }
  return true;
}
/* The accept= attribute and file.type are both advisory - a renamed or
   spoofed file passes either. Magic bytes are not advisory. */
function sniffImage(buf){
  const b=new Uint8Array(buf), at=(sig,off)=>sig.every((v,i)=>b[(off||0)+i]===v);
  if(b.length<12) return null;
  if(at([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a])) return "image/png";
  if(at([0xff,0xd8,0xff]))                          return "image/jpeg";
  if(at([0x52,0x49,0x46,0x46]) && at([0x57,0x45,0x42,0x50],8)) return "image/webp";
  if(at([0x47,0x49,0x46,0x38]))                     return "image/gif";
  return null;
}
function okImageSrc(s){
  return typeof s==="string" && s.length<=SEC.MAX_IMAGE && DATA_IMG_RE.test(s);
}

/* ---- document sanitiser ------------------------------------------------ */
function sanPt(v){
  if(!v || typeof v!=="object") return null;
  return V(safeNum(v.x,0), safeNum(v.y,0));
}
function sanPts(a){
  if(!Array.isArray(a)) return [];
  const out=[];

  return out;
}
function sanMk(m,kind){
  const o={};
  if(!m || typeof m!=="object") m={};
  if(kind==="node"){
    o.fill=okColor(m.fill,"#f4f7fb"); o.line=okColor(m.line,"#2d6fa8");
    o.text=okColor(m.text,"#16202b"); o.w=Math.abs(safeNum(m.w,1,1e6));
    return o;
  }
  o.col=okColor(m.col,"#ff3b30");
  o.w=Math.abs(safeNum(m.w,1,1e6));
  o.alpha=Math.max(0,Math.min(1,safeNum(m.alpha,1,1)));
  o.blend = m.blend==="multiply" ? "multiply" : null;
  o.fill = m.fill ? okColor(m.fill,null) : null;

}
function sanEnd(v){
  if(!v || typeof v!=="object") return null;
  if(typeof v.id==="string") return {id:safeStr(v.id,64)};
  const p=sanPt(v.pt);
  return p? {pt:p} : null;
}
const NODE_KINDS=new Set(["proc","dec","term","data","note","lane"]);
const SHAPE_KINDS=new Set(["line","arrow","darrow","rect","ellipse","cloud"]);
function sanEnt(e,nLayers,nStyles){
  if(!e || typeof e!=="object") return null;
  /* Both ends of the range: a negative index passed the old upper-bound-only

  const li=safeInt(e.li,0), si=safeInt(e.si,0);
  const base={ li: (li>=0 && li<nLayers) ? li : 0 };
  if(e.si!=null) base.si = (si>=0 && si<nStyles) ? si : 0;
  if(typeof e.gid==="string") base.gid=safeStr(e.gid,64);

    case "line": { const a=P("a"), b=P("b"); return a&&b? Object.assign(base,{t:"line",a,b}) : null; }
    case "pline": case "spline": {
      const pts=sanPts(e.pts);

    }
    case "circle": { const c=P("c"); return c? Object.assign(base,{t:"circle",c,r:Math.abs(safeNum(e.r,1))||1}) : null; }
    case "arc": { const c=P("c"); return c? Object.assign(base,{t:"arc",c,r:Math.abs(safeNum(e.r,1))||1,

    case "ellipse": { const c=P("c"); return c? Object.assign(base,{t:"ellipse",c,

      rot:safeNum(e.rot,0,1e4), a0:safeNum(e.a0,0,1e4), sw:safeNum(e.sw,TAU,1e4)}) : null; }
    case "text": { const p=P("p"); return p? Object.assign(base,{t:"text",p,
      s:safeStr(e.s), h:Math.abs(safeNum(e.h,2.5))||2.5, rot:safeNum(e.rot,0,1e4)}) : null; }
    case "dim": { const a=P("a"), b=P("b"); return a&&b? Object.assign(base,{t:"dim",a,b,
      off:safeNum(e.off,0), h:Math.abs(safeNum(e.h,2.5))||2.5}) : null; }
    case "ink": {
      const pts=sanPts(e.pts);
      return pts.length? Object.assign(base,{t:"ink",pts,closed:!!e.closed,cloud:!!e.cloud,

    }
    case "mshape": {
      const a=P("a"), b=P("b");

        hl:Math.abs(safeNum(e.hl,0)), bump:Math.abs(safeNum(e.bump,0)), mk:sanMk(e.mk)});
    }
    case "mtext": {
      const p=P("p");

        h:Math.abs(safeNum(e.h,2.5))||2.5, hl:Math.abs(safeNum(e.hl,0)),
        box:e.box!==false, mk:sanMk(e.mk)});

    case "node": {
      const p=P("p");

        id:safeStr(e.id,64)||("N"+Math.floor(Math.random()*1e9)),
        w:Math.abs(safeNum(e.w,10))||10, h:Math.abs(safeNum(e.h,10))||10,
        s:safeStr(e.s), fs:Math.abs(safeNum(e.fs,2))||2, mk:sanMk(e.mk,"node")});

function sanitizeEnts(arr,nLayers,nStyles){
  if(!Array.isArray(arr)) return [];
  const out=[];
  for(const e of arr.slice(0,SEC.MAX_ENTS)){
    const q=sanEnt(e,nLayers||1,nStyles||1);
    if(q) out.push(q);
  }
  return out;
}
function sanLayers(a){
  const out=[];
  if(Array.isArray(a)) for(const L of a.slice(0,SEC.MAX_LAYERS)){
    if(!L || typeof L!=="object") continue;
    out.push({name:safeStr(L.name,64)||"LAYER", aci:safeInt(L.aci,7,255),

}
function sanStyles(a){
  const out=[];
  if(Array.isArray(a)) for(const st of a.slice(0,SEC.MAX_STYLES)){
    if(!st || typeof st!=="object") continue;
    const pat=Array.isArray(st.pat)? st.pat.slice(0,16).map(v=>Math.abs(safeNum(v,1,1e4))) : null;
    out.push({name:safeStr(st.name,64)||"STYLE", w:Math.abs(safeNum(st.w,0.25,1e3)),

    const v=(o&&typeof o==="object")? safeNum(o[k],dflt) : dflt;
    return Math.max(lo,Math.min(hi,v));

    weldR:g("weldR",9,0,400), ironTol:g("ironTol",1.4,0,400),
    repelPad:g("repelPad",8,0,400), wrapOffset:g("wrapOffset",8,0,400),
    corridor:g("corridor",60,4,4000), sonarRays:Math.round(g("sonarRays",24,4,72)),
    stampWord: (o&&XSTAMPS.includes(o.stampWord))? o.stampWord : "VOID"

}
function sanSnapOn(o){
  const out={};
  for(const [k] of SNAP_KINDS)
    out[k] = (o && typeof o==="object" && typeof o[k]==="boolean") ? o[k] : true;

}

    sx:safeNum(r.crop.sx,0), sy:safeNum(r.crop.sy,0),
    sw:Math.abs(safeNum(r.crop.sw,1))||1, sh:Math.abs(safeNum(r.crop.sh,1))||1

    src:r.src, name:safeStr(r.name,120)||"image",
    x:safeNum(r.x,0), y:safeNum(r.y,0),
    w:Math.abs(safeNum(r.w,10))||10, h:Math.abs(safeNum(r.h,10))||10,
    opacity:Math.max(0,Math.min(1,safeNum(r.opacity,.5,1))),

  if(!d || typeof d!=="object" || Array.isArray(d)) return null;
  if(d.app!==FILE_TAG) return null;
  const layers=sanLayers(d.layers), styles=sanStyles(d.styles);

    saved:safeStr(d.saved,40),
    name:safeFileName(d.name,"untitled"),
    layers, styles,
    ents:sanitizeEnts(d.ents,layers.length,styles.length),
    cur:safeInt(d.cur,0,layers.length-1),
    curStyle:safeInt(d.curStyle,0,styles.length-1),

    ortho:!!d.ortho, osnap:d.osnap!==false, weld:!!d.weld, edgeAssist:!!d.edgeAssist,
    textHeight:Math.abs(safeNum(d.textHeight,2.5,1e5))||2.5,

  out.mk={};   mergePlain(out.mk,d.mk);
  out.png={};  mergePlain(out.png,d.png);
  if(out.png.bg!=null) out.png.bg = out.png.bg==="transparent" ? "transparent" : okColor(out.png.bg,"#ffffff");
  if(out.flow.fill!=null) out.flow.fill=okColor(out.flow.fill,"#f4f7fb");
  if(out.flow.line!=null) out.flow.line=okColor(out.flow.line,"#2d6fa8");
  if(out.flow.text!=null) out.flow.text=okColor(out.flow.text,"#16202b");
  if(out.flow.edgeCol!=null) out.flow.edgeCol=okColor(out.flow.edgeCol,"#8fb6d8");

/* ============================================================ SNAPS v2
   The Revit 2016 object snap set. What was here before covered endpoint,
   midpoint, centre and quadrant, which is why measuring a wall to a circle had
   nowhere to land except the centre: without Nearest, Perpendicular and
   Tangent there is no point ON a curve to snap to.

   Added: Intersection, Nearest, Perpendicular, Tangent, Points, and recursive
   midpoints - halve a segment, then halve the half you are hovering over, as
   deep as the zoom can usefully distinguish. Tab cycles the candidates under
   the cursor; SE/SM/SN/SI/SC/SQ/SP/ST/SX override for one pick, SS suspends
   snapping, SO clears an override, exactly as they do in Revit.

   Every generator is bounded. Point snaps look at the nearest few entities,
   intersections at fewer still, and subdivision stops when the candidates get
   closer together than a finger. A drawing cannot be crafted to make snapping
   quadratic.                                                                */

const SNAP_KINDS=[
  ["end",   "Endpoint",      "SE"],
  ["int",   "Intersection",  "SI"],
  ["mid",   "Midpoint",      "SM"],
  ["center","Center",        "SC"],
  ["quad",  "Quadrant",      "SQ"],
  ["perp",  "Perpendicular", "SP"],
  ["tan",   "Tangent",       "ST"],
  ["point", "Point",         "SX"],
  ["near",  "Nearest",       "SN"]
];
const SNAP_RANK={end:90,int:80,mid:70,center:60,quad:55,perp:50,tan:45,point:40,near:10};
const SNAP_NAME={}; const SNAP_CODE={};
for(const [k,name,code] of SNAP_KINDS){ SNAP_NAME[k]=name; SNAP_CODE[code.toLowerCase()]=k; }

const SNAP_MAX_ENTS=40;        // entities considered for point snaps
const SNAP_MAX_INT_ENTS=10;    // entities considered for intersections (pairs!)
const SNAP_MAX_CAND=200;       // hard ceiling on candidates per resolve
const SNAP_SUBDIV_PX=26;       // stop halving below this on-screen spacing
const SNAP_SUBDIV_MAX=12;
const ANNOT_TYPES=new Set(["text","mtext","node"]);

S.snapOn={end:true,int:true,mid:true,center:true,quad:true,perp:true,tan:true,point:true,near:true};
S.snapSubdiv=true;
S.snapSuspend=false;
S.snapOverride=null;
S.snapCycle=0;
S.snapList=[];
S.snapAnchor=null;
S.dimSnap=false;
S.dimSnapLen=0;
S.dimSnapAng=0;

function snapEnabled(k){
  if(S.snapSuspend) return false;
  if(S.snapOverride) return S.snapOverride===k;
  return !!S.snapOn[k];
}
function snapBase(){
  if(S.pending.length) return S.pending[S.pending.length-1];
  return S.base||null;
}
function projParam(p,a,b){
  const ab=sub(b,a), dd=ab.x*ab.x+ab.y*ab.y;
  if(dd<1e-18) return 0;
  return ((p.x-a.x)*ab.x+(p.y-a.y)*ab.y)/dd;

function snapFrac(t,den){
  let num=Math.round(t*den);
  const g=(a,b)=>b?g(b,a%b):a;
  const k=g(num,den)||1;
  return (num/k)+"/"+(den/k);

/* Bounded spatial filter: only entities whose bounding box comes near the
   cursor are considered at all. */
function snapNearbyEnts(w,tol,cap){
  const out=[];
  for(let i=S.ents.length-1;i>=0;i--){
    if(out.length>=cap) break;
    const e=S.ents[i], L=S.layers[e.li];
    if(!L||!L.on) continue;
    const b=entBox(e);
    if(!b||!isFinite(b.x0)||!isFinite(b.y1)) continue;
    if(w.x<b.x0-tol||w.x>b.x1+tol||w.y<b.y0-tol||w.y>b.y1+tol) continue;
    out.push(e);
  }

}
/* Halve, then halve the half you are pointing at, and keep going until the
   candidates would be closer together than you could aim at. */
function snapSubdivisions(a,b,w){
  const out=[];
  const L=dist(a,b);
  if(!(L>0)||!isFinite(L)) return out;
  const tCur=Math.max(0,Math.min(1,projParam(w,a,b)));
  let lo=0, hi=1;
  for(let d=0; d<SNAP_SUBDIV_MAX; d++){
    if(L*(hi-lo)*S.view.s < SNAP_SUBDIV_PX*2) break;
    const mt=(lo+hi)/2;
    const p=add(a,mul(sub(b,a),mt));
    out.push({p, label: d===0 ? "Midpoint" : "Midpoint "+snapFrac(mt,Math.pow(2,d+1))});
    if(!S.snapSubdiv) break;
    if(tCur<mt) hi=mt; else lo=mt;

  const cs=curvesOf(e), out=[];

function nearestOnEnt(e,w){
  let best=null,bd=1e18;
  for(const c of curvesOf(e)){
    let p=null;
    if(c.k==="seg"){
      const t=Math.max(0,Math.min(1,projParam(w,c.a,c.b)));
      p=add(c.a,mul(sub(c.b,c.a),t));
    } else if(c.k==="circ"||c.k==="arc"){
      const d=sub(w,c.c), L=len(d);
      if(!(L>1e-9)) continue;
      const th=Math.atan2(d.y,d.x);
      if(c.k==="arc" && !arcContains(c,wrap(th))) continue;
      p=V(c.c.x+c.r*Math.cos(th), c.c.y+c.r*Math.sin(th));
    }
    if(!p||!isFinite(p.x)||!isFinite(p.y)) continue;
    const dd=dist(p,w);

function perpOnEnt(e,B){
  const out=[];
  if(!B) return out;
  for(const c of curvesOf(e)){
    if(c.k==="seg"){
      const t=projParam(B,c.a,c.b);
      if(t<-1e-9||t>1+1e-9) continue;
      const p=add(c.a,mul(sub(c.b,c.a),t));
      if(dist(p,B)>1e-9) out.push(p);
    } else if(c.k==="circ"||c.k==="arc"){
      const d=sub(B,c.c), L=len(d);
      if(!(L>1e-9)) continue;
      const u=mul(d,1/L);
      for(const s of [1,-1]){
        const p=add(c.c,mul(u,s*c.r));
        if(c.k==="arc" && !arcContains(c,wrap(ang(c.c,p)))) continue;

  return out;
}

    if(c.k!=="circ"&&c.k!=="arc") continue;
    const d=sub(B,c.c), L=len(d);
    if(!(L>c.r+1e-9)) continue;              // inside the circle: no tangent
    const q=Math.max(-1,Math.min(1,c.r/L));  // acos domain guard
    const a=Math.acos(q), base=Math.atan2(d.y,d.x);

      const th=base+s*a;

      if(!isFinite(p.x)||!isFinite(p.y)) continue;
      if(c.k==="arc" && !arcContains(c,wrap(ang(c.c,p)))) continue;

    }
  }

}

    if(d>tol) return;

    const annot=ANNOT_TYPES.has(e.t);
    if(annot){

    } else if(snapEnabled("end")){
      for(const p of entPoints(e)) push("end",p);
    }
    if(snapEnabled("center")) for(const p of entCenters(e)) push("center",p);
    if(snapEnabled("quad"))   for(const p of entQuads(e))   push("quad",p);
    if(snapEnabled("mid")){
      const segs=snapSegmentsOf(e);
      if(segs.length){
        for(const c of segs) for(const m of snapSubdivisions(c.a,c.b,w)) push("mid",m.p,m.label);

        for(const p of entMids(e)) push("mid",p);
      }
    }
  }

  /* Nearest, perpendicular and tangent are only meaningful when the cursor is
     actually over the element, which also keeps the work proportional. */
  const base=snapBase();
  for(const e of ents){
    if(ANNOT_TYPES.has(e.t)) continue;
    if(!entHit(e,w,tol)) continue;
    if(snapEnabled("near")){ const p=nearestOnEnt(e,w); if(p) push("near",p); }
    if(snapEnabled("perp")) for(const p of perpOnEnt(e,base)) push("perp",p);
    if(snapEnabled("tan"))  for(const p of tanOnEnt(e,base)) push("tan",p);
  }

  if(snapEnabled("int")){
    const few=ents.slice(0,SNAP_MAX_INT_ENTS);
    for(let i=0;i<few.length;i++)
      for(let j=i+1;j<few.length;j++){
        let xs=[];
        try{ xs=entInt(few[i],few[j],false,false)||[]; }catch(_){ xs=[]; }
        for(const p of xs) push("int",p);
        if(out.length>=SNAP_MAX_CAND) break;
      }
  }

  /* Collapse duplicates that land on the same pixel, keeping the strongest. */
  const seen=new Map();
  for(const cand of out){
    const key=Math.round(X(cand.p.x))+":"+Math.round(Y(cand.p.y));
    const prev=seen.get(key);
    if(!prev || SNAP_RANK[cand.kind]>SNAP_RANK[prev.kind]) seen.set(key,cand);
  }
  const list=[...seen.values()];
  list.sort((a,b)=>{
    const r=SNAP_RANK[b.kind]-SNAP_RANK[a.kind];
    if(r) return r;
    return a.d-b.d;
  });
  return list;
}
function snapCycleReset(){ S.snapCycle=0; S.snapAnchor=null; }
function snapCycleNext(){
  if(!S.snapList.length) return false;

  const c=S.snapList[S.snapCycle];

  draw();

}
function snapSetOverride(k){

/* Revit rounds the rubber band to fixed length and angle increments when
   nothing better is under the cursor. */
function applyDimSnap(p,from){
  if(!S.dimSnap||!from) return p;
  let d=sub(p,from), L=len(d);
  if(!(L>1e-9)) return p;
  let th=Math.atan2(d.y,d.x);
  if(S.dimSnapAng>0){
    const step=S.dimSnapAng*Math.PI/180;
    th=Math.round(th/step)*step;
  }
  if(S.dimSnapLen>0) L=Math.max(S.dimSnapLen,Math.round(L/S.dimSnapLen)*S.dimSnapLen);
  return V(from.x+L*Math.cos(th), from.y+L*Math.sin(th));
}

/* A snap override only makes sense while a point is being requested. */
function snapPickActive(){
  const T=TOOLS[S.tool];
  if(!T) return false;
  if(isMeasureTool(S.tool)) return true;
  if(S.tool==="select") return false;
  if(T.pick) return true;
  return (T.pts===-1 || T.pts>0 || S.pending.length>0 || !!S.base);
}

/* ====================================================== EXPERIMENTAL FEATURES
   Experimental tools where physics, slapstick and visual feedback are the mechanism. Every one has
   a job: repair imported geometry, prove an enclosure is closed, find the
   duplicates you cannot see, lay out a diagram, or present one.

   House rules for everything in here:
     - bounded. Particle counts, iteration counts, raster size and animation
       duration are all capped, so no drawing however hostile can turn an
       effect into a hang.
     - undoable. Anything that mutates geometry calls snap() first.
     - invisible to exports. Effects paint after S.exporting has returned, so a
       PNG or SVG never contains a spark.
     - opt-in. The whole tab is hidden until you ask for it.                  */

const XCAP={
  PARTS: 2200,          // live particles
  MS: 14000,            // any single effect
  RASTER: 640,          // longest edge of the enclosure raster
  CELLS: 640*640,
  ITER: 400,            // layout relaxation passes
  ENTS: 20000,          // entities any sweep will look at
  PAIRS: 4000,          // pairwise comparisons
  REPORT: 40            // findings listed before we summarise
};
const XSTAMPS=["VOID","REVISED","APPROVED","REJECTED","AS BUILT","DRAFT","FOR REVIEW","SUPERSEDED"];

S.experimental=false;
S.x={
  weldR:9, ironTol:1.4, repelPad:8, wrapOffset:8, corridor:60, sonarRays:24,
  stampWord:"VOID", xray:false, spotlight:false, current:false, surferPick:false
};

/* ---- effect driver ----------------------------------------------------- */
const XFX={parts:[], marks:[], until:0, raf:0, kind:null, data:null, t0:0};

/* Current is a persistent animated mode, not a timed XFX effect. Give it its
   own RAF so its phase keeps advancing even after startup effects finish. */
let XCURRENT_RAF=0;
function xCurrentLoopStop(){
  if(XCURRENT_RAF) cancelAnimationFrame(XCURRENT_RAF);
  XCURRENT_RAF=0;
}
function xCurrentLoopStart(){
  if(XCURRENT_RAF || !S.x.current) return;
  const step=()=>{
    if(!S.x.current){ XCURRENT_RAF=0; return; }
    draw();
    XCURRENT_RAF=requestAnimationFrame(step);
  };
  XCURRENT_RAF=requestAnimationFrame(step);
}

function xfxStop(){
  if(XFX.raf) cancelAnimationFrame(XFX.raf);
  XFX.raf=0; XFX.parts.length=0; XFX.marks.length=0; XFX.kind=null; XFX.data=null; XFX.until=0;
}
function xfxRun(kind,ms,data,onTick,onDone){
  /* Tools push their findings into XFX.marks and then start the animation, so
     starting must not wipe them - only an explicit stop does. */
  const keep=XFX.marks.slice();
  xfxStop();
  XFX.marks=keep;
  XFX.kind=kind; XFX.data=data||null;
  XFX.t0=(typeof performance!=="undefined"&&performance.now)?performance.now():Date.now();
  XFX.until=XFX.t0+Math.max(1,Math.min(XCAP.MS,ms));
  const step=()=>{
    const now=(typeof performance!=="undefined"&&performance.now)?performance.now():Date.now();
    const done=now>=XFX.until;
    try{ if(onTick) onTick(Math.min(1,(now-XFX.t0)/Math.max(1,XFX.until-XFX.t0)), now); }
    catch(err){ console.error(err); xfxStop(); draw(); return; }
    draw();
    if(done){ const d=onDone; xfxStop(); if(d) try{ d(); }catch(err){ console.error(err); } draw(); return; }
    XFX.raf=requestAnimationFrame(step);
  };
  XFX.raf=requestAnimationFrame(step);
}
function xPart(x,y,vx,vy,life,col,r){
  if(XFX.parts.length>=XCAP.PARTS) return;
  XFX.parts.push({x,y,vx,vy,life,max:life,col:col||"#8fd0ff",r:r||2});
}
function xBeep(kind){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    xBeep._c=xBeep._c||new AC();
    const c=xBeep._c;
    if(c.state==="suspended" && c.resume) c.resume();
    const o=c.createOscillator(), g=c.createGain();
    const map={thunk:[90,.16,"square"], tick:[900,.05,"triangle"], sweep:[220,.3,"sawtooth"], pop:[440,.08,"sine"]};
    const [f,d,t]=map[kind]||map.pop;
    o.type=t; o.frequency.setValueAtTime(f,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(40,f*0.4),c.currentTime+d);
    g.gain.setValueAtTime(.09,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+d+.02);
  }catch(_){}
}

/* ---- shared geometry --------------------------------------------------- */
function xEnts(){ return S.ents.slice(0,XCAP.ENTS).filter(e=>{ const L=S.layers[e.li]; return !L||L.on; }); }
function xSelOrAll(){
  const sel=[...S.sel].map(i=>S.ents[i]).filter(Boolean);
  return sel.length? sel : xEnts();
}
function xInkPath(e){
  if(!e || e.t!=="ink" || !Array.isArray(e.pts)) return [];
  const src=e.pts.filter(q=>q&&isFinite(q.x)&&isFinite(q.y));
  if(src.length<2) return src.slice();

  /* Marker/pencil strokes arrive at pointer-event density, which can be extremely
     uneven. Resample them in world space so Experimental toys see one continuous
     curve instead of hundreds of tiny jittery mouse segments. The original entity
     is never modified. */
  const step=Math.max(px(3.5),1e-6), out=[V(src[0].x,src[0].y)];
  let carry=0, a=V(src[0].x,src[0].y);
  for(let i=1;i<src.length;i++){
    const b=src[i]; let d=dist(a,b);
    if(!(d>1e-9)){a=b;continue;}
    let dir=norm(sub(b,a));
    while(carry+d>=step){
      const need=step-carry;
      a=add(a,mul(dir,need));
      out.push(a); d-=need; carry=0;
      if(d>1e-9) dir=norm(sub(b,a));
    }
    carry+=d; a=V(b.x,b.y);
  }
  const last=src[src.length-1];
  if(dist(out[out.length-1],last)>step*.28) out.push(V(last.x,last.y));

  /* One light smoothing pass removes hand-sampling buzz while preserving ramps,
     bowls and deliberate corners. End points stay exact so gaps remain real. */
  if(out.length>4){
    const sm=[out[0]];
    for(let i=1;i<out.length-1;i++) sm.push(V(
      out[i-1].x*.18+out[i].x*.64+out[i+1].x*.18,
      out[i-1].y*.18+out[i].y*.64+out[i+1].y*.18));
    sm.push(out[out.length-1]);
    return sm;
  }
  return out;
}
function xSegs(e){
  const out=[];

  /* Markup ink is genuine geometry for Experimental mode. Do NOT send it through
     flatten(), because generic entPoints(ink) intentionally exposes only its two
     end points for normal CAD operations. Current and Line Surfer need the full
     freehand path. */
  if(e && e.t==="ink"){
    const P=xInkPath(e);
    for(let i=0;i<P.length-1;i++) if(dist(P[i],P[i+1])>1e-9)
      out.push({a:P[i],b:P[i+1],ink:true,pathIndex:i,pathCount:P.length-1});
    if(e.closed && P.length>2 && dist(P[P.length-1],P[0])>1e-9)
      out.push({a:P[P.length-1],b:P[0],ink:true,pathIndex:P.length-1,pathCount:P.length});
    return out;
  }

  for(const c of curvesOf(e)) if(c.k==="seg") out.push(c);
  if(!out.length){
    const P=flatten(e);
    if(P&&P.length>1) for(let i=0;i<P.length-1;i++) out.push({a:P[i],b:P[i+1]});
  }
  return out;
}
function xEndpoints(e){
  if(e.t==="line") return [{get:()=>e.a,set:p=>e.a=p},{get:()=>e.b,set:p=>e.b=p}];
  if(e.t==="pline"||e.t==="spline"){
    if(!e.pts.length) return [];
    const n=e.pts.length;
    return [{get:()=>e.pts[0],set:p=>e.pts[0]=p},{get:()=>e.pts[n-1],set:p=>e.pts[n-1]=p}];
  }
  return [];
}
function xBox(list){
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18,any=false;
  for(const e of list){
    const b=entBox(e);
    if(!b||!isFinite(b.x0)||!isFinite(b.y1)) continue;
    any=true; x0=Math.min(x0,b.x0); y0=Math.min(y0,b.y0); x1=Math.max(x1,b.x1); y1=Math.max(y1,b.y1);
  }
  return any? {x0,y0,x1,y1} : null;
}
/* Ray cast against every straight span in the drawing. Bounded by XCAP.ENTS. */
function xRayHit(from,dir,maxD){
  const d=norm(dir);
  if(!isFinite(d.x)) return null;
  let best=null, bd=maxD;
  for(const e of xEnts()) for(const c of xSegs(e)){
    const r=lineLineInt(from, add(from,mul(d,bd||1e7)), c.a, c.b);
    if(!r) continue;
    if(r.t<1e-9 || r.u<-1e-9 || r.u>1+1e-9) continue;
    const dd=dist(from,r.p);
    if(dd<bd){ bd=dd; best={p:r.p,d:dd,ent:e}; }
  }
  return best;
}

/* ---- enclosure raster: the engine behind Flood Fill and Rain Test ------- */
function xRaster(box,maxDim){
  const w0=Math.max(1e-9,box.x1-box.x0), h0=Math.max(1e-9,box.y1-box.y0);
  const lim=Math.max(16,Math.min(XCAP.RASTER,maxDim||XCAP.RASTER));
  const k=Math.min(lim/w0, lim/h0);
  const W2=Math.max(8,Math.min(lim,Math.round(w0*k)));
  const H2=Math.max(8,Math.min(lim,Math.round(h0*k)));
  if(W2*H2>XCAP.CELLS) return null;
  const c=document.createElement("canvas");
  c.width=W2; c.height=H2;
  const g=c.getContext("2d");
  if(!g) return null;
  g.fillStyle="#000"; g.fillRect(0,0,W2,H2);
  g.strokeStyle="#fff"; g.lineWidth=1.5; g.lineCap="round"; g.lineJoin="round";
  const PX=p=>((p.x-box.x0)/w0)*W2, PY=p=>H2-((p.y-box.y0)/h0)*H2;
  g.beginPath();
  let drawn=0;
  for(const e of xEnts()){
    for(const c2 of xSegs(e)){
      g.moveTo(PX(c2.a),PY(c2.a)); g.lineTo(PX(c2.b),PY(c2.b));
      if(++drawn>XCAP.CELLS) break;
    }
    if(drawn>XCAP.CELLS) break;
  }
  g.stroke();
  let data;
  try{ data=g.getImageData(0,0,W2,H2).data; }catch(_){ return null; }
  const cells=new Uint8Array(W2*H2);
  for(let i=0;i<W2*H2;i++) cells[i]= data[i*4]>80 ? 1 : 0;
  return {cells,w:W2,h:H2,box,sx:w0/W2,sy:h0/H2};
}
/* Pure, so it can be tested on a synthetic mask without a canvas. */
function xFlood(R,cx,cy){
  if(!R) return null;
  const {cells,w,h}=R;
  if(!(cx>=0&&cy>=0&&cx<w&&cy<h)) return null;
  if(cells[cy*w+cx]) return {blocked:true,count:0,perim:0,escaped:false,seen:null};
  const seen=new Uint8Array(w*h);
  const stack=new Int32Array(w*h);
  let sp=0;
  stack[sp++]=cy*w+cx; seen[cy*w+cx]=1;
  let count=0, perim=0, escaped=false;
  while(sp>0){
    const i=stack[--sp];
    count++;
    const x=i%w, y=(i/w)|0;
    if(x===0||y===0||x===w-1||y===h-1){ escaped=true; perim++; }
    const nb=[[1,0],[-1,0],[0,1],[0,-1]];
    for(let n=0;n<4;n++){
      const nx=x+nb[n][0], ny=y+nb[n][1];
      if(nx<0||ny<0||nx>=w||ny>=h) continue;
      const j=ny*w+nx;
      if(cells[j]){ perim++; continue; }
      if(!seen[j]){ seen[j]=1; stack[sp++]=j; }
    }
  }
  return {count,perim,escaped,seen,w,h};
}
function xCellCentre(R,i){
  const x=i%R.w, y=(i/R.w)|0;
  return V(R.box.x0+(x+.5)*R.sx, R.box.y1-(y+.5)*R.sy);
}
function xCellOf(R,p){
  return {cx:Math.floor((p.x-R.box.x0)/R.sx), cy:Math.floor((R.box.y1-p.y)/R.sy)};
}
function xRegionAt(p,pad){
  const b=xBox(xEnts());
  if(!b) return null;
  const m=Math.max((b.x1-b.x0),(b.y1-b.y0))*0.04+(pad||0);
  const box={x0:Math.min(b.x0,p.x)-m, y0:Math.min(b.y0,p.y)-m, x1:Math.max(b.x1,p.x)+m, y1:Math.max(b.y1,p.y)+m};
  const R=xRaster(box);
  if(!R) return null;
  const c=xCellOf(R,p);
  const F=xFlood(R,c.cx,c.cy);
  return F? {R,F} : null;
}


/* ---- chaos helpers: Experimental is intentionally theatrical ------------ */
function xAllTargetable(){

}
function xEntityCenter(e){

function xEffectBox(list){

function xKickParticles(dt){

function xNearestIndex(p){
  let bi=-1,bd=1e99;

/* ====================== CLEANUP ======================================== */
function xMagnet(){
  const list=xSelectedOrEverything();
  const handles=[];
  for(const e of list) for(const h of xEndpoints(e)) handles.push(h);
  const box=xEffectBox(list), c=V((box.x0+box.x1)/2,(box.y0+box.y1)/2);
  if(handles.length<2){
    xfxRun("magnet",1200,{c,box},(t)=>{ if(Math.random()<.4)xBurstAt(c,"#ff5ac8",2,px(80)); xKickParticles(.016); },null);
    xBeep("pop"); return echo("MAGNET CLANG: nothing weldable, so it magnetised the air instead.");
  }
  const r=Math.max(px(S.x.weldR),Math.max(box.x1-box.x0,box.y1-box.y0)*.18);
  snap();
  let moved=0,groups=0;
  const used=new Uint8Array(handles.length);
  XFX.marks.length=0;
  for(let i=0;i<handles.length;i++){
    if(used[i]) continue;
    const pi=handles[i].get(), g=[i]; used[i]=1;
    for(let j=i+1;j<handles.length;j++){
      if(used[j]) continue;
      if(dist(pi,handles[j].get())<=r){used[j]=1;g.push(j);}
    }
    if(g.length<2) continue;
    let sx=0,sy=0; for(const k of g){const p=handles[k].get();sx+=p.x;sy+=p.y;}
    const q=V(sx/g.length,sy/g.length);
    for(const k of g){ if(dist(handles[k].get(),q)>1e-9){handles[k].set(q);moved++;} }
    XFX.marks.push({kind:"weld",p:q}); groups++;
  }
  if(!groups){
    /* No natural group? Force the two closest endpoints to slam together. */
    let a=0,b=1,bd=1e99;
    for(let i=0;i<handles.length;i++)for(let j=i+1;j<handles.length;j++){const d=dist(handles[i].get(),handles[j].get());if(d<bd){bd=d;a=i;b=j;}}
    const q=mul(add(handles[a].get(),handles[b].get()),.5); handles[a].set(q); handles[b].set(q); moved=2; groups=1;
    XFX.marks.push({kind:"weld",p:q});
  }
  flowInvalidateIndex(); updateProps();
  xfxRun("magnet",1500,{c,box},(t)=>{ if(Math.random()<.7){const q=V(box.x0+Math.random()*(box.x1-box.x0),box.y0+Math.random()*(box.y1-box.y0));xPart(q.x,q.y,(c.x-q.x)*2,(c.y-q.y)*2,700,"#ff5ac8",2);} xKickParticles(.016); },null);
  xBeep("thunk"); draw();
  echo("MAGNET SNAP: "+groups+" junction"+(groups===1?"":"s")+" slammed together, "+moved+" endpoint"+(moved===1?"":"s")+" moved.");
}
function xVacuum(){
  /* Experimental means literal: if objects are selected, suck them out of the drawing.
     With no selection it falls back to the original drawing-cleanup behaviour. Everything is undoable. */
  const sel=[...S.sel].filter(i=>S.ents[i]).sort((a,b)=>b-a);
  if(sel.length){
    const victims=sel.map(i=>S.ents[i]);

function xDominantAngle(list){
  const bins=new Float64Array(90);
  for(const e of list) for(const c of xSegs(e)){
    const L=dist(c.a,c.b);
    if(!(L>1e-9)) continue;
    let a=deg(Math.atan2(c.b.y-c.a.y, c.b.x-c.a.x));
    a=((a%90)+90)%90;
    bins[Math.min(89,Math.floor(a))]+=L;
  }
  let bi=-1, bv=0;
  for(let i=0;i<90;i++) if(bins[i]>bv){ bv=bins[i]; bi=i; }
  if(bi<0||bv<=0) return null;
  /* refine within the winning degree using a length-weighted mean */
  let sum=0, wsum=0;
  for(const e of list) for(const c of xSegs(e)){
    const L=dist(c.a,c.b);
    if(!(L>1e-9)) continue;
    let a=deg(Math.atan2(c.b.y-c.a.y, c.b.x-c.a.x));
    a=((a%90)+90)%90;
    if(Math.abs(a-(bi+0.5))>1.5) continue;
    sum+=a*L; wsum+=L;
  }
  return wsum>0 ? sum/wsum : bi+0.5;
}

/* ====================== ARCADE TOYS ==================================== */
function xPathFromEnt(e){
  let P=[];
  try{P=flatten(e)||[];}catch(_){P=[];}
  if(!P.length){
    if(e.t==="line")P=[e.a,e.b];
    else if(e.pts)P=e.pts.slice();
  }
  return P.filter(q=>q&&isFinite(q.x)&&isFinite(q.y));
}
function xPathLength(P){let n=0;for(let i=1;i<P.length;i++)n+=dist(P[i-1],P[i]);return n;}
function xLongestRide(){
  let best=null,L=-1;
  for(const e of xEnts()){
    const P=xPathFromEnt(e); if(P.length<2)continue;
    const d=xPathLength(P); if(d>L){L=d;best={e,P,L:d};}
  }
  return best;
}
function xPointOnPath(P,d){
  if(!P||P.length<2)return {p:P&&P[0]?P[0]:V(0,0),dir:V(1,0),i:0};
  let acc=0;
  for(let i=0;i<P.length-1;i++){
    const a=P[i],b=P[i+1],L=dist(a,b);
    if(d<=acc+L || i===P.length-2){
      const u=L?Math.max(0,Math.min(1,(d-acc)/L)):0;
      return {p:add(a,mul(sub(b,a),u)),dir:L?norm(sub(b,a)):V(1,0),i};
    }
    acc+=L;
  }
  return {p:P[P.length-1],dir:norm(sub(P[P.length-1],P[P.length-2])),i:P.length-2};
}
function xReversePath(P){return P.slice().reverse();}
function xSurfCourse(){
  const candidates=[];
  for(const e of xEnts()){
    const P=xPathFromEnt(e); if(P.length<2)continue;
    const L=xPathLength(P); if(L>px(24))candidates.push({e,P,L});
  }
  if(!candidates.length)return null;
  candidates.sort((a,b)=>b.L-a.L);
  const used=new Set(),tol=px(3),course=[];
  let cur=candidates[0],P=cur.P.slice(); used.add(cur.e); course.push(...P);
  let guard=0;
  while(guard++<80){
    const end=course[course.length-1]; let best=null,bestD=Infinity,bestRev=false;
    for(const c of candidates){
      if(used.has(c.e))continue;
      const d0=dist(end,c.P[0]),d1=dist(end,c.P[c.P.length-1]);
      if(d0<bestD){best=c;bestD=d0;bestRev=false;}
      if(d1<bestD){best=c;bestD=d1;bestRev=true;}
    }
    if(!best || bestD>tol)break;
    used.add(best.e); const Q=bestRev?xReversePath(best.P):best.P;
    if(bestD>1e-6)course.push(Q[0]);
    course.push(...Q.slice(1));
  }
  return {P:course,L:xPathLength(course),segments:used.size};
}
function xHorizontalPlatforms(){
  const out=[], slopeTol=.10, minL=px(34);
  for(const e of xEnts()){
    let segs=[]; try{segs=xSegs(e)||[];}catch(_){segs=[];}
    for(const seg of segs){
      if(!seg||!seg.a||!seg.b)continue;
      let a=seg.a,b=seg.b,dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy);
      if(L<minL || Math.abs(dy)/Math.max(1e-9,L)>slopeTol)continue;
      if(a.x>b.x){const q=a;a=b;b=q;}
      out.push({a,b,x0:a.x,x1:b.x,y:(a.y+b.y)/2,L,e});
    }
  }
  out.sort((a,b)=>a.x0-b.x0 || b.y-a.y);
  return out;
}


function xRideSurfaces(){
  const out=[], minL=px(26), maxSlope=Math.tan(rad(58));
  for(const e of xEnts()){
    let segs=[]; try{segs=xSegs(e)||[];}catch(_){segs=[];}
    for(const seg of segs){
      if(!seg||!seg.a||!seg.b)continue;
      let a=seg.a,b=seg.b, reversed=false;
      if(a.x>b.x){const q=a;a=b;b=q;reversed=true;}
      const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy);

      /* CAD lines need enough physical length to be useful terrain. Freehand ink is
         already resampled, so its short spans are intentional pieces of a curve and
         must not be discarded. This is what lets a marker-drawn bowl/ramp become a
         continuous skate surface. */
      const ink=!!seg.ink || e.t==="ink";
      const localMin=ink?px(1.8):minL;
      const localDx=ink?px(.65):px(8);
      const localMaxSlope=ink?Math.tan(rad(74)):maxSlope;
      if(L<localMin || dx<localDx)continue;
      if(Math.abs(dy/Math.max(1e-9,dx))>localMaxSlope)continue;
      const dir=norm(sub(b,a)), ang0=Math.atan2(dir.y,dir.x);
      out.push({a,b,x0:a.x,x1:b.x,L,dir,ang:ang0,e,ink,reversed,
                pathIndex:seg.pathIndex,pathCount:seg.pathCount});
    }
  }
  out.sort((a,b)=>a.x0-b.x0 || b.a.y-a.a.y);
  return out;
}
function xSurfY(q,x){
  const u=Math.max(0,Math.min(1,(x-q.a.x)/Math.max(1e-9,q.b.x-q.a.x)));
  return q.a.y+(q.b.y-q.a.y)*u;
}
function xSurfConnectedFrom(surfs,cur){
  const tol=px(4); let best=null,bd=Infinity,bscore=Infinity;
  for(const q of surfs){
    if(q===cur)continue;
    const d=dist(cur.b,q.a);
    if(d>tol || q.x1<=cur.x1-tol)continue;
    const same=(q.e===cur.e), sequential=same&&Number.isFinite(cur.pathIndex)&&Number.isFinite(q.pathIndex)&&Math.abs(q.pathIndex-cur.pathIndex)===1;
    /* Freehand strokes should follow their own next sample before jumping to some
       unrelated line that happens to be nearby. Distance still breaks ties. */
    const score=(sequential?-1000:same?-100:0)+d;
    if(score<bscore || (score===bscore&&d<bd)){best=q;bd=d;bscore=score;}
  }
  return best;
}
function xSurfConnectedBack(surfs,cur){
  const tol=px(4); let best=null,bd=Infinity,bscore=Infinity;
  for(const q of surfs){
    if(q===cur)continue;
    const d=dist(cur.a,q.b);
    if(d>tol || q.x0>=cur.x0+tol)continue;
    const same=(q.e===cur.e), sequential=same&&Number.isFinite(cur.pathIndex)&&Number.isFinite(q.pathIndex)&&Math.abs(q.pathIndex-cur.pathIndex)===1;
    const score=(sequential?-1000:same?-100:0)+d;
    if(score<bscore || (score===bscore&&d<bd)){best=q;bd=d;bscore=score;}
  }
  return best;
}
function xSurfNextAhead(surfs,cur){
  let best=null,score=Infinity;
  for(const q of surfs){
    if(q===cur)continue;
    const gap=q.x0-cur.x1;
    if(gap<px(3))continue;
    const dy=q.a.y-cur.b.y;
    const sc=gap+Math.abs(dy)*.22;
    if(sc<score){score=sc;best=q;}
  }
  return best;
}
function xSurfCross(a,b,c,d){return (b.x-a.x)*(d.y-c.y)-(b.y-a.y)*(d.x-c.x);}
function xSurfIntersection(a,b,c,d){
  const r=sub(b,a),s0=sub(d,c),den=xSurfCross(a,b,c,d);
  if(Math.abs(den)<1e-9)return null;
  const ca=sub(c,a),t=(ca.x*s0.y-ca.y*s0.x)/den,u=(ca.x*r.y-ca.y*r.x)/den;
  if(t>=0&&t<=1&&u>=0&&u<=1)return {p:add(a,mul(r,t)),t,u};
  return null;
}
/* Swept board-vs-terrain landing test. The rider is a projectile once he leaves a lip.
   We test the whole movement step against every ramp, then allow a tiny landing tolerance
   so a fast board cannot tunnel through a lower platform between animation frames. */
function xSurfSweepLanding(prev,nowp,vel,q,tol){
  const h=xSurfIntersection(prev,nowp,q.a,q.b);
  if(h){
    const n=V(-q.dir.y,q.dir.x);
    if(vel.x*n.x+vel.y*n.y<0)return {p:h.p,t:h.t};
  }
  const dx=nowp.x-prev.x;
  if(Math.abs(dx)<1e-9)return null;
  const xmin=Math.min(q.a.x,q.b.x)-tol,xmax=Math.max(q.a.x,q.b.x)+tol;
  const lo=Math.max(Math.min(prev.x,nowp.x),xmin),hi=Math.min(Math.max(prev.x,nowp.x),xmax);
  if(lo>hi)return null;
  // Probe where the board passed the ramp's x-range. This catches high-speed near misses.
  const probes=[lo,(lo+hi)*.5,hi];
  let best=null;
  for(const x of probes){
    const tm=(x-prev.x)/dx; if(tm<0||tm>1)continue;
    const by=prev.y+(nowp.y-prev.y)*tm;

    const uq=Math.abs(qdx)>1e-9?(x-q.a.x)/qdx:0;
    if(uq<-.02||uq>1.02)continue;
    const gy=q.a.y+(q.b.y-q.a.y)*uq;
    // Board must be descending through the top side of the ramp.
    const n=V(-q.dir.y,q.dir.x);
    if(vel.x*n.x+vel.y*n.y>=0)continue;
    const dd=Math.abs(by-gy);
    if(dd<=tol && (!best||dd<best.dd))best={p:V(x,gy),t:tm,dd};
  }

}
function xChooseSurferStart(surfs){
  if(!surfs.length)return null;
  return surfs[0];
}
function xSurferNearestSurface(surfs,w){
  let best=null, bestD=Infinity, bestU=0;
  for(const q of surfs){
    const ab=sub(q.b,q.a), den=ab.x*ab.x+ab.y*ab.y;
    if(den<1e-12)continue;
    const u=Math.max(0,Math.min(1,((w.x-q.a.x)*ab.x+(w.y-q.a.y)*ab.y)/den));
    const p=add(q.a,mul(ab,u)), d=dist(w,p);

  }
  return best?{q:best,u:bestU,p:add(best.a,mul(sub(best.b,best.a),bestU)),dist:bestD}:null;
}
function xArmSurferPick(){
  const surfs=xRideSurfaces();
  if(!surfs.length){
    const c=V(S.view.cx,S.view.cy);xfxRun("surferFail",1800,{c},null,null);xBeep("pop");
    return echo("LINE SURFER: draw a rideable line, ramp, or Marker track first.","warn");
  }
  S.x.surferPick=true;
  xUiReact("xsurfer","armed");

}
function xLineSurfer(startPick){
  const surfs=xRideSurfaces();
  if(!surfs.length){
    const c=V(S.view.cx,S.view.cy);xfxRun("surferFail",1800,{c},null,null);xBeep("pop");
    return echo("LINE SURFER: no rideable ground. Draw some lines or ramps first.");
  }
  const hit=startPick||xSurferNearestSurface(surfs,V(S.view.cx,S.view.cy));
  if(!hit||!hit.q)return echo("LINE SURFER: click a rideable part of the track.","warn");
  const start=hit.q, margin=Math.max(0,Math.min(start.L,hit.u*start.L));
  const data={surfs,p:start,state:"ride",d:margin,x:hit.p.x,y:hit.p.y,
              speed:px(125),vx:0,vy:0,spin:0,last:0,jumps:0,landings:0,goal:null,crashed:false,
              groundAng:start.ang,airAng:start.ang,sliding:false};

  // on fairly level ground; on a serious slope the hill wins.

  const airDrag=.006, landingCarry=.92, landingBoost=px(42), rampPopMax=px(120);

    const t=data.p.dir, signed=data.speed;
    data.state="air";

    data.vy=signed*t.y;

    // simply carries the downhill velocity into free flight.

    else if(signed>0 && Math.abs(t.y)<.08)data.vy+=px(8);
    data.airAng=Math.atan2(data.vy,data.vx||px(.01)); data.jumps++; data.launch=V(data.x,data.y);
    data.goal=signed>=0?xSurfNextAhead(surfs,data.p):null;
    data.sliding=false;
    xBeep("pop");
  };
  xfxRun("lineSurfer",26000,data,(t,now)=>{
    const dt=data.last?Math.min(.032,(now-data.last)/1000):.016; data.last=now;
    if(data.state==="ride"){
      const q=data.p, tangent=q.dir;
      // Signed velocity along the terrain. Positive = left-to-right, negative = right-to-left.
      // Gravity projected onto the slope is the dominant acceleration.
      const gravityAlong=-g*tangent.y;
      const slopeAbs=Math.abs(tangent.y);

      const rollingDrag=-rolling*data.speed;

      data.speed=Math.max(-maxV,Math.min(maxV,data.speed));

      data.d+=data.speed*dt;

      if(data.d>=0 && data.d<=q.L){

        if(prev){
          const turn=Math.acos(Math.max(-1,Math.min(1,q.dir.x*prev.dir.x+q.dir.y*prev.dir.y)));
          data.speed*=Math.max(.72,1-turn*.18);

          xBeep("tick");xBurstAt(V(data.x,data.y),"#78b7f1",Math.min(26,8+Math.floor(landingSpeed/45)),px(110));
          if(landingSpeed>330){
            xBurstAt(V(data.x,data.y),"#ffd166",18,px(150));

          }

  }

    ()=>{const want=Math.min(frames.length-1,Math.floor((((typeof performance!=="undefined"&&performance.now)?performance.now():Date.now())-XFX.t0)/per));if(want!==i){i=want;try{applyBlob(frames[i]);}catch(_){}}},
    ()=>{try{applyBlob(hold);}catch(_){}S.sel.clear();updateProps();echo("TIME-LAPSE finished. Reality restored.");});

function xWidget(){

    const sp=document.createElement("span"); sp.className="oh"; sp.textContent=label;

    i.type="number"; i.step=step||"any"; i.value=get(); i.style.maxWidth="52px";
    i.onchange=()=>{ const v=parseFloat(i.value); if(isFinite(v)) set(v); };

  };

function xSetExperimental(on){
  S.experimental=!!on;

    xfxStop();

window.addEventListener("keydown",e=>{
  const typing = !!S.ask || document.activeElement===cmdin;
  if(e.key==="Escape"){ cmdin.value=""; cancel(); return; }
  if(!typing && e.key==="Tab" && S.tool!=="measurealong" && S.snapList.length>1){
    e.preventDefault(); snapCycleNext(); return;
  }
  if(!typing && e.key==="Tab" && S.tool==="measurealong"){
    e.preventDefault(); S.measureTabChain=!S.measureTabChain; S.measureEscArmed=false;
    echo(S.measureTabChain?"Chain preview · click to measure connected run":"Element preview"); draw(); return;
  }
  if(e.key==="F8"){ e.preventDefault(); return toggle("ortho"); }
  if(e.key==="F9"){ e.preventDefault(); return toggle("gridSnap"); }
  if(e.key==="F7"){ e.preventDefault(); return toggle("gridShow"); }
  if(e.key==="F3"){ e.preventDefault(); return toggle("osnap"); }
  if(e.key==="F4"){ e.preventDefault(); return toggle("weld"); }
  if(e.key==="F6"){ e.preventDefault(); return toggle("edgeAssist"); }
  if(e.key==="F10"){ e.preventDefault(); return toggle("punch"); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); return e.shiftKey?redo():undo(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){ e.preventDefault(); return redo(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="a"){ e.preventDefault(); S.sel=new Set(S.ents.map((_,i)=>i)); draw(); updateProps(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="c"){ e.preventDefault(); return clipCopy(false); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="x"){ e.preventDefault(); return clipCopy(true); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="v"){ e.preventDefault(); return clipPaste(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){ e.preventDefault(); return saveDrawing(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="o"){ e.preventDefault(); return document.getElementById("b2dbin").click(); }
  if(e.key==="Delete"||e.key==="Backspace"){ if(!typing){ e.preventDefault(); eraseSel(); } return; }
  if(typing) return;
  const NUD={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];
  if(NUD){
    if(!S.sel.size || S.pending.length || S.base) return;
    e.preventDefault(); return nudge(NUD[0],NUD[1],e);
  }
  const k=e.key.toUpperCase();
  for(const [id,T] of Object.entries(TOOLS)) if(T.hot===k){ e.preventDefault(); return setTool(id); }
  if(k==="Z"&&!e.ctrlKey&&!e.metaKey){ e.preventDefault(); zoomExtents(); }
});

let ribbonTab="Home";
function itemOf(id){ return TOOLS[id] || ACTIONS[id]; }

/* All ribbon clicks go through one dispatcher. This is deliberately the only
   place a generated ribbon button activates a tool/action, so active state
   cannot drift between tabs, especially Experimental Features. */
function activateRibbonItem(id){
  if(TOOLS[id]){
    setTool(id);
    if(TOOLS[id].experimental) xUiReact(id,"armed");
    return;
  }
  const A=ACTIONS[id];
  if(!A){
    console.error("Ribbon item has no tool/action:",id);
    echo("Button is not wired: "+id,"warn");
    return;
  }
  if(XACTIONS.has(id) && !S.experimental){
    echo("Experimental Features is off","warn");
    return;
  }

  /* One-shot commands must not leave the previous drawing/pick tool armed.
     Selection is preserved by setTool("select"), but pending points, pick
     stages, measure graphics and pressed-state from the old tool are cleared. */
  if(S.tool!=="select") setTool("select");
  if(XACTIONS.has(id)) xUiReact(id,"action");
  A.run();
  paintRibbon();
  paintOptbar();
  setPrompt();
  draw();
}

function mkBtn(id,big){
  const T=itemOf(id), b=document.createElement("button");
  b.type="button";
  b.className=big?"big":"small"; b.dataset.item=id;
  if(!T){
    b.disabled=true;
    b.title="Unwired ribbon item: "+id;
    b.textContent=id;
    console.error("Unwired ribbon item:",id);
    return b;
  }
  const hot = T.hot? " or press "+T.hot : "";
  b.title=T.label+"   type "+(T.alias||id)+hot;
  b.innerHTML='<svg viewBox="0 0 20 20" aria-hidden="true">'+T.svg+'</svg><span>'+
    T.label.replace(/,.*$/,"").replace(/\s*\(.*\)$/,"")+'</span>';
  b.onclick=()=>activateRibbonItem(id);
  return b;
}
function paintRibbon(){
  const tabs=document.getElementById("rtabs");
  const want=xVisibleTabs();
  const have=[...tabs.children].map(b=>b.textContent);
  if(have.length!==want.length || have.some((n,i)=>n!==want[i])){
    tabs.innerHTML="";
    for(const name of want){
      const b=document.createElement("button");
      b.className="rtab"; b.textContent=name; b.setAttribute("role","tab");
      b.onclick=()=>{ ribbonTab=name; paintRibbon(); };
      tabs.append(b);
    }
  }
  if(!want.includes(ribbonTab)) ribbonTab=want[0]||"Home";
  [...tabs.children].forEach(b=>b.setAttribute("aria-selected",String(b.textContent===ribbonTab)));

  const host=document.getElementById("rpanels");
  host.innerHTML="";
  for(const P of RIBBON[ribbonTab]){
    const panel=document.createElement("div"); panel.className="rpanel";
    const body=document.createElement("div"); body.className="rpanel-body";
    if(P.big) body.append(mkBtn(P.big,true));
    if(P.small){
      const cols=document.createElement("div"); cols.className="rcols";
      for(let i=0;i<P.small.length;i+=3){
        const row=document.createElement("div"); row.className="rrow";
        const col=document.createElement("div"); col.className="rcols";
        P.small.slice(i,i+3).forEach(id=>col.append(mkBtn(id,false)));
        row.append(col); cols.append(row);
      }
      // lay the groups of three out side by side
      cols.className="rrow";
      body.append(cols);
    }
    if(P.custom==="layers")  body.append(layerWidget());
    if(P.custom==="style")   body.append(styleWidget());
    if(P.custom==="toggles") body.append(toggleWidget());
    if(P.custom==="punch")   body.append(punchWidget());
    if(P.custom==="grid")    body.append(gridWidget());
    if(P.custom==="pen")     body.append(penWidget());
    if(P.custom==="flow")    body.append(flowWidget());
    if(P.custom==="png")     body.append(pngWidget());
    if(P.custom==="snaps")   body.append(snapWidget());
    if(P.custom==="xtoggle") body.append(xExperimentalToggle());
    if(P.custom==="xsettings") body.append(xWidget());
    const lab=document.createElement("div"); lab.className="rpanel-label"; lab.textContent=P.name;
    panel.append(body,lab); host.append(panel);
  }
  host.querySelectorAll(".big,.small").forEach(b=>{
    const id=b.dataset.item;
    if(id && TOOLS[id]) b.setAttribute("aria-pressed",String(id===S.tool));
    else if(id) b.setAttribute("aria-pressed","false");
  });

    : (MK_TOOLS[S.tool] ? (MK_TOOLS[S.tool].kind==="erase" ? "erasing" : "inking") : "");
}

/* ============================================================ punch mode
   Test Your Might. When S.punch is on, a left-click on the canvas hits the
   object under the cursor. Four hits destroys it. Destruction goes through
   snap() so undo (Ctrl+Z) brings the object straight back. Pure stress relief,
   nothing here mutates geometry except the final removal. */
const PUNCH_PALETTE=["#f87171","#fbbf24","#fb923c","#dc2626","#ffffff"];
const PUNCH_TEXT=[
  {hp:1,text:"Crack!",color:"#fbbf24"},
  {hp:2,text:"Wallop!",color:"#fb923c"},
  {hp:3,text:"Critical!",color:"#f87171"},
  {hp:4,text:"K.O.!",color:"#dc2626"}
];
let punchKills=0;
const punchFX=(function(){
  let host=null, banner=null, ac=null;
  function fxHost(){
    if(!host){ host=document.createElement("div"); host.className="punch-fx-host";
      host.id="punch-particles"; document.body.appendChild(host); }
    return host;
  }
  function fatalityHost(){
    if(!banner){ banner=document.createElement("div"); banner.id="punch-fatality";
      banner.innerHTML="<span>Fatality</span>"; document.body.appendChild(banner); }
    return banner;
  }
  function ctx(){
    if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ return null; } }
    if(ac.state==="suspended") ac.resume();
    return ac;
  }
  function hitTone(level){
    const c=ctx(); if(!c) return; const now=c.currentTime;
    const o=c.createOscillator(), g=c.createGain(); o.type="square";
    const f=220-level*30;
    o.frequency.setValueAtTime(f*2,now); o.frequency.exponentialRampToValueAtTime(f*0.5,now+0.15);
    g.gain.setValueAtTime(0.14,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.2);
    o.connect(g).connect(c.destination); o.start(now); o.stop(now+0.2);
  }
  function boom(){
    const c=ctx(); if(!c) return; const now=c.currentTime;
    const n=c.sampleRate*0.4, buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const src=c.createBufferSource(); src.buffer=buf;
    const ng=c.createGain(); ng.gain.setValueAtTime(0.3,now); ng.gain.exponentialRampToValueAtTime(0.001,now+0.4);
    const fl=c.createBiquadFilter(); fl.type="lowpass";
    fl.frequency.setValueAtTime(2000,now); fl.frequency.exponentialRampToValueAtTime(100,now+0.4);
    src.connect(fl).connect(ng).connect(c.destination); src.start(now);
    const o=c.createOscillator(), og=c.createGain(); o.type="sawtooth";
    o.frequency.setValueAtTime(80,now); o.frequency.exponentialRampToValueAtTime(30,now+0.4);
    og.gain.setValueAtTime(0.24,now); og.gain.exponentialRampToValueAtTime(0.001,now+0.5);
    o.connect(og).connect(c.destination); o.start(now); o.stop(now+0.5);
  }
  function fatalChord(){
    const c=ctx(); if(!c) return; const now=c.currentTime;
    [110,138.6,164.8].forEach(fr=>{
      const o=c.createOscillator(), g=c.createGain(); o.type="sawtooth";
      o.frequency.setValueAtTime(fr,now); o.frequency.exponentialRampToValueAtTime(fr*0.5,now+1.5);
      g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(0.07,now+0.1);
      g.gain.linearRampToValueAtTime(0.07,now+1.0); g.gain.exponentialRampToValueAtTime(0.001,now+1.6);
      o.connect(g).connect(c.destination); o.start(now); o.stop(now+1.6);
    });
  }
  function particles(x,y,count){
    const h=fxHost();
    for(let i=0;i<count;i++){
      const p=document.createElement("div"); p.className="punch-particle";
      p.style.left=x+"px"; p.style.top=y+"px";
      p.style.background=PUNCH_PALETTE[(Math.random()*PUNCH_PALETTE.length)|0];
      const a=Math.random()*Math.PI*2, sp=80+Math.random()*220;
      p.style.setProperty("--px",Math.cos(a)*sp+"px");
      p.style.setProperty("--py",(Math.sin(a)*sp+60)+"px");
      p.style.setProperty("--pr",(Math.random()*720-360)+"deg");
      const sz=4+Math.random()*8; p.style.width=p.style.height=sz+"px";
      if(Math.random()<0.3) p.style.borderRadius="50%";
      h.appendChild(p); setTimeout(()=>p.remove(),950);
    }
  }
  function floater(x,y,hp){
    const cfg=PUNCH_TEXT.find(t=>t.hp===Math.min(hp,4))||PUNCH_TEXT[0];
    const t=document.createElement("div"); t.className="punch-text";
    t.textContent=cfg.text; t.style.color=cfg.color;
    t.style.left=(x-70)+"px"; t.style.top=(y-30)+"px";
    document.body.appendChild(t); setTimeout(()=>t.remove(),1000);
  }
  function shake(){
    const app=document.getElementById("app");
    app.classList.remove("punch-shake"); void app.offsetWidth; app.classList.add("punch-shake");
    setTimeout(()=>app.classList.remove("punch-shake"),450);
  }
  return {
    hit(x,y,hp){ floater(x,y,hp); particles(x,y,8+hp*6); hitTone(hp); },
    destroy(x,y){ particles(x,y,42); boom(); shake(); },
    fatality(){ const b=fatalityHost(); b.classList.remove("show"); void b.offsetWidth;
      b.classList.add("show"); fatalChord(); setTimeout(()=>b.classList.remove("show"),2000); }
  };
})();
function punchAt(e){
  const p=cursorPoint();
  const i=hitIndex(p);
  const x=e.clientX, y=e.clientY;
  if(i<0){ punchFX.hit(x,y,1); echo("Whiff \u2014 nothing to hit there","warn"); return; }
  const ent=S.ents[i];
  ent._hp=(ent._hp||0)+1;
  punchFX.hit(x,y,ent._hp);
  if(ent._hp>=4){
    snap();                         // undoable removal
    const idx=S.ents.indexOf(ent);
    if(idx>=0) S.ents.splice(idx,1);
    S.sel.clear(); resetNudge();
    const orphans=flowPrune();
    punchFX.destroy(x,y);
    if(++punchKills%3===0) punchFX.fatality();
    echo("Object destroyed"+(orphans?"  ("+orphans+" connector"+(orphans>1?"s":"")+" dropped)":"")+"  \u2014  Ctrl+Z to revive");
  }
  draw();
}

/* ============================================================ options bar
   Context controls for the active tool, the way Revit's Options Bar sits
   under the ribbon and changes per tool. Chain/Radius drive the Line tool's
   chained-segment drawing; Offset drives both the Line tool and Pick Lines. */
function paintOptbar(){
  const host=document.getElementById("optbar");
  host.innerHTML="";
  const activeTool=TOOLS[S.tool];
  if(activeTool && (S.tool!=="select" || S.sel.size)){
    const context=document.createElement("span");
    context.className="context-name";
    context.textContent=activeTool.label.replace(/,.*/,"");
    host.append(context);
  }
  const num=(label,val,step,set,disabled)=>{
    const wrap=document.createElement("label");
    const sp=document.createElement("span"); sp.textContent=label; sp.className="oh";
    const i=document.createElement("input"); i.type="number"; i.step=step||"any"; i.value=val; i.disabled=!!disabled;
    i.onchange=()=>{ const v=parseFloat(i.value); if(isFinite(v)) set(v); paintOptbar(); };
    wrap.append(sp,i); return wrap;
  };
  const chk=(label,val,set)=>{
    const wrap=document.createElement("label");
    const i=document.createElement("input"); i.type="checkbox"; i.checked=!!val;
    i.onchange=()=>{ set(i.checked); paintOptbar(); draw(); };
    const sp=document.createElement("span"); sp.textContent=label;
    wrap.append(i,sp); return wrap;
  };
  if(S.snapSuspend||S.snapOverride){
    const b=document.createElement("button");
    b.className="small"; b.type="button"; b.style.minWidth="0";
    b.textContent=S.snapSuspend?"Snaps suspended (SS)":("Snap: "+SNAP_NAME[S.snapOverride]);
    b.setAttribute("aria-pressed","true");
    b.title="Click to clear";
    b.onclick=()=>{ S.snapSuspend=false; snapSetOverride(null); };
    host.append(b);
  }
  const readField=(label,val)=>{
    const wrap=document.createElement("label");
    const sp=document.createElement("span"); sp.textContent=label; sp.className="oh";
    const i=document.createElement("input"); i.type="text"; i.value=val; i.readOnly=true; i.disabled=true; i.style.width="92px";
    wrap.append(sp,i); return wrap;
  };
  const radio=(options,val,set)=>{
    const wrap=document.createElement("div"); wrap.className="rrow";
    for(const [v,l] of options){
      const b=document.createElement("button"); b.className="small"; b.style.minWidth="0";
      b.textContent=l; b.setAttribute("aria-pressed", String(val===v));
      b.onclick=()=>{ set(v); paintOptbar(); draw(); };
      wrap.append(b);
    }
    return wrap;
  };
  if(flowIsTool(S.tool)){ flowOptbar(host,{num,chk,radio}); return; }
  if(mkIsTool(S.tool)){ mkOptbar(host,{num,chk,radio}); return; }
  if(S.tool==="measurebetween"){
    host.append(chk("Chain",S.measureChain,v=>{ S.measureChain=v; clearMeasurement(false); setPrompt(); }));
    host.append(readField("Total Length",S.measureTotal>0?fmt(S.measureTotal):""));
  } else if(S.tool==="measurealong"){
    host.append(readField("Total Length",S.measureTotal>0?fmt(S.measureTotal):""));
    const hint=document.createElement("span"); hint.className="oh"; hint.textContent=S.measureTabChain?"Tab: chain preview":"Tab: connected chain"; host.append(hint);
  } else if(S.tool==="line"){
    host.append(chk("Chain", S.chain, v=>{S.chain=v; S.pending=[]; S.chainPrev=null; setPrompt(); draw();}));
    host.append(num("Offset", S.drawOffset, "any", v=>S.drawOffset=v));
    host.append(chk("Radius", S.useRadius, v=>S.useRadius=v));
    host.append(num("", S.chainRadius, "any", v=>S.chainRadius=Math.max(0,v), !S.useRadius));
  } else if(S.tool==="pickLines"){
    host.append(num("Offset", S.drawOffset, "any", v=>{S.drawOffset=v; if(S.op) S.op.d=Math.max(0,v);}));
  } else if(S.tool==="offset"){
    host.append(radio([["numerical","Numerical"],["graphical","Graphical"]], S.offsetMode, v=>S.offsetMode=v));
    if(S.offsetMode==="numerical")
      host.append(num("Offset", S.op.d!=null?S.op.d:S.lastOffset, "any",
        v=>{ S.lastOffset=v; if(S.op) S.op.d=v; }));
    host.append(chk("Copy", S.copyOffset, v=>S.copyOffset=v));
  } else if(S.tool==="fillet"||S.tool==="chamfer"){
    host.append(num(S.tool==="fillet"?"Radius":"Distance",
      S.op.r!=null? S.op.r : (S.tool==="fillet"?S.lastFillet:S.lastChamfer), "any",
      v=>{ const r=Math.max(0,v); if(S.op) S.op.r=r; if(S.tool==="fillet") S.lastFillet=r; else S.lastChamfer=r; }));
  } else if(S.tool==="scale"){
    host.append(radio([["graphical","Graphical"],["numerical","Numerical"]], S.scaleMode,
      v=>{ S.scaleMode=v; S.pending=[]; setPrompt(); draw(); }));
    if(S.scaleMode==="numerical") host.append(num("Scale", S.lastScaleFactor, "any", v=>S.lastScaleFactor=v));
  } else if(S.tool==="copy"){
    host.append(chk("Multiple", S.copyMultiple, v=>S.copyMultiple=v));
  } else if(S.tool==="rotate"){
    host.append(chk("Copy", S.copyRotate, v=>S.copyRotate=v));
  } else if(S.tool==="mirror"){
    host.append(chk("Copy", S.copyMirror, v=>S.copyMirror=v));
  } else if(S.tool==="polygon"){
    host.append(num("Sides", S.polySides, "1", v=>S.polySides=Math.max(3,Math.min(64,Math.round(v)))));
    const wrap=document.createElement("label"); const sp=document.createElement("span"); sp.className="oh"; sp.textContent="";
    const sel=document.createElement("select");
    for(const [v,l] of [["1","Inscribed"],["0","Circumscribed"]]){
      const o=document.createElement("option"); o.value=v; o.textContent=l;
      if((v==="1")===S.polyInscribed) o.selected=true; sel.append(o);
    }
    sel.onchange=()=>{ S.polyInscribed=sel.value==="1"; draw(); };
    wrap.append(sp,sel); host.append(wrap);
  } else if(S.tool==="select" && S.sel.size===1){
    const e=S.ents[[...S.sel][0]];
    if(e && e.si!=null){
      const lab=document.createElement("span"); lab.className="oh"; lab.textContent="Line style";
      const sw=document.createElement("span"); sw.className="swatch";
      const st=S.styles[e.si]; if(st) sw.style.background=aciColor(st.aci);
      const nm=document.createElement("span"); nm.textContent=st? st.name : "";
      host.append(lab,sw,nm);
    }
  }
  if(S.tool==="select" && [...S.sel].some(i=>mkIsEnt(S.ents[i]))){
    const lab=document.createElement("span"); lab.className="oh"; lab.textContent="Markup colour";
    host.append(lab, mkColorChips(()=>{ mkRestyleSelection(); paintOptbar(); }));
  }
}

/* ============================================================ line styles UI
   Mirrors the Layers list: swatch cycles colour, weight is a typed mm value,
   the little dashed-line button cycles a small preset list of dash patterns. */
const PAT_PRESETS=[null,[3,2],[2,1.5],[6,2,1,2],[12,2,2,2],[8,2,1,2,1,2],[10,3]];
function patKey(p){ return p? p.join(",") : "solid"; }
function nextPattern(p){
  const idx=PAT_PRESETS.findIndex(x=>patKey(x)===patKey(p));
  return PAT_PRESETS[(idx+1+PAT_PRESETS.length)%PAT_PRESETS.length];
}
function paintStyles(){

    const w=document.createElement("input"); w.className="sweight"; w.type="number"; w.step="0.01"; w.min="0.01";
    w.value=st.w; w.title="Line weight, mm";

    const pat=document.createElement("button"); pat.className="spat"; pat.title="Click to cycle the dash pattern";
    const dash=(st.pat||[]).map(v=>{ const n=Math.abs(Number(v)); return isFinite(n)? n : 1; }).join(",");
    pat.innerHTML='<svg viewBox="0 0 28 14"><line x1="2" y1="7" x2="26" y2="7" stroke-dasharray="'+dash+'"/></svg>';
    pat.onclick=ev=>{ ev.stopPropagation(); st.pat=nextPattern(st.pat); paintStyles(); draw(); };
    d.append(sw,nm,w,pat); host.append(d);

}

/* ============================================================ properties */
function updateProps(){
  if(S.tool==="select") paintOptbar();
  const host=document.getElementById("props"), title=document.getElementById("prop-title");
  host.innerHTML="";
  if(S.sel.size===1){
    const i=[...S.sel][0], e=S.ents[i];
    title.textContent=flowIsEnt(e)? flowEntName(e) : mkIsEnt(e)? mkEntName(e) : e.t.toUpperCase();
    const rows=[];
    if(e.t==="line"){
      rows.push(num("Length",dist(e.a,e.b),v=>{
        const d=norm(sub(e.b,e.a)); snap(); e.b=add(e.a,mul(d,v)); }));
      rows.push(num("Angle",deg(wrap(ang(e.a,e.b))),v=>{
        const L=dist(e.a,e.b); snap(); e.b=add(e.a,V(L*Math.cos(rad(v)),L*Math.sin(rad(v)))); }));
      rows.push(num("Start X",e.a.x,v=>{snap();e.a.x=v}));
      rows.push(num("Start Y",e.a.y,v=>{snap();e.a.y=v}));
    }
    if(e.t==="circle"){
      rows.push(num("Radius",e.r,v=>{snap();e.r=Math.max(1e-6,v)}));
      rows.push(num("Center X",e.c.x,v=>{snap();e.c.x=v}));
      rows.push(num("Center Y",e.c.y,v=>{snap();e.c.y=v}));
    }
    if(e.t==="arc"){
      rows.push(num("Radius",e.r,v=>{snap();e.r=Math.max(1e-6,v)}));
      rows.push(num("Start ang",deg(e.a0),v=>{snap();e.a0=wrap(rad(v))}));
      rows.push(num("End ang",deg(e.a1),v=>{snap();e.a1=wrap(rad(v))}));
    }
    if(e.t==="text"){
