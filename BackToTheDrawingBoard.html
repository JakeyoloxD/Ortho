function doPick(i,p,shift){
  const t=S.tool;
  if(i<0){ echo("Nothing under the cursor","warn"); return; }
  if(t==="trimcorner"){
    if(S.op.first==null){ S.op.first=i; S.op.firstPt=p; say("Pick the part of the second element to keep"); draw(); return; }
    if(i===S.op.first){ echo("Pick a different element","warn"); return; }
    trimExtendCorner(S.op.first,S.op.firstPt,i,p);
    S.op={}; say("Pick the part of the first element to keep");
    return;
  }
  if(t==="trimsingle"||t==="trimmultiple"){
    if(S.op.boundary==null){ S.op.boundary=i; say("Pick the element to trim or extend"); draw(); return; }
    if(i===S.op.boundary){ echo("Pick a different element","warn"); return; }
    trimExtendToBoundary(i,S.op.boundary,p);
    if(t==="trimsingle"){ S.op={}; say("Pick a boundary reference"); }
    else say("Pick another element to trim/extend to the same boundary");
    return;
  }
  if(t==="offset"||t==="pickLines"){
    if(S.op.stage!=="side"){ S.op.ent=i; S.op.stage="side"; say("Pick the side to offset toward"); draw(); return; }
    return;
  }
  if(t==="fillet"||t==="chamfer"){
    if(S.op.first==null){ S.op.first=i; S.op.firstPt=p; say("Pick second line"); draw(); return; }
    if(i===S.op.first){ echo("Pick a different line","warn"); return; }
    filletPair(S.op.first,S.op.firstPt,i,p,S.op.r,t==="chamfer");
    S.op={r:S.op.r}; say("Pick first line");
    return;
  }
  if(t==="measurealong"){ measureAlongPick(i); return; }
}

/* Trace a connected run of coincident "line" entities in both directions from
   startIdx, the way Revit's Offset detects a whole chained wall/line run and
   offsets it as one mitred unit instead of one segment at a time. Any other
   entity type, or a branch/dead end, stops the trace at length 1. */
function traceChainPoints(startIdx){
  const e0=S.ents[startIdx];
  if(e0.t!=="line") return {idxs:[startIdx], pts:null, closed:false};
  const used=new Set([startIdx]);
  const idxs=[startIdx];
  let pts=[e0.a,e0.b];
  const step=(atFront)=>{
    for(;;){
      const tip = atFront ? pts[0] : pts[pts.length-1];
      const cands=[];
      S.ents.forEach((e,i)=>{
        if(used.has(i)||e.t!=="line") return;
        if(dist(e.a,tip)<WELD_TOL) cands.push({i,next:e.b});
        else if(dist(e.b,tip)<WELD_TOL) cands.push({i,next:e.a});
      });
      if(cands.length!==1) return;
      used.add(cands[0].i);
      if(atFront){ idxs.unshift(cands[0].i); pts.unshift(cands[0].next); }
      else       { idxs.push(cands[0].i);    pts.push(cands[0].next); }
    }
  };
  step(false); step(true);
  let closed=false;
  if(idxs.length>2 && dist(pts[0],pts[pts.length-1])<WELD_TOL){ closed=true; pts=pts.slice(0,-1); }
  return {idxs, pts, closed};
}
/* Offset a whole traced chain as one mitred shape, then hand back one new
   "line" entity per original segment (chains stay separate elements, the
   same way Chain-mode drawing keeps them separate for weld to act on). */
function offsetChain(idxs,pts,closed,d,side){
  const first=S.ents[idxs[0]];
  const fake={t:"pline", li:first.li, si:first.si, closed, pts};
  const off=offsetEnt(fake,d,side);
  if(!off) return null;
  const segs=[], n=off.pts.length;
  for(let k=0;k<n-1;k++) segs.push({t:"line", li:fake.li, si:fake.si, a:off.pts[k], b:off.pts[k+1]});
  if(closed) segs.push({t:"line", li:fake.li, si:fake.si, a:off.pts[n-1], b:off.pts[0]});
  return segs;
}
/* offset's second click is a side point, not an entity, so it is handled here */
function offsetSide(p){
  const src=S.ents[S.op.ent];
  if(!src){ echo("Object went away","warn"); setTool("select"); return; }
  const picking = S.tool==="pickLines";

  let d=S.op.d;
  if(S.tool==="offset" && S.offsetMode==="graphical"){
    d = src.t==="line" ? ptSegDist(p,src.a,src.b) : Math.abs(dist(p,src.c)-src.r);
  }
  if(!(d>0)){ echo("Offset distance must be greater than zero","warn"); return; }

  let idxs, segs;
  if(src.t==="line"){
    const tr=traceChainPoints(S.op.ent);
    idxs=tr.idxs;
    segs=offsetChain(idxs,tr.pts,tr.closed,d,p);
    if(!segs) return echo("Cannot offset that far inward","warn");
  } else {
    const out=offsetEnt(src,d,p);
    if(!out) return echo("Cannot offset that far inward","warn");
    idxs=[S.op.ent]; segs=[out];
  }
  if(picking) segs.forEach(sg=>{ sg.li=S.cur; sg.si=S.curStyle; });  /* Pick Lines: active style, not the source's */

  snap();
  if(S.tool==="offset" && !S.copyOffset){
    idxs.forEach((idx,k)=>Object.assign(S.ents[idx],segs[k]));
    echo("Moved to offset "+fmt(d)+(idxs.length>1?"  ("+idxs.length+"-segment chain)":""));
  } else {
    S.ents.push(...segs);
    echo((picking?"Placed at offset ":"Offset by ")+fmt(d)+(idxs.length>1?"  ("+idxs.length+"-segment chain)":""));
  }
  draw(); updateProps();
  S.op={stage:"pick", d}; say(picking?"Pick a line to offset":"Pick object to offset");
}

/* ============================================================ pointer */
let panning=false, panFrom=null, downAt=null, dragging=false;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);
  const r=cv.getBoundingClientRect();
  setMouseFrom(e,r);
  if(touchDown(e)){ e.preventDefault(); draw(); return; }
  if(e.button===1 || (e.button===0&&e.altKey)){
    panning=true; panFrom={x:e.clientX,y:e.clientY,cx:S.view.cx,cy:S.view.cy};
    cv.classList.add("panning"); e.preventDefault(); return;
  }
  if(e.button===2){
    if(S.tool==="pline"||S.tool==="spline") finishPline();
    else if(S.tool==="line"&&S.chain) finishChain();
    else cancel();
    return;
  }
  if(e.button!==0) return;
  if(S.punch){
    /* Deferred to the lift on touch: a pinch starts with one finger down, and
       that finger must not land a hit before the second arrives. */
    if(S.touchUI && e.pointerType && e.pointerType!=="mouse"){ punchTap=true; return; }
    punchAt(e); return;
  }
  if(mkIsTool(S.tool)){ mkPointerDown(e); return; }
  if(flowIsTool(S.tool)){ flowPointerDown(e); return; }
  if(gripBegin(S.mouse.sx,S.mouse.sy)) return;
  downAt={sx:S.mouse.sx, sy:S.mouse.sy, w:cursorPoint(), shift:e.shiftKey||S.stickyShift};
  dragging=false;
});
window.addEventListener("pointermove",e=>{
  const r=cv.getBoundingClientRect();
  setMouseFrom(e,r);
  if(touchMove(e)) return;
  if(panning&&panFrom){
    S.view.cx=panFrom.cx-(e.clientX-panFrom.x)/S.view.s;
    S.view.cy=panFrom.cy+(e.clientY-panFrom.y)/S.view.s;
    draw(); return;
  }
  if(mkDraw){ mkPointerMove(e); return; }
  if(gripDrag){ gripMove(); return; }
  if(flowResize){ flowApplyResize(cursorPoint()); readout(); draw(); return; }
  if(flowDraw){ flowPointerMove(e); return; }
  if(downAt && !dragging && Math.hypot(S.mouse.sx-downAt.sx,S.mouse.sy-downAt.sy)>4) dragging=true;
  if(downAt && dragging && S.tool==="select"){
    S.band={a:downAt.w, b:V(wX(S.mouse.sx),wY(S.mouse.sy))};
  }
  S.hover = (TOOLS[S.tool].pick && !((S.tool==="offset"||S.tool==="pickLines")&&S.op.stage==="side"))
    ? (S.tool==="measurealong"?hitIndexMeasure(V(wX(S.mouse.sx),wY(S.mouse.sy))):hitIndex(V(wX(S.mouse.sx),wY(S.mouse.sy)))) : -1;
  readout(); draw();
});
window.addEventListener("pointerup",e=>{
  if(touchUp(e)){ panning=false; panFrom=null; cv.classList.remove("panning"); return; }
  if(punchTap){ punchTap=false; punchAt(e); return; }
  if(panning){ panning=false; panFrom=null; cv.classList.remove("panning"); return; }
  if(mkDraw){ mkPointerUp(e); return; }
  if(gripDrag){ gripEnd(); return; }
  if(flowResize){ flowResize=null; draw(); updateProps(); echo("Resized node"); return; }
  if(flowDraw){ flowPointerUp(e); return; }
  if(!downAt) return;
  const w=cursorPoint();
  if(S.x && S.x.surferPick){
    if(!dragging || touchAimDrag()){
      const raw=V(wX(S.mouse.sx),wY(S.mouse.sy));
      const surfs=xRideSurfaces(), hit=xSurferNearestSurface(surfs,raw);
      const maxPick=px(22);
      if(hit && hit.dist<=maxPick){
        S.x.surferPick=false;
        cv.classList.remove("picking");
        downAt=null; dragging=false;
        xUiReact("xsurfer","action");
        xLineSurfer(hit);
        setPrompt(); draw();
        return;
      }
      echo("LINE SURFER: click closer to a rideable line, ramp, or Marker stroke.","warn");
      say("Line Surfer: click where he starts");
      downAt=null; dragging=false; draw();
      return;
    }
  }
  /* On touch, sliding to aim leaves dragging=true even though the user was
     placing a point, not dragging. Honour the release in that case, and pick
     from where the crosshair ended up rather than where the finger landed. */
  const slid=touchAimDrag();
  if(S.tool==="select"){
    if(dragging && S.band){ pickBox(S.band.a,S.band.b,downAt.shift); S.band=null; }
    else pickAt(downAt.w, downAt.shift);
    updateProps();
  } else if(TOOLS[S.tool].pick){
    if(!dragging || slid){
      S.measureEscArmed=false;
      if((S.tool==="offset"||S.tool==="pickLines") && S.op.stage==="side") offsetSide(w);
      else { const hp=S.tool==="measurealong"?hitIndexMeasure(slid?w:downAt.w):hitIndex(slid?w:downAt.w); doPick(hp,w,e.shiftKey||downAt.shift); }
    }
  } else {
    if(!dragging || slid) feed(w);
  }
  downAt=null; dragging=false; draw();
});
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const before=V(wX(mx),wY(my));
  const k=Math.pow(1.0016, -e.deltaY);
  S.view.s=Math.min(4000,Math.max(0.002,S.view.s*k));
  const after=V(wX(mx),wY(my));
  S.view.cx += before.x-after.x; S.view.cy += before.y-after.y;
  readout(); draw();
},{passive:false});
cv.addEventListener("dblclick",()=>{
  if(S.tool==="measurebetween"&&S.measureChain) finishMeasureChain();
  else if(S.tool==="pline"||S.tool==="spline") finishPline();
  else if(S.tool==="line"&&S.chain) finishChain();
  else if(S.tool==="select"){
    const hit=flowHitAt(cursorPoint());
    if(hit) flowAskLabel(hit);
  }
});

function readout(){
  const c=cursorPoint();
  document.getElementById("rx").textContent=c.x.toFixed(3);
  document.getElementById("ry").textContent=c.y.toFixed(3);
  const from=S.pending.length?S.pending[S.pending.length-1]:S.base;
  const ex=document.getElementById("rextra");
  if(from){
    const d=dist(from,c), a=wrap(ang(from,c));
    ex.innerHTML="L <b>"+d.toFixed(3)+"</b>&nbsp;&nbsp;A <b>"+deg(a).toFixed(2)+"&deg;</b>";
  } else ex.innerHTML="1:"+ (1/S.view.s).toFixed(3) + " &nbsp; grid "+gridPitch()+"mm";
}

/* ============================================================ zoom helpers */
function zoomExtents(){
  if(!S.ents.length){ S.view={cx:0,cy:0,s:2}; draw(); return; }
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18,any=false;
  for(const e of S.ents){
    const b=entBox(e);
    if(!b || !isFinite(b.x0) || !isFinite(b.y0) || !isFinite(b.x1) || !isFinite(b.y1)) continue;
    any=true;
    x0=Math.min(x0,b.x0);y0=Math.min(y0,b.y0);x1=Math.max(x1,b.x1);y1=Math.max(y1,b.y1);
  }
  /* One NaN coordinate used to make the scale NaN, and a NaN view cannot be
     recovered from by any user action. Refuse rather than corrupt. */
  if(!any){ S.view={cx:0,cy:0,s:2}; draw(); return; }
  const w=Math.max(x1-x0,1), h=Math.max(y1-y0,1);
  const sc=Math.min(W/w, H/h)*0.86;
  S.view.s = (isFinite(sc) && sc>1e-12) ? sc : 2;
  S.view.cx = isFinite((x0+x1)/2) ? (x0+x1)/2 : 0;
  S.view.cy = isFinite((y0+y1)/2) ? (y0+y1)/2 : 0;
  draw();
}

/* ============================================================ command line */
const cmdin=document.getElementById("cmdin");
cmdin.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  e.preventDefault();
  const raw=cmdin.value.trim(); cmdin.value="";
  if(S.ask){ const {cb}=S.ask; S.ask=null; cb(raw); setPrompt(); return; }
  if(!raw){
    if(S.tool==="measurebetween"&&S.measureChain) finishMeasureChain();
    else if(S.tool==="pline"||S.tool==="spline") finishPline();
    else if(S.tool==="line"&&S.chain) finishChain();
    return;
  }
  handleCommand(raw);
});
function parsePoint(str){
  const s=str.replace(/\s+/g,"");
  const last=S.pending.length?S.pending[S.pending.length-1]:S.base;
  let m;
  if((m=/^@?(-?[\d.]+)<(-?[\d.]+)$/.exec(s))){
    if(!last) return null;
    const d=parseFloat(m[1]), a=rad(parseFloat(m[2]));
    return V(last.x+d*Math.cos(a), last.y+d*Math.sin(a));
  }
  if((m=/^@(-?[\d.]+),(-?[\d.]+)$/.exec(s))){
    if(!last) return null;
    return V(last.x+parseFloat(m[1]), last.y+parseFloat(m[2]));
  }
  if((m=/^(-?[\d.]+),(-?[\d.]+)$/.exec(s))) return V(parseFloat(m[1]),parseFloat(m[2]));
  if((m=/^(-?[\d.]+)$/.exec(s))){
    if(!last) return null;
    const d=parseFloat(m[1]);
    const dir=norm(sub(applyOrtho(V(wX(S.mouse.sx),wY(S.mouse.sy)),last),last));
    if(!isFinite(dir.x)||(dir.x===0&&dir.y===0)) return null;
    return add(last,mul(dir,d));
  }
  return null;
}
const ALIAS={};
for(const [id,T] of Object.entries(TOOLS)){
  ALIAS[id]=id;
  ALIAS[id.toLowerCase()]=id;      // handleCommand lowercases, so pickLines needs picklines
  if(T.alias) ALIAS[T.alias.toLowerCase()]=id;
}
Object.assign(ALIAS,{li:"line",p:"pline",rec:"rect",ci:"circle",dli:"dim",txt:"text",
  mb:"measurebetween",ma:"measurealong",measure:"measurebetween",
  sel:"select",cha:"chamfer",mi:"mirror",ro:"rotate",
  sc:"scale",ar:"array",x:"explode",e:"erase"});
function handleCommand(raw){
  const s=raw.toLowerCase();
  /* Revit's snap overrides are only meaningful while a point is being asked
     for, which is also what keeps SC available to the Scale tool otherwise. */
  if(SNAP_CODE[s] && snapPickActive()){ snapSetOverride(SNAP_CODE[s]); return; }
  if(S.tool==="rotate" && S.pending.length===1 && /^-?[\d.]+$/.test(s)){
    const th=rad(parseFloat(s));
    snap();
    if(S.copyRotate) S.ents.push(...cloneEntitiesFreshGroups([...S.sel].map(i=>S.ents[i])).map(e=>rotEnt(e,S.pending[0],th)));
    else for(const i of S.sel) rotEnt(S.ents[i],S.pending[0],th);
    S.pending=[]; draw(); updateProps(); setPrompt();
    return echo((S.copyRotate?"Rotated a copy of ":"Rotated ")+S.sel.size+" object(s) by "+s+"\u00B0");
  }
  const p=parsePoint(raw);
  if(p && S.tool!=="select" && !TOOLS[S.tool].pick && !TOOLS[S.tool].markup && !TOOLS[S.tool].flow){ feed(p); readout(); return; }
  if(ALIAS[s]==="erase") return eraseSel();
  if(ALIAS[s]) return setTool(ALIAS[s]);
  for(const [id,A] of Object.entries(ACTIONS)){
    if(s===id.toLowerCase() || (A.alias&&s===A.alias.toLowerCase())){
      if(XACTIONS.has(id) && !S.experimental)
        return echo("Command unavailable","warn");
      return A.run();
    }
  }
  switch(s){
    case "erase": case "del": return eraseSel();
    case "weld": return toggle("weld");
    case "u": case "undo": return undo();
    case "redo": return redo();
    case "z": case "ze": case "zoom": return zoomExtents();
    case "ortho": return toggle("ortho");
    case "mobile": case "touch": return setMobileUI(!S.touchUI);
    case "desktop": return setMobileUI(false);
    case "ss": S.snapSuspend=!S.snapSuspend; S.snapOverride=null; snapCycleReset();
      paintOptbar(); draw(); return echo(S.snapSuspend?"Snaps suspended":"Snaps on");
    case "so": return snapSetOverride(null);
    case "sr": S.osnap=!S.osnap; syncToggles(); draw(); return echo("Object snap "+(S.osnap?"on":"off"));
    case "snaps": ribbonTab="View"; paintRibbon(); return echo("Snap settings are in View \u203A Snaps");
    case "experimental": case "labs": xSetExperimental(!S.experimental); return;
    case "restore": return offerRestore();
    case "clearautosave": return clearAutosave();
    case "grid": case "gridshow": case "showgrid": return toggle("gridShow");
    case "snap": case "gridsnap": return toggle("gridSnap");
    case "osnap": return toggle("osnap");
    case "all": S.sel=new Set(S.ents.map((_,i)=>i)); draw(); updateProps(); return echo(S.sel.size+" selected");
    case "img": case "image": return document.getElementById("imagein").click();
    case "imgshow": return toggleReferenceImage();
    case "imgdel": return removeReferenceImage();
    case "dxf": return exportDXF();
    case "svg": return exportSVG();
  }
  if(/^grid\s+[\d.]+$/.test(s)){ S.gridStep=parseFloat(s.split(/\s+/)[1])||10; draw(); return echo("Grid "+S.gridStep+"mm"); }
  if(/^layer\s+/.test(s)){
    const n=raw.slice(6).trim().toUpperCase();
    const i=S.layers.findIndex(l=>l.name.toUpperCase()===n);
    if(i<0) return echo("No layer "+n,"warn");
    S.cur=i; paintLayers(); return echo("Current layer "+S.layers[i].name);
  }
  echo("Unknown: "+raw,"warn");
}

/* ============================================================ toggles */
const TGID={ortho:"tg-ortho",gridShow:"tg-gridshow",gridSnap:"tg-snap",osnap:"tg-osnap",edgeAssist:"tg-edge",weld:"tg-weld"};
const TGNAME={ortho:"Ortho",gridShow:"Grid",gridSnap:"Grid snap",osnap:"Object snap",edgeAssist:"Reference edge assist",weld:"Weld",punch:"Punch mode",experimental:"Experimental Features"};
function toggle(k){
  S[k]=!S[k];
  syncToggles();
  echo(TGNAME[k]+" "+(S[k]?"on":"off"));
  draw();
}
document.getElementById("tg-ortho").onclick=()=>toggle("ortho");
document.getElementById("tg-gridshow").onclick=()=>toggle("gridShow");
document.getElementById("tg-snap").onclick =()=>toggle("gridSnap");
document.getElementById("tg-osnap").onclick=()=>toggle("osnap");
document.getElementById("tg-edge").onclick =()=>toggle("edgeAssist");
document.getElementById("tg-weld").onclick =()=>toggle("weld");

/* ============================================================ MARKUP

   Markup lives in S.ents so it inherits undo, selection, move/copy, layers
   and export, but it carries its own colour, width and opacity in e.mk and
   deliberately ignores osnap, grid snap and CAD line styles.

   Widths, text heights, arrow heads and cloud bumps are entered in screen
   pixels and stored in world units (px / view scale) at the moment of
   drawing, so a stroke keeps its weight relative to the plan when you zoom.

   Entity types:
     {t:"ink",    pts, closed, cloud, bump, mk}
     {t:"mshape", k:line|arrow|darrow|rect|ellipse|cloud, a, b, hl, bump, mk}

    svg:'<path d="M8.6 3.2l6.6 6.6-6.1 6.1-6.6-6.6z"/><path d="M6.4 5.4l7 7"/><path d="M17.6 13.6c0 1-.7 1.8-1.6 1.8s-1.6-.8-1.6-1.8 1.6-2.8 1.6-2.8 1.6 1.8 1.6 2.8z"/>'}
};

/* register with the command system so they behave like every other tool */
for(const [id,T] of Object.entries(MK_TOOLS)){
  TOOLS[id]={label:T.label, alias:T.alias, hot:T.hot, svg:T.svg, pts:0, markup:true};
  ALIAS[id.toLowerCase()]=id;
  if(T.alias) ALIAS[T.alias.toLowerCase()]=id;
}
Object.assign(ACTIONS,{
  mkselect:{label:"Select Markup", alias:"MSEL",
    svg:'<path d="M3 6.2V3h3.2M13.8 3H17v3.2M17 13.8V17h-3.2M6.2 17H3v-3.2"/><path d="M6 12.4l2.8-4.8 2 2.8 2.2-2.2"/>',
    run:()=>mkSelectAll()},
  mkshow:{label:"Show / Hide", alias:"MSHOW",
    svg:'<path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5z"/><circle cx="10" cy="10" r="2.2"/>',
    run:()=>mkToggleLayer()},
  mkclear:{label:"Clear Markup", alias:"MCLR",
    svg:'<rect x="5" y="6" width="10" height="11" rx="1"/><path d="M3.5 6h13M8 3.2h4M8.6 9v5M11.4 9v5"/>',
    run:()=>mkClearAll()}
});

/* ---- markup state ---------------------------------------------------- */
S.mk={
  col:"#ff3b30",
  fill:false,
  fillAlpha:0.18,
  textPx:15,
  textBox:true,
  headPx:15,
  cloudPx:14,
  smooth:true,
  per:{}
};
S.mkLast="mkpencil";
for(const [id,T] of Object.entries(MK_TOOLS))
  S.mk.per[id]={size:T.size||3, alpha:T.alpha==null?1:T.alpha};

let mkDraw=null;      // live stroke: {tool,kind,ent,...}

/* ---- helpers --------------------------------------------------------- */
function mkIsTool(t){ return !!MK_TOOLS[t]; }
function mkIsEnt(e){ return !!e && (e.t==="ink"||e.t==="mshape"||e.t==="mtext"); }
function mkPen(t){
  if(!S.mk.per[t]) S.mk.per[t]={size:3, alpha:1};
  return S.mk.per[t];
}
function mkEntName(e){
  if(e.t==="mtext") return e.lead? "CALLOUT" : "NOTE";
  if(e.t==="ink")   return e.cloud? "CLOUD REGION" : "FREEHAND";
  return String(e.k||"SHAPE").toUpperCase();
}
function markupLayer(){
  let i=S.layers.findIndex(l=>l.name.toUpperCase()==="MARKUP");
  if(i<0){ S.layers.push({name:"MARKUP", aci:1, on:true, lock:false}); i=S.layers.length-1; paintLayers(); }
  return i;
}
function mkNewStyle(t){
  const p=mkPen(t), T=MK_TOOLS[t]||{};
  return {
    col:S.mk.col,
    w:Math.max(1e-9, p.size/S.view.s),
    alpha:p.alpha,
    blend:T.blend||null,
    fill:S.mk.fill? S.mk.col : null,
    fillAlpha:S.mk.fillAlpha
  };
}
function mkClosed(e){
  if(e.t==="ink") return !!e.closed;
  if(e.t==="mshape") return e.k==="rect"||e.k==="ellipse"||e.k==="cloud";
  return false;
}
function mkRectPts(a,b){
  const x0=Math.min(a.x,b.x), x1=Math.max(a.x,b.x), y0=Math.min(a.y,b.y), y1=Math.max(a.y,b.y);
  return [V(x0,y0),V(x1,y0),V(x1,y1),V(x0,y1)];        // CCW in world, so "right of travel" is outside
}
function mkEllipsePts(a,b,n){
  n=n||72;
  const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2, rx=Math.abs(b.x-a.x)/2, ry=Math.abs(b.y-a.y)/2, out=[];
  for(let i=0;i<n;i++){ const th=i/n*TAU; out.push(V(cx+rx*Math.cos(th), cy+ry*Math.sin(th))); }
  return out;
}
function mkSignedArea(P){
  let s=0;
  for(let i=0;i<P.length;i++){ const a=P[i], b=P[(i+1)%P.length]; s+=a.x*b.y-b.x*a.y; }
  return s/2;
}
/* quadratic scallops along a path - the revision-cloud look */
function mkScallops(P, closed, r){
  const out=[], n=P.length;
  if(n<2 || !(r>0)) return out;
  const flip = (closed && mkSignedArea(P)<0) ? -1 : 1;
  const last = closed? n : n-1;
  for(let i=0;i<last;i++){
    const a=P[i], b=P[(i+1)%n], L=dist(a,b);
    if(L<1e-12) continue;
    const d=norm(sub(b,a)), nrm=mul(V(d.y,-d.x), flip);
    const k=Math.max(1, Math.round(L/(2*r)));
    for(let j=0;j<k;j++){
      const p0=add(a,mul(d,L*j/k)), p1=add(a,mul(d,L*(j+1)/k));
      const mid=mul(add(p0,p1),.5), bump=Math.min(r, L/k*0.8);
      out.push({c:add(mid,mul(nrm,bump*1.45)), p:p1});
    }
  }
  return out;
}
function mkBump(e){ return e.bump || (e.mk&&e.mk.w? e.mk.w*8 : px(10)); }
function mkTextBox(e){
  const lines=String(e.s==null?"":e.s).split("\n");
  ctx.save(); ctx.font="100px "+getCSS("--draft");
  let wm=0; for(const l of lines) wm=Math.max(wm, ctx.measureText(l||" ").width);
  ctx.restore();
  const w=wm/100*e.h, lh=e.h*1.34, pad=e.h*0.45;
  const top=e.p.y+e.h*0.92, bot=e.p.y-(lines.length-1)*lh-e.h*0.30;
  return {lines, lh, w, pad, x0:e.p.x-pad, x1:e.p.x+w+pad, y0:bot-pad*0.5, y1:top+pad*0.5};
}
function mkOutline(e){
  if(e.t==="ink") return e.pts;
  if(e.t==="mshape"){
    if(e.k==="rect"||e.k==="cloud") return mkRectPts(e.a,e.b);
    if(e.k==="ellipse") return mkEllipsePts(e.a,e.b,48);
    return [e.a,e.b];
  }
  if(e.t==="mtext"){
    const B=mkTextBox(e);
    const P=[V(B.x0,B.y0),V(B.x1,B.y0),V(B.x1,B.y1),V(B.x0,B.y1)];
    if(e.lead) P.push(e.lead);
    return P;
  }
  return [];
}
function mkPointInPoly(p,P){
  let inside=false;
  for(let i=0,j=P.length-1;i<P.length;j=i++){
    const a=P[i], b=P[j];
    if((a.y>p.y)!==(b.y>p.y) && p.x < (b.x-a.x)*(p.y-a.y)/((b.y-a.y)||1e-12)+a.x) inside=!inside;
  }
  return inside;
}
function mkHitEnt(e,p,tol){
  const w=(e.mk&&e.mk.w)||0, t=Math.max(tol, w/2);
  if(e.t==="mtext"){
    const B=mkTextBox(e);
    if(p.x>=B.x0-tol&&p.x<=B.x1+tol&&p.y>=B.y0-tol&&p.y<=B.y1+tol) return true;
    if(e.lead && ptSegDist(p, e.lead, V((B.x0+B.x1)/2,(B.y0+B.y1)/2))<=t) return true;
    return false;
  }
  const P=mkOutline(e);
  if(P.length<2) return false;
  const closed=mkClosed(e);
  const pad = (e.cloud||(e.t==="mshape"&&e.k==="cloud")) ? mkBump(e) : 0;
  if(closed && e.mk && e.mk.fill && mkPointInPoly(p,P)) return true;
  const last = closed ? P.length : P.length-1;
  for(let i=0;i<last;i++){
    if(ptSegDist(p, P[i], P[(i+1)%P.length]) <= t+pad) return true;
  }
  return false;
}

/* ---- painting -------------------------------------------------------- */
function mkRoundRect(x,y,w,h,r){
  if(ctx.roundRect){ ctx.roundRect(x,y,w,h,r); return; }
  r=Math.min(r,w/2,h/2);
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
}
function mkTracePath(e){
  const s=S.view.s;
  if(e.t==="ink"){
    const P=e.pts; if(!P.length) return;
    ctx.moveTo(X(P[0].x),Y(P[0].y));
    if(e.cloud){
      for(const q of mkScallops(P,!!e.closed,mkBump(e)))
        ctx.quadraticCurveTo(X(q.c.x),Y(q.c.y),X(q.p.x),Y(q.p.y));
    } else {
      for(let i=1;i<P.length;i++) ctx.lineTo(X(P[i].x),Y(P[i].y));
    }
    if(e.closed) ctx.closePath();
    return;
  }
  if(e.t!=="mshape") return;
  if(e.k==="line"||e.k==="arrow"||e.k==="darrow"){
    ctx.moveTo(X(e.a.x),Y(e.a.y)); ctx.lineTo(X(e.b.x),Y(e.b.y)); return;
  }
  if(e.k==="rect"){
    const P=mkRectPts(e.a,e.b);
    ctx.moveTo(X(P[0].x),Y(P[0].y));
    for(let i=1;i<4;i++) ctx.lineTo(X(P[i].x),Y(P[i].y));
    ctx.closePath(); return;
  }
  if(e.k==="ellipse"){
    const cx=(e.a.x+e.b.x)/2, cy=(e.a.y+e.b.y)/2;
    ctx.ellipse(X(cx),Y(cy),
      Math.max(.4,Math.abs(e.b.x-e.a.x)/2*s), Math.max(.4,Math.abs(e.b.y-e.a.y)/2*s), 0, 0, TAU);
    return;
  }
  if(e.k==="cloud"){
    const P=mkRectPts(e.a,e.b);
    ctx.moveTo(X(P[0].x),Y(P[0].y));
    for(const q of mkScallops(P,true,mkBump(e)))
      ctx.quadraticCurveTo(X(q.c.x),Y(q.c.y),X(q.p.x),Y(q.p.y));
    ctx.closePath(); return;
  }
}
function mkHead(tip, from, e){
  const w=Math.max(1,((e.mk&&e.mk.w)||0)*S.view.s);
  const hl=Math.max((e.hl||0)*S.view.s, w*3.2, 6);
  const tx=X(tip.x), ty=Y(tip.y);
  let dx=tx-X(from.x), dy=ty-Y(from.y);
  const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
  const bx=tx-dx*hl, by=ty-dy*hl, o=hl*0.42;
  ctx.beginPath();
  ctx.moveTo(tx,ty);
  ctx.lineTo(bx-dy*o, by+dx*o);
  ctx.lineTo(bx+dy*o, by-dx*o);
  ctx.closePath();
  ctx.fillStyle=(e.mk&&e.mk.col)||"#ff3b30";
  ctx.fill();
}
function mkPaintText(e){
  const B=mkTextBox(e), s=S.view.s, m=e.mk||{};
  if(e.lead){
    const cx=(B.x0+B.x1)/2, cy=(B.y0+B.y1)/2;
    ctx.beginPath(); ctx.moveTo(X(cx),Y(cy)); ctx.lineTo(X(e.lead.x),Y(e.lead.y)); ctx.stroke();
    mkHead(e.lead, V(cx,cy), e);
  }
  const x=X(B.x0), y=Y(B.y1), w=(B.x1-B.x0)*s, h=(B.y1-B.y0)*s;
  if(e.box!==false && w>1 && h>1){
    const r=Math.min(7,h/3);
    ctx.save();
    ctx.globalAlpha=(m.alpha==null?1:m.alpha)*0.86;
    ctx.fillStyle=e.boxCol||"rgba(16,19,24,.84)";
    ctx.beginPath(); mkRoundRect(x,y,w,h,r); ctx.fill();
    ctx.restore();
    ctx.beginPath(); mkRoundRect(x,y,w,h,r); ctx.stroke();
  }
  ctx.fillStyle=m.col||"#ff3b30";
  ctx.textBaseline="alphabetic";
  ctx.textAlign="left";
  ctx.font=Math.max(7,e.h*s)+"px "+getCSS("--draft");
  B.lines.forEach((ln,i)=>{ ctx.fillText(ln, X(e.p.x), Y(e.p.y - i*B.lh)); });
}
function mkPaintEnt(e){
  const m=e.mk||{};
  ctx.save();
  ctx.globalAlpha=m.alpha==null?1:m.alpha;
  if(m.blend) ctx.globalCompositeOperation=m.blend;
  ctx.lineCap="round"; ctx.lineJoin="round"; ctx.setLineDash([]);
  ctx.strokeStyle=m.col||"#ff3b30";
  ctx.lineWidth=Math.max(1,(m.w||0)*S.view.s);
  if(e.t==="mtext"){ mkPaintText(e); ctx.restore(); return; }
  ctx.beginPath();
  mkTracePath(e);
  if(m.fill && mkClosed(e)){
    ctx.save();
    ctx.globalAlpha=(m.alpha==null?1:m.alpha)*(m.fillAlpha==null?.18:m.fillAlpha);
    ctx.fillStyle=m.fill; ctx.fill();
    ctx.restore();
  }
  ctx.stroke();
  if(e.t==="mshape"&&(e.k==="arrow"||e.k==="darrow")){
    mkHead(e.b,e.a,e);
    if(e.k==="darrow") mkHead(e.a,e.b,e);
  }
  ctx.restore();
}
function mkPaintSelection(e){
  const b=entBox(e), pad=px(3);
  if(!isFinite(b.x0)) return;
  ctx.save();
  ctx.strokeStyle=getCSS("--pen"); ctx.lineWidth=1; ctx.setLineDash([5,3]);
  ctx.strokeRect(X(b.x0-pad), Y(b.y1+pad), (b.x1-b.x0+2*pad)*S.view.s, (b.y1-b.y0+2*pad)*S.view.s);
  ctx.restore();
}
function mkPaintLive(){
  if(mkIsTool(S.tool) && MK_TOOLS[S.tool].kind==="erase"){
    const r=Math.max(4, mkPen(S.tool).size/2);
    ctx.save();
    ctx.setLineDash([3,3]); ctx.lineWidth=1; ctx.strokeStyle=getCSS("--alert");
    ctx.beginPath(); ctx.arc(S.mouse.sx,S.mouse.sy,r,0,TAU); ctx.stroke();
    ctx.restore();
  }
  if(mkDraw && mkDraw.ent) mkPaintEnt(mkDraw.ent);
  if(mkDraw && mkDraw.kind==="callout" && mkDraw.moved){
    ctx.save();
    ctx.setLineDash([4,3]); ctx.lineWidth=1; ctx.strokeStyle=S.mk.col;
    ctx.beginPath(); ctx.moveTo(X(mkDraw.a.x),Y(mkDraw.a.y)); ctx.lineTo(X(mkDraw.b.x),Y(mkDraw.b.y)); ctx.stroke();
    ctx.restore();
  }
}

/* ---- input ----------------------------------------------------------- */
function mkRaw(){ return V(wX(S.mouse.sx), wY(S.mouse.sy)); }
function mkConstrain(a,p,shift,kind){
  if(!(shift||S.ortho)) return p;
  if(kind==="rect"||kind==="ellipse"||kind==="cloud"){
    const dx=p.x-a.x, dy=p.y-a.y, m=Math.max(Math.abs(dx),Math.abs(dy));
    return V(a.x+(dx<0?-m:m), a.y+(dy<0?-m:m));
  }
  const d=sub(p,a), L=len(d);
  if(L<1e-9) return p;
  const step=Math.PI/4, th=Math.round(Math.atan2(d.y,d.x)/step)*step;
  return V(a.x+L*Math.cos(th), a.y+L*Math.sin(th));
}
function mkPointerDown(e){
  const T=MK_TOOLS[S.tool], p=mkRaw();
  if(T.kind==="pick"||T.kind==="apply"||T.kind==="text"||T.kind==="callout"){
    mkDraw={tool:S.tool, kind:T.kind, a:p, b:p, moved:false};
    return;
  }
  if(T.kind==="erase"){
    mkDraw={tool:S.tool, kind:"erase", doomed:new Set()};
    mkEraseAt(p); draw(); return;
  }
  S.mkLast=S.tool;
  if(T.kind==="ink"){
    const ent={t:"ink", li:markupLayer(), pts:[p], closed:!!T.closed, cloud:!!T.cloud, mk:mkNewStyle(S.tool)};
    if(T.cloud) ent.bump=S.mk.cloudPx/S.view.s;
    mkDraw={tool:S.tool, kind:"ink", ent};
    draw(); return;
  }
  const ent={t:"mshape", k:T.shape, li:markupLayer(), a:p, b:p, mk:mkNewStyle(S.tool)};
  if(T.shape==="arrow"||T.shape==="darrow") ent.hl=S.mk.headPx/S.view.s;
  if(T.shape==="cloud") ent.bump=S.mk.cloudPx/S.view.s;
  mkDraw={tool:S.tool, kind:"shape", ent};
  draw();
}
function mkPointerMove(e){
  const p=mkRaw();
  if(mkDraw.kind==="ink"){
    const P=mkDraw.ent.pts, last=P[P.length-1];
    if(dist(last,p)*S.view.s > 1.6) P.push(p);
  } else if(mkDraw.kind==="shape"){
    mkDraw.ent.b=mkConstrain(mkDraw.ent.a, p, e.shiftKey||S.stickyShift, mkDraw.ent.k);
  } else if(mkDraw.kind==="erase"){
    mkEraseAt(p);
  } else {
    mkDraw.b=p;
    if(dist(mkDraw.a,p)*S.view.s>5) mkDraw.moved=true;
  }
  readout(); draw();
}
function mkPointerUp(e){
  const D=mkDraw; mkDraw=null;
  if(!D){ draw(); return; }
  if(D.kind==="erase"){
    if(D.doomed.size){
      snap();
      const kill=D.doomed, n=kill.size;
      S.ents=S.ents.filter((_,i)=>!kill.has(i));
      S.sel.clear(); resetNudge();
      echo("Erased "+n+" markup object"+(n>1?"s":""));
    }
    draw(); updateProps(); return;
  }
  if(D.kind==="pick")  return mkPickStyle(D.a);
  if(D.kind==="apply") return mkApplyStyle(D.a);
  if(D.kind==="text"||D.kind==="callout") return mkPlaceText(D);
  if(D.kind==="ink"){
    let P=D.ent.pts;
    if(P.length<2){ draw(); return; }
    if(S.mk.smooth) P=mkSmooth(P);
    D.ent.pts=P;
    snap(); S.ents.push(D.ent);
    echo(MK_TOOLS[D.tool].label+"  "+P.length+" points");
    draw(); updateProps(); return;
  }
  if(D.kind==="shape"){
    if(dist(D.ent.a,D.ent.b)*S.view.s < 3){ draw(); return; }
    snap(); S.ents.push(D.ent);
    echo(MK_TOOLS[D.tool].label+" added");
    draw(); updateProps(); return;
  }
  draw();
}
function mkEraseAt(p){
  const r=Math.max(px(2), mkPen(S.tool).size/2/S.view.s);
  S.ents.forEach((e,i)=>{
    if(mkDraw.doomed.has(i) || !mkIsEnt(e)) return;
    const L=S.layers[e.li];
    if(L && (!L.on || L.lock)) return;
    if(mkHitEnt(e,p,r)) mkDraw.doomed.add(i);
  });
}
function mkHitMarkup(p){
  const tol=px(tolPx(8));
  for(let i=S.ents.length-1;i>=0;i--){
    const e=S.ents[i];
    if(!mkIsEnt(e)) continue;
    const L=S.layers[e.li];
    if(L && (!L.on || L.lock)) continue;
    if(mkHitEnt(e,p,tol)) return i;
  }
  return -1;
}
function mkPlaceText(D){
  const T=MK_TOOLS[D.tool];
  const isCall = T.kind==="callout" && D.moved;
  const anchor = isCall ? D.b : D.a;
  const lead   = isCall ? D.a : null;
  const h=S.mk.textPx/S.view.s;
  requestString(isCall?"Callout text":"Note text", "", s=>{
    if(s && s.trim()){
      snap();
      S.ents.push({t:"mtext", li:markupLayer(), p:anchor, s:s.replace(/\\n/g,"\n"),
        h, lead, box:S.mk.textBox, hl:S.mk.headPx/S.view.s, mk:mkNewStyle(D.tool)});
      echo("Note added");
    }
    setPrompt(); draw(); updateProps();
  });
}
function mkPickStyle(p){
  const i=mkHitMarkup(p);
  if(i<0) return echo("No markup under the cursor","warn");
  const m=S.ents[i].mk||{};
  S.mk.col=m.col||S.mk.col;
  S.mk.fill=!!m.fill;
  const target=S.mkLast||"mkpencil";
  S.mk.per[target]={size:Math.max(.5,(m.w||0)*S.view.s), alpha:m.alpha==null?1:m.alpha};
  paintOptbar(); paintRibbon();
  echo("Picked "+S.mk.col+"  "+fmt((m.w||0)*S.view.s)+"px");
}
function mkApplyStyle(p){
  const i=mkHitMarkup(p);
  if(i<0) return echo("No markup under the cursor","warn");
  snap();
  const base=mkNewStyle(S.mkLast||"mkpencil"), e=S.ents[i];
  e.mk=Object.assign({}, e.mk, {col:base.col, w:base.w, alpha:base.alpha, fill:base.fill, fillAlpha:base.fillAlpha});
  draw(); updateProps(); echo("Style applied to "+mkEntName(e).toLowerCase());
}
function mkRestyleSelection(){
  let n=0;
  for(const i of S.sel){
    const e=S.ents[i];
    if(!mkIsEnt(e)) continue;
    e.mk.col=S.mk.col;
    e.mk.fill=S.mk.fill? S.mk.col : null;
    n++;
  }
  if(n){ draw(); echo("Recoloured "+n+" markup object"+(n>1?"s":"")); }
  return n;
}
function mkSmooth(P){
  let Q=P;
  if(Q.length>3){
    const out=[Q[0]];
    for(let i=0;i<Q.length-1;i++){
      const a=Q[i], b=Q[i+1];
      out.push(V(a.x*.75+b.x*.25, a.y*.75+b.y*.25));
      out.push(V(a.x*.25+b.x*.75, a.y*.25+b.y*.75));
    }
    out.push(Q[Q.length-1]);
    Q=out;
  }
  return mkRDP(Q, px(0.6));
}
function mkRDP(P,eps){
  if(P.length<3) return P;
  let idx=0, dmax=0;
  for(let i=1;i<P.length-1;i++){
    const d=ptSegDist(P[i],P[0],P[P.length-1]);
    if(d>dmax){ dmax=d; idx=i; }
  }
  if(dmax<=eps) return [P[0],P[P.length-1]];
  return mkRDP(P.slice(0,idx+1),eps).slice(0,-1).concat(mkRDP(P.slice(idx),eps));
}

/* ---- export ---------------------------------------------------------- */
function mkACI(hex){
  const h=String(hex||"").replace("#","");
  if(h.length<6) return 1;
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  let best=1, bd=1e18;
  for(const a of ACI){
    const c=a.c.replace("#","");
    const dr=r-parseInt(c.slice(0,2),16), dg=g-parseInt(c.slice(2,4),16), db=b-parseInt(c.slice(4,6),16);
    const d=dr*dr+dg*dg+db*db;
    if(d<bd){ bd=d; best=a.i; }
  }
  return best;
}
function mkSampleScallops(P,closed,r){
  const segs=mkScallops(P,closed,r);
  if(!segs.length) return P.slice();
  const out=[P[0]];
  let prev=P[0];
  for(const q of segs){
    for(let t=1;t<=6;t++){
      const u=t/6, iu=1-u;
      out.push(V(iu*iu*prev.x+2*iu*u*q.c.x+u*u*q.p.x,
                 iu*iu*prev.y+2*iu*u*q.c.y+u*u*q.p.y));
    }
    prev=q.p;
  }
  return out;
}
function mkFlatPts(e){
  if(e.t==="ink"){
    const P=e.cloud? mkSampleScallops(e.pts,!!e.closed,mkBump(e)) : e.pts.slice();
    if(e.closed && P.length>2) P.push(P[0]);
    return P;
  }
  if(e.t==="mshape"){
    if(e.k==="cloud"){ const P=mkSampleScallops(mkRectPts(e.a,e.b),true,mkBump(e)); P.push(P[0]); return P; }
    if(e.k==="rect"){ const P=mkRectPts(e.a,e.b); P.push(P[0]); return P; }
    if(e.k==="ellipse"){ const P=mkEllipsePts(e.a,e.b,64); P.push(P[0]); return P; }
    return [e.a,e.b];
  }
  return [];
}
function mkHeadPts(tip,from,e){
  const hl=Math.max(e.hl||0, (e.mk.w||0)*3.2);
  const d=norm(sub(tip,from));
  if(!isFinite(d.x)) return [];
  const n=perp(d), base=sub(tip,mul(d,hl)), o=hl*0.42;
  return [tip, add(base,mul(n,o)), sub(base,mul(n,o)), tip];
}
function mkSVG(e){
  const out=[], m=e.mk||{}, col=okColor(m.col,"#ff3b30");
  const op=(m.alpha==null?1:m.alpha).toFixed(3);
  const w=(m.w||0).toFixed(4);
  const P=p=>`${p.x} ${-p.y}`;
  if(e.t==="mtext"){
    const B=mkTextBox(e);
    if(e.lead){
      const cx=(B.x0+B.x1)/2, cy=(B.y0+B.y1)/2;
      out.push(`<line x1="${cx}" y1="${-cy}" x2="${e.lead.x}" y2="${-e.lead.y}" stroke="${col}" stroke-width="${w}" opacity="${op}"/>`);
      const H=mkHeadPts(e.lead,V(cx,cy),e);
      if(H.length) out.push(`<path d="M ${H.map(P).join(" L ")} Z" fill="${col}" stroke="none" opacity="${op}"/>`);
    }
    if(e.box!==false)
      out.push(`<rect x="${B.x0}" y="${-B.y1}" width="${B.x1-B.x0}" height="${B.y1-B.y0}" rx="${e.h*0.35}" fill="#ffffff" fill-opacity="0.86" stroke="${col}" stroke-width="${w}" opacity="${op}"/>`);
    B.lines.forEach((ln,i)=>{
      const y=-(e.p.y - i*B.lh);
      out.push(`<text x="${e.p.x}" y="${y}" font-size="${e.h}" font-family="Arial, sans-serif" fill="${col}" stroke="none" opacity="${op}">${xmlText(ln)}</text>`);
    });
    return out;
  }
  const pts=mkFlatPts(e);
  if(pts.length>1){
    const fill = (m.fill && mkClosed(e)) ? `fill="${okColor(m.fill,"none")}" fill-opacity="${(m.fillAlpha==null?.18:m.fillAlpha).toFixed(3)}"` : `fill="none"`;
    out.push(`<path d="M ${pts.map(P).join(" L ")}" ${fill} stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`);
  }
  if(e.t==="mshape"&&(e.k==="arrow"||e.k==="darrow")){
    for(const [tip,from] of (e.k==="darrow"?[[e.b,e.a],[e.a,e.b]]:[[e.b,e.a]])){
      const H=mkHeadPts(tip,from,e);
      if(H.length) out.push(`<path d="M ${H.map(P).join(" L ")} Z" fill="${col}" stroke="none" opacity="${op}"/>`);
    }
  }
  return out;
}
function mkDXF(e,ly,g,line,text){
  const aci=mkACI(e.mk&&e.mk.col);
  const poly=pts=>{
    if(pts.length<2) return;
    g(0,"POLYLINE"); g(8,ly); g(62,aci); g(66,1); g(10,0.0); g(20,0.0); g(30,0.0); g(70,0);
    for(const p of pts){ g(0,"VERTEX"); g(8,ly); g(62,aci); g(10,p.x); g(20,p.y); g(30,0.0); }
    g(0,"SEQEND"); g(8,ly);
  };
  if(e.t==="mtext"){
    const B=mkTextBox(e);
    B.lines.forEach((ln,i)=>{
      g(0,"TEXT"); g(8,ly); g(62,aci);
      g(10,e.p.x); g(20,e.p.y - i*B.lh); g(30,0.0); g(40,e.h); g(1,dxfStr(ln));
    });
    if(e.box!==false) poly([V(B.x0,B.y0),V(B.x1,B.y0),V(B.x1,B.y1),V(B.x0,B.y1),V(B.x0,B.y0)]);
    if(e.lead){
      const c=V((B.x0+B.x1)/2,(B.y0+B.y1)/2);
      poly([c,e.lead]);
      poly(mkHeadPts(e.lead,c,e));
    }
    return;
  }
  poly(mkFlatPts(e));
  if(e.t==="mshape"&&(e.k==="arrow"||e.k==="darrow")){
    poly(mkHeadPts(e.b,e.a,e));
    if(e.k==="darrow") poly(mkHeadPts(e.a,e.b,e));
  }
}

/* ============================================================ FLOW
   Relational diagramming: nodes that carry a label, and connectors that BIND
   to those nodes by id rather than by coordinate. Move a node and every edge
   touching it re-routes, which is the whole point of the tab - it is a
   relationship tool, not boxes-and-lines you redraw by hand.

   Deliberately platform agnostic. No vendor shapes, no compliance vocabulary:
   a process is a process wherever the workflow eventually gets implemented.

   Entities:
     {t:"node", k:proc|dec|term|data|note, id, p(centre), w, h, s, fs, mk}
     {t:"edge", from:{id}|{pt}, to:{id}|{pt}, route:"ortho"|"straight",
                a0, a1, s(label), fs, hl, mk}
   mk(node) = {fill, line, text, w}      mk(edge) = {col, w}
   Sizes are entered in screen px and stored in world units, same rule as
   markup, so a diagram keeps its proportions when you zoom.                */

S.flow={
  fill:"#f4f7fb", line:"#2d6fa8", text:"#16202b",
  edgeCol:"#8fb6d8", edgeW:2, strokeW:2,

  headPx:13, askNode:true, askEdge:false,
  seq:1
};
let flowDraw=null;     // live node drag / edge drag
let flowResize=null;   // corner-drag resize under the Select tool

/* ---- helpers --------------------------------------------------------- */
function flowIsTool(t){ return !!FLOW_TOOLS[t]; }
function flowIsEnt(e){ return !!e && (e.t==="node"||e.t==="edge"); }
function flowNewId(){
  let id;
  do { id="N"+(S.flow.seq++); } while(S.ents.some(e=>e.t==="node"&&e.id===id));
  return id;
}
/* Every connector resolved its ends by scanning the whole entity list, once
   per end, once per frame. On a large diagram that is quadratic and a crafted
   file could turn it into a hang. Indexed, invalidated when the list changes. */
let _nodeIdx=null, _nodeIdxSrc=null, _nodeIdxLen=-1;
function flowInvalidateIndex(){ _nodeIdx=null; _nodeIdxSrc=null; _nodeIdxLen=-1; }
function flowNodeIndex(){
  if(_nodeIdx && _nodeIdxSrc===S.ents && _nodeIdxLen===S.ents.length) return _nodeIdx;
  const m=new Map();
  for(const e of S.ents) if(e && e.t==="node") m.set(e.id,e);
  _nodeIdx=m; _nodeIdxSrc=S.ents; _nodeIdxLen=S.ents.length;
  return m;
}
function flowFindNode(id){
  if(id==null) return null;
  return flowNodeIndex().get(id)||null;
}
function flowNodeAt(p){
  for(let i=S.ents.length-1;i>=0;i--){
    const e=S.ents[i];
    if(e.t!=="node") continue;
    const L=S.layers[e.li];
    if(L && (!L.on || L.lock)) continue;
    if(mkPointInPoly(p, flowNodePoly(e))) return e;
  }
  return null;
}
function flowEntName(e){
  if(e.t==="edge") return "CONNECTOR";
  if(e.k==="lane") return "SWIMLANE";
  return ({proc:"PROCESS", dec:"DECISION", term:"START / END", data:"DATA", note:"NOTE"}[e.k]||"NODE");
}
function flowLayer(){
  let i=S.layers.findIndex(l=>l.name.toUpperCase()==="FLOW");
  if(i<0){ S.layers.push({name:"FLOW", aci:5, on:true, lock:false}); i=S.layers.length-1; paintLayers(); }
  return i;
}
function flowNodePoly(e){
  const x0=e.p.x-e.w/2, x1=e.p.x+e.w/2, y0=e.p.y-e.h/2, y1=e.p.y+e.h/2;
  if(e.k==="dec")  return [V(e.p.x,y1),V(x1,e.p.y),V(e.p.x,y0),V(x0,e.p.y)];
  if(e.k==="data"){
    const sk=Math.min(e.w*0.18, e.h*0.55);
    return [V(x0+sk,y1),V(x1,y1),V(x1-sk,y0),V(x0,y0)];
  }
  return [V(x0,y0),V(x1,y0),V(x1,y1),V(x0,y1)];
}
/* where a ray leaving the node centre crosses its outline - this is what
   keeps a connector touching the shape instead of burying itself in it */
function flowRayExit(n,dir){
  const d=norm(dir);
  if(!isFinite(d.x)||(d.x===0&&d.y===0)) return n.p;
  const P=flowNodePoly(n);
  const far=add(n.p, mul(d, (Math.abs(n.w)+Math.abs(n.h))*2+1));
  let best=null, bt=1e18;
  for(let i=0;i<P.length;i++){
    const r=lineLineInt(n.p, far, P[i], P[(i+1)%P.length]);
    if(!r) continue;
    if(r.t>=-1e-9 && r.u>=-1e-9 && r.u<=1+1e-9 && r.t<bt){ bt=r.t; best=r.p; }
  }
  return best||n.p;
}
function flowEnd(end){
  if(end && end.id!=null){ const n=flowFindNode(end.id); if(n) return {node:n, c:n.p}; return null; }
  if(end && end.pt) return {pt:end.pt, c:end.pt};
  return null;
}
function flowRoute(e){
  if(!e) return null;
  if(e.wp && e.wp.length){
    const chain=edgeChain(e);
    if(chain) return e.route==="ortho" ? edgeElbows(chain) : chain;
  }
  const A=flowEnd(e.from), B=flowEnd(e.to);
  if(!A||!B) return null;
  const ca=A.c, cb=B.c;
  if(dist(ca,cb)<1e-9) return null;
  if(e.route!=="ortho"){
    const pa=A.node? flowRayExit(A.node, sub(cb,ca)) : ca;
    const pb=B.node? flowRayExit(B.node, sub(ca,cb)) : cb;
    return [pa,pb];
  }
  if(Math.abs(cb.x-ca.x) >= Math.abs(cb.y-ca.y)){
    const sg = cb.x>=ca.x ? 1 : -1;
    const pa=A.node? flowRayExit(A.node,V(sg,0)) : ca;
    const pb=B.node? flowRayExit(B.node,V(-sg,0)) : cb;
    if(Math.abs(pa.y-pb.y)<1e-9) return [pa,pb];
    const mx=(pa.x+pb.x)/2;
    return [pa, V(mx,pa.y), V(mx,pb.y), pb];
  }
  const sg = cb.y>=ca.y ? 1 : -1;
  const pa=A.node? flowRayExit(A.node,V(0,sg)) : ca;
  const pb=B.node? flowRayExit(B.node,V(0,-sg)) : cb;
  if(Math.abs(pa.x-pb.x)<1e-9) return [pa,pb];
  const my=(pa.y+pb.y)/2;
  return [pa, V(pa.x,my), V(pb.x,my), pb];
}
function flowRouteMid(R){
  let total=0;
  for(let i=0;i<R.length-1;i++) total+=dist(R[i],R[i+1]);
  let want=total/2;
  for(let i=0;i<R.length-1;i++){
    const L=dist(R[i],R[i+1]);
    if(want<=L || i===R.length-2){
      const t=L<1e-12?0:want/L;
      return add(R[i], mul(sub(R[i+1],R[i]), Math.max(0,Math.min(1,t))));
    }
    want-=L;
  }
  return R[0];
}
function flowTextW(str, fs){
  ctx.save(); ctx.font="100px "+getCSS("--draft");
  const w=ctx.measureText(String(str==null?"":str)).width/100*fs;
  ctx.restore();
  return w;
}
function flowLines(e){
  const s=String(e.s==null?"":e.s);
  if(!s) return [];
  const usable=Math.max(e.fs, e.w*(e.k==="dec"?0.62:1) - e.fs*1.3);
  const out=[];
  for(const para of s.split("\n")){
    const words=para.split(/\s+/).filter(Boolean);
    if(!words.length){ out.push(""); continue; }
    let line=words[0];
    for(let i=1;i<words.length;i++){
      const t=line+" "+words[i];
      if(flowTextW(t,e.fs)<=usable) line=t; else { out.push(line); line=words[i]; }
    }
    out.push(line);
  }
  return out;
}
/* grow a node so its label fits - never shrinks, that is what Shrink To Text is for */
function flowFit(e){
  const L=flowLines(e);
  if(!L.length) return;
  const widest=Math.max(...L.map(l=>flowTextW(l,e.fs)));
  const padW=e.fs*1.3, padH=e.fs*1.1;
  const needW=(widest+padW) / (e.k==="dec"?0.62:1);
  if(needW>e.w) e.w=needW;
  const needH=(L.length*e.fs*1.32+padH) * (e.k==="dec"?1.8:1);
  if(needH>e.h) e.h=needH;
}
function flowFitTight(e){
  const L=flowLines(e);
  const fs=e.fs;
  if(!L.length){ e.w=Math.max(fs*4, S.flow.w/S.view.s*0.5); e.h=Math.max(fs*2.6, e.fs*3); return; }
  const widest=Math.max(...L.map(l=>flowTextW(l,fs)));
  e.w=(widest+fs*1.6)/(e.k==="dec"?0.62:1);
  e.h=(L.length*fs*1.32+fs*1.2)*(e.k==="dec"?1.8:1);
}

/* ---- painting -------------------------------------------------------- */
function flowPaintNode(e,selected,hot){
  const s=S.view.s, m=e.mk||{};
  const x=X(e.p.x-e.w/2), y=Y(e.p.y+e.h/2), w=e.w*s, h=e.h*s;
  ctx.save();
  ctx.lineJoin="round"; ctx.lineCap="round"; ctx.setLineDash([]);
  ctx.lineWidth=Math.max(1,(m.w||0)*s);
  ctx.strokeStyle= hot? getCSS("--snap") : (m.line||"#2d6fa8");
  ctx.fillStyle= m.fill||"#f4f7fb";
  ctx.beginPath();
  if(e.k==="term")      mkRoundRect(x,y,w,h,Math.min(h/2,w/2));
  else if(e.k==="proc") mkRoundRect(x,y,w,h,Math.min(7,h/4,w/4));
  else if(e.k==="note"){
    const f=Math.min(w,h)*0.26;
    ctx.moveTo(x,y); ctx.lineTo(x+w-f,y); ctx.lineTo(x+w,y+f);
    ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath();
  } else {
    const P=flowNodePoly(e);
    P.forEach((p,i)=> i? ctx.lineTo(X(p.x),Y(p.y)) : ctx.moveTo(X(p.x),Y(p.y)));
    ctx.closePath();
  }
  ctx.fill(); ctx.stroke();
  if(e.k==="note"){
    const f=Math.min(w,h)*0.26;
    ctx.beginPath();
    ctx.moveTo(x+w-f,y); ctx.lineTo(x+w-f,y+f); ctx.lineTo(x+w,y+f);
    ctx.stroke();
  }
  const L=flowLines(e);
  if(L.length){
    const lh=e.fs*1.32*s, cx=X(e.p.x), cy=Y(e.p.y);
    ctx.fillStyle=m.text||"#16202b";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font=Math.max(6,e.fs*s)+"px "+getCSS("--draft");
    L.forEach((ln,i)=> ctx.fillText(ln, cx, cy + (i-(L.length-1)/2)*lh));
  }
  ctx.restore();
}
function flowPaintEdge(e,selected,hot){
  const R=flowRoute(e);
  if(!R) return;
  const s=S.view.s, m=e.mk||{};
  ctx.save();
  ctx.lineJoin="round"; ctx.lineCap="round"; ctx.setLineDash([]);
  ctx.lineWidth=Math.max(1,(m.w||0)*s);
  ctx.strokeStyle= hot? getCSS("--snap") : (m.col||"#8fb6d8");
  ctx.beginPath();
  R.forEach((p,i)=> i? ctx.lineTo(X(p.x),Y(p.y)) : ctx.moveTo(X(p.x),Y(p.y)));
  ctx.stroke();
  if(e.a1!==false) mkHead(R[R.length-1], R[R.length-2], e);
  if(e.a0)         mkHead(R[0], R[1], e);
  if(e.s){
    const mid=flowRouteMid(R), fs=e.fs||S.flow.fontPx/s;
    const tw=flowTextW(e.s,fs), pad=fs*0.42;
    ctx.fillStyle=getCSS("--panel-2");
    ctx.globalAlpha=.92;
    ctx.beginPath();
    mkRoundRect(X(mid.x)-(tw/2+pad)*s, Y(mid.y)-(fs*0.78)*s, (tw+pad*2)*s, (fs*1.56)*s, Math.min(5,fs*0.5*s));
    ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=m.col||"#8fb6d8";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font=Math.max(6,fs*s)+"px "+getCSS("--draft");
    ctx.fillText(e.s, X(mid.x), Y(mid.y));
  }
  ctx.restore();
}
function flowPaintSelection(e){
  const b=entBox(e), pad=px(3);
  if(!isFinite(b.x0)) return;
  ctx.save();
  ctx.strokeStyle=getCSS("--pen"); ctx.lineWidth=1; ctx.setLineDash([5,3]);
  ctx.strokeRect(X(b.x0-pad), Y(b.y1+pad), (b.x1-b.x0+2*pad)*S.view.s, (b.y1-b.y0+2*pad)*S.view.s);
  ctx.setLineDash([]);
  ctx.restore();
}
function flowPaintEnt(e,selected,hot){
  if(e.t==="node") (e.k==="lane"? flowPaintLane : flowPaintNode)(e,selected,hot);
  else flowPaintEdge(e,selected,hot);
  if(selected){ flowPaintSelection(e); paintGrips(e); }
}
function flowPaintLive(){
  if(!flowDraw) return;
  const s=S.view.s;
  if(flowDraw.kind==="node" && flowDraw.ent){
    ctx.save(); ctx.globalAlpha=.75; flowPaintNode(flowDraw.ent,false,false); ctx.restore();
    return;
  }
  if(flowDraw.kind==="edge"){
    const from=flowDraw.fromNode ? flowRayExit(flowDraw.fromNode, sub(flowDraw.b, flowDraw.fromNode.p)) : flowDraw.a;
    ctx.save();
    ctx.setLineDash([5,4]); ctx.lineWidth=Math.max(1,S.flow.edgeW);
    ctx.strokeStyle=S.flow.edgeCol;
    ctx.beginPath(); ctx.moveTo(X(from.x),Y(from.y)); ctx.lineTo(X(flowDraw.b.x),Y(flowDraw.b.y)); ctx.stroke();
    ctx.restore();
    const hovered=flowDraw.hover;
    if(hovered){
      ctx.save();
      ctx.strokeStyle=getCSS("--snap"); ctx.lineWidth=2; ctx.setLineDash([]);
      const P=flowNodePoly(hovered);
      ctx.beginPath();
      P.forEach((p,i)=> i? ctx.lineTo(X(p.x),Y(p.y)) : ctx.moveTo(X(p.x),Y(p.y)));
      ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
  }
}

/* ---- input ----------------------------------------------------------- */
function flowMkNode(k, centre, w, h){
  const e={
    t:"node", k, id:flowNewId(), li:flowLayer(),
    p:centre, w, h, s:"", fs:S.flow.fontPx/S.view.s,
    mk:{fill:S.flow.fill, line:S.flow.line, text:S.flow.text, w:S.flow.strokeW/S.view.s}
  };
  if(k==="note") e.mk.fill = S.flow.fill==="#f4f7fb" ? "#ffe9a8" : S.flow.fill;
  if(k==="lane"){ e.dir=S.flow.laneDir; e.s=""; }
  return e;
}
function flowDefaultSize(k){
  return k==="lane" ? {w:S.flow.laneW/S.view.s, h:S.flow.laneH/S.view.s}
                    : {w:S.flow.w/S.view.s,    h:S.flow.h/S.view.s};
}
function flowPointerDown(e){
  const T=FLOW_TOOLS[S.tool], p=cursorPoint();
  if(T.kind==="node"){
    flowDraw={kind:"node", tool:S.tool, a:p, b:p, moved:false, ent:null};
    return;
  }
  if(T.kind==="edge"){
    const n=flowNodeAt(p);
    flowDraw={kind:"edge", a:p, b:p, fromNode:n, hover:null, moved:false};
    return;
  }
  flowDraw={kind:"label", a:p};
}
function flowPointerMove(ev){
  const p=cursorPoint();
  flowDraw.b=p;
  if(dist(flowDraw.a,p)*S.view.s>4) flowDraw.moved=true;
  if(flowDraw.kind==="node" && flowDraw.moved){
    const T=FLOW_TOOLS[flowDraw.tool];
    const w=Math.abs(p.x-flowDraw.a.x), h=Math.abs(p.y-flowDraw.a.y);
    const c=V((p.x+flowDraw.a.x)/2, (p.y+flowDraw.a.y)/2);
    if(!flowDraw.ent) flowDraw.ent=flowMkNode(T.k, c, Math.max(px(12),w), Math.max(px(10),h));
    else { flowDraw.ent.p=c; flowDraw.ent.w=Math.max(px(12),w); flowDraw.ent.h=Math.max(px(10),h); }
  }
  if(flowDraw.kind==="edge"){
    const n=flowNodeAt(p);
    flowDraw.hover = (n && n!==flowDraw.fromNode) ? n : null;
  }
  readout(); draw();
}
function flowPointerUp(ev){
  const D=flowDraw; flowDraw=null;
  if(!D){ draw(); return; }
  const p=cursorPoint();

  if(D.kind==="label"){
    const hit=flowHitAt(p);
    if(!hit){ echo("Click a node or a connector","warn"); draw(); return; }
    return flowAskLabel(hit);
  }

  if(D.kind==="node"){
    const T=FLOW_TOOLS[D.tool];
    let ent;
    if(D.moved && D.ent) ent=D.ent;
    else { const z=flowDefaultSize(T.k); ent=flowMkNode(T.k, D.a, z.w, z.h); }
    snap(); S.ents.push(ent);
    draw(); updateProps();
    if(S.flow.askNode) return flowAskLabel(ent, true);
    echo(T.label+" added");
    return;
  }

  if(D.kind==="edge"){
    const target=flowNodeAt(p);
    if(D.fromNode && target===D.fromNode){ echo("A connector needs two different ends","warn"); draw(); return; }
    if(!D.fromNode && !target){ echo("Start or end a connector on a node","warn"); draw(); return; }
    if(!D.moved && !target){ draw(); return; }
    const edge={
      t:"edge", li:flowLayer(),
      from: D.fromNode? {id:D.fromNode.id} : {pt:D.a},
      to:   target?     {id:target.id}     : {pt:p},
      route:S.flow.route, a0:S.flow.arrowStart, a1:S.flow.arrowEnd,
      s:"", fs:S.flow.fontPx/S.view.s, hl:S.flow.headPx/S.view.s,
      mk:{col:S.flow.edgeCol, w:S.flow.edgeW/S.view.s}
    };
    snap(); S.ents.push(edge);
    draw(); updateProps();
    if(S.flow.askEdge) return flowAskLabel(edge, true);
    echo("Connector added");
    return;
  }
  draw();
}
function flowHitAt(p){
  const tol=px(tolPx(8));
  for(let i=S.ents.length-1;i>=0;i--){
    const e=S.ents[i];
    if(!flowIsEnt(e)) continue;
    const L=S.layers[e.li];
    if(L && (!L.on || L.lock)) continue;
    if(flowHitEnt(e,p,tol)) return e;
  }
  return null;
}
function flowHitEnt(e,p,tol){
  if(e.t==="node" && e.k==="lane"){
    /* A lane is a backdrop: only its border and its title band are clickable,
       or it would swallow every pick inside the column. */
    const P=flowNodePoly(e);
    for(let i=0;i<P.length;i++) if(ptSegDist(p,P[i],P[(i+1)%P.length])<=tol) return true;
    const hb=laneHeaderRect(e);
    return p.x>=hb.x0 && p.x<=hb.x1 && p.y>=hb.y0 && p.y<=hb.y1;
  }
  if(e.t==="node"){
    const P=flowNodePoly(e);
    if(mkPointInPoly(p,P)) return true;
    for(let i=0;i<P.length;i++) if(ptSegDist(p,P[i],P[(i+1)%P.length])<=tol) return true;
    return false;
  }
  const R=flowRoute(e);
  if(!R) return false;
  const t=Math.max(tol,((e.mk&&e.mk.w)||0)/2);
  for(let i=0;i<R.length-1;i++) if(ptSegDist(p,R[i],R[i+1])<=t) return true;
  if(e.s){
    const mid=flowRouteMid(R), fs=e.fs||tol, tw=flowTextW(e.s,fs);
    if(Math.abs(p.x-mid.x)<=tw/2+fs*.5 && Math.abs(p.y-mid.y)<=fs) return true;
  }
  return false;
}
function flowAskLabel(e, fresh){
  const isEdge=e.t==="edge";
  requestString(isEdge?"Connector label":"Node label", String(e.s||""), v=>{
    snap();
    e.s=(v==null?"":v).replace(/\\n/g,"\n");
    if(e.t==="node") flowFit(e);
    setPrompt(); draw(); updateProps();
    echo(fresh? (flowEntName(e).toLowerCase()+" added") : "Label set");
  });
}

/* ---- resize under the Select tool ------------------------------------ */
function flowGripAt(e,sx,sy){
  if(!e || e.t!=="node") return null;
  const c=[["nw",e.p.x-e.w/2,e.p.y+e.h/2],["ne",e.p.x+e.w/2,e.p.y+e.h/2],
           ["se",e.p.x+e.w/2,e.p.y-e.h/2],["sw",e.p.x-e.w/2,e.p.y-e.h/2]];
  for(const [k,wx,wy] of c) if(Math.hypot(X(wx)-sx, Y(wy)-sy)<=tolPx(9)) return k;
  return null;
}
function flowBeginResize(sx,sy){
  if(S.tool!=="select" || S.sel.size!==1) return false;
  const e=S.ents[[...S.sel][0]];
  const g=flowGripAt(e,sx,sy);
  if(!g) return false;
  const L=S.layers[e.li];
  if(L && L.lock) return false;
  snap();
  flowResize={e, g};
  return true;
}
function flowApplyResize(p){ flowResizeTo(flowResize.e, flowResize.g, p); }
function flowResizeTo(e,g,p){
  let x0=e.p.x-e.w/2, x1=e.p.x+e.w/2, y0=e.p.y-e.h/2, y1=e.p.y+e.h/2;
  if(g.indexOf("w")>=0) x0=p.x;
  if(g.indexOf("e")>=0) x1=p.x;
  if(g.indexOf("s")>=0) y0=p.y;
  if(g.indexOf("n")>=0) y1=p.y;
  const mw=px(16), mh=px(12);
  if(x1-x0<mw){ if(g.indexOf("w")>=0) x0=x1-mw; else x1=x0+mw; }
  if(y1-y0<mh){ if(g.indexOf("s")>=0) y0=y1-mh; else y1=y0+mh; }
  e.w=x1-x0; e.h=y1-y0; e.p=V((x0+x1)/2,(y0+y1)/2);
}

/* ---- arrange --------------------------------------------------------- */
function flowSelNodes(){ return [...S.sel].map(i=>S.ents[i]).filter(e=>e&&e.t==="node"); }
function flowAlign(kind){
  const N=flowSelNodes();
  if(N.length<2) return echo("Select two or more nodes first","warn");
  snap();
  if(kind==="left"){   const x=Math.min(...N.map(n=>n.p.x-n.w/2)); N.forEach(n=>n.p.x=x+n.w/2); }
  if(kind==="centre"){ const x=N.reduce((a,n)=>a+n.p.x,0)/N.length; N.forEach(n=>n.p.x=x); }
  if(kind==="top"){    const y=Math.max(...N.map(n=>n.p.y+n.h/2)); N.forEach(n=>n.p.y=y-n.h/2); }
  if(kind==="middle"){ const y=N.reduce((a,n)=>a+n.p.y,0)/N.length; N.forEach(n=>n.p.y=y); }
  draw(); updateProps(); echo("Aligned "+N.length+" nodes");
}
function flowDistribute(axis){
  const N=flowSelNodes();
  if(N.length<3) return echo("Select three or more nodes first","warn");
  snap();
  N.sort((a,b)=> axis==="x" ? a.p.x-b.p.x : a.p.y-b.p.y);
  const first=N[0], lastN=N[N.length-1];
  const span=(axis==="x"? lastN.p.x-first.p.x : lastN.p.y-first.p.y);
  const step=span/(N.length-1);
  N.forEach((n,i)=>{ if(axis==="x") n.p.x=first.p.x+i*step; else n.p.y=first.p.y+i*step; });
  draw(); updateProps(); echo("Spaced "+N.length+" nodes evenly");
}
function flowTidy(){
  const sel=flowSelNodes();
  const N=sel.length? sel : S.ents.filter(e=>e.t==="node");
  if(!N.length) return echo("No nodes to tidy","warn");
  snap();
  const g=gridPitch();
  N.forEach(n=>{ n.p.x=Math.round(n.p.x/g)*g; n.p.y=Math.round(n.p.y/g)*g; });
  draw(); updateProps(); echo("Snapped "+N.length+" node"+(N.length>1?"s":"")+" to the grid");
}
function flowAutoSize(){
  const sel=flowSelNodes();
  const N=sel.length? sel : S.ents.filter(e=>e.t==="node");
  if(!N.length) return echo("No nodes to resize","warn");
  snap();
  N.forEach(flowFitTight);
  draw(); updateProps(); echo("Shrank "+N.length+" node"+(N.length>1?"s":"")+" to its text");
}
/* an edge whose node is gone is meaningless - drop it with the node */
function flowPrune(){
  const before=S.ents.length;
  S.ents=S.ents.filter(e=>{
    if(e.t!=="edge") return true;
    return !!flowEnd(e.from) && !!flowEnd(e.to);
  });
  return before-S.ents.length;
}

/* ---- options bar ----------------------------------------------------- */
function flowFillChips(onPick){
  const chips=document.createElement("div"); chips.className="chips";
  for(const c of FLOW_FILLS){
    const b=document.createElement("button");

  inp.title="Custom fill";

}
function flowColorField(label,get,set){

  const i=document.createElement("input");
  i.type="color"; i.value=get();

function flowRestyleSelection(){
  let n=0;
  for(const i of S.sel){
    const e=S.ents[i];
    if(!e || e.t!=="node") continue;
    e.mk.fill=S.flow.fill; e.mk.line=S.flow.line; e.mk.text=S.flow.text;
    n++;
  }
  if(n){ draw(); echo("Restyled "+n+" node"+(n>1?"s":"")); }
  return n;
}

function flowWidget(){

/* ---- property rows --------------------------------------------------- */
function flowPropRows(e,H){
  const rows=[], s=S.view.s;
  const colour=(label,get,set)=>{
    const d=H.mkrow(label), i=document.createElement("input");
    i.type="color"; i.value=get();
    i.oninput=()=>{ set(i.value); draw(); };
    d.append(i); return d;
  };
  if(e.t==="node" && e.k==="lane")
    rows.push(H.choice("Direction", e.dir==="h"?"h":"v", [["v","Columns"],["h","Rows"]],
      v=>{ snap(); e.dir=v; }));
  if(e.t==="edge")
    rows.push(H.info("Waypoints", String((e.wp||[]).length)));
  if(e.t==="node"){
    rows.push(H.txt("Label", String(e.s||"").replace(/\n/g,"\\n"),
      v=>{ snap(); e.s=v.replace(/\\n/g,"\n"); flowFit(e); }));
    rows.push(H.info("Id", e.id));
    rows.push(H.num("Width", e.w, v=>{ snap(); e.w=Math.max(px(16),v); }));
    rows.push(H.num("Height", e.h, v=>{ snap(); e.h=Math.max(px(12),v); }));
    rows.push(H.num("Centre X", e.p.x, v=>{ snap(); e.p.x=v; }));
    rows.push(H.num("Centre Y", e.p.y, v=>{ snap(); e.p.y=v; }));
    rows.push(H.num("Text px", e.fs*s, v=>{ snap(); e.fs=Math.max(1e-6,v)/s; }));
    rows.push(colour("Fill", ()=>e.mk.fill, v=>e.mk.fill=v));
    rows.push(colour("Line", ()=>e.mk.line, v=>e.mk.line=v));
    rows.push(colour("Text", ()=>e.mk.text, v=>e.mk.text=v));
    rows.push(H.num("Line px", (e.mk.w||0)*s, v=>{ e.mk.w=Math.max(1e-9,v)/s; }));
    rows.push(H.info("Connectors", String(S.ents.filter(x=>x.t==="edge" &&
      ((x.from&&x.from.id===e.id)||(x.to&&x.to.id===e.id))).length)));
    return rows;
  }
  rows.push(H.txt("Label", String(e.s||""), v=>{ snap(); e.s=v; }));
  rows.push(H.info("From", e.from&&e.from.id ? e.from.id : "free point"));
  rows.push(H.info("To",   e.to&&e.to.id     ? e.to.id   : "free point"));
  rows.push(H.choice("Route", e.route==="ortho"?"ortho":"straight",
    [["ortho","Elbow"],["straight","Straight"]], v=>{ snap(); e.route=v; }));
  rows.push(H.choice("Start arrow", e.a0?"yes":"no", [["no","No"],["yes","Yes"]], v=>e.a0=(v==="yes")));
  rows.push(H.choice("End arrow", e.a1===false?"no":"yes", [["yes","Yes"],["no","No"]], v=>e.a1=(v==="yes")));
  rows.push(colour("Line", ()=>e.mk.col, v=>e.mk.col=v));
  rows.push(H.num("Line px", (e.mk.w||0)*s, v=>{ e.mk.w=Math.max(1e-9,v)/s; }));
  rows.push(H.num("Head px", (e.hl||0)*s, v=>{ e.hl=Math.max(2,v)/s; }));
  rows.push(H.num("Text px", (e.fs||0)*s, v=>{ e.fs=Math.max(1e-6,v)/s; }));
  return rows;
}

/* ---- export ---------------------------------------------------------- */
function flowSVG(e){
  const out=[], P=p=>`${p.x} ${-p.y}`;
  const raw=e.mk||{};
  const m = e.t==="node"
    ? {fill:okColor(raw.fill,"#f4f7fb"), line:okColor(raw.line,"#2d6fa8"), text:okColor(raw.text,"#16202b"), w:raw.w}
    : {col:okColor(raw.col,"#8fb6d8"), w:raw.w};
  const esc=t=>xmlText(t);
  if(e.t==="node"){
    const x0=e.p.x-e.w/2, y1=e.p.y+e.h/2, lw=(m.w||0).toFixed(4);
    if(e.k==="term")
      out.push(`<rect x="${x0}" y="${-y1}" width="${e.w}" height="${e.h}" rx="${Math.min(e.h/2,e.w/2)}" fill="${m.fill}" stroke="${m.line}" stroke-width="${lw}"/>`);
    else if(e.k==="proc")
      out.push(`<rect x="${x0}" y="${-y1}" width="${e.w}" height="${e.h}" rx="${Math.min(e.h/8,e.w/8)}" fill="${m.fill}" stroke="${m.line}" stroke-width="${lw}"/>`);
    else if(e.k==="note"){
      const f=Math.min(e.w,e.h)*0.26, x1=e.p.x+e.w/2, y0=e.p.y-e.h/2;
      out.push(`<path d="M ${P(V(x0,y1))} L ${P(V(x1-f,y1))} L ${P(V(x1,y1-f))} L ${P(V(x1,y0))} L ${P(V(x0,y0))} Z" fill="${m.fill}" stroke="${m.line}" stroke-width="${lw}"/>`);
      out.push(`<path d="M ${P(V(x1-f,y1))} L ${P(V(x1-f,y1-f))} L ${P(V(x1,y1-f))}" fill="none" stroke="${m.line}" stroke-width="${lw}"/>`);
    } else {
      out.push(`<path d="M ${flowNodePoly(e).map(P).join(" L ")} Z" fill="${m.fill}" stroke="${m.line}" stroke-width="${lw}"/>`);
    }
    const L=flowLines(e);
    L.forEach((ln,i)=>{
      const y=-(e.p.y + ((L.length-1)/2 - i)*e.fs*1.32) + e.fs*0.35;
      out.push(`<text x="${e.p.x}" y="${y}" font-size="${e.fs}" font-family="Arial, sans-serif" text-anchor="middle" fill="${m.text}" stroke="none">${esc(ln)}</text>`);
    });
    return out;
  }
  const R=flowRoute(e);
  if(!R) return out;
  out.push(`<path d="M ${R.map(P).join(" L ")}" fill="none" stroke="${m.col}" stroke-width="${(m.w||0).toFixed(4)}" stroke-linecap="round" stroke-linejoin="round"/>`);
  const heads=[];
  if(e.a1!==false) heads.push([R[R.length-1],R[R.length-2]]);
  if(e.a0) heads.push([R[0],R[1]]);
  for(const [tip,from] of heads){
    const H=mkHeadPts(tip,from,e);
    if(H.length) out.push(`<path d="M ${H.map(P).join(" L ")} Z" fill="${m.col}" stroke="none"/>`);
  }
  if(e.s){
    const mid=flowRouteMid(R), fs=e.fs||1, tw=flowTextW(e.s,fs);
    out.push(`<rect x="${mid.x-tw/2-fs*.4}" y="${-(mid.y+fs*.8)}" width="${tw+fs*.8}" height="${fs*1.6}" rx="${fs*.35}" fill="#ffffff" fill-opacity=".9" stroke="none"/>`);
    out.push(`<text x="${mid.x}" y="${-(mid.y-fs*0.35)}" font-size="${fs}" font-family="Arial, sans-serif" text-anchor="middle" fill="${m.col}" stroke="none">${esc(e.s)}</text>`);
  }
  return out;
}
function flowDXF(e,ly,g){
  const aci=mkACI(e.t==="node" ? (e.mk&&e.mk.line) : (e.mk&&e.mk.col));
  const poly=pts=>{
    if(!pts||pts.length<2) return;
    g(0,"POLYLINE"); g(8,ly); g(62,aci); g(66,1); g(10,0.0); g(20,0.0); g(30,0.0); g(70,0);
    for(const p of pts){ g(0,"VERTEX"); g(8,ly); g(62,aci); g(10,p.x); g(20,p.y); g(30,0.0); }
    g(0,"SEQEND"); g(8,ly);
  };
  const txt=(p,str,h,center)=>{
    g(0,"TEXT"); g(8,ly); g(62,aci); g(10,p.x); g(20,p.y); g(30,0.0); g(40,h); g(1,dxfStr(str));
    if(center){ g(72,1); g(11,p.x); g(21,p.y); g(31,0.0); }
  };
  if(e.t==="node"){
    const P=flowNodePoly(e); poly(P.concat([P[0]]));
    const L=flowLines(e);
    L.forEach((ln,i)=> txt(V(e.p.x, e.p.y + ((L.length-1)/2 - i)*e.fs*1.32 - e.fs*0.4), ln, e.fs, true));
    return;
  }
  const R=flowRoute(e);
  if(!R) return;
  poly(R);
  if(e.a1!==false) poly(mkHeadPts(R[R.length-1],R[R.length-2],e));
  if(e.a0)         poly(mkHeadPts(R[0],R[1],e));
  if(e.s){
    const mid=flowRouteMid(R);
    txt(V(mid.x, mid.y+(e.fs||1)*0.3), e.s, e.fs||1, true);
  }
}

/* ============================================================ FILES & IMAGE
   Everything in this block exists because a drawing you cannot save, paste or
   reopen is a drawing you did once. Native .b2db round-trips the parts DXF and
   SVG throw away: markup styling, node identity, connector bindings.          */

const FILE_TAG="BackToTheDrawingBoard", FILE_VER=1;
const AUTOKEY="b2db.autosave.v1", CLIPKEY="b2db.clip.v1";

S.exporting=null;
S.docName="untitled";
S.png={width:2000, bg:"#ffffff", grid:false, margin:5};
S.flow.laneW=280; S.flow.laneH=560; S.flow.laneDir="v";

let refImgEl=null;         // the live <img>, kept alive across undo
let autoTimer=null, autoStamp="", autoDBPromise=null;

function setDocName(n){
  S.docName=safeFileName(String(n||"untitled").replace(/\.(b2db|json|dxf)$/i,""),"untitled");
  const el=document.getElementById("fname");
  if(el) el.textContent=S.docName+" \u00B7 units mm";
}

/* ---- bounds of everything worth putting in a picture ------------------ */
function contentBounds(){
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18,any=false;
  const grow=(a,b,c,d)=>{ any=true; x0=Math.min(x0,a); y0=Math.min(y0,b); x1=Math.max(x1,c); y1=Math.max(y1,d); };
  S.ents.forEach(e=>{
    const L=S.layers[e.li]; if(L && !L.on) return;
    const q=entBox(e);
    if(q && isFinite(q.x0) && isFinite(q.y1)) grow(q.x0,q.y0,q.x1,q.y1);
  });
  const R=S.refImage;
  if(R && R.visible && R.img){ const h=Math.hypot(R.w,R.h)/2; grow(R.x-h,R.y-h,R.x+h,R.y+h); }
  if(!any || !isFinite(x0) || !isFinite(y0) || !isFinite(x1) || !isFinite(y1)) return null;
  return {x0,y0,x1,y1};
}

/* ---- render the scene into an offscreen canvas ------------------------
   draw() paints through the module-level cv/ctx/W/H, so the honest way to get
   a high-resolution frame is to point those at a bigger canvas, redraw, and
   put them back. S.exporting suppresses crosshair, grips, band and preview. */
function renderScene(opt){
  const b=contentBounds();
  if(!b) return null;
  const m=Math.max(0,(opt.margin==null?5:opt.margin))/100;
  const bw=Math.max(1e-6,b.x1-b.x0), bh=Math.max(1e-6,b.y1-b.y0);
  const mx=bw*m+bw*0.002, my=bh*m+bh*0.002;
  const x0=b.x0-mx, x1=b.x1+mx, y0=b.y0-my, y1=b.y1+my;
  const worldW=x1-x0, worldH=y1-y0;
  let wpx=Math.max(64,Math.min(12000, Math.round(opt.width||2000)));
  let scale=wpx/worldW;
  let hpx=Math.max(1,Math.round(worldH*scale));
  const MAXPIX=36e6;
  if(wpx*hpx>MAXPIX){
    const k=Math.sqrt(MAXPIX/(wpx*hpx));
    wpx=Math.max(64,Math.round(wpx*k)); scale=wpx/worldW; hpx=Math.max(1,Math.round(worldH*scale));
  }
  const c=document.createElement("canvas");
  c.width=wpx; c.height=hpx;
  const g=c.getContext("2d");
  if(!g) return null;
  const sv={cv,ctx,W,H,DPR,view:S.view,hover:S.hover,sel:S.sel,band:S.band};
  cv=c; ctx=g; W=wpx; H=hpx; DPR=1;
  S.view={cx:(x0+x1)/2, cy:(y0+y1)/2, s:scale};
  S.hover=-1; S.sel=new Set(); S.band=null;
  S.exporting=opt;
  try{
    ctx.setTransform(1,0,0,1,0,0);
    draw();
  } finally {
    S.exporting=null;
    cv=sv.cv; ctx=sv.ctx; W=sv.W; H=sv.H; DPR=sv.DPR;
    S.view=sv.view; S.hover=sv.hover; S.sel=sv.sel; S.band=sv.band;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    draw();
  }
  return c;
}
function pngOpts(){ return {width:S.png.width, bg:S.png.bg, grid:S.png.grid, margin:S.png.margin}; }
function exportPNG(){
  const c=renderScene(pngOpts());
  if(!c) return echo("Nothing to export yet","warn");
  const finish=bl=>{
    if(!bl) return echo("Could not encode that image","warn");
    const u=URL.createObjectURL(bl), a=document.createElement("a");
    a.href=u; a.download=safeFileName(S.docName,"drawing")+".png"; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
    echo("PNG exported  "+c.width+"\u00D7"+c.height);
  };
  if(c.toBlob) c.toBlob(finish,"image/png");
  else finish(null);
}
function copyImage(){
  const c=renderScene(pngOpts());
  if(!c) return echo("Nothing to copy yet","warn");
  if(!(navigator.clipboard && window.ClipboardItem && c.toBlob))
    return echo("This browser will not hand over the clipboard - use Export PNG","warn");
  c.toBlob(bl=>{
    if(!bl) return echo("Could not encode that image","warn");
    navigator.clipboard.write([new ClipboardItem({"image/png":bl})])
      .then(()=>echo("Image copied  "+c.width+"\u00D7"+c.height))
      .catch(()=>echo("Clipboard blocked here - use Export PNG instead","warn"));
  },"image/png");
}

/* ---- save / open ------------------------------------------------------ */
function refDoc(withSrc){
  const R=S.refImage;
  if(!R) return null;
  const o={name:R.name,x:R.x,y:R.y,w:R.w,h:R.h,opacity:R.opacity,visible:R.visible,
           locked:R.locked,rot:R.rot||0,crop:R.crop||null,mode:R.mode||"fade"};
  if(withSrc && R.img){
    try{
      o.src = String(R.img.src||"").slice(0,5)==="data:" ? R.img.src : null;
      if(!o.src){
        const c=document.createElement("canvas");
        c.width=R.img.naturalWidth; c.height=R.img.naturalHeight;
        c.getContext("2d").drawImage(R.img,0,0);
        o.src=c.toDataURL("image/png");
      }
    }catch(_){ o.src=null; }
  }
  return o;
}
function serializeDrawing(withImage){
  return {
    app:FILE_TAG, version:FILE_VER, saved:new Date().toISOString(), name:S.docName,
    ents:S.ents, layers:S.layers, styles:S.styles, cur:S.cur, curStyle:S.curStyle,
    view:S.view, gridStep:S.gridStep, gridShow:S.gridShow, gridSnap:S.gridSnap,
    ortho:S.ortho, osnap:S.osnap, weld:S.weld, edgeAssist:S.edgeAssist, edgeThreshold:S.edgeThreshold,
    snapOn:S.snapOn, snapSubdiv:S.snapSubdiv, dimSnap:S.dimSnap, dimSnapLen:S.dimSnapLen, dimSnapAng:S.dimSnapAng,
    x:{weldR:S.x.weldR, ironTol:S.x.ironTol, repelPad:S.x.repelPad, wrapOffset:S.x.wrapOffset,
       corridor:S.x.corridor, sonarRays:S.x.sonarRays, stampWord:S.x.stampWord},
    textHeight:S.textHeight, groupSeq:S.groupSeq,
    flow:S.flow, mk:S.mk, png:S.png,
    ref: refDoc(withImage!==false)
  };
}
function applyDrawing(raw,label){
  const d=sanitizeDoc(raw);
  if(!d){ echo("That is not a valid BackToTheDrawingBoard file","warn"); return false; }
  S.ents=Array.isArray(d.ents)? d.ents : [];
  if(Array.isArray(d.layers) && d.layers.length) S.layers=d.layers;
  if(Array.isArray(d.styles) && d.styles.length) S.styles=d.styles;
  S.cur=Math.max(0,Math.min(d.cur|0, S.layers.length-1));
  S.curStyle=Math.max(0,Math.min(d.curStyle|0, S.styles.length-1));
  if(d.view && isFinite(d.view.s) && d.view.s>0) S.view={cx:d.view.cx,cy:d.view.cy,s:d.view.s};
  for(const k of ["gridStep","gridShow","gridSnap","ortho","osnap","weld","edgeAssist","edgeThreshold","textHeight","groupSeq"])
    if(d[k]!==undefined) S[k]=d[k];
  if(d.snapOn) for(const [k] of SNAP_KINDS) if(typeof d.snapOn[k]==="boolean") S.snapOn[k]=d.snapOn[k];
  if(typeof d.snapSubdiv==="boolean") S.snapSubdiv=d.snapSubdiv;
  if(d.x) Object.assign(S.x, sanX(d.x));
  if(typeof d.dimSnap==="boolean") S.dimSnap=d.dimSnap;
  if(d.dimSnapLen!=null) S.dimSnapLen=Math.max(0,Math.min(1e6,safeNum(d.dimSnapLen,0)));
  if(d.dimSnapAng!=null) S.dimSnapAng=Math.max(0,Math.min(180,safeNum(d.dimSnapAng,0)));
  mergePlain(S.flow,d.flow); mergePlain(S.mk,d.mk); mergePlain(S.png,d.png);
  S.sel.clear(); S.undo.length=0; S.redo.length=0; S.op={}; S.pending=[]; S.base=null;
  flowInvalidateIndex();
  S.refImage=null; refImgEl=null;
  setDocName(d.name||"untitled");
  if(d.ref && d.ref.src){
    const img=new Image();
    img.onload=()=>{
      const o=Object.assign({},d.ref); delete o.src;
      S.refImage=Object.assign(o,{img});
      refImgEl=img;
      try{ prepareReferenceEdges(S.refImage); }catch(_){}
      draw(); updateProps(); paintRibbon();
    };
    img.src=d.ref.src;
  }
  syncToggles();
  paintLayers(); paintStyles(); paintRibbon(); paintOptbar(); setPrompt();
  draw(); updateProps();
  echo((label||"Opened")+" \u00B7 "+S.ents.length+" objects");
  return true;
}
function saveDrawing(){
  requestString("Save as", S.docName, n=>{
    setDocName(safeFileName(n||S.docName,"untitled"));
    let txt;
    try{ txt=JSON.stringify(serializeDrawing(true)); }
    catch(_){ setPrompt(); return echo("Could not serialise this drawing","warn"); }
    download(txt, S.docName+".b2db", "application/json");
    echo("Saved "+S.docName+".b2db  ("+(txt.length/1024).toFixed(0)+" KB)");
    setPrompt();
  });
}
function openDrawingText(txt,name){
  if(typeof txt!=="string" || txt.length>SEC.MAX_DOC) return echo("That file is too large","warn");
  const d=safeParse(txt);
  if(!d) return echo("That file is not valid JSON","warn");
  if(applyDrawing(d,"Opened") && name) setDocName(safeFileName(name,"untitled"));
}

/* ---- autosave --------------------------------------------------------- */
/* Full recovery uses IndexedDB so embedded references are not silently lost at
   localStorage quota. localStorage remains a deliberately smaller fallback. */
const AUTODB="BackToTheDrawingBoard", AUTOSTORE="recovery", AUTODBKEY="autosave.v2";
function recoveryDB(){
  if(!("indexedDB" in window)) return Promise.resolve(null);
  if(autoDBPromise) return autoDBPromise;
  autoDBPromise=new Promise(resolve=>{
    try{
      const q=indexedDB.open(AUTODB,1);
      q.onupgradeneeded=()=>{ if(!q.result.objectStoreNames.contains(AUTOSTORE)) q.result.createObjectStore(AUTOSTORE); };
      q.onsuccess=()=>resolve(q.result); q.onerror=()=>resolve(null); q.onblocked=()=>resolve(null);
    }catch(_){ resolve(null); }
  });
  return autoDBPromise;
}
async function idbSetAutosave(txt){
  const db=await recoveryDB(); if(!db) return false;
  return await new Promise(resolve=>{ try{
    const tx=db.transaction(AUTOSTORE,"readwrite"); tx.objectStore(AUTOSTORE).put(txt,AUTODBKEY);
    tx.oncomplete=()=>resolve(true); tx.onerror=()=>resolve(false); tx.onabort=()=>resolve(false);
  }catch(_){resolve(false);} });
}
async function idbGetAutosave(){
  const db=await recoveryDB(); if(!db) return null;
  return await new Promise(resolve=>{ try{
    const q=db.transaction(AUTOSTORE,"readonly").objectStore(AUTOSTORE).get(AUTODBKEY);
    q.onsuccess=()=>resolve(typeof q.result==="string"?q.result:null); q.onerror=()=>resolve(null);
  }catch(_){resolve(null);} });
}
async function idbDeleteAutosave(){
  const db=await recoveryDB(); if(!db) return false;
  return await new Promise(resolve=>{ try{
    const tx=db.transaction(AUTOSTORE,"readwrite"); tx.objectStore(AUTOSTORE).delete(AUTODBKEY);
    tx.oncomplete=()=>resolve(true); tx.onerror=()=>resolve(false); tx.onabort=()=>resolve(false);
  }catch(_){resolve(false);} });
}
function markDirty(){
  if(autoTimer) clearTimeout(autoTimer);
  autoTimer=setTimeout(autosaveNow,1500);
}
function autosaveNow(){
  autoTimer=null;
  let full="",fallback="";
  try{
    full=JSON.stringify(serializeDrawing(true));
    if(full.length>SEC.MAX_DOC){ const d=serializeDrawing(false); d.imageDropped=true; full=JSON.stringify(d); }
    let small=full;
    if(small.length>2.4e6){ const d=serializeDrawing(false); d.imageDropped=true; small=JSON.stringify(d); }
    fallback=small.length<=4.4e6?small:"";
  }catch(_){ autoStamp="autosave unavailable"; return; }
  const stamp="saved "+new Date().toLocaleTimeString();
  idbSetAutosave(full).then(ok=>{ if(ok){autoStamp=stamp;draw();} });
  try{
    if(fallback) localStorage.setItem(AUTOKEY,fallback); else localStorage.removeItem(AUTOKEY);
    if(!("indexedDB" in window)) autoStamp=fallback?stamp:"too large to autosave";
  }catch(_){ if(!("indexedDB" in window)) autoStamp="autosave unavailable"; }
}
async function autosaveDoc(){
