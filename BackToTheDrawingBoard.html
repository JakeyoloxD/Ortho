S.flow={
  fill:"#f4f7fb", line:"#2d6fa8", text:"#16202b",
  edgeCol:"#8fb6d8", edgeW:2, strokeW:2,
  fontPx:13, w:170, h:72,
  route:"ortho", arrowStart:false, arrowEnd:true,
  headPx:13, askNode:true, askEdge:false,
  seq:1
};
let flowDraw=null;     // live node drag / edge drag
let flowResize=null;   // corner-drag resize under the Select tool

/* ---- helpers --------------------------------------------------------- */
function flowIsTool(t){ return !!FLOW_TOOLS[t]; }
function flowIsEnt(e){ return !!e && (e.t==="node"||e.t==="edge"); }
function flowNewId(){
  let id;
  do { id="N"+(S.flow.seq++); } while(S.ents.some(e=>e.t==="node"&&e.id===id));
  return id;
}
function flowFindNode(id){
  if(id==null) return null;
  for(const e of S.ents) if(e.t==="node" && e.id===id) return e;
  return null;
}
function flowNodeAt(p){
  for(let i=S.ents.length-1;i>=0;i--){
    const e=S.ents[i];
    if(e.t!=="node") continue;
    const L=S.layers[e.li];
    if(L && (!L.on || L.lock)) continue;
    if(mkPointInPoly(p, flowNodePoly(e))) return e;
  }
  return null;
}
function flowEntName(e){
  if(e.t==="edge") return "CONNECTOR";
  if(e.k==="lane") return "SWIMLANE";
  return ({proc:"PROCESS", dec:"DECISION", term:"START / END", data:"DATA", note:"NOTE"}[e.k]||"NODE");
}
function flowLayer(){
  let i=S.layers.findIndex(l=>l.name.toUpperCase()==="FLOW");
  if(i<0){ S.layers.push({name:"FLOW", aci:5, on:true, lock:false}); i=S.layers.length-1; paintLayers(); }
  return i;
}
function flowNodePoly(e){
  const x0=e.p.x-e.w/2, x1=e.p.x+e.w/2, y0=e.p.y-e.h/2, y1=e.p.y+e.h/2;
  if(e.k==="dec")  return [V(e.p.x,y1),V(x1,e.p.y),V(e.p.x,y0),V(x0,e.p.y)];
  if(e.k==="data"){
    const sk=Math.min(e.w*0.18, e.h*0.55);
    return [V(x0+sk,y1),V(x1,y1),V(x1-sk,y0),V(x0,y0)];
  }
  return [V(x0,y0),V(x1,y0),V(x1,y1),V(x0,y1)];
}
/* where a ray leaving the node centre crosses its outline - this is what
   keeps a connector touching the shape instead of burying itself in it */
function flowRayExit(n,dir){
  const d=norm(dir);
  if(!isFinite(d.x)||(d.x===0&&d.y===0)) return n.p;
  const P=flowNodePoly(n);
  const far=add(n.p, mul(d, (Math.abs(n.w)+Math.abs(n.h))*2+1));
  let best=null, bt=1e18;
  for(let i=0;i<P.length;i++){
    const r=lineLineInt(n.p, far, P[i], P[(i+1)%P.length]);
    if(!r) continue;
    if(r.t>=-1e-9 && r.u>=-1e-9 && r.u<=1+1e-9 && r.t<bt){ bt=r.t; best=r.p; }
  }
  return best||n.p;
}
function flowEnd(end){
  if(end && end.id!=null){ const n=flowFindNode(end.id); if(n) return {node:n, c:n.p}; return null; }
  if(end && end.pt) return {pt:end.pt, c:end.pt};
  return null;
}
function flowRoute(e){
  if(e.wp && e.wp.length){
    const chain=edgeChain(e);
    if(chain) return e.route==="ortho" ? edgeElbows(chain) : chain;
  }
  const A=flowEnd(e.from), B=flowEnd(e.to);
  if(!A||!B) return null;
  const ca=A.c, cb=B.c;
  if(dist(ca,cb)<1e-9) return null;
  if(e.route!=="ortho"){
    const pa=A.node? flowRayExit(A.node, sub(cb,ca)) : ca;
    const pb=B.node? flowRayExit(B.node, sub(ca,cb)) : cb;
    return [pa,pb];
  }
  if(Math.abs(cb.x-ca.x) >= Math.abs(cb.y-ca.y)){
    const sg = cb.x>=ca.x ? 1 : -1;
    const pa=A.node? flowRayExit(A.node,V(sg,0)) : ca;
    const pb=B.node? flowRayExit(B.node,V(-sg,0)) : cb;
    if(Math.abs(pa.y-pb.y)<1e-9) return [pa,pb];
    const mx=(pa.x+pb.x)/2;
    return [pa, V(mx,pa.y), V(mx,pb.y), pb];
  }
  const sg = cb.y>=ca.y ? 1 : -1;
  const pa=A.node? flowRayExit(A.node,V(0,sg)) : ca;
  const pb=B.node? flowRayExit(B.node,V(0,-sg)) : cb;
  if(Math.abs(pa.x-pb.x)<1e-9) return [pa,pb];
  const my=(pa.y+pb.y)/2;
  return [pa, V(pa.x,my), V(pb.x,my), pb];
}
function flowRouteMid(R){
  let total=0;
  for(let i=0;i<R.length-1;i++) total+=dist(R[i],R[i+1]);
  let want=total/2;
  for(let i=0;i<R.length-1;i++){
    const L=dist(R[i],R[i+1]);
    if(want<=L || i===R.length-2){
      const t=L<1e-12?0:want/L;
      return add(R[i], mul(sub(R[i+1],R[i]), Math.max(0,Math.min(1,t))));
    }
    want-=L;
  }
  return R[0];
}
function flowTextW(str, fs){
  ctx.save(); ctx.font="100px "+getCSS("--draft");
  const w=ctx.measureText(String(str==null?"":str)).width/100*fs;
  ctx.restore();
  return w;
}
function flowLines(e){
  const s=String(e.s==null?"":e.s);
  if(!s) return [];
  const usable=Math.max(e.fs, e.w*(e.k==="dec"?0.62:1) - e.fs*1.3);
  const out=[];
  for(const para of s.split("\n")){
    const words=para.split(/\s+/).filter(Boolean);
    if(!words.length){ out.push(""); continue; }
    let line=words[0];
    for(let i=1;i<words.length;i++){
      const t=line+" "+words[i];
      if(flowTextW(t,e.fs)<=usable) line=t; else { out.push(line); line=words[i]; }
    }
    out.push(line);
  }
  return out;
}
/* grow a node so its label fits - never shrinks, that is what Shrink To Text is for */
function flowFit(e){
  const L=flowLines(e);
  if(!L.length) return;
  const widest=Math.max(...L.map(l=>flowTextW(l,e.fs)));
  const padW=e.fs*1.3, padH=e.fs*1.1;
  const needW=(widest+padW) / (e.k==="dec"?0.62:1);
  if(needW>e.w) e.w=needW;
  const needH=(L.length*e.fs*1.32+padH) * (e.k==="dec"?1.8:1);
  if(needH>e.h) e.h=needH;
}
function flowFitTight(e){
  const L=flowLines(e);
  const fs=e.fs;
  if(!L.length){ e.w=Math.max(fs*4, S.flow.w/S.view.s*0.5); e.h=Math.max(fs*2.6, e.fs*3); return; }
  const widest=Math.max(...L.map(l=>flowTextW(l,fs)));
  e.w=(widest+fs*1.6)/(e.k==="dec"?0.62:1);
  e.h=(L.length*fs*1.32+fs*1.2)*(e.k==="dec"?1.8:1);
}

/* ---- painting -------------------------------------------------------- */
function flowPaintNode(e,selected,hot){
  const s=S.view.s, m=e.mk||{};
  const x=X(e.p.x-e.w/2), y=Y(e.p.y+e.h/2), w=e.w*s, h=e.h*s;
  ctx.save();
  ctx.lineJoin="round"; ctx.lineCap="round"; ctx.setLineDash([]);
  ctx.lineWidth=Math.max(1,(m.w||0)*s);
  ctx.strokeStyle= hot? getCSS("--snap") : (m.line||"#2d6fa8");
  ctx.fillStyle= m.fill||"#f4f7fb";
  ctx.beginPath();
  if(e.k==="term")      mkRoundRect(x,y,w,h,Math.min(h/2,w/2));
  else if(e.k==="proc") mkRoundRect(x,y,w,h,Math.min(7,h/4,w/4));
  else if(e.k==="note"){
    const f=Math.min(w,h)*0.26;
    ctx.moveTo(x,y); ctx.lineTo(x+w-f,y); ctx.lineTo(x+w,y+f);
    ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath();
  } else {
    const P=flowNodePoly(e);
    P.forEach((p,i)=> i? ctx.lineTo(X(p.x),Y(p.y)) : ctx.moveTo(X(p.x),Y(p.y)));
    ctx.closePath();
  }
  ctx.fill(); ctx.stroke();
  if(e.k==="note"){
    const f=Math.min(w,h)*0.26;
    ctx.beginPath();
    ctx.moveTo(x+w-f,y); ctx.lineTo(x+w-f,y+f); ctx.lineTo(x+w,y+f);
    ctx.stroke();
  }
  const L=flowLines(e);
  if(L.length){
    const lh=e.fs*1.32*s, cx=X(e.p.x), cy=Y(e.p.y);
    ctx.fillStyle=m.text||"#16202b";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font=Math.max(6,e.fs*s)+"px "+getCSS("--draft");
    L.forEach((ln,i)=> ctx.fillText(ln, cx, cy + (i-(L.length-1)/2)*lh));
  }
  ctx.restore();
}
function flowPaintEdge(e,selected,hot){
  const R=flowRoute(e);
  if(!R) return;
  const s=S.view.s, m=e.mk||{};
  ctx.save();
  ctx.lineJoin="round"; ctx.lineCap="round"; ctx.setLineDash([]);
  ctx.lineWidth=Math.max(1,(m.w||0)*s);
  ctx.strokeStyle= hot? getCSS("--snap") : (m.col||"#8fb6d8");
  ctx.beginPath();
  R.forEach((p,i)=> i? ctx.lineTo(X(p.x),Y(p.y)) : ctx.moveTo(X(p.x),Y(p.y)));
  ctx.stroke();
  if(e.a1!==false) mkHead(R[R.length-1], R[R.length-2], e);
  if(e.a0)         mkHead(R[0], R[1], e);
  if(e.s){
    const mid=flowRouteMid(R), fs=e.fs||S.flow.fontPx/s;
    const tw=flowTextW(e.s,fs), pad=fs*0.42;
    ctx.fillStyle=getCSS("--panel-2");
    ctx.globalAlpha=.92;
    ctx.beginPath();
    mkRoundRect(X(mid.x)-(tw/2+pad)*s, Y(mid.y)-(fs*0.78)*s, (tw+pad*2)*s, (fs*1.56)*s, Math.min(5,fs*0.5*s));
    ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=m.col||"#8fb6d8";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font=Math.max(6,fs*s)+"px "+getCSS("--draft");
    ctx.fillText(e.s, X(mid.x), Y(mid.y));
  }
  ctx.restore();
}
function flowPaintSelection(e){
  const b=entBox(e), pad=px(3);
  if(!isFinite(b.x0)) return;
  ctx.save();
  ctx.strokeStyle=getCSS("--pen"); ctx.lineWidth=1; ctx.setLineDash([5,3]);
  ctx.strokeRect(X(b.x0-pad), Y(b.y1+pad), (b.x1-b.x0+2*pad)*S.view.s, (b.y1-b.y0+2*pad)*S.view.s);
  ctx.setLineDash([]);
  ctx.restore();
}
function flowPaintEnt(e,selected,hot){
  if(e.t==="node") (e.k==="lane"? flowPaintLane : flowPaintNode)(e,selected,hot);
  else flowPaintEdge(e,selected,hot);
  if(selected){ flowPaintSelection(e); paintGrips(e); }
}
function flowPaintLive(){
  if(!flowDraw) return;
  const s=S.view.s;
  if(flowDraw.kind==="node" && flowDraw.ent){
    ctx.save(); ctx.globalAlpha=.75; flowPaintNode(flowDraw.ent,false,false); ctx.restore();
    return;
  }
  if(flowDraw.kind==="edge"){
    const from=flowDraw.fromNode ? flowRayExit(flowDraw.fromNode, sub(flowDraw.b, flowDraw.fromNode.p)) : flowDraw.a;
    ctx.save();
    ctx.setLineDash([5,4]); ctx.lineWidth=Math.max(1,S.flow.edgeW);
    ctx.strokeStyle=S.flow.edgeCol;
    ctx.beginPath(); ctx.moveTo(X(from.x),Y(from.y)); ctx.lineTo(X(flowDraw.b.x),Y(flowDraw.b.y)); ctx.stroke();
    ctx.restore();
    const hovered=flowDraw.hover;
    if(hovered){
      ctx.save();
      ctx.strokeStyle=getCSS("--snap"); ctx.lineWidth=2; ctx.setLineDash([]);
      const P=flowNodePoly(hovered);
      ctx.beginPath();
      P.forEach((p,i)=> i? ctx.lineTo(X(p.x),Y(p.y)) : ctx.moveTo(X(p.x),Y(p.y)));
      ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
  }
}

/* ---- input ----------------------------------------------------------- */
function flowMkNode(k, centre, w, h){
  const e={
    t:"node", k, id:flowNewId(), li:flowLayer(),
    p:centre, w, h, s:"", fs:S.flow.fontPx/S.view.s,
    mk:{fill:S.flow.fill, line:S.flow.line, text:S.flow.text, w:S.flow.strokeW/S.view.s}
  };
  if(k==="note") e.mk.fill = S.flow.fill==="#f4f7fb" ? "#ffe9a8" : S.flow.fill;
  if(k==="lane"){ e.dir=S.flow.laneDir; e.s=""; }
  return e;
}
function flowDefaultSize(k){
  return k==="lane" ? {w:S.flow.laneW/S.view.s, h:S.flow.laneH/S.view.s}
                    : {w:S.flow.w/S.view.s,    h:S.flow.h/S.view.s};
}
function flowPointerDown(e){
  const T=FLOW_TOOLS[S.tool], p=cursorPoint();
  if(T.kind==="node"){
    flowDraw={kind:"node", tool:S.tool, a:p, b:p, moved:false, ent:null};
    return;
  }
  if(T.kind==="edge"){
    const n=flowNodeAt(p);
    flowDraw={kind:"edge", a:p, b:p, fromNode:n, hover:null, moved:false};
    return;
  }
  flowDraw={kind:"label", a:p};
}
function flowPointerMove(ev){
  const p=cursorPoint();
  flowDraw.b=p;
  if(dist(flowDraw.a,p)*S.view.s>4) flowDraw.moved=true;
  if(flowDraw.kind==="node" && flowDraw.moved){
    const T=FLOW_TOOLS[flowDraw.tool];
    const w=Math.abs(p.x-flowDraw.a.x), h=Math.abs(p.y-flowDraw.a.y);
    const c=V((p.x+flowDraw.a.x)/2, (p.y+flowDraw.a.y)/2);
    if(!flowDraw.ent) flowDraw.ent=flowMkNode(T.k, c, Math.max(px(12),w), Math.max(px(10),h));
    else { flowDraw.ent.p=c; flowDraw.ent.w=Math.max(px(12),w); flowDraw.ent.h=Math.max(px(10),h); }
  }
  if(flowDraw.kind==="edge"){
    const n=flowNodeAt(p);
    flowDraw.hover = (n && n!==flowDraw.fromNode) ? n : null;
  }
  readout(); draw();
}
function flowPointerUp(ev){
  const D=flowDraw; flowDraw=null;
  if(!D){ draw(); return; }
  const p=cursorPoint();

  if(D.kind==="label"){
    const hit=flowHitAt(p);
    if(!hit){ echo("Click a node or a connector","warn"); draw(); return; }
    return flowAskLabel(hit);
  }

  if(D.kind==="node"){
    const T=FLOW_TOOLS[D.tool];
    let ent;
    if(D.moved && D.ent) ent=D.ent;
    else { const z=flowDefaultSize(T.k); ent=flowMkNode(T.k, D.a, z.w, z.h); }
    snap(); S.ents.push(ent);
    draw(); updateProps();
    if(S.flow.askNode) return flowAskLabel(ent, true);
    echo(T.label+" added");
    return;
  }

  if(D.kind==="edge"){
    const target=flowNodeAt(p);
    if(D.fromNode && target===D.fromNode){ echo("A connector needs two different ends","warn"); draw(); return; }
    if(!D.fromNode && !target){ echo("Start or end a connector on a node","warn"); draw(); return; }
    if(!D.moved && !target){ draw(); return; }
    const edge={
      t:"edge", li:flowLayer(),
      from: D.fromNode? {id:D.fromNode.id} : {pt:D.a},
      to:   target?     {id:target.id}     : {pt:p},
      route:S.flow.route, a0:S.flow.arrowStart, a1:S.flow.arrowEnd,
      s:"", fs:S.flow.fontPx/S.view.s, hl:S.flow.headPx/S.view.s,
      mk:{col:S.flow.edgeCol, w:S.flow.edgeW/S.view.s}
    };
    snap(); S.ents.push(edge);
    draw(); updateProps();
    if(S.flow.askEdge) return flowAskLabel(edge, true);
    echo("Connector added");
    return;
  }
  draw();
}
function flowHitAt(p){
  const tol=px(8);
  for(let i=S.ents.length-1;i>=0;i--){
    const e=S.ents[i];
    if(!flowIsEnt(e)) continue;
    const L=S.layers[e.li];
    if(L && (!L.on || L.lock)) continue;
    if(flowHitEnt(e,p,tol)) return e;
  }
  return null;
}
function flowHitEnt(e,p,tol){
  if(e.t==="node" && e.k==="lane"){
    /* A lane is a backdrop: only its border and its title band are clickable,
       or it would swallow every pick inside the column. */
    const P=flowNodePoly(e);
    for(let i=0;i<P.length;i++) if(ptSegDist(p,P[i],P[(i+1)%P.length])<=tol) return true;
    const hb=laneHeaderRect(e);
    return p.x>=hb.x0 && p.x<=hb.x1 && p.y>=hb.y0 && p.y<=hb.y1;
  }
  if(e.t==="node"){
    const P=flowNodePoly(e);
    if(mkPointInPoly(p,P)) return true;
    for(let i=0;i<P.length;i++) if(ptSegDist(p,P[i],P[(i+1)%P.length])<=tol) return true;
    return false;
  }
  const R=flowRoute(e);
  if(!R) return false;
  const t=Math.max(tol,((e.mk&&e.mk.w)||0)/2);
  for(let i=0;i<R.length-1;i++) if(ptSegDist(p,R[i],R[i+1])<=t) return true;
  if(e.s){
    const mid=flowRouteMid(R), fs=e.fs||tol, tw=flowTextW(e.s,fs);
    if(Math.abs(p.x-mid.x)<=tw/2+fs*.5 && Math.abs(p.y-mid.y)<=fs) return true;
  }
  return false;
}
function flowAskLabel(e, fresh){
  const isEdge=e.t==="edge";
  requestString(isEdge?"Connector label":"Node label", String(e.s||""), v=>{
    snap();
    e.s=(v==null?"":v).replace(/\\n/g,"\n");
    if(e.t==="node") flowFit(e);
    setPrompt(); draw(); updateProps();
    echo(fresh? (flowEntName(e).toLowerCase()+" added") : "Label set");
  });
}

/* ---- resize under the Select tool ------------------------------------ */
function flowGripAt(e,sx,sy){
  if(!e || e.t!=="node") return null;
  const c=[["nw",e.p.x-e.w/2,e.p.y+e.h/2],["ne",e.p.x+e.w/2,e.p.y+e.h/2],
           ["se",e.p.x+e.w/2,e.p.y-e.h/2],["sw",e.p.x-e.w/2,e.p.y-e.h/2]];
  for(const [k,wx,wy] of c) if(Math.hypot(X(wx)-sx, Y(wy)-sy)<=7) return k;
  return null;
}
function flowBeginResize(sx,sy){
  if(S.tool!=="select" || S.sel.size!==1) return false;
  const e=S.ents[[...S.sel][0]];
  const g=flowGripAt(e,sx,sy);
  if(!g) return false;
  const L=S.layers[e.li];
  if(L && L.lock) return false;
  snap();
  flowResize={e, g};
  return true;
}
function flowApplyResize(p){ flowResizeTo(flowResize.e, flowResize.g, p); }
function flowResizeTo(e,g,p){
  let x0=e.p.x-e.w/2, x1=e.p.x+e.w/2, y0=e.p.y-e.h/2, y1=e.p.y+e.h/2;
  if(g.indexOf("w")>=0) x0=p.x;
  if(g.indexOf("e")>=0) x1=p.x;
  if(g.indexOf("s")>=0) y0=p.y;
  if(g.indexOf("n")>=0) y1=p.y;
  const mw=px(16), mh=px(12);
  if(x1-x0<mw){ if(g.indexOf("w")>=0) x0=x1-mw; else x1=x0+mw; }
  if(y1-y0<mh){ if(g.indexOf("s")>=0) y0=y1-mh; else y1=y0+mh; }
  e.w=x1-x0; e.h=y1-y0; e.p=V((x0+x1)/2,(y0+y1)/2);
}

/* ---- arrange --------------------------------------------------------- */
function flowSelNodes(){ return [...S.sel].map(i=>S.ents[i]).filter(e=>e&&e.t==="node"); }
function flowAlign(kind){
  const N=flowSelNodes();
  if(N.length<2) return echo("Select two or more nodes first","warn");
  snap();
  if(kind==="left"){   const x=Math.min(...N.map(n=>n.p.x-n.w/2)); N.forEach(n=>n.p.x=x+n.w/2); }
  if(kind==="centre"){ const x=N.reduce((a,n)=>a+n.p.x,0)/N.length; N.forEach(n=>n.p.x=x); }
  if(kind==="top"){    const y=Math.max(...N.map(n=>n.p.y+n.h/2)); N.forEach(n=>n.p.y=y-n.h/2); }
  if(kind==="middle"){ const y=N.reduce((a,n)=>a+n.p.y,0)/N.length; N.forEach(n=>n.p.y=y); }
  draw(); updateProps(); echo("Aligned "+N.length+" nodes");
}
function flowDistribute(axis){
  const N=flowSelNodes();
  if(N.length<3) return echo("Select three or more nodes first","warn");
  snap();
  N.sort((a,b)=> axis==="x" ? a.p.x-b.p.x : a.p.y-b.p.y);
  const first=N[0], lastN=N[N.length-1];
  const span=(axis==="x"? lastN.p.x-first.p.x : lastN.p.y-first.p.y);
  const step=span/(N.length-1);
  N.forEach((n,i)=>{ if(axis==="x") n.p.x=first.p.x+i*step; else n.p.y=first.p.y+i*step; });
  draw(); updateProps(); echo("Spaced "+N.length+" nodes evenly");
}
function flowTidy(){
  const sel=flowSelNodes();
  const N=sel.length? sel : S.ents.filter(e=>e.t==="node");
  if(!N.length) return echo("No nodes to tidy","warn");
  snap();
  const g=gridPitch();
  N.forEach(n=>{ n.p.x=Math.round(n.p.x/g)*g; n.p.y=Math.round(n.p.y/g)*g; });
  draw(); updateProps(); echo("Snapped "+N.length+" node"+(N.length>1?"s":"")+" to the grid");
}
function flowAutoSize(){
  const sel=flowSelNodes();
  const N=sel.length? sel : S.ents.filter(e=>e.t==="node");
  if(!N.length) return echo("No nodes to resize","warn");
  snap();
  N.forEach(flowFitTight);
  draw(); updateProps(); echo("Shrank "+N.length+" node"+(N.length>1?"s":"")+" to its text");
}
/* an edge whose node is gone is meaningless - drop it with the node */
function flowPrune(){
  const before=S.ents.length;
  S.ents=S.ents.filter(e=>{
    if(e.t!=="edge") return true;
    return !!flowEnd(e.from) && !!flowEnd(e.to);
  });
  return before-S.ents.length;
}

/* ---- options bar ----------------------------------------------------- */
function flowFillChips(onPick){
  const chips=document.createElement("div"); chips.className="chips";
  for(const c of FLOW_FILLS){
    const b=document.createElement("button");
    b.className="chip"; b.type="button"; b.style.background=c; b.title=c;
    b.setAttribute("aria-pressed", String(c.toLowerCase()===String(S.flow.fill).toLowerCase()));
    b.onclick=()=>{ S.flow.fill=c; onPick(); };
    chips.append(b);
  }
  const inp=document.createElement("input");
  inp.type="color"; inp.value=/^#[0-9a-f]{6}$/i.test(S.flow.fill)?S.flow.fill:"#f4f7fb";
  inp.title="Custom fill";
  inp.oninput=()=>{ S.flow.fill=inp.value; onPick(); };
  chips.append(inp);
  return chips;
}
function flowColorField(label,get,set){
  const wrap=document.createElement("label");
  const sp=document.createElement("span"); sp.className="oh"; sp.textContent=label;
  const i=document.createElement("input");
  i.type="color"; i.value=get();

function flowRestyleSelection(){

function flowOptbar(host,H){
  const T=FLOW_TOOLS[S.tool];
  const lab=t=>{ const s=document.createElement("span"); s.className="oh"; s.textContent=t; return s; };
  const refresh=()=>{ paintOptbar(); paintRibbon(); draw(); };
  if(T.kind==="node"){
    host.append(lab("Fill"), flowFillChips(refresh));
    if(T.k==="lane"){
      host.append(H.radio([["v","Columns"],["h","Rows"]], S.flow.laneDir, v=>S.flow.laneDir=v));
      host.append(H.num("Lane W px", S.flow.laneW, "any", v=>S.flow.laneW=Math.max(40,v)));
      host.append(H.num("Lane H px", S.flow.laneH, "any", v=>S.flow.laneH=Math.max(40,v)));
    }
    host.append(flowColorField("Line", ()=>S.flow.line, v=>S.flow.line=v));
    host.append(flowColorField("Text", ()=>S.flow.text, v=>S.flow.text=v));
    host.append(H.num("W px", S.flow.w, "any", v=>S.flow.w=Math.max(20,v)));
    host.append(H.num("H px", S.flow.h, "any", v=>S.flow.h=Math.max(16,v)));
    host.append(H.num("Text px", S.flow.fontPx, "any", v=>S.flow.fontPx=Math.max(5,v)));
    host.append(H.chk("Ask for label", S.flow.askNode, v=>S.flow.askNode=v));
    host.append(lab("click drops · drag sizes"));
    return;
  }
  if(T.kind==="edge"){
    host.append(H.radio([["ortho","Elbow"],["straight","Straight"]], S.flow.route, v=>S.flow.route=v));
    host.append(H.chk("Start arrow", S.flow.arrowStart, v=>S.flow.arrowStart=v));
    host.append(H.chk("End arrow", S.flow.arrowEnd, v=>S.flow.arrowEnd=v));
    host.append(flowColorField("Line", ()=>S.flow.edgeCol, v=>S.flow.edgeCol=v));
    host.append(H.num("Size px", S.flow.edgeW, "any", v=>S.flow.edgeW=Math.max(.5,v)));
    host.append(H.num("Head px", S.flow.headPx, "any", v=>S.flow.headPx=Math.max(4,v)));
    host.append(H.chk("Ask for label", S.flow.askEdge, v=>S.flow.askEdge=v));
    host.append(lab("drag node to node"));
    return;
  }
  host.append(lab("click a node or connector to relabel"));
}
function flowWidget(){
  const wrap=document.createElement("div"); wrap.className="rstack";
  wrap.append(flowFillChips(()=>{ paintRibbon(); paintOptbar(); flowRestyleSelection(); }));
  const row=document.createElement("div"); row.className="rrow"; row.style.gap="3px";
  const line=document.createElement("input");
  line.type="color"; line.value=S.flow.line; line.title="Node line colour";
  line.oninput=()=>{ S.flow.line=line.value; flowRestyleSelection(); };
  const text=document.createElement("input");
  text.type="color"; text.value=S.flow.text; text.title="Node text colour";
  text.oninput=()=>{ S.flow.text=text.value; flowRestyleSelection(); };
  const fs=document.createElement("input");
  fs.type="number"; fs.step="any"; fs.value=S.flow.fontPx; fs.style.maxWidth="46px";
  fs.title="Label size in screen pixels";
  fs.onchange=()=>{ const v=parseFloat(fs.value); if(isFinite(v)) S.flow.fontPx=Math.max(5,v); paintOptbar(); };
  row.append(line,text,fs);
  wrap.append(row);
  return wrap;
}

/* ---- property rows --------------------------------------------------- */
function flowPropRows(e,H){
  const rows=[], s=S.view.s;
  const colour=(label,get,set)=>{
    const d=H.mkrow(label), i=document.createElement("input");
    i.type="color"; i.value=get();
    i.oninput=()=>{ set(i.value); draw(); };
    d.append(i); return d;
  };
  if(e.t==="node" && e.k==="lane")
    rows.push(H.choice("Direction", e.dir==="h"?"h":"v", [["v","Columns"],["h","Rows"]],
      v=>{ snap(); e.dir=v; }));
  if(e.t==="edge")
    rows.push(H.info("Waypoints", String((e.wp||[]).length)));
  if(e.t==="node"){
    rows.push(H.txt("Label", String(e.s||"").replace(/\n/g,"\\n"),
      v=>{ snap(); e.s=v.replace(/\\n/g,"\n"); flowFit(e); }));
    rows.push(H.info("Id", e.id));
    rows.push(H.num("Width", e.w, v=>{ snap(); e.w=Math.max(px(16),v); }));
    rows.push(H.num("Height", e.h, v=>{ snap(); e.h=Math.max(px(12),v); }));
    rows.push(H.num("Centre X", e.p.x, v=>{ snap(); e.p.x=v; }));
    rows.push(H.num("Centre Y", e.p.y, v=>{ snap(); e.p.y=v; }));
    rows.push(H.num("Text px", e.fs*s, v=>{ snap(); e.fs=Math.max(1e-6,v)/s; }));
    rows.push(colour("Fill", ()=>e.mk.fill, v=>e.mk.fill=v));
    rows.push(colour("Line", ()=>e.mk.line, v=>e.mk.line=v));
    rows.push(colour("Text", ()=>e.mk.text, v=>e.mk.text=v));
    rows.push(H.num("Line px", (e.mk.w||0)*s, v=>{ e.mk.w=Math.max(1e-9,v)/s; }));
    rows.push(H.info("Connectors", String(S.ents.filter(x=>x.t==="edge" &&
      ((x.from&&x.from.id===e.id)||(x.to&&x.to.id===e.id))).length)));
    return rows;
  }
  rows.push(H.txt("Label", String(e.s||""), v=>{ snap(); e.s=v; }));
  rows.push(H.info("From", e.from&&e.from.id ? e.from.id : "free point"));
  rows.push(H.info("To",   e.to&&e.to.id     ? e.to.id   : "free point"));
  rows.push(H.choice("Route", e.route==="ortho"?"ortho":"straight",
    [["ortho","Elbow"],["straight","Straight"]], v=>{ snap(); e.route=v; }));
  rows.push(H.choice("Start arrow", e.a0?"yes":"no", [["no","No"],["yes","Yes"]], v=>e.a0=(v==="yes")));
  rows.push(H.choice("End arrow", e.a1===false?"no":"yes", [["yes","Yes"],["no","No"]], v=>e.a1=(v==="yes")));
  rows.push(colour("Line", ()=>e.mk.col, v=>e.mk.col=v));
  rows.push(H.num("Line px", (e.mk.w||0)*s, v=>{ e.mk.w=Math.max(1e-9,v)/s; }));
  rows.push(H.num("Head px", (e.hl||0)*s, v=>{ e.hl=Math.max(2,v)/s; }));
  rows.push(H.num("Text px", (e.fs||0)*s, v=>{ e.fs=Math.max(1e-6,v)/s; }));
  return rows;
}

/* ---- export ---------------------------------------------------------- */
function flowSVG(e){
  const out=[], m=e.mk||{}, P=p=>`${p.x} ${-p.y}`;
  const esc=t=>String(t).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
  if(e.t==="node"){
    const x0=e.p.x-e.w/2, y1=e.p.y+e.h/2, lw=(m.w||0).toFixed(4);
    if(e.k==="term")
      out.push(`<rect x="${x0}" y="${-y1}" width="${e.w}" height="${e.h}" rx="${Math.min(e.h/2,e.w/2)}" fill="${m.fill}" stroke="${m.line}" stroke-width="${lw}"/>`);
    else if(e.k==="proc")
      out.push(`<rect x="${x0}" y="${-y1}" width="${e.w}" height="${e.h}" rx="${Math.min(e.h/8,e.w/8)}" fill="${m.fill}" stroke="${m.line}" stroke-width="${lw}"/>`);
    else if(e.k==="note"){
      const f=Math.min(e.w,e.h)*0.26, x1=e.p.x+e.w/2, y0=e.p.y-e.h/2;
      out.push(`<path d="M ${P(V(x0,y1))} L ${P(V(x1-f,y1))} L ${P(V(x1,y1-f))} L ${P(V(x1,y0))} L ${P(V(x0,y0))} Z" fill="${m.fill}" stroke="${m.line}" stroke-width="${lw}"/>`);
      out.push(`<path d="M ${P(V(x1-f,y1))} L ${P(V(x1-f,y1-f))} L ${P(V(x1,y1-f))}" fill="none" stroke="${m.line}" stroke-width="${lw}"/>`);
    } else {
      out.push(`<path d="M ${flowNodePoly(e).map(P).join(" L ")} Z" fill="${m.fill}" stroke="${m.line}" stroke-width="${lw}"/>`);
    }
    const L=flowLines(e);
    L.forEach((ln,i)=>{
      const y=-(e.p.y + ((L.length-1)/2 - i)*e.fs*1.32) + e.fs*0.35;
      out.push(`<text x="${e.p.x}" y="${y}" font-size="${e.fs}" font-family="Arial, sans-serif" text-anchor="middle" fill="${m.text}" stroke="none">${esc(ln)}</text>`);
    });
    return out;
  }
  const R=flowRoute(e);
  if(!R) return out;
  out.push(`<path d="M ${R.map(P).join(" L ")}" fill="none" stroke="${m.col}" stroke-width="${(m.w||0).toFixed(4)}" stroke-linecap="round" stroke-linejoin="round"/>`);
  const heads=[];
  if(e.a1!==false) heads.push([R[R.length-1],R[R.length-2]]);
  if(e.a0) heads.push([R[0],R[1]]);
  for(const [tip,from] of heads){
    const H=mkHeadPts(tip,from,e);
    if(H.length) out.push(`<path d="M ${H.map(P).join(" L ")} Z" fill="${m.col}" stroke="none"/>`);
  }
  if(e.s){
    const mid=flowRouteMid(R), fs=e.fs||1, tw=flowTextW(e.s,fs);
    out.push(`<rect x="${mid.x-tw/2-fs*.4}" y="${-(mid.y+fs*.8)}" width="${tw+fs*.8}" height="${fs*1.6}" rx="${fs*.35}" fill="#ffffff" fill-opacity=".9" stroke="none"/>`);
    out.push(`<text x="${mid.x}" y="${-(mid.y-fs*0.35)}" font-size="${fs}" font-family="Arial, sans-serif" text-anchor="middle" fill="${m.col}" stroke="none">${esc(e.s)}</text>`);
  }
  return out;
}
function flowDXF(e,ly,g){
  const aci=mkACI(e.t==="node" ? (e.mk&&e.mk.line) : (e.mk&&e.mk.col));
  const poly=pts=>{
    if(!pts||pts.length<2) return;
    g(0,"POLYLINE"); g(8,ly); g(62,aci); g(66,1); g(10,0.0); g(20,0.0); g(30,0.0); g(70,0);
    for(const p of pts){ g(0,"VERTEX"); g(8,ly); g(62,aci); g(10,p.x); g(20,p.y); g(30,0.0); }
    g(0,"SEQEND"); g(8,ly);
  };
  const txt=(p,str,h,center)=>{
    g(0,"TEXT"); g(8,ly); g(62,aci); g(10,p.x); g(20,p.y); g(30,0.0); g(40,h); g(1,String(str));
    if(center){ g(72,1); g(11,p.x); g(21,p.y); g(31,0.0); }
  };
  if(e.t==="node"){
    const P=flowNodePoly(e); poly(P.concat([P[0]]));
    const L=flowLines(e);
    L.forEach((ln,i)=> txt(V(e.p.x, e.p.y + ((L.length-1)/2 - i)*e.fs*1.32 - e.fs*0.4), ln, e.fs, true));
    return;
  }
  const R=flowRoute(e);
  if(!R) return;
  poly(R);
  if(e.a1!==false) poly(mkHeadPts(R[R.length-1],R[R.length-2],e));
  if(e.a0)         poly(mkHeadPts(R[0],R[1],e));
  if(e.s){
    const mid=flowRouteMid(R);
    txt(V(mid.x, mid.y+(e.fs||1)*0.3), e.s, e.fs||1, true);
  }
}

/* ============================================================ FILES & IMAGE
   Everything in this block exists because a drawing you cannot save, paste or
   reopen is a drawing you did once. Native .b2db round-trips the parts DXF and
   SVG throw away: markup styling, node identity, connector bindings.          */

const FILE_TAG="BackToTheDrawingBoard", FILE_VER=1;
const AUTOKEY="b2db.autosave.v1", CLIPKEY="b2db.clip.v1";

S.exporting=null;
S.docName="untitled";
S.png={width:2000, bg:"#ffffff", grid:false, margin:5};
S.flow.laneW=280; S.flow.laneH=560; S.flow.laneDir="v";

let refImgEl=null;         // the live <img>, kept alive across undo
let autoTimer=null, autoStamp="";

function setDocName(n){
  S.docName=String(n||"untitled").replace(/\.(b2db|json|dxf)$/i,"");
  const el=document.getElementById("fname");
  if(el) el.textContent=S.docName+" \u00B7 units mm";
}

/* ---- bounds of everything worth putting in a picture ------------------ */
function contentBounds(){
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18,any=false;
  const grow=(a,b,c,d)=>{ any=true; x0=Math.min(x0,a); y0=Math.min(y0,b); x1=Math.max(x1,c); y1=Math.max(y1,d); };
  S.ents.forEach(e=>{
    const L=S.layers[e.li]; if(L && !L.on) return;
    const q=entBox(e);
    if(q && isFinite(q.x0) && isFinite(q.y1)) grow(q.x0,q.y0,q.x1,q.y1);
  });
  const R=S.refImage;
  if(R && R.visible && R.img){ const h=Math.hypot(R.w,R.h)/2; grow(R.x-h,R.y-h,R.x+h,R.y+h); }
  if(!any || !isFinite(x0) || !isFinite(y0) || !isFinite(x1) || !isFinite(y1)) return null;
  return {x0,y0,x1,y1};
}

/* ---- render the scene into an offscreen canvas ------------------------
   draw() paints through the module-level cv/ctx/W/H, so the honest way to get
   a high-resolution frame is to point those at a bigger canvas, redraw, and
   put them back. S.exporting suppresses crosshair, grips, band and preview. */
function renderScene(opt){
  const b=contentBounds();
  if(!b) return null;
  const m=Math.max(0,(opt.margin==null?5:opt.margin))/100;
  const bw=Math.max(1e-6,b.x1-b.x0), bh=Math.max(1e-6,b.y1-b.y0);
  const mx=bw*m+bw*0.002, my=bh*m+bh*0.002;
  const x0=b.x0-mx, x1=b.x1+mx, y0=b.y0-my, y1=b.y1+my;
  const worldW=x1-x0, worldH=y1-y0;
  let wpx=Math.max(64,Math.min(12000, Math.round(opt.width||2000)));
  let scale=wpx/worldW;
  let hpx=Math.max(1,Math.round(worldH*scale));
  const MAXPIX=36e6;
  if(wpx*hpx>MAXPIX){
    const k=Math.sqrt(MAXPIX/(wpx*hpx));
    wpx=Math.max(64,Math.round(wpx*k)); scale=wpx/worldW; hpx=Math.max(1,Math.round(worldH*scale));
  }
  const c=document.createElement("canvas");
  c.width=wpx; c.height=hpx;
  const g=c.getContext("2d");
  if(!g) return null;
  const sv={cv,ctx,W,H,DPR,view:S.view,hover:S.hover,sel:S.sel,band:S.band};
  cv=c; ctx=g; W=wpx; H=hpx; DPR=1;
  S.view={cx:(x0+x1)/2, cy:(y0+y1)/2, s:scale};
  S.hover=-1; S.sel=new Set(); S.band=null;
  S.exporting=opt;
  try{
    ctx.setTransform(1,0,0,1,0,0);
    draw();
  } finally {
    S.exporting=null;
    cv=sv.cv; ctx=sv.ctx; W=sv.W; H=sv.H; DPR=sv.DPR;
    S.view=sv.view; S.hover=sv.hover; S.sel=sv.sel; S.band=sv.band;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    draw();
  }
  return c;
}
function pngOpts(){ return {width:S.png.width, bg:S.png.bg, grid:S.png.grid, margin:S.png.margin}; }
function exportPNG(){
  const c=renderScene(pngOpts());
  if(!c) return echo("Nothing to export yet","warn");
  const finish=bl=>{
    if(!bl) return echo("Could not encode that image","warn");
    const u=URL.createObjectURL(bl), a=document.createElement("a");
    a.href=u; a.download=S.docName+".png"; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
    echo("PNG exported  "+c.width+"\u00D7"+c.height);
  };
  if(c.toBlob) c.toBlob(finish,"image/png");
  else finish(null);
}
function copyImage(){
  const c=renderScene(pngOpts());
  if(!c) return echo("Nothing to copy yet","warn");
  if(!(navigator.clipboard && window.ClipboardItem && c.toBlob))
    return echo("This browser will not hand over the clipboard - use Export PNG","warn");
  c.toBlob(bl=>{
    if(!bl) return echo("Could not encode that image","warn");
    navigator.clipboard.write([new ClipboardItem({"image/png":bl})])
      .then(()=>echo("Image copied  "+c.width+"\u00D7"+c.height))
      .catch(()=>echo("Clipboard blocked here - use Export PNG instead","warn"));
  },"image/png");
}

/* ---- save / open ------------------------------------------------------ */
function refDoc(withSrc){
  const R=S.refImage;
  if(!R) return null;
  const o={name:R.name,x:R.x,y:R.y,w:R.w,h:R.h,opacity:R.opacity,visible:R.visible,
           locked:R.locked,rot:R.rot||0,crop:R.crop||null,mode:R.mode||"fade"};
  if(withSrc && R.img){
    try{
      o.src = String(R.img.src||"").slice(0,5)==="data:" ? R.img.src : null;
      if(!o.src){
        const c=document.createElement("canvas");
        c.width=R.img.naturalWidth; c.height=R.img.naturalHeight;
        c.getContext("2d").drawImage(R.img,0,0);
        o.src=c.toDataURL("image/png");
      }
    }catch(_){ o.src=null; }
  }
  return o;
}
function serializeDrawing(withImage){
  return {
    app:FILE_TAG, version:FILE_VER, saved:new Date().toISOString(), name:S.docName,
    ents:S.ents, layers:S.layers, styles:S.styles, cur:S.cur, curStyle:S.curStyle,
    view:S.view, gridStep:S.gridStep, gridShow:S.gridShow, gridSnap:S.gridSnap,
    ortho:S.ortho, osnap:S.osnap, weld:S.weld, edgeAssist:S.edgeAssist,
    textHeight:S.textHeight, groupSeq:S.groupSeq,
    flow:S.flow, mk:S.mk, png:S.png,
    ref: refDoc(withImage!==false)
  };
}
function applyDrawing(d,label){
  if(!d || d.app!==FILE_TAG) { echo("That is not a BackToTheDrawingBoard file","warn"); return false; }
  S.ents=Array.isArray(d.ents)? d.ents : [];
  if(Array.isArray(d.layers) && d.layers.length) S.layers=d.layers;
  if(Array.isArray(d.styles) && d.styles.length) S.styles=d.styles;
  S.cur=Math.max(0,Math.min(d.cur|0, S.layers.length-1));
  S.curStyle=Math.max(0,Math.min(d.curStyle|0, S.styles.length-1));
  if(d.view && isFinite(d.view.s) && d.view.s>0) S.view={cx:d.view.cx,cy:d.view.cy,s:d.view.s};
  for(const k of ["gridStep","gridShow","gridSnap","ortho","osnap","weld","edgeAssist","textHeight","groupSeq"])
    if(d[k]!==undefined) S[k]=d[k];
  if(d.flow) Object.assign(S.flow,d.flow);
  if(d.mk)   Object.assign(S.mk,d.mk);
  if(d.png)  Object.assign(S.png,d.png);
  S.sel.clear(); S.undo.length=0; S.redo.length=0; S.op={}; S.pending=[]; S.base=null;
  S.refImage=null; refImgEl=null;
  setDocName(d.name||"untitled");
  if(d.ref && d.ref.src){
    const img=new Image();
    img.onload=()=>{
      const o=Object.assign({},d.ref); delete o.src;
      S.refImage=Object.assign(o,{img});
      refImgEl=img;
      try{ prepareReferenceEdges(S.refImage); }catch(_){}
      draw(); updateProps(); paintRibbon();
    };
    img.src=d.ref.src;
  }
  syncToggles();
  paintLayers(); paintStyles(); paintRibbon(); paintOptbar(); setPrompt();
  draw(); updateProps();
  echo((label||"Opened")+" \u00B7 "+S.ents.length+" objects");
  return true;
}
function saveDrawing(){
  requestString("Save as", S.docName, n=>{
    setDocName(n||S.docName);
    let txt;
    try{ txt=JSON.stringify(serializeDrawing(true)); }
    catch(_){ setPrompt(); return echo("Could not serialise this drawing","warn"); }
    download(txt, S.docName+".b2db", "application/json");
    echo("Saved "+S.docName+".b2db  ("+(txt.length/1024).toFixed(0)+" KB)");
    setPrompt();
  });
}
function openDrawingText(txt,name){
  let d=null;
  try{ d=JSON.parse(txt); }catch(_){ return echo("That file is not valid JSON","warn"); }
  if(applyDrawing(d,"Opened") && name) setDocName(name);
}

/* ---- autosave --------------------------------------------------------- */
function markDirty(){
  if(autoTimer) clearTimeout(autoTimer);
  autoTimer=setTimeout(autosaveNow,1500);
}
function autosaveNow(){
  autoTimer=null;
  try{
    let doc=serializeDrawing(true), txt=JSON.stringify(doc);
    if(txt.length>2.4e6){ doc=serializeDrawing(false); doc.imageDropped=true; txt=JSON.stringify(doc); }
    if(txt.length>4.4e6){ autoStamp="too large to autosave"; return; }
    localStorage.setItem(AUTOKEY,txt);
    autoStamp="saved "+new Date().toLocaleTimeString();
  }catch(_){ autoStamp="autosave unavailable"; }
}
function autosaveDoc(){
  try{
    const t=localStorage.getItem(AUTOKEY);
    if(!t) return null;
    const d=JSON.parse(t);
    return (d && d.app===FILE_TAG && Array.isArray(d.ents) && d.ents.length) ? d : null;
  }catch(_){ return null; }
}
function offerRestore(){
  const d=autosaveDoc();
  if(!d) return;
  const when=d.saved ? new Date(d.saved).toLocaleString() : "earlier";
  requestString("Restore autosave from "+when+"?  y/n","y",v=>{
    if(/^y/i.test(String(v||""))){
      applyDrawing(d,"Autosave restored");
      if(d.imageDropped) echo("Autosave restored - the reference image was too large to keep");
    } else echo("Starting fresh. The autosave stays until you draw something.");
    setPrompt();
  });
}
function clearAutosave(){
  try{ localStorage.removeItem(AUTOKEY); }catch(_){}
  autoStamp=""; echo("Autosave cleared");
}

/* ---- entity clipboard ------------------------------------------------- */
let clipMem=null;
function clipCopy(cut){
  expandSelectionGroups();
  if(!S.sel.size) return echo("Select something first","warn");
  const src=[...S.sel].map(i=>S.ents[i]).filter(Boolean);
  let payload;
  try{ payload={app:FILE_TAG, kind:"clip", ents:JSON.parse(JSON.stringify(src))}; }
  catch(_){ return echo("That selection cannot be copied","warn"); }
  clipMem=payload;
  try{ localStorage.setItem(CLIPKEY,JSON.stringify(payload)); }catch(_){}
  if(cut){ eraseSel(); echo("Cut "+src.length+" object(s)"); }
  else echo("Copied "+src.length+" object(s)");
}
function clipRead(){
  if(clipMem) return clipMem;
  try{
    const t=localStorage.getItem(CLIPKEY);
    if(t){ const d=JSON.parse(t); if(d && d.kind==="clip" && Array.isArray(d.ents)) return d; }
  }catch(_){}
  return null;
}
function clipPaste(){
  const d=clipRead();
  if(!d || !d.ents.length) return echo("Clipboard is empty","warn");
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  for(const e of d.ents){
    const q=entBox(e);
    if(q && isFinite(q.x0)){ x0=Math.min(x0,q.x0); y0=Math.min(y0,q.y0); x1=Math.max(x1,q.x1); y1=Math.max(y1,q.y1); }
  }
  const centre = isFinite(x0) ? V((x0+x1)/2,(y0+y1)/2) : V(0,0);
  const dlt=sub(cursorPoint(),centre);
  snap();
  const copies=cloneEntitiesFreshGroups(d.ents.map(clone)).map(e=>moveEnt(e,dlt));
  for(const e of copies){
    if(!(e.li>=0) || e.li>=S.layers.length) e.li=S.cur;
    if(e.si!=null && e.si>=S.styles.length) e.si=S.curStyle;
  }
  const base=S.ents.length;
  S.ents.push(...copies);
  S.sel=new Set(copies.map((_,k)=>base+k));
  setTool("select"); draw(); updateProps();
  echo("Pasted "+copies.length+" object(s)");
}

/* ---- layer delete ----------------------------------------------------- */
function deleteLayer(i){
  if(!S.layers[i]) return;
  if(S.layers.length<2) return echo("A drawing needs at least one layer","warn");
  const nm=S.layers[i].name, n=S.ents.filter(e=>e.li===i).length;
  const go=()=>{
    snap();
    S.ents=S.ents.filter(e=>e.li!==i);
    for(const e of S.ents) if(e.li>i) e.li--;
    S.layers.splice(i,1);
    if(S.cur>i) S.cur--;
    if(S.cur>=S.layers.length) S.cur=S.layers.length-1;
    S.sel.clear(); flowPrune(); resetNudge();
    paintLayers(); draw(); updateProps();
    echo("Deleted layer "+nm+(n?" and "+n+" object"+(n>1?"s":""):""));
  };
  if(n) requestString("Delete layer "+nm+" and its "+n+" object"+(n>1?"s":"")+"?  y/n","",v=>{
    if(/^y/i.test(String(v||""))) go(); else echo("Layer kept");
    setPrompt();
  });
  else go();
}

/* ============================================================ GRIPS
   One table describes every draggable handle in the app. gripSet returns the
   handle positions plus the setter that consumes a new world point, so the
   drag loop never needs to know what kind of thing it is holding.            */
let gripDrag=null;

function gripSet(e){
  const G=[], push=(p,set)=>{ if(p && isFinite(p.x) && isFinite(p.y)) G.push({x:p.x,y:p.y,set}); };
  switch(e.t){
    case "line":
      push(e.a,q=>e.a=q); push(e.b,q=>e.b=q); break;
    case "pline": case "spline":
      e.pts.forEach((p,k)=>push(p,q=>{ e.pts[k]=q; })); break;
    case "circle":
      push(e.c,q=>e.c=q);
      push(V(e.c.x+e.r,e.c.y), q=>{ e.r=Math.max(1e-9,dist(e.c,q)); }); break;
    case "arc": {
      push(e.c,q=>e.c=q);
      push(V(e.c.x+e.r*Math.cos(e.a0), e.c.y+e.r*Math.sin(e.a0)), q=>{ e.a0=wrap(ang(e.c,q)); });
      push(V(e.c.x+e.r*Math.cos(e.a1), e.c.y+e.r*Math.sin(e.a1)), q=>{ e.a1=wrap(ang(e.c,q)); });
      const mid=wrap(e.a0+wrap(e.a1-e.a0)/2);
      push(V(e.c.x+e.r*Math.cos(mid), e.c.y+e.r*Math.sin(mid)), q=>{ e.r=Math.max(1e-9,dist(e.c,q)); });
      break; }
    case "ellipse": {
      const ax=V(Math.cos(e.rot||0),Math.sin(e.rot||0)), ny=perp(ax);
      push(e.c,q=>e.c=q);
      push(add(e.c,mul(ax,e.rx)), q=>{ e.rx=Math.max(1e-9,dist(e.c,q)); });
      push(add(e.c,mul(ny,e.ry)), q=>{ e.ry=Math.max(1e-9,dist(e.c,q)); });
      break; }
    case "text": push(e.p,q=>e.p=q); break;
    case "dim": {
      push(e.a,q=>e.a=q); push(e.b,q=>e.b=q);
      const d=norm(sub(e.b,e.a)), nn=perp(d), mid=mul(add(e.a,e.b),.5);
      push(add(mid,mul(nn,e.off||0)), q=>{
        const dd=norm(sub(e.b,e.a)), n2=perp(dd), v=sub(q,e.a);
        e.off=v.x*n2.x+v.y*n2.y;
      });
      break; }
    case "ink":
      if(e.pts.length){
        push(e.pts[0], q=>{ e.pts[0]=q; });
        push(e.pts[e.pts.length-1], q=>{ e.pts[e.pts.length-1]=q; });
      }
      break;
    case "mshape": push(e.a,q=>e.a=q); push(e.b,q=>e.b=q); break;
    case "mtext":  push(e.p,q=>e.p=q); if(e.lead) push(e.lead,q=>e.lead=q); break;
    case "node":
      for(const [g,hx,hy] of [["nw",-1,1],["ne",1,1],["se",1,-1],["sw",-1,-1]])
        push(V(e.p.x+hx*e.w/2, e.p.y+hy*e.h/2), q=>flowResizeTo(e,g,q));
      break;
    case "edge": {
      const wp=e.wp||[];
      wp.forEach((p,k)=>push(p,q=>{ e.wp[k]=q; }));
      for(const gh of edgeGhosts(e)){
        const k=gh.k;
        G.push({
          x:gh.x, y:gh.y, ghost:true,
          insert(q){
            if(!e.wp) e.wp=[];
            e.wp.splice(k,0,V(q.x,q.y));
            this.set=p=>{ e.wp[k]=p; };
          },
          set(){}
        });
      }
      break; }
  }
  return G;
}
function paintGrips(e){
  const G=gripSet(e);
  ctx.save();
  for(const g of G){
    const x=Math.round(X(g.x)), y=Math.round(Y(g.y));
    if(g.ghost){
      ctx.strokeStyle=getCSS("--pen"); ctx.lineWidth=1; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(x,y-3.5); ctx.lineTo(x+3.5,y); ctx.lineTo(x,y+3.5); ctx.lineTo(x-3.5,y);
      ctx.closePath(); ctx.stroke();
    } else {
      ctx.fillStyle=getCSS("--pen");
      ctx.fillRect(x-3,y-3,6,6);
    }
  }
  ctx.restore();
}
function gripHitAt(sx,sy){
  if(S.tool!=="select" || !S.sel.size) return null;
  for(const i of S.sel){
    const e=S.ents[i];
    if(!e) continue;
    const L=S.layers[e.li];
    if(L && (!L.on || L.lock)) continue;
    for(const g of gripSet(e))
      if(Math.hypot(X(g.x)-sx, Y(g.y)-sy)<=7) return {e,g,i};
  }
  return null;
}
function gripBegin(sx,sy){
  const h=gripHitAt(sx,sy);
  if(!h) return false;
  snap();
  gripDrag=h;
  return true;
}
function gripMove(){
  const q=cursorPoint();
  const g=gripDrag.g;
  if(g.ghost && !g._made){ g._made=true; g.insert(q); }
  g.set(q);
  readout(); draw();
}
function gripEnd(){
  const e=gripDrag.e;
  gripDrag=null;
  if(e && e.t==="node") flowFit(e);
  draw(); updateProps();
  echo("Edited "+(e? (flowIsEnt(e)? flowEntName(e).toLowerCase() : mkIsEnt(e)? mkEntName(e).toLowerCase() : e.t) : "object"));
}

/* ============================================================ SWIMLANES */
function laneHeader(e){
  const t=Math.min(e.fs*2.4, (e.dir==="h"? e.w : e.h)*0.2);
  return Math.max(e.fs*1.6, t);
}
function laneHeaderRect(e){
  const hb=laneHeader(e);
  const x0=e.p.x-e.w/2, x1=e.p.x+e.w/2, y0=e.p.y-e.h/2, y1=e.p.y+e.h/2;
  return e.dir==="h" ? {x0, y0, x1:x0+hb, y1} : {x0, y0:y1-hb, x1, y1};
}
function flowPaintLane(e,selected,hot){
  const s=S.view.s, m=e.mk||{};
  const x=X(e.p.x-e.w/2), y=Y(e.p.y+e.h/2), w=e.w*s, h=e.h*s;
  const hb=laneHeader(e)*s;
  ctx.save();
  ctx.setLineDash([]);
  ctx.lineWidth=Math.max(1,(m.w||0)*s);
  ctx.strokeStyle= hot? getCSS("--snap") : (m.line||"#2d6fa8");
  ctx.globalAlpha=0.10; ctx.fillStyle=m.fill||"#f4f7fb";
  ctx.fillRect(x,y,w,h);
  ctx.globalAlpha=0.90;
  if(e.dir==="h") ctx.fillRect(x,y,hb,h); else ctx.fillRect(x,y,w,hb);
  ctx.globalAlpha=1;
  ctx.strokeRect(x,y,w,h);
  ctx.beginPath();
  if(e.dir==="h"){ ctx.moveTo(x+hb,y); ctx.lineTo(x+hb,y+h); }
  else { ctx.moveTo(x,y+hb); ctx.lineTo(x+w,y+hb); }
  ctx.stroke();
  if(e.s){
    ctx.fillStyle=m.text||"#16202b";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font=Math.max(7,e.fs*s)+"px "+getCSS("--draft");
    if(e.dir==="h"){
      ctx.translate(x+hb/2, y+h/2); ctx.rotate(-Math.PI/2);
      ctx.fillText(e.s,0,0);
    } else ctx.fillText(e.s, x+w/2, y+hb/2);
  }
  ctx.restore();
}
/* A lane picks up whatever is standing in it, so dragging the lane drags the
   column. Membership is by centre point, decided at drag time. */
function laneExpand(indices){
  const set=new Set(indices);
  const lanes=[...set].map(i=>S.ents[i]).filter(e=>e && e.t==="node" && e.k==="lane");
  if(!lanes.length) return [...set];
  S.ents.forEach((e,j)=>{
    if(set.has(j) || !e) return;
    const L=S.layers[e.li];
    if(L && (!L.on || L.lock)) return;
    let c=null;
    if(e.t==="node") c=e.p;
    else { const b=entBox(e); if(b && isFinite(b.x0)) c=V((b.x0+b.x1)/2,(b.y0+b.y1)/2); }
    if(!c) return;
    for(const ln of lanes){
      if(ln===e) continue;
      if(Math.abs(c.x-ln.p.x)<=ln.w/2 && Math.abs(c.y-ln.p.y)<=ln.h/2){ set.add(j); return; }
    }
  });
  return [...set];
}

/* ============================================================ WAYPOINTS
   The logical chain is anchor -> waypoints -> anchor. Elbows are generated on
   top of it, so a waypoint index always matches a chain segment index and the
   ghost handles line up with what you see.                                   */
function flowDirTo(from,to,route){
  const d=sub(to,from);
  if(route!=="ortho") return d;
  return Math.abs(d.x)>=Math.abs(d.y) ? V(d.x<0?-1:1,0) : V(0,d.y<0?-1:1);
}
function edgeChain(e){
  const A=flowEnd(e.from), B=flowEnd(e.to);
  if(!A||!B) return null;
  const wp=(e.wp||[]).filter(p=>p && isFinite(p.x));
  const firstT=wp.length? wp[0] : B.c;
  const lastT =wp.length? wp[wp.length-1] : A.c;
  const pa=A.node? flowRayExit(A.node, flowDirTo(A.c,firstT,e.route)) : A.c;
  const pb=B.node? flowRayExit(B.node, flowDirTo(B.c,lastT,e.route)) : B.c;
  return [pa,...wp,pb];
}
/* One ghost handle per logical segment, parked on the middle of the drawn
   sub-path for that segment so it sits on the line you can actually see. */
function edgeGhosts(e){
  const chain=edgeChain(e);
  if(!chain) return [];
  const R=flowRoute(e)||chain;
  if(chain.length===2){ const m=flowRouteMid(R); return [{x:m.x,y:m.y,k:0}]; }
  const idxOf=(p,from)=>{
    let bi=from, bd=1e18;
    for(let i=from;i<R.length;i++){ const d=dist(R[i],p); if(d<bd){ bd=d; bi=i; } }
    return bi;
  };
  const out=[];
  let ri=0;
  for(let k=0;k<chain.length-1;k++){
    const ni=idxOf(chain[k+1],ri);
    const seg=(ni>ri)? R.slice(ri,ni+1) : [chain[k],chain[k+1]];
    const m=flowRouteMid(seg);
    out.push({x:m.x,y:m.y,k});
    ri=Math.max(ni,ri);
  }
  return out;
}
function edgeElbows(chain){
  const out=[chain[0]];
  for(let k=0;k<chain.length-1;k++){
    const p=chain[k], q=chain[k+1];
    if(Math.abs(q.x-p.x)>1e-9 && Math.abs(q.y-p.y)>1e-9)
      out.push(Math.abs(q.x-p.x)>=Math.abs(q.y-p.y) ? V(q.x,p.y) : V(p.x,q.y));
    out.push(q);
  }
  return out;
}
function flowClearWaypoints(){
  const sel=[...S.sel].map(i=>S.ents[i]).filter(e=>e && e.t==="edge" && e.wp && e.wp.length);
  const list=sel.length? sel : S.ents.filter(e=>e.t==="edge" && e.wp && e.wp.length);
  if(!list.length) return echo("No connector has waypoints","warn");
  snap();
  let n=0;
  for(const e of list){ n+=e.wp.length; delete e.wp; }
  draw(); updateProps();
  echo("Cleared "+n+" waypoint"+(n>1?"s":""));
}

function pngWidget(){
  const wrap=document.createElement("div"); wrap.className="rstack";
  const r1=document.createElement("div"); r1.className="rrow"; r1.style.gap="3px";
  const lab=document.createElement("span"); lab.className="oh"; lab.textContent="px wide";
  const wd=document.createElement("input");
  wd.type="number"; wd.step="100"; wd.min="64"; wd.value=S.png.width; wd.style.maxWidth="66px";
  wd.title="Long-edge width of the exported image";
  wd.onchange=()=>{ const v=parseInt(wd.value,10); if(isFinite(v)) S.png.width=Math.max(64,Math.min(12000,v)); };
  r1.append(lab,wd);
  const r2=document.createElement("div"); r2.className="rrow"; r2.style.gap="3px";
  const bg=document.createElement("select");
  for(const [v,t] of [["#ffffff","White"],["transparent","Transparent"],["#12161b","Board"]]){
    const o=document.createElement("option"); o.value=v; o.textContent=t;
    if(v===S.png.bg) o.selected=true; bg.append(o);
  }
  bg.title="Background of the exported image";
  bg.onchange=()=>S.png.bg=bg.value;
  const gl=document.createElement("label"); gl.style.display="flex"; gl.style.alignItems="center"; gl.style.gap="3px";
  const gc=document.createElement("input"); gc.type="checkbox"; gc.checked=S.png.grid;
  gc.onchange=()=>S.png.grid=gc.checked;
  const gt=document.createElement("span"); gt.className="oh"; gt.textContent="Grid";
  gl.append(gc,gt);
  r2.append(bg,gl);
  wrap.append(r1,r2);
  return wrap;
}

/* ============================================================ keyboard */
window.addEventListener("keydown",e=>{
  const typing = !!S.ask || (document.activeElement===cmdin && cmdin.value.length>0);
  if(e.key==="Escape"){ cmdin.value=""; cancel(); return; }
  if(e.key==="F8"){ e.preventDefault(); return toggle("ortho"); }
  if(e.key==="F9"){ e.preventDefault(); return toggle("gridSnap"); }
  if(e.key==="F7"){ e.preventDefault(); return toggle("gridShow"); }
  if(e.key==="F3"){ e.preventDefault(); return toggle("osnap"); }
  if(e.key==="F4"){ e.preventDefault(); return toggle("weld"); }
  if(e.key==="F6"){ e.preventDefault(); return toggle("edgeAssist"); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); return e.shiftKey?redo():undo(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){ e.preventDefault(); return redo(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="a"){ e.preventDefault(); S.sel=new Set(S.ents.map((_,i)=>i)); draw(); updateProps(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="c"){ e.preventDefault(); return clipCopy(false); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="x"){ e.preventDefault(); return clipCopy(true); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="v"){ e.preventDefault(); return clipPaste(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){ e.preventDefault(); return saveDrawing(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="o"){ e.preventDefault(); return document.getElementById("b2dbin").click(); }
  if(e.key==="Delete"||e.key==="Backspace"){ if(!typing){ e.preventDefault(); eraseSel(); } return; }
  if(typing) return;
  const NUD={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];
  if(NUD){
    if(!S.sel.size || S.pending.length || S.base) return;
    e.preventDefault(); return nudge(NUD[0],NUD[1],e);
  }
  const k=e.key.toUpperCase();
  for(const [id,T] of Object.entries(TOOLS)) if(T.hot===k){ e.preventDefault(); return setTool(id); }
  if(k==="Z"&&!e.ctrlKey&&!e.metaKey){ e.preventDefault(); zoomExtents(); }
});

let ribbonTab="Home";
function itemOf(id){ return TOOLS[id] || ACTIONS[id]; }
function mkBtn(id,big){
  const T=itemOf(id), b=document.createElement("button");
  b.className=big?"big":"small"; b.dataset.item=id;
  const hot = T.hot? " or press "+T.hot : "";
  b.title=T.label+"   type "+(T.alias||id)+hot;
  b.innerHTML='<svg viewBox="0 0 20 20" aria-hidden="true">'+T.svg+'</svg><span>'+
    T.label.replace(/,.*$/,"").replace(/\s*\(.*\)$/,"")+'</span>';
  b.onclick=()=>{ if(TOOLS[id]) setTool(id); else ACTIONS[id].run(); paintRibbon(); };
  return b;
}
function paintRibbon(){
  const tabs=document.getElementById("rtabs");
  if(!tabs.childElementCount){
    for(const name of Object.keys(RIBBON)){
      const b=document.createElement("button");
      b.className="rtab"; b.textContent=name; b.setAttribute("role","tab");
      b.onclick=()=>{ ribbonTab=name; paintRibbon(); };
      tabs.append(b);
    }
  }
  [...tabs.children].forEach(b=>b.setAttribute("aria-selected",String(b.textContent===ribbonTab)));

  const host=document.getElementById("rpanels");
  host.innerHTML="";
  for(const P of RIBBON[ribbonTab]){
    const panel=document.createElement("div"); panel.className="rpanel";
    const body=document.createElement("div"); body.className="rpanel-body";
    if(P.big) body.append(mkBtn(P.big,true));
    if(P.small){
      const cols=document.createElement("div"); cols.className="rcols";
      for(let i=0;i<P.small.length;i+=3){
        const row=document.createElement("div"); row.className="rrow";
        const col=document.createElement("div"); col.className="rcols";
        P.small.slice(i,i+3).forEach(id=>col.append(mkBtn(id,false)));
        row.append(col); cols.append(row);
      }
      // lay the groups of three out side by side
      cols.className="rrow";
      body.append(cols);
    }
    if(P.custom==="layers")  body.append(layerWidget());
    if(P.custom==="style")   body.append(styleWidget());
    if(P.custom==="toggles") body.append(toggleWidget());
    if(P.custom==="grid")    body.append(gridWidget());
    if(P.custom==="pen")     body.append(penWidget());
    if(P.custom==="flow")    body.append(flowWidget());
    if(P.custom==="png")     body.append(pngWidget());
    const lab=document.createElement("div"); lab.className="rpanel-label"; lab.textContent=P.name;
    panel.append(body,lab); host.append(panel);
  }
  host.querySelectorAll(".big,.small").forEach(b=>{
    if(TOOLS[b.dataset.item]) b.setAttribute("aria-pressed",String(b.dataset.item===S.tool));
  });
  cv.className = S.tool==="select" ? "picking"
    : (MK_TOOLS[S.tool] ? (MK_TOOLS[S.tool].kind==="erase" ? "erasing" : "inking") : "");
}

/* ============================================================ options bar
   Context controls for the active tool, the way Revit's Options Bar sits
   under the ribbon and changes per tool. Chain/Radius drive the Line tool's
   chained-segment drawing; Offset drives both the Line tool and Pick Lines. */
function paintOptbar(){
  const host=document.getElementById("optbar");
  host.innerHTML="";
  const activeTool=TOOLS[S.tool];
  if(activeTool && (S.tool!=="select" || S.sel.size)){
    const context=document.createElement("span");
    context.className="context-name";
    context.textContent=activeTool.label.replace(/,.*/,"");
    host.append(context);
  }
  const num=(label,val,step,set,disabled)=>{
    const wrap=document.createElement("label");
    const sp=document.createElement("span"); sp.textContent=label; sp.className="oh";
    const i=document.createElement("input"); i.type="number"; i.step=step||"any"; i.value=val; i.disabled=!!disabled;
    i.onchange=()=>{ const v=parseFloat(i.value); if(isFinite(v)) set(v); paintOptbar(); };
    wrap.append(sp,i); return wrap;
  };
  const chk=(label,val,set)=>{
    const wrap=document.createElement("label");
    const i=document.createElement("input"); i.type="checkbox"; i.checked=!!val;
    i.onchange=()=>{ set(i.checked); paintOptbar(); draw(); };
    const sp=document.createElement("span"); sp.textContent=label;
    wrap.append(i,sp); return wrap;
  };
  const radio=(options,val,set)=>{
    const wrap=document.createElement("div"); wrap.className="rrow";
    for(const [v,l] of options){
      const b=document.createElement("button"); b.className="small"; b.style.minWidth="0";
      b.textContent=l; b.setAttribute("aria-pressed", String(val===v));
      b.onclick=()=>{ set(v); paintOptbar(); draw(); };
      wrap.append(b);
    }
    return wrap;
  };
  if(flowIsTool(S.tool)){ flowOptbar(host,{num,chk,radio}); return; }
  if(mkIsTool(S.tool)){ mkOptbar(host,{num,chk,radio}); return; }
  if(S.tool==="line"){
    host.append(chk("Chain", S.chain, v=>{S.chain=v; S.pending=[]; S.chainPrev=null; setPrompt(); draw();}));
    host.append(num("Offset", S.drawOffset, "any", v=>S.drawOffset=v));
    host.append(chk("Radius", S.useRadius, v=>S.useRadius=v));
    host.append(num("", S.chainRadius, "any", v=>S.chainRadius=Math.max(0,v), !S.useRadius));
  } else if(S.tool==="pickLines"){
    host.append(num("Offset", S.drawOffset, "any", v=>{S.drawOffset=v; if(S.op) S.op.d=Math.max(0,v);}));
  } else if(S.tool==="offset"){
    host.append(radio([["numerical","Numerical"],["graphical","Graphical"]], S.offsetMode, v=>S.offsetMode=v));
    if(S.offsetMode==="numerical")
      host.append(num("Offset", S.op.d!=null?S.op.d:S.lastOffset, "any",
        v=>{ S.lastOffset=v; if(S.op) S.op.d=v; }));
    host.append(chk("Copy", S.copyOffset, v=>S.copyOffset=v));
  } else if(S.tool==="fillet"||S.tool==="chamfer"){
    host.append(num(S.tool==="fillet"?"Radius":"Distance",
      S.op.r!=null? S.op.r : (S.tool==="fillet"?S.lastFillet:S.lastChamfer), "any",
      v=>{ const r=Math.max(0,v); if(S.op) S.op.r=r; if(S.tool==="fillet") S.lastFillet=r; else S.lastChamfer=r; }));
  } else if(S.tool==="scale"){
    host.append(radio([["graphical","Graphical"],["numerical","Numerical"]], S.scaleMode,
      v=>{ S.scaleMode=v; S.pending=[]; setPrompt(); draw(); }));
    if(S.scaleMode==="numerical") host.append(num("Scale", S.lastScaleFactor, "any", v=>S.lastScaleFactor=v));
  } else if(S.tool==="copy"){
    host.append(chk("Multiple", S.copyMultiple, v=>S.copyMultiple=v));
  } else if(S.tool==="rotate"){
    host.append(chk("Copy", S.copyRotate, v=>S.copyRotate=v));
  } else if(S.tool==="mirror"){
    host.append(chk("Copy", S.copyMirror, v=>S.copyMirror=v));
  } else if(S.tool==="polygon"){
    host.append(num("Sides", S.polySides, "1", v=>S.polySides=Math.max(3,Math.min(64,Math.round(v)))));
    const wrap=document.createElement("label"); const sp=document.createElement("span"); sp.className="oh"; sp.textContent="";
    const sel=document.createElement("select");
    for(const [v,l] of [["1","Inscribed"],["0","Circumscribed"]]){
      const o=document.createElement("option"); o.value=v; o.textContent=l;
      if((v==="1")===S.polyInscribed) o.selected=true; sel.append(o);
    }
    sel.onchange=()=>{ S.polyInscribed=sel.value==="1"; draw(); };
    wrap.append(sp,sel); host.append(wrap);
  } else if(S.tool==="select" && S.sel.size===1){
    const e=S.ents[[...S.sel][0]];
    if(e && e.si!=null){
      const lab=document.createElement("span"); lab.className="oh"; lab.textContent="Line style";
      const sw=document.createElement("span"); sw.className="swatch";
      const st=S.styles[e.si]; if(st) sw.style.background=aciColor(st.aci);
      const nm=document.createElement("span"); nm.textContent=st? st.name : "";
      host.append(lab,sw,nm);
    }
  }
  if(S.tool==="select" && [...S.sel].some(i=>mkIsEnt(S.ents[i]))){
    const lab=document.createElement("span"); lab.className="oh"; lab.textContent="Markup colour";
    host.append(lab, mkColorChips(()=>{ mkRestyleSelection(); paintOptbar(); }));
  }
}

/* ============================================================ layers UI */
function paintLayers(){
  if(ribbonTab==="Home") paintRibbon();
  const host=document.getElementById("layers"); host.innerHTML="";
  S.layers.forEach((L,i)=>{
    const d=document.createElement("div");
    d.className="layer"+(i===S.cur?" current":"")+(L.on?"":" hidden");
    d.onclick=ev=>{ if(ev.target.closest(".licon")) return; S.cur=i; paintLayers(); };
    const sw=document.createElement("span"); sw.className="swatch"; sw.style.background=aciColor(L.aci);
    sw.title="ACI "+L.aci+" - click to change";
    sw.onclick=ev=>{ ev.stopPropagation();
      const k=ACI.findIndex(a=>a.i===L.aci); L.aci=ACI[(k+1)%ACI.length].i; paintLayers(); draw(); };
    const nm=document.createElement("span"); nm.className="lname"; nm.textContent=L.name;
    nm.title="Double-click to rename";
    nm.ondblclick=ev=>{ ev.stopPropagation();
      requestString("Rename layer", L.name, v=>{
        if(v) L.name=v.trim().toUpperCase()||L.name;

    const vis=document.createElement("button"); vis.className="licon"+(L.on?" on":"");
    vis.textContent=L.on?"\u25CF":"\u25CB"; vis.title="Show / hide";
    vis.onclick=ev=>{ev.stopPropagation(); L.on=!L.on; paintLayers(); draw();};
    const lk=document.createElement("button"); lk.className="licon"+(L.lock?" on":"");
    lk.textContent=L.lock?"\u25A0":"\u25A1"; lk.title="Lock / unlock";

    const del=document.createElement("button"); del.className="licon";
    del.textContent="\u2715"; del.title="Delete this layer";

document.getElementById("btn-addlayer").onclick=()=>{

  });
};

/* ============================================================ line styles UI
   Mirrors the Layers list: swatch cycles colour, weight is a typed mm value,
   the little dashed-line button cycles a small preset list of dash patterns. */
const PAT_PRESETS=[null,[3,2],[2,1.5],[6,2,1,2],[12,2,2,2],[8,2,1,2,1,2],[10,3]];
function patKey(p){ return p? p.join(",") : "solid"; }
function nextPattern(p){
  const idx=PAT_PRESETS.findIndex(x=>patKey(x)===patKey(p));
  return PAT_PRESETS[(idx+1+PAT_PRESETS.length)%PAT_PRESETS.length];
}
function paintStyles(){
  if(ribbonTab==="Home") paintRibbon();
  const host=document.getElementById("styles"); host.innerHTML="";
  S.styles.forEach((st,i)=>{
    const d=document.createElement("div");
    d.className="style-row"+(i===S.curStyle?" current":"");
    d.onclick=ev=>{ if(ev.target.closest("input,.spat,.swatch")) return; S.curStyle=i; paintStyles(); };
    const sw=document.createElement("span"); sw.className="swatch"; sw.style.background=aciColor(st.aci);
    sw.title="ACI "+st.aci+" - click to change";
    sw.onclick=ev=>{ ev.stopPropagation();
      const k=ACI.findIndex(a=>a.i===st.aci); st.aci=ACI[(k+1)%ACI.length].i; paintStyles(); draw(); };
    const nm=document.createElement("span"); nm.className="sname"; nm.textContent=st.name;
    nm.title="Double-click to rename";
    nm.ondblclick=ev=>{ ev.stopPropagation();
      requestString("Rename line style", st.name, v=>{ if(v) st.name=v.trim()||st.name; paintStyles(); draw(); }); };
    const w=document.createElement("input"); w.className="sweight"; w.type="number"; w.step="0.01"; w.min="0.01";
    w.value=st.w; w.title="Line weight, mm";
    w.onclick=ev=>ev.stopPropagation();
    w.onchange=()=>{ const v=parseFloat(w.value); if(isFinite(v)&&v>0) st.w=v; else w.value=st.w; draw(); };
    const pat=document.createElement("button"); pat.className="spat"; pat.title="Click to cycle the dash pattern";
    pat.innerHTML='<svg viewBox="0 0 28 14"><line x1="2" y1="7" x2="26" y2="7" stroke-dasharray="'+(st.pat?st.pat.join(","):"")+'"/></svg>';
    pat.onclick=ev=>{ ev.stopPropagation(); st.pat=nextPattern(st.pat); paintStyles(); draw(); };
    d.append(sw,nm,w,pat); host.append(d);
  });
}
document.getElementById("btn-addstyle").onclick=()=>{

/* ============================================================ properties */
function updateProps(){
  if(S.tool==="select") paintOptbar();
  const host=document.getElementById("props"), title=document.getElementById("prop-title");
  host.innerHTML="";
  if(S.sel.size===1){
    const i=[...S.sel][0], e=S.ents[i];
    title.textContent=flowIsEnt(e)? flowEntName(e) : mkIsEnt(e)? mkEntName(e) : e.t.toUpperCase();
    const rows=[];
    if(e.t==="line"){
      rows.push(num("Length",dist(e.a,e.b),v=>{
        const d=norm(sub(e.b,e.a)); snap(); e.b=add(e.a,mul(d,v)); }));
      rows.push(num("Angle",deg(wrap(ang(e.a,e.b))),v=>{
        const L=dist(e.a,e.b); snap(); e.b=add(e.a,V(L*Math.cos(rad(v)),L*Math.sin(rad(v)))); }));
      rows.push(num("Start X",e.a.x,v=>{snap();e.a.x=v}));
      rows.push(num("Start Y",e.a.y,v=>{snap();e.a.y=v}));
    }
    if(e.t==="circle"){
      rows.push(num("Radius",e.r,v=>{snap();e.r=Math.max(1e-6,v)}));
      rows.push(num("Center X",e.c.x,v=>{snap();e.c.x=v}));
      rows.push(num("Center Y",e.c.y,v=>{snap();e.c.y=v}));
    }
    if(e.t==="arc"){
      rows.push(num("Radius",e.r,v=>{snap();e.r=Math.max(1e-6,v)}));
      rows.push(num("Start ang",deg(e.a0),v=>{snap();e.a0=wrap(rad(v))}));
      rows.push(num("End ang",deg(e.a1),v=>{snap();e.a1=wrap(rad(v))}));
    }
    if(e.t==="text"){
      rows.push(txt("Text",e.s,v=>{snap();e.s=v}));
      rows.push(num("Height",e.h,v=>{snap();e.h=Math.max(.1,v)}));
      rows.push(num("Rotation",deg(e.rot||0),v=>{snap();e.rot=rad(v)}));
    }
    if(e.t==="pline") rows.push(info("Vertices",e.pts.length+(e.closed?" (closed)":"")));
    if(e.t==="ellipse"){
      rows.push(num("Radius X",e.rx,v=>{snap();e.rx=Math.max(1e-6,v)}));
      rows.push(num("Radius Y",e.ry,v=>{snap();e.ry=Math.max(1e-6,v)}));
      rows.push(num("Rotation",deg(e.rot||0),v=>{snap();e.rot=rad(v)}));
    }
    if(e.t==="spline") rows.push(info("Vertices",e.pts.length+(e.closed?" (closed)":"")));
    if(e.t==="dim")   rows.push(info("Measured",dist(e.a,e.b).toFixed(3)+" mm"));
    if(mkIsEnt(e))    rows.push(...mkPropRows(e,{mkrow,num,txt,choice,info}));
    if(flowIsEnt(e))  rows.push(...flowPropRows(e,{mkrow,num,txt,choice,info}));
    rows.push(layerSel(e));
    if(e.si!=null) rows.push(styleSel(e));
    rows.forEach(r=>host.append(r));
  } else if(S.sel.size>1){
    const gids=[...new Set([...S.sel].map(i=>S.ents[i]&&S.ents[i].gid).filter(Boolean))];
    const oneGroup=gids.length===1 && [...S.sel].every(i=>S.ents[i]&&S.ents[i].gid===gids[0]);
    title.textContent=oneGroup?((S.ents[[...S.sel][0]].gname||"GROUP")+" · "+S.sel.size):S.sel.size+" SELECTED";
    const el=document.createElement("div"); el.className="hint";
    el.innerHTML="<kbd>&larr;&uarr;&rarr;&darr;</kbd> nudge by snap step &nbsp; <kbd>Shift</kbd> &times;10 &nbsp; <kbd>Ctrl</kbd> &divide;10<br>"+
      "<kbd>M</kbd> move &nbsp; <kbd>Y</kbd> copy &nbsp; <kbd>Del</kbd> erase<br>"+
      (oneGroup?'Grouped object &nbsp; <button class="small" id="prop-ungroup">Ungroup</button>':'<button class="small" id="prop-group">Group selection</button>');
    host.append(el);
    setTimeout(()=>{const g=document.getElementById(oneGroup?"prop-ungroup":"prop-group");if(g)g.onclick=()=>oneGroup?ungroupSelection():groupSelection();},0);
  } else {
    title.textContent="Drawing";
    host.append(info("Objects",String(S.ents.length)));
    host.append(num("Grid step",S.gridStep,v=>{S.gridStep=Math.max(.001,v)}));
    host.append(num("Text height",S.textHeight,v=>{S.textHeight=Math.max(.1,v)}));
    if(S.refImage){
      const R=S.refImage;
      host.append(info("Reference",R.name||"Image"));
      host.append(info("State",R.locked?"Locked":"Editable"));
      host.append(num("Opacity %",Math.round(R.opacity*100),v=>{R.opacity=Math.max(5,Math.min(100,v))/100}));
      host.append(num("Image X",R.x,v=>{if(!R.locked)R.x=v}));
      host.append(num("Image Y",R.y,v=>{if(!R.locked)R.y=v}));
      host.append(num("Image width",R.w,v=>{ if(!R.locked&&v>0){ const k=v/R.w; R.w=v; R.h*=k; }}));
      host.append(num("Rotation °",deg(R.rot||0),v=>{if(!R.locked)R.rot=rad(v)}));
      host.append(choice("Display",R.mode||"normal",[["normal","Normal"],["fade","Fade"],["gray","Greyscale"],["contrast","High contrast"],["invert","Invert"]],v=>R.mode=v));
      host.append(num("Edge threshold",S.edgeThreshold,v=>{S.edgeThreshold=Math.max(15,Math.min(220,v))}));
