<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The app makes no network calls at all, so it can afford a strict policy.
     img-src data: blob: is what stops a crafted drawing from beaconing home,
     and the script-src directive below omits the dynamic-code keyword, which
     disables the runtime code-compilation APIs. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src 'none'; connect-src 'none'; object-src 'none'; child-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>BackToTheDrawingBoard</title>
<style>
  :root{
    /* 2026 neutral CAD shell: dark surfaces, restrained blue state, low contrast transitions */
    color-scheme:dark;
    --ground:#191c21;
    --panel:#252a31;
    --panel-2:#20252c;
    --panel-3:#2b3038;
    --raised:#303640;
    --raised-2:#363d47;
    --rule:#3b424c;
    --rule-soft:#303741;
    --ink:#e5e9ef;
    --ink-dim:#a7b0bd;
    --ink-faint:#77818f;
    --pen:#62a6e8;
    --pen-strong:#78b7f1;
    --pen-soft:#263c50;
    --snap:#54c7c4;
    --alert:#ef8178;
    --grid-minor:#22272e;
    --grid-major:#2d343d;
    --axis:#46515e;
    --ui:"Segoe UI Variable", "Segoe UI", Inter, Arial, sans-serif;
    --mono:"Cascadia Mono", Consolas, "Courier New", monospace;
    --draft:"Arial", "Segoe UI", sans-serif;
    --shadow:0 8px 24px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--panel-2);color:var(--ink);font-family:var(--ui);font-size:12px;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  button,input,select{font-family:var(--ui)}
  button{color:inherit}
  #app{
    --ribbon-h:101px;
    --optbar-h:31px;
    --status-h:26px;
    --cmd-h:34px;
    display:grid;grid-template-columns:1fr 238px;
    grid-template-rows:34px var(--ribbon-h) var(--optbar-h) minmax(0,1fr) var(--status-h) var(--cmd-h);
    grid-template-areas:"top top" "ribbon ribbon" "optbar optbar" "canvas right" "status right" "cmd cmd";
    height:100%;background:var(--panel-2);
  }

  /* ---- application / document bar ---- */
  #top{
    grid-area:top;display:flex;align-items:center;gap:6px;background:#22272e;
    border-bottom:1px solid var(--rule-soft);padding:0 7px;box-shadow:0 1px 0 rgba(255,255,255,.02) inset;
  }
  .brand{
    height:100%;display:flex;align-items:center;gap:7px;padding:0 10px 0 4px;
    border-right:1px solid var(--rule-soft);color:var(--ink-dim);font-size:11.5px;
  }
  .brand::before{
    content:"B";display:grid;place-items:center;width:20px;height:20px;border-radius:4px;
    background:#2d6fa8;color:#f3f8fd;font-weight:700;font-size:11px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .brand b{font-weight:600;letter-spacing:.01em;color:var(--ink)}
  .workspace-tag{
    color:var(--ink-faint);font-size:10.5px;padding:3px 7px;border-right:1px solid var(--rule-soft);margin-right:2px;
  }
  .doc-tab{
    height:27px;min-width:190px;max-width:390px;display:flex;align-items:center;gap:7px;padding:0 10px;
    background:#2b3038;border:1px solid #39414b;border-bottom-color:#2b3038;border-radius:5px 5px 0 0;
    color:var(--ink-dim);position:relative;align-self:flex-end;
  }
  .doc-tab::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pen);opacity:.85;flex:0 0 auto}
  .filename{color:var(--ink-faint);font-size:11px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #fname{font-weight:500;color:var(--ink)}
  .spacer{flex:1}
  #counts{color:var(--ink-faint);font-size:10.5px;margin-right:4px}
  .top-action{
    height:25px;min-width:28px;padding:0 7px;border:1px solid transparent;border-radius:4px;background:transparent;
    color:var(--ink-dim);font-size:11px;cursor:pointer;
  }
  .top-action:hover{background:var(--raised);border-color:var(--rule);color:var(--ink)}
  .top-action[aria-pressed="true"]{background:var(--pen-soft);border-color:#365b7a;color:var(--pen-strong)}
  .top-action:focus-visible{outline:1px solid var(--pen);outline-offset:1px}

  /* ---- ribbon ---- */
  #ribbon{
    grid-area:ribbon;background:var(--panel);border-bottom:1px solid var(--rule);
    display:flex;flex-direction:column;box-shadow:0 3px 10px rgba(0,0,0,.08);overflow:hidden;min-height:0;
  }
  .rtabs{
    display:flex;gap:2px;padding:3px 7px 0;background:#23282f;border-bottom:1px solid var(--rule-soft);min-height:29px;
  }
  .rtab{
    font:inherit;font-size:11px;background:transparent;border:0;border-bottom:2px solid transparent;
    color:var(--ink-dim);padding:5px 10px 6px;cursor:pointer;border-radius:3px 3px 0 0;
  }
  .rtab:hover{color:var(--ink);background:#2c323a}
  .rtab[aria-selected="true"]{color:var(--ink);background:#2a3037;border-bottom-color:var(--pen)}
  .rtab:focus-visible{outline:1px solid var(--pen);outline-offset:-2px}
  .rpanels{
    display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;min-height:68px;padding:3px 5px 2px;
    scrollbar-width:thin;scrollbar-color:#4a5360 transparent;
  }
  .rpanel{
    display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--rule-soft);
    padding:2px 6px 0;flex:0 0 auto;
  }
  .rpanel:last-child{border-right:0}
  .rpanel-body{display:flex;align-items:flex-start;gap:2px;flex:1}
  .rpanel-label{text-align:center;font-size:9px;color:var(--ink-faint);padding:2px 1px 1px}
  .rcols{display:flex;flex-direction:column;gap:0}.rrow{display:flex;gap:1px}
  .big,.small{
    font:inherit;background:transparent;border:1px solid transparent;border-radius:4px;color:var(--ink-dim);
    cursor:pointer;display:flex;align-items:center;transition:background .08s linear,color .08s linear,border-color .08s linear;
  }
  .big{flex-direction:column;justify-content:flex-start;width:54px;min-height:52px;padding:4px 2px 2px;gap:2px;font-size:9.5px;line-height:1.08;text-align:center}
  .small{gap:4px;padding:2px 5px 2px 3px;font-size:10px;line-height:1.1;min-width:84px;min-height:19px;text-align:left}
  .big svg,.small svg{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .big svg{width:24px;height:24px}.small svg{width:14px;height:14px}
  .big:hover,.small:hover{color:var(--ink);background:var(--raised);border-color:#414a56}
  .big[aria-pressed="true"],.small[aria-pressed="true"]{color:#dceeff;background:var(--pen-soft);border-color:#3c6788;box-shadow:inset 0 0 0 1px rgba(98,166,232,.08)}
  .big:focus-visible,.small:focus-visible{outline:1px solid var(--pen);outline-offset:1px}
  .big .alias,.small .alias{color:inherit;opacity:.55;font-size:8.5px}
  .rpanel select,.rpanel input{
    background:#1f242a;border:1px solid var(--rule);border-radius:4px;color:var(--ink);font-size:10px;padding:2px 5px;height:21px;max-width:132px;
  }
  .rpanel select:focus,.rpanel input:focus{outline:1px solid var(--pen);outline-offset:-1px;border-color:var(--pen)}
  .rstack{display:flex;flex-direction:column;gap:2px}

  /* compact mode: keep tabs and contextual bar, surrender vertical space to drawing */
  #app.ribbon-compact .rpanels{display:none}
  #app.ribbon-compact #ribbon{box-shadow:none}
  /* no ghost row when the current tool has no contextual controls */
  #app:has(#optbar:empty){--optbar-h:0px}
  #app.bottom-compact{--status-h:0px}
  #app.bottom-compact #status{display:none}

  /* ---- contextual tool strip ---- */
  #optbar{
    grid-area:optbar;background:#20252c;border-bottom:1px solid var(--rule);display:flex;align-items:center;
    gap:10px;padding:4px 9px;font-size:11px;color:var(--ink-dim);overflow-x:auto;white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.018);
  }
  #optbar:empty{display:none}
  #optbar .context-name{
    display:inline-flex;align-items:center;height:21px;padding:0 8px 0 6px;margin-right:2px;border-right:1px solid var(--rule);
    color:#cfe5fa;font-weight:600;font-size:10.5px;
  }
  #optbar .context-name::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--pen);margin-right:7px}
  #optbar .oh{color:var(--ink-faint);text-transform:none;font-size:10px;letter-spacing:0;font-weight:500}
  #optbar label{display:flex;align-items:center;gap:5px;cursor:default;flex:0 0 auto}
  #optbar input[type=checkbox]{accent-color:#4d91cf;width:13px;height:13px;cursor:pointer;flex:0 0 auto}
  #optbar input[type=number],#optbar select{
    background:#191e24;border:1px solid var(--rule);border-radius:4px;color:var(--ink);font-size:10.5px;padding:2px 5px;height:22px;width:66px;
  }
  #optbar select{width:auto;min-width:82px}
  #optbar input:disabled{background:#20242a;color:#606a77;opacity:1}
  #optbar input:focus,#optbar select:focus{outline:1px solid var(--pen);outline-offset:-1px;border-color:var(--pen)}
  #optbar .swatch{width:11px;height:11px;border-radius:2px;border:1px solid #59636f;flex:0 0 auto}

  /* ---- canvas ---- */
  #stage{grid-area:canvas;position:relative;overflow:hidden;background:var(--ground);box-shadow:inset 0 0 0 1px rgba(255,255,255,.012)}
  #stage::before{
    content:"MODEL";position:absolute;left:9px;top:8px;z-index:2;pointer-events:none;color:#687381;font-size:9px;font-weight:600;
    letter-spacing:.08em;background:rgba(25,28,33,.72);border:1px solid #303741;border-radius:3px;padding:3px 5px;
  }
  canvas{display:block;width:100%;height:100%;cursor:crosshair;font-family:var(--draft)}
  canvas.panning{cursor:grabbing}canvas.picking{cursor:default}

  /* ---- viewport splitters: resize top ribbon and bottom command/status stack ---- */
  .shell-resizer{
    position:absolute;left:0;right:0;height:8px;z-index:20;cursor:row-resize;touch-action:none;
    background:transparent;outline:none;
  }
  .shell-resizer-top{top:0}
  .shell-resizer-bottom{bottom:0}
  .shell-resizer::after{
    content:"";position:absolute;left:50%;top:3px;transform:translateX(-50%);width:54px;height:2px;
    border-radius:2px;background:#53606d;opacity:.16;transition:opacity .12s linear,width .12s linear,background .12s linear;
  }
  .shell-resizer:hover::after,.shell-resizer:focus-visible::after,.shell-resizer.dragging::after{
    opacity:.9;width:86px;background:var(--pen);
  }
  body.shell-resizing{cursor:row-resize!important;user-select:none}
  body.shell-resizing *{cursor:row-resize!important}

  /* ---- status strip ---- */
  #status{
    grid-area:status;background:#20252c;border-top:1px solid var(--rule);display:flex;align-items:center;gap:0;padding:0 6px;
    font-size:10.5px;color:var(--ink-dim);overflow:hidden;min-height:0;
  }
  .coord{color:var(--ink-faint);min-width:184px;font-family:var(--mono);font-size:10px}.coord b{color:#cdd5df;font-weight:400}
  .toggles{display:flex;gap:2px;margin-left:auto;height:100%;align-items:center}
  .tg{
    font:inherit;font-size:9.5px;text-transform:none;background:transparent;border:1px solid transparent;border-radius:3px;color:var(--ink-faint);
    padding:2px 7px;cursor:pointer;min-width:38px;height:20px;
  }
  .tg:hover{background:var(--raised);color:var(--ink)}
  .tg[aria-pressed="true"]{color:#cde9ff;border-color:#355b79;background:#263c50}
  .tg:focus-visible{outline:1px solid var(--pen);outline-offset:1px}

  /* ---- right properties palette ---- */
  #right{
    grid-area:right;background:#21262d;border-left:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden;
    box-shadow:-6px 0 18px rgba(0,0,0,.06);
  }
  .sect-head{
    display:flex;align-items:center;justify-content:space-between;padding:6px 8px 5px;font-size:10.5px;font-weight:600;color:#cbd2dc;
    background:#272c33;border-top:1px solid rgba(255,255,255,.02);border-bottom:1px solid var(--rule-soft);
  }
  .sect-head button{
    font:inherit;font-size:14px;line-height:1;background:transparent;border:1px solid transparent;border-radius:3px;color:var(--ink-faint);cursor:pointer;padding:0 4px;
  }
  .sect-head button:hover{background:var(--raised);border-color:var(--rule);color:var(--ink)}
  #layers{overflow-y:auto;flex:0 1 auto;max-height:30%}#styles{overflow-y:auto;flex:0 1 auto;max-height:26%}
  .style-row,.layer{display:flex;align-items:center;gap:5px;padding:4px 7px;cursor:pointer;border-bottom:1px solid #292f36;background:#20252b}
  .style-row:hover,.layer:hover{background:#292f37}
  .style-row.current,.layer.current{background:#26394a;box-shadow:inset 2px 0 0 var(--pen)}
  .style-row.current .sname,.layer.current .lname{color:#e5f2ff;font-weight:600}
  .sname,.lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;color:#c1c8d1}
  .sweight{width:40px;background:#191e24;border:1px solid var(--rule);border-radius:3px;color:var(--ink);font:inherit;font-size:10px;padding:1px 3px;height:19px}
  .sweight:focus{outline:1px solid var(--pen);outline-offset:-1px;border-color:var(--pen)}
  .spat{width:30px;height:16px;flex:0 0 auto;background:#191e24;border:1px solid var(--rule);border-radius:3px;color:var(--ink-dim);cursor:pointer;position:relative}
  .spat:hover{background:var(--raised);border-color:#4c5865}.spat svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.5}
  .swatch{width:10px;height:10px;border-radius:2px;flex:0 0 auto;border:1px solid #69737f}
  .licon{width:16px;text-align:center;color:var(--ink-faint);font-size:10px;background:none;border:none;border-radius:2px;cursor:pointer;font-family:var(--ui)}
  .licon:hover{color:var(--ink);background:var(--raised)}.licon.on{color:var(--pen-strong)}.layer.hidden .lname{color:#68717d;text-decoration:line-through}

  #props{flex:1;overflow-y:auto;padding:0 0 8px;background:#20252b}
  .row{display:grid;grid-template-columns:82px minmax(0,1fr);align-items:center;gap:0;padding:0;font-size:10.5px;border-bottom:1px solid #2a3037;min-height:25px}
  .row label{color:#7f8996;padding:5px 7px;font-size:9.8px;text-transform:none;border-right:1px solid #2d343c;height:100%;display:flex;align-items:center}
  .row input[type=number],.row input[type=text],.row select{min-width:0;background:#1a1f25;border:0;border-radius:0;color:#dce1e8;font:inherit;font-size:10.5px;padding:4px 6px;height:24px;width:100%}
  .row input:hover,.row select:hover{background:#20262d}.row input:focus,.row select:focus{outline:1px solid var(--pen);outline-offset:-1px;background:#1d242b}
  #props .hint .small{display:inline-flex;min-width:0;width:auto;padding:5px 8px;margin:2px 3px 2px 0;vertical-align:middle;background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;color:var(--ink-dim)}#props .hint .small:hover{color:var(--ink);background:#343a43}
  .hint{padding:7px 8px;color:#6e7884;font-size:9.8px;line-height:1.45}.hint kbd{background:#2d333b;border:1px solid #434c57;border-radius:3px;padding:0 3px;color:#aeb7c2;font-family:var(--mono);font-size:9px}

  /* ---- command line ---- */
  #cmd{
    grid-area:cmd;background:#1d2228;border-top:1px solid var(--rule);display:flex;align-items:center;padding:0 7px;gap:7px;font-family:var(--mono);
    box-shadow:0 -4px 12px rgba(0,0,0,.06);overflow:hidden;min-height:0;
  }
  #prompt{color:#8cc5f3;white-space:nowrap;font-size:10.5px;font-family:var(--mono);font-weight:600}
  #cmdin{flex:1;background:#171b20;border:1px solid #39414a;border-radius:4px;color:#e1e7ef;font-family:var(--mono);font-size:10.5px;padding:3px 6px;height:23px}
  #cmdin:focus{outline:1px solid var(--pen);outline-offset:-1px;border-color:var(--pen);background:#191f25}
  #cmdin::placeholder{color:#59636f}
  #echo{color:#737d89;font-size:9.8px;white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis;text-align:right;font-family:var(--mono)}
  #echo.warn{color:var(--alert)}

  /* ---------------- touch and mobile mode ----------------
     touch-action:none is the load-bearing line: without it the browser eats
     every drag as a page scroll and every pinch as a page zoom. */
  #cv,#stage{touch-action:none}
  html,body{overscroll-behavior:none}

  #mact{
    position:absolute;right:8px;bottom:8px;z-index:30;display:none;
    grid-template-columns:repeat(2,44px);gap:6px;
  }
  #mact button{
    width:44px;height:44px;border-radius:11px;border:1px solid var(--rule);
    background:rgba(24,29,35,.92);color:var(--ink-dim);display:grid;place-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.35);cursor:pointer;padding:0;
  }
  #mact button[aria-pressed="true"]{background:var(--pen);color:#0b0e12;border-color:var(--pen)}
  #mact button:disabled{opacity:.32}
  #msheet{
    position:absolute;left:0;right:0;bottom:0;z-index:40;height:64%;
    background:var(--panel-2);border-top:1px solid var(--rule);
    transform:translateY(101%);transition:transform .18s ease;
    display:flex;flex-direction:column;box-shadow:0 -10px 26px rgba(0,0,0,.4);
  }
  #msheet.open{transform:none}
  #msheet .mgrab{
    height:30px;flex:0 0 auto;border:0;background:transparent;color:var(--ink-faint);
    font-size:18px;line-height:1;cursor:pointer;
  }
  #msheet .mbody{flex:1;min-height:0;overflow:auto;display:flex}
  #msheet #right{display:flex!important;flex:1;border-left:0;box-shadow:none}

  #app.mobile{--ribbon-h:138px;--optbar-h:40px;--status-h:0px;--cmd-h:44px}
  #app.mobile #status{display:none}
  #app.mobile #right{display:none}
  #app.mobile #mact{display:grid}
  #app.mobile .shell-resizer{display:none}
  #app.mobile #rtabs{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
  #app.mobile .rtab{height:36px;min-width:0;padding:0 15px;font-size:12px;flex:0 0 auto}
  #app.mobile #rpanels{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
  #app.mobile .rpanel{flex:0 0 auto}
  #app.mobile .big{width:64px;min-height:62px;font-size:10px;padding:6px 3px 3px}
  #app.mobile .big svg{width:24px;height:24px}
  #app.mobile .small{
    flex-direction:column;min-width:56px;min-height:50px;gap:3px;padding:5px 3px;
    font-size:8.5px;text-align:center;line-height:1.05;
  }
  #app.mobile .small svg{width:20px;height:20px}
  #app.mobile .tg{height:34px;min-width:52px}
  #app.mobile #optbar{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #app.mobile .chip{width:26px;height:26px}
  #app.mobile .licon{min-width:30px;min-height:30px}
  #app.mobile .layer,#app.mobile .style{min-height:38px}
  /* 16px is the threshold below which iOS zooms the page on focus */
  #app.mobile input,#app.mobile select,#app.mobile #cmdin{font-size:16px;min-height:34px}
  #app.mobile .row{min-height:38px}
  #app.mobile.asking #cmd{
    position:fixed;left:0;right:0;top:0;z-index:70;
    border-top:0;border-bottom:1px solid var(--pen);box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  @media (max-width:560px){
    #app.mobile{--ribbon-h:126px}
    #app.mobile .big{width:58px;min-height:58px}
    #app.mobile .small{min-width:50px;min-height:46px}
    #mact{grid-template-columns:44px;right:6px;bottom:6px;gap:5px}
    #app.mobile #mact{grid-template-columns:repeat(2,44px)}
  }

  @media (max-width:900px){
    #app{grid-template-columns:1fr;grid-template-areas:"top" "ribbon" "optbar" "canvas" "status" "cmd"}
    #right{display:none}.small{min-width:0}.workspace-tag{display:none}.doc-tab{min-width:140px}
  }
  @media (prefers-reduced-motion:no-preference){.big,.small,.rtab,.tg,.top-action{transition:background .08s linear,color .08s linear,border-color .08s linear}}

  /* ---- markup palette ---- */
  .chips{display:flex;align-items:center;gap:3px;flex:0 0 auto}
  .chip{
    width:15px;height:15px;padding:0;border-radius:3px;border:1px solid #5b6572;cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
  }
  .chip:hover{transform:translateY(-1px)}
  .chip[aria-pressed="true"]{outline:2px solid var(--pen);outline-offset:1px;border-color:transparent}
  .chip:focus-visible{outline:2px solid var(--pen);outline-offset:1px}
  input[type=color]{
    width:26px;height:21px;padding:0 1px;border:1px solid var(--rule);border-radius:4px;
    background:#191e24;cursor:pointer;flex:0 0 auto;
  }
  #optbar .chips{margin-right:2px}
  .rpanel .chips{padding:1px 0}
  canvas.inking{cursor:crosshair}
  canvas.erasing{cursor:cell}

  /* ---- experimental reactive feedback -------------------------------- */

<script>
"use strict";
/* ============================================================ constants */
const ACI = [
  {i:1,n:"red",     c:"#ff0000"},
  {i:2,n:"yellow",  c:"#ffff00"},
  {i:3,n:"green",   c:"#00ff00"},
  {i:4,n:"cyan",    c:"#00ffff"},
  {i:5,n:"blue",    c:"#4a6cff"},
  {i:6,n:"magenta", c:"#ff00ff"},
  {i:7,n:"white",   c:"#e8edf4"},
  {i:8,n:"grey",    c:"#808080"},
  {i:9,n:"ltgrey",  c:"#c0c0c0"},
  {i:30,n:"orange", c:"#ff7f00"}
];
const aciColor = i => (ACI.find(a=>a.i===i)||ACI[6]).c;

/* ============================================================ state */
const S = {
  ents: [],
  layers: [
    {name:"0",     aci:7, on:true, lock:false},
    {name:"WALLS", aci:4, on:true, lock:false},
    {name:"DIMS",  aci:2, on:true, lock:false}
  ],
  cur: 0,
  sel: new Set(),
  view: {cx:0, cy:0, s:2},
  tool: "select",
  punch: false,        // Test Your Might: click canvas objects to destroy them
  ortho: false,
  gridShow: true,      // grid visibility, independent of grid snapping
  gridSnap: true,
  osnap: true,
  gridStep: 10,
  textHeight: 2.5,
  refImage: null,      // tracing underlay; transform/crop metadata lives on the object
  edgeAssist: true,
  edgeThreshold: 62,
  /* Revit 2016 Measure state is temporary and never saved as drawing geometry. */
  measureChain: false,
  measureSegs: [],
  measureTotal: 0,
  measureLabel: null,
  measureTabChain: false,
  measureEscArmed: false,
  groupSeq: 1,
  pending: [],        // picked points for the active tool
  base: null,         // move/copy base point
  mouse: {x:0,y:0, sx:0, sy:0},
  snapHit: null,
  hover: -1,
  band: null,         // window-select rubber band
  ask: null,          // pending command-bar question {label, cb}
  op: {},             // scratch state for multi-step modify tools
  weld: true,         // coincident points move together
  lastOffset: 100, lastFillet: 50, lastChamfer: 50,
  styles:[
    {name:"Thin Lines",    w:0.10, aci:7, pat:null},
    {name:"Medium Lines",  w:0.25, aci:7, pat:null},
    {name:"Wide Lines",    w:0.53, aci:7, pat:null},
    {name:"Thin Dashed",   w:0.10, aci:7, pat:[3,2]},
    {name:"Hidden",        w:0.18, aci:8, pat:[2,1.5]},
    {name:"Overhead",      w:0.18, aci:4, pat:[6,2,1,2]},
    {name:"Centreline",    w:0.13, aci:3, pat:[12,2,2,2]},
    {name:"Demolished",    w:0.18, aci:1, pat:[8,2,1,2,1,2]},
    {name:"Area Boundary", w:0.53, aci:6, pat:[10,3]}
  ],
  curStyle: 1,
  chain: false, drawOffset: 0, chainRadius: 0, useRadius: false, chainPrev: null,
  scaleMode: "graphical", lastScaleFactor: 2,
  offsetMode: "numerical", copyOffset: true,
  copyMultiple: false, copyRotate: false, copyMirror: true,
  polySides: 6, polyInscribed: true,
  undo: [], redo: []
};

/* ============================================================ geometry */
const V  = (x,y)=>({x,y});
const sub=(a,b)=>V(a.x-b.x,a.y-b.y);
const add=(a,b)=>V(a.x+b.x,a.y+b.y);
const mul=(a,k)=>V(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const norm=a=>{const l=len(a)||1;return V(a.x/l,a.y/l)};
const perp=a=>V(-a.y,a.x);
const ang =(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const TAU=Math.PI*2;
const wrap=a=>{a%=TAU;return a<0?a+TAU:a};
const deg=r=>r*180/Math.PI, rad=d=>d*Math.PI/180;

function ptSegDist(p,a,b){
  const ab=sub(b,a), t=Math.max(0,Math.min(1,(sub(p,a).x*ab.x+sub(p,a).y*ab.y)/(ab.x*ab.x+ab.y*ab.y||1)));
  return dist(p, add(a,mul(ab,t)));
}
function circumcenter(a,b,c){
  const d=2*(a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y));
  if(Math.abs(d)<1e-9) return null;
  const ux=((a.x**2+a.y**2)*(b.y-c.y)+(b.x**2+b.y**2)*(c.y-a.y)+(c.x**2+c.y**2)*(a.y-b.y))/d;
  const uy=((a.x**2+a.y**2)*(c.x-b.x)+(b.x**2+b.y**2)*(a.x-c.x)+(c.x**2+c.y**2)*(b.x-a.x))/d;
  return V(ux,uy);
}
/* 3-point arc -> {c,r,a0,a1} CCW from a0 to a1 passing through mid */
function arc3(p1,pm,p2){
  const c=circumcenter(p1,pm,p2); if(!c) return null;
  const r=dist(c,p1);
  let a0=wrap(ang(c,p1)), a1=wrap(ang(c,p2)), am=wrap(ang(c,pm));
  const inCCW=(s,e,t)=>{const S1=wrap(e-s), T=wrap(t-s); return T<=S1};
  if(!inCCW(a0,a1,am)){const t=a0;a0=a1;a1=t;}
  return {c,r,a0,a1};
}
function arcContains(e,a){
  const sweep=wrap(e.a1-e.a0);
  return wrap(a-e.a0) <= sweep+1e-9;
}
const MM=3.7795;                       /* print mm -> screen px */
function ellPts(e,n){
  n=n||72;
  const co=Math.cos(e.rot||0), si=Math.sin(e.rot||0), out=[];
  const sw=(e.sw==null?TAU:e.sw), a0=e.a0||0;
  const steps=Math.max(8, Math.round(n*Math.abs(sw)/TAU));
  for(let k=0;k<=steps;k++){
    const th=a0+sw*k/steps, x=e.rx*Math.cos(th), y=e.ry*Math.sin(th);
    out.push(V(e.c.x+x*co-y*si, e.c.y+x*si+y*co));
  }
  return out;
}
function splPts(e){
  const p=e.pts, n=p.length;
  if(n<3) return p.slice();
  const cl=!!e.closed, out=[];
  const at=i=> cl ? p[(i%n+n)%n] : p[Math.max(0,Math.min(n-1,i))];
  const last = cl? n-1 : n-2;
  for(let i=0;i<=last;i++){
    const p0=at(i-1),p1=at(i),p2=at(i+1),p3=at(i+2);
    for(let k=0;k<12;k++){
      const t=k/12,t2=t*t,t3=t2*t;
      out.push(V(
        0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
        0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)));
    }
  }
  out.push(cl? at(0) : p[n-1]);
  return out;
}
function flatten(e){
  if(e.t==="ellipse") return ellPts(e);
  if(e.t==="spline")  return splPts(e);
  if(e.t==="circle")  return ellPts({c:e.c,rx:e.r,ry:e.r,rot:0,a0:0,sw:TAU});
  if(e.t==="arc")     return ellPts({c:e.c,rx:e.r,ry:e.r,rot:0,a0:e.a0,sw:wrap(e.a1-e.a0)});
  return entPoints(e);
}
function entPoints(e){
  switch(e.t){
    case "line": return [e.a,e.b];
    case "pline": return e.pts.slice();
    case "circle": return [];
    case "arc": return [V(e.c.x+e.r*Math.cos(e.a0),e.c.y+e.r*Math.sin(e.a0)),
                         V(e.c.x+e.r*Math.cos(e.a1),e.c.y+e.r*Math.sin(e.a1))];
    case "dim": return [e.a,e.b];
    case "text": return [e.p];
    case "spline": return e.pts.slice();
    case "ellipse":
      return (e.sw!=null && Math.abs(Math.abs(e.sw)-TAU)>1e-9) ? [ellPts(e,4)[0], ellPts(e,4).slice(-1)[0]] : [];
    case "node":   return flowNodePoly(e).concat([e.p]);
    case "edge":   return [];
    case "ink":    return e.pts.length? [e.pts[0], e.pts[e.pts.length-1]] : [];
    case "mshape": return [e.a,e.b];
    case "mtext":  return e.lead? [e.p,e.lead] : [e.p];
  }
  return [];
}
function entMids(e){
  const out=[];
  if(e.t==="line") out.push(mul(add(e.a,e.b),.5));
  if(e.t==="dim")  out.push(mul(add(e.a,e.b),.5));
  if(e.t==="pline"){
    const n=e.pts.length;
    for(let i=0;i<n-1;i++) out.push(mul(add(e.pts[i],e.pts[i+1]),.5));
    if(e.closed&&n>2) out.push(mul(add(e.pts[n-1],e.pts[0]),.5));
  }
  return out;
}
function entCenters(e){
  if(e.t==="circle"||e.t==="arc"||e.t==="ellipse") return [e.c];
  return [];
}
function entQuads(e){
  if(e.t==="circle") return [V(e.c.x+e.r,e.c.y),V(e.c.x-e.r,e.c.y),V(e.c.x,e.c.y+e.r),V(e.c.x,e.c.y-e.r)];
  if(e.t==="ellipse"){
    const co=Math.cos(e.rot||0), si=Math.sin(e.rot||0), q=[];
    for(const [x,y] of [[e.rx,0],[-e.rx,0],[0,e.ry],[0,-e.ry]])
      q.push(V(e.c.x+x*co-y*si, e.c.y+x*si+y*co));
    return q;
  }
  return [];
}
function entHit(e,p,tol){
  if(flowIsEnt(e)) return flowHitEnt(e,p,tol);
  if(mkIsEnt(e)) return mkHitEnt(e,p,tol);
  switch(e.t){
    case "line": return ptSegDist(p,e.a,e.b)<=tol;
    case "dim":  return ptSegDist(p,e.a,e.b)<=tol*3;
    case "pline":{
      const n=e.pts.length;
      for(let i=0;i<n-1;i++) if(ptSegDist(p,e.pts[i],e.pts[i+1])<=tol) return true;
      if(e.closed&&n>2&&ptSegDist(p,e.pts[n-1],e.pts[0])<=tol) return true;
      return false;
    }
    case "circle": return Math.abs(dist(p,e.c)-e.r)<=tol;
    case "arc": {
      if(Math.abs(dist(p,e.c)-e.r)>tol) return false;
      return arcContains(e,wrap(ang(e.c,p)));
    }
    case "text": return dist(p,e.p)<=Math.max(tol, e.h);
    case "ellipse": case "spline":{
      const P=flatten(e);
      for(let i=0;i<P.length-1;i++) if(ptSegDist(p,P[i],P[i+1])<=tol) return true;
      if(e.t==="spline"&&e.closed&&P.length>2&&ptSegDist(p,P[P.length-1],P[0])<=tol) return true;
      return false;
    }
  }
  return false;
}
function entBox(e){
  const pts=[];
  if(mkIsEnt(e)) pts.push(...mkOutline(e));
  if(e.t==="node") pts.push(...flowNodePoly(e));
  if(e.t==="edge"){ const R=flowRoute(e); if(R) pts.push(...R); }
  if(e.t==="circle"||e.t==="arc"){
    pts.push(V(e.c.x-e.r,e.c.y-e.r),V(e.c.x+e.r,e.c.y+e.r));
  } else pts.push(...entPoints(e));
  if(e.t==="pline") pts.push(...e.pts);
  if(e.t==="ellipse"||e.t==="spline") pts.push(...flatten(e));
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  for(const p of pts){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}
  return {x0,y0,x1,y1};
}
function moveEnt(e,d){
  const m=p=>add(p,d);
  if(e.a) e.a=m(e.a); if(e.b) e.b=m(e.b);
  if(e.c) e.c=m(e.c); if(e.p) e.p=m(e.p);
  if(e.pts) e.pts=e.pts.map(m);
  if(e.lead) e.lead=m(e.lead);
  if(e.t==="edge"){
    if(e.from&&e.from.pt) e.from.pt=m(e.from.pt);
    if(e.to&&e.to.pt)     e.to.pt=m(e.to.pt);
  }
  return e;
}

/* ============================================================ view */
/* let, not const: PNG export repoints these at an offscreen canvas, redraws
   the scene at export resolution, then puts them back. */
let cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=window.devicePixelRatio||1;
  const r=cv.parentElement.getBoundingClientRect();
  W=Math.max(1,Math.round(r.width)); H=Math.max(1,Math.round(r.height));
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}
const X = wx => (wx - S.view.cx)*S.view.s + W/2;
const Y = wy => H/2 - (wy - S.view.cy)*S.view.s;
const wX = sx => (sx - W/2)/S.view.s + S.view.cx;
const wY = sy => S.view.cy - (sy - H/2)/S.view.s;
const px = n => n/S.view.s;   // pixels -> world units

/* ============================================================ history */
/* Undo used to snapshot entities only, so calibrating or cropping a reference
   image - or renaming a layer - could not be taken back. The snapshot now
   covers layers, styles and the image placement too. The <img> itself stays
   out of JSON and is held in refImgEl so a removed image can come back. */
function refState(){
  const R=S.refImage;
  if(!R) return null;
  refImgEl=R.img||refImgEl;
  return {name:R.name,x:R.x,y:R.y,w:R.w,h:R.h,opacity:R.opacity,visible:R.visible,
          locked:R.locked,rot:R.rot||0,crop:R.crop||null,mode:R.mode||"fade"};
}
function restoreRef(o){
  if(!o){ S.refImage=null; return; }
  if(!refImgEl) return;
  S.refImage=Object.assign({},o,{img:refImgEl});
  try{ prepareReferenceEdges(S.refImage); }catch(_){}
}
function stateBlob(){
  return JSON.stringify({e:S.ents, l:S.layers, y:S.styles, c:S.cur, cs:S.curStyle,
                         r:refState(), fs:S.flow?S.flow.seq:1, gs:S.groupSeq});
}
function applyBlob(t){
  const d=JSON.parse(t);
  S.ents=d.e||[];
  if(Array.isArray(d.l) && d.l.length) S.layers=d.l;
  if(Array.isArray(d.y) && d.y.length) S.styles=d.y;
  S.cur=Math.max(0,Math.min(d.c|0,S.layers.length-1));
  S.curStyle=Math.max(0,Math.min(d.cs|0,S.styles.length-1));
  restoreRef(d.r);
  flowInvalidateIndex();
  if(S.flow && d.fs) S.flow.seq=d.fs;
  if(d.gs) S.groupSeq=d.gs;

}
function snap(){
  S.undo.push(stateBlob());
  if(S.undo.length>120) S.undo.shift();
  S.redo.length=0;
  markDirty();
}
function undo(){
  if(!S.undo.length) return echo("Nothing to undo","warn");
  S.redo.push(stateBlob());
  applyBlob(S.undo.pop());

}
function redo(){
  if(!S.redo.length) return echo("Nothing to redo","warn");
  S.undo.push(stateBlob());
  applyBlob(S.redo.pop());

/* ============================================================ snapping */
function gridPitch(){
  let g=S.gridStep;
  while(g*S.view.s < 7)  g*=(String(g)[0]==="1"?2:(String(g)[0]==="2"?2.5:2));
  while(g*S.view.s > 70) g/=(String(g)[0]==="1"?2:(String(g)[0]==="2"?2.5:2));
  return g;
}
function resolveSnap(w){
  S.snapHit=null;
  if(S.osnap && !S.snapSuspend){
    /* Moving the cursor away from where Tab was pressed abandons the cycle,
       so the choice never survives into a pick you did not aim. */
    if(S.snapAnchor && Math.hypot(S.mouse.sx-S.snapAnchor.sx, S.mouse.sy-S.snapAnchor.sy)>6)
      snapCycleReset();
    S.snapList=snapCandidates(w);
    if(S.snapList.length){
      if(S.snapCycle>=S.snapList.length) S.snapCycle=0;
      const best=S.snapList[S.snapCycle];
      S.snapHit={p:best.p, kind:best.kind, label:best.label,
                 index:S.snapCycle, count:S.snapList.length};
      return best.p;
    }
    S.snapCycle=0;
  } else S.snapList=[];
  if(S.edgeAssist && S.refImage && S.refImage.visible){
    const ep=resolveImageEdgeSnap(w);
    if(ep){ S.snapHit={p:ep,kind:"edge"}; return ep; }
  }
  if(S.gridSnap){
    const g=gridPitch();
    return V(Math.round(w.x/g)*g, Math.round(w.y/g)*g);
  }
  return w;
}
function applyOrtho(p, from){
  if(!S.ortho||!from) return p;
  return Math.abs(p.x-from.x) >= Math.abs(p.y-from.y) ? V(p.x, from.y) : V(from.x, p.y);
}
function cursorPoint(){
  const raw=V(wX(S.mouse.sx), wY(S.mouse.sy));
  // Reference-image transform tools deliberately ignore drafting snaps.
  if(["imgcal","imgmove","imgstraight","imgcrop"].includes(S.tool)) return raw;
  // markup is freehand annotation, not drafting - it never snaps
  if(MK_TOOLS[S.tool]) return raw;
  let p=resolveSnap(raw);
  const from=S.pending.length? S.pending[S.pending.length-1] : (S.base||null);
  if(!S.snapHit) p=applyDimSnap(p,from);
  if(S.ortho && from && !S.snapHit) p=applyOrtho(p,from);
  return p;
}

/* ---- reference image geometry + raster edge assist -------------------- */
function refWorldToPixel(R,p){
  if(!R||!R.img||!(R.w>0)||!(R.h>0)) return null;
  const v=sub(p,V(R.x,R.y)), co=Math.cos(R.rot||0), si=Math.sin(R.rot||0);
  // inverse world rotation
  const lx=v.x*co+v.y*si, ly=-v.x*si+v.y*co;
  return V((lx/R.w+.5)*R.img.naturalWidth, (.5-ly/R.h)*R.img.naturalHeight);
}
function refPixelToWorld(R,px0,py0){
  const lx=(px0/R.img.naturalWidth-.5)*R.w, ly=(.5-py0/R.img.naturalHeight)*R.h;
  const co=Math.cos(R.rot||0), si=Math.sin(R.rot||0);
  return V(R.x+lx*co-ly*si, R.y+lx*si+ly*co);
}
function refPixelInCrop(R,x,y){
  const c=R.crop; return !c || (x>=c.sx && x<=c.sx+c.sw && y>=c.sy && y<=c.sy+c.sh);
}
function prepareReferenceEdges(R){
  if(!R||!R.img||!R.img.complete) return;
  const nw=R.img.naturalWidth, nh=R.img.naturalHeight, maxDim=1400;
  const k=Math.min(1,maxDim/Math.max(nw,nh));
  const ew=Math.max(8,Math.round(nw*k)), eh=Math.max(8,Math.round(nh*k));
  const c=document.createElement("canvas"); c.width=ew; c.height=eh;
  const g=c.getContext("2d",{willReadFrequently:true});
  g.drawImage(R.img,0,0,ew,eh);
  const d=g.getImageData(0,0,ew,eh).data, gray=new Uint8Array(ew*eh), edge=new Uint8Array(ew*eh);
  for(let i=0,j=0;i<d.length;i+=4,j++) gray[j]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;
  for(let y=1;y<eh-1;y++) for(let x=1;x<ew-1;x++){
    const i=y*ew+x;
    const gx=Math.abs(gray[i+1]-gray[i-1]), gy=Math.abs(gray[i+ew]-gray[i-ew]);
    edge[i]=Math.min(255,gx+gy);
  }
  R.edge={w:ew,h:eh,data:edge};
}
function resolveImageEdgeSnap(w){
  const R=S.refImage; if(!R||!R.edge||R.locked===undefined&&!R.img) return null;
  const p=refWorldToPixel(R,w); if(!p||!refPixelInCrop(R,p.x,p.y)) return null;
  const E=R.edge, ex=p.x/R.img.naturalWidth*E.w, ey=p.y/R.img.naturalHeight*E.h;
  const worldRad=px(11), edgePxWorld=R.w/E.w;
  const rr=Math.max(2,Math.min(18,Math.ceil(worldRad/Math.max(1e-9,edgePxWorld))));
  let best=null, bestScore=1e18;
  const x0=Math.max(1,Math.floor(ex-rr)),x1=Math.min(E.w-2,Math.ceil(ex+rr));
  const y0=Math.max(1,Math.floor(ey-rr)),y1=Math.min(E.h-2,Math.ceil(ey+rr));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const mag=E.data[y*E.w+x]; if(mag<S.edgeThreshold) continue;
    const npX=(x+.5)/E.w*R.img.naturalWidth, npY=(y+.5)/E.h*R.img.naturalHeight;
    if(!refPixelInCrop(R,npX,npY)) continue;
    const dd=(x-ex)*(x-ex)+(y-ey)*(y-ey);
    // nearest strong edge wins, with a small preference for stronger pixels
    const score=dd-mag*.0025;
    if(score<bestScore){bestScore=score;best=[npX,npY];}
  }
  return best?refPixelToWorld(R,best[0],best[1]):null;
}

function clearMeasurement(keepEsc){
  S.pending=[]; S.measureSegs=[]; S.measureTotal=0; S.measureLabel=null; S.measureTabChain=false;
  if(!keepEsc) S.measureEscArmed=false;

function measurePath(e){

  if(e.t==="pline") return e.pts&&e.pts.length>1?e.pts.slice():null;
  if(e.t==="arc"||e.t==="circle"||e.t==="ellipse"||e.t==="spline") return flatten(e);
  return null;
}
function measureSegmentsForPath(P,closed,source){

  for(let i=0;i<P.length-1;i++) if(dist(P[i],P[i+1])>1e-9) out.push({a:P[i],b:P[i+1],source});
  if(closed&&P.length>2&&dist(P[P.length-1],P[0])>1e-9) out.push({a:P[P.length-1],b:P[0],source});
  return out;

  }
  const a=S.pending[S.pending.length-1]; if(dist(a,p)<1e-9) return;

}

    const P=measurePath(e);

      segs=measureSegmentsForPath(P,!!e.closed||e.t==="circle",i);

  const prev=S.tool; if(isMeasureTool(prev)&&prev!==t) clearMeasurement(false);
  S.pending=[]; S.base=null; S.band=null; S.op={}; S.ask=null; S.chainPrev=null; resetNudge();
  if(["imgmove","imgcal","imgstraight","imgcrop"].includes(t) && !S.refImage){ echo("Load a reference image first","warn"); t="select"; }
  if(["imgmove","imgcal","imgstraight","imgcrop"].includes(t) && S.refImage && S.refImage.locked){ echo("Reference image is locked","warn"); t="select"; }
  if(SELOPS.includes(t) && !S.sel.size){
    echo("Select objects first","warn"); S.tool="select"; paintRibbon(); paintOptbar(); setPrompt(); draw(); return;
  }
  if(!SELOPS.includes(t) && t!=="select") S.sel.clear();
  S.tool=t;
  paintRibbon(); paintOptbar(); setPrompt(); draw();
  document.getElementById("cmdin").focus();
  if(t==="explode"){ explodeSel(); S.tool="select"; paintRibbon(); setPrompt(); return; }
  if(t==="array")  { askArray(); return; }
  if(t==="offset"){
    S.op={stage:"pick", d:S.lastOffset};
    say("Pick object to offset");
    return; }
  if(t==="pickLines"){
    S.op={stage:"pick", d:Math.max(0,S.drawOffset)};
    say("Pick a line to offset");
    return; }
  if(t==="fillet"||t==="chamfer"){
    S.op={r: t==="fillet"? S.lastFillet : S.lastChamfer};
    say("Pick first line");
    return; }
  if(t==="measurebetween"||t==="measurealong"){ clearMeasurement(false); setPrompt(); paintOptbar(); draw(); return; }
}
function say(t){ S.op.prompt=t; document.getElementById("prompt").textContent=t+":"; }
function askArray(){
  requestString("Columns,Rows", "3,2", v=>{
    const m=/^(\d+)\s*,\s*(\d+)$/.exec(v.trim());
    if(!m){ echo("Give it as columns,rows","warn"); setTool("select"); return; }
    const cols=+m[1], rows=+m[2];
    if(cols*rows>4000){ echo("That is over 4000 copies","warn"); setTool("select"); return; }
    requestString("Column spacing,Row spacing", "1000,1000", v2=>{
      const n=/^(-?[\d.]+)\s*,\s*(-?[\d.]+)$/.exec(v2.trim());
      if(!n){ echo("Give it as dx,dy","warn"); setTool("select"); return; }
      const dx=parseFloat(n[1]), dy=parseFloat(n[2]);
      snap();
      const src=[...S.sel].map(i=>S.ents[i]);
      let made=0;
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
        if(!r&&!c) continue;
        const batch=cloneEntitiesFreshGroups(src);
        for(const e of batch){ S.ents.push(moveEnt(e,V(c*dx,r*dy))); made++; }
      }
      S.sel.clear(); draw(); updateProps();
      echo("Array: "+made+" copies");
      S.tool="select"; paintRibbon(); setPrompt();
    });
  });
}

/* command-bar question: modals are blocked in sandboxed frames, so ask here */
function requestString(label, initial, cb){
  S.ask={label,cb};
  syncAskClass();
  document.getElementById("prompt").textContent=label+":";
  const el=document.getElementById("cmdin");
  el.value=initial||""; el.focus(); el.select();
}
function setPrompt(){
  syncAskClass();
  if(S.ask){ document.getElementById("prompt").textContent=S.ask.label+":"; return; }
  if(S.op && S.op.prompt){ document.getElementById("prompt").textContent=S.op.prompt+":"; return; }
  const T=TOOLS[S.tool];
  if(!T.prompts){ document.getElementById("prompt").textContent="Command:"; return; }
  const i=Math.min(S.pending.length + (S.base?1:0), T.prompts.length-1);
  let txt = T.pts===0 ? "Command:" : T.prompts[i]+":";
  if((S.tool==="pline"||S.tool==="spline")&&S.pending.length) txt="Next point or Enter to finish:";
  if(S.tool==="line"&&S.chain&&S.pending.length) txt="Next point or Enter to finish chain:";
  if((S.tool==="move"||S.tool==="copy")) txt = (S.base?"Destination":"Base point")+":";
  if(S.tool==="measurebetween") txt=(S.pending.length?(S.measureChain?"Select next reference or double-click to finish":"Select second reference"):"Select first reference")
    +(S.snapHit?("  \u00B7  "+(S.snapHit.label||SNAP_NAME[S.snapHit.kind]||"")):"")+":";
  if(S.tool==="measurealong") txt="Select element:";
  document.getElementById("prompt").textContent=txt;
}
function echo(m,cls){
  const el=document.getElementById("echo");
  el.textContent=m||""; el.className=cls||"";
}

/* commit a picked point into the active tool */
function feed(p){
  if(S.snapOverride){ S.snapOverride=null; paintOptbar(); }
  snapCycleReset();
  if(XPICK[S.tool] && S.experimental){ xUiReact(S.tool,"hit",p); XPICK[S.tool](p); return; }
  const T=TOOLS[S.tool];
  if(S.tool==="select"){ return; }
  if(S.tool==="measurebetween") return feedMeasureBetween(p);
  if(S.tool==="move"||S.tool==="copy"){
    if(!S.base){ S.base=p; setPrompt(); return; }
    const d=sub(p,S.base); snap();
    if(S.tool==="move"){
      const w=applyDelta([...S.sel], d, true);
      echo("Moved "+S.sel.size+" object(s)"+(w?"  ("+w+" joined point"+(w>1?"s":"")+" followed)":""));
      S.base=null;
    } else {
      const copies=cloneEntitiesFreshGroups([...S.sel].map(i=>S.ents[i])).map(e=>moveEnt(e,d));
      S.ents.push(...copies);
      echo("Copied "+S.sel.size+" object(s)");
      if(!S.copyMultiple){ setTool("select"); return; }
      /* Multiple: base stays fixed, so the next click is another destination from the same origin */
    }
    setPrompt(); draw(); updateProps();
    return;
  }
  if(S.tool==="line" && S.chain) return feedChainLine(p);
  if(S.tool==="scale"){
    S.pending.push(p);
    const need = S.scaleMode==="numerical" ? 1 : 3;
    if(S.pending.length>=need) commit(); else setPrompt();
    draw();
    return;
  }
  if(TOOLS[S.tool].pts===-1){                       // pline / spline: unlimited points
    if(S.pending.length && dist(S.pending[S.pending.length-1],p)<1e-9) return;
    S.pending.push(p); setPrompt(); draw(); return;
  }
  S.pending.push(p);
  if(T.pts>0 && S.pending.length>=T.pts) commit();
  else setPrompt();
  draw();
}
/* Revit-style Chain: each segment commits immediately as its own line entity,
   sharing an endpoint with the last (weld picks that up), instead of building
   one polyline. Radius auto-fillets the corner between consecutive segments. */
function feedChainLine(p){
  if(!S.pending.length){ S.pending=[applyDrawOffsetStart(p)]; setPrompt(); draw(); return; }
  let a=S.pending[0], b=p;
  if(S.drawOffset){ const o=drawOffsetVec(a,b); a=add(a,o); b=add(b,o); }
  if(dist(a,b)>1e-9){
    snap();
    S.ents.push({t:"line", li:S.cur, si:S.curStyle, a, b});
    const newIdx=S.ents.length-1;
    if(S.useRadius && S.chainRadius>0 && S.chainPrev!=null){
      filletPair(S.chainPrev, S.ents[S.chainPrev].a, newIdx, b, S.chainRadius, false, true);
    }
    S.chainPrev=newIdx;
  }
  S.pending=[p]; setPrompt(); draw();
}
function applyDrawOffsetStart(p){ return p; }
function drawOffsetVec(a,b){
  const d=norm(sub(b,a)); if(!isFinite(d.x)) return V(0,0);
  return mul(perp(d), S.drawOffset);
}
function commit(){
  const P=S.pending, li=S.cur, si=S.curStyle;
  let e=null;
  switch(S.tool){
    case "imgmove": {
      if(!S.refImage){ S.pending=[]; setTool("select"); return; }
      const d=sub(P[1],P[0]);
      snap();
      S.refImage.x+=d.x; S.refImage.y+=d.y;
      S.pending=[]; echo("Reference image moved"); setTool("select"); updateProps(); draw(); return;
    }
    case "imgcal": {
      if(!S.refImage){ S.pending=[]; setTool("select"); return; }
      const a=V(P[0].x,P[0].y), b=V(P[1].x,P[1].y), measured=dist(a,b);
      S.pending=[];
      if(measured<1e-9){ echo("Calibration points are coincident","warn"); setTool("select"); return; }
      requestString("Known distance in mm", measured.toFixed(3), v=>{
        const actual=parseFloat(v);
        if(!(actual>0)){ echo("Known distance must be greater than zero","warn"); setTool("select"); return; }
        const k=actual/measured, R=S.refImage;
        snap();
        R.x=a.x+(R.x-a.x)*k; R.y=a.y+(R.y-a.y)*k;
        R.w*=k; R.h*=k;
        echo("Reference calibrated: "+fmt(measured)+" -> "+fmt(actual)+" mm");
        setTool("select"); updateProps(); draw();
      });
      return;
    }
    case "imgstraight": {
      const R=S.refImage; S.pending=[];
      if(!R||R.locked){ echo("Reference image is unavailable or locked","warn"); setTool("select"); return; }
      const a=P[0], b=P[1], th=ang(a,b);
      if(dist(a,b)<1e-9){echo("Pick two different points","warn");setTool("select");return;}
      const target=Math.round(th/(Math.PI/2))*(Math.PI/2), dth=target-th;
      snap();
      const v=sub(V(R.x,R.y),a), co=Math.cos(dth), si=Math.sin(dth);
      R.x=a.x+v.x*co-v.y*si; R.y=a.y+v.x*si+v.y*co; R.rot=(R.rot||0)+dth;
      echo("Reference straightened by "+fmt(deg(dth))+"°"); setTool("select"); updateProps(); draw(); return;
    }
    case "imgcrop": {
      const R=S.refImage; S.pending=[];
      if(!R||R.locked){ echo("Reference image is unavailable or locked","warn"); setTool("select"); return; }
      const a=refWorldToPixel(R,P[0]), b=refWorldToPixel(R,P[1]);
      if(!a||!b){setTool("select");return;}
      const nw=R.img.naturalWidth, nh=R.img.naturalHeight;
      const x0=Math.max(0,Math.min(nw,Math.min(a.x,b.x))), x1=Math.max(0,Math.min(nw,Math.max(a.x,b.x)));
      const y0=Math.max(0,Math.min(nh,Math.min(a.y,b.y))), y1=Math.max(0,Math.min(nh,Math.max(a.y,b.y)));
      if(x1-x0<4||y1-y0<4){echo("Crop is too small","warn");setTool("select");return;}
      snap();
      R.crop={sx:x0,sy:y0,sw:x1-x0,sh:y1-y0};
      echo("Reference cropped to working area"); setTool("select"); updateProps(); draw(); return;
    }
    case "line": {
      let a=P[0], b=P[1];
      if(S.drawOffset){ const o=drawOffsetVec(a,b); a=add(a,o); b=add(b,o); }
      if(dist(a,b)>1e-9) e={t:"line",li,si,a,b};
      break;
    }
    case "rect": e={t:"pline",li,si,closed:true,pts:[
        V(P[0].x,P[0].y),V(P[1].x,P[0].y),V(P[1].x,P[1].y),V(P[0].x,P[1].y)]}; break;
    case "circle":{const r=dist(P[0],P[1]); if(r>1e-9) e={t:"circle",li,si,c:P[0],r};break;}
    case "arc":{const a=arc3(P[0],P[2],P[1]); if(a) e={t:"arc",li,si,...a}; break;}
    case "arccenter":{
      const r=dist(P[0],P[1]);
      if(r>1e-9) e={t:"arc",li,si,c:P[0],r,a0:wrap(ang(P[0],P[1])),a1:wrap(ang(P[0],P[2]))};
      break;
    }
    case "ellipse": case "pellipse":{
      const rx=dist(P[0],P[1]), rot=ang(P[0],P[1]);
      const axisDir=V(Math.cos(rot),Math.sin(rot)), nrm=perp(axisDir);
      const v1=sub(P[2],P[0]), ry=Math.abs(v1.x*nrm.x+v1.y*nrm.y);
      if(rx<1e-9||ry<1e-9){ echo("Ellipse has zero width","warn"); break; }
      if(S.tool==="ellipse"){ e={t:"ellipse",li,si,c:P[0],rx,ry,rot,a0:0,sw:TAU}; break; }
      const localAngle=q=>{ const v=sub(q,P[0]); return Math.atan2((v.x*nrm.x+v.y*nrm.y)/ry, (v.x*axisDir.x+v.y*axisDir.y)/rx); };
      const a0=wrap(localAngle(P[3])), a1=wrap(localAngle(P[4]));
      e={t:"ellipse",li,si,c:P[0],rx,ry,rot,a0,sw:wrap(a1-a0)};
      break;
    }
    case "polygon":{
      const n=S.polySides, R=dist(P[0],P[1]), a0=ang(P[0],P[1]);
      if(R<1e-9){ echo("Polygon has zero size","warn"); break; }
      const circumR = S.polyInscribed? R : R/Math.cos(Math.PI/n);
      const rotOff = S.polyInscribed? 0 : Math.PI/n;
      const pts=[];
      for(let k=0;k<n;k++){ const th=a0-rotOff+k*(TAU/n); pts.push(V(P[0].x+circumR*Math.cos(th), P[0].y+circumR*Math.sin(th))); }
      e={t:"pline",li,si,closed:true,pts};
      break;
    }
    case "pline": if(P.length>1) e={t:"pline",li,si,closed:false,pts:P.slice()}; break;
    case "spline": if(P.length>1){
        const closed=dist(P[0],P[P.length-1])<=px(11);
        e={t:"spline",li,si,closed,pts:closed?P.slice(0,-1):P.slice()};
      } break;
    case "dim":{
      const d=norm(sub(P[1],P[0])), n=perp(d), off=(sub(P[2],P[0]).x*n.x+sub(P[2],P[0]).y*n.y);
      e={t:"dim",li,a:P[0],b:P[1],off,h:S.textHeight}; break;
    }
    case "mirror":{
      const A=P[0], B=P[1];
      if(dist(A,B)<1e-9){ echo("Mirror line has no length","warn"); S.pending=[]; return; }
      snap();
      const src=[...S.sel].map(i=>S.ents[i]);
      const made=(S.copyMirror?cloneEntitiesFreshGroups(src):src.map(clone)).map(e=>mirEnt(e,A,B));
      if(S.copyMirror) S.ents.push(...made);
      else { const keep=S.ents.filter((_,i)=>!S.sel.has(i)); S.ents=keep.concat(made); }
      S.pending=[]; setTool("select"); draw(); updateProps();
      echo((S.copyMirror?"Mirrored a copy of ":"Mirrored ")+made.length+" object(s)");
      return;
    }
    case "rotate":{
      const th=ang(P[0],P[1]);
      snap();
      if(S.copyRotate) S.ents.push(...cloneEntitiesFreshGroups([...S.sel].map(i=>S.ents[i])).map(e=>rotEnt(e,P[0],th)));
      else for(const i of S.sel) rotEnt(S.ents[i],P[0],th);
      S.pending=[]; draw(); updateProps();
      echo((S.copyRotate?"Rotated a copy of ":"Rotated ")+S.sel.size+" object(s) by "+fmt(deg(wrap(th)))+"\u00B0");
      return;
    }
    case "scale":{
      snap();
      let k, desc;
      if(S.scaleMode==="numerical"){
        k=S.lastScaleFactor;
        if(!k||k===0){ echo("Set a scale factor first","warn"); S.pending=[]; return; }
        desc="by "+fmt(k);
      } else {
        const origin=P[0], from=dist(origin,P[1]), to=dist(origin,P[2]);
        if(from<1e-9){ echo("Reference point is on the origin","warn"); S.pending=[]; return; }
        k=to/from; S.lastScaleFactor=k;
        desc="by "+fmt(k)+"  ("+fmt(from)+" \u2192 "+fmt(to)+")";
      }
      for(const i of S.sel) sclEnt(S.ents[i],P[0],k);
      S.pending=[]; draw(); updateProps();
      echo("Scaled "+S.sel.size+" object(s) "+desc);
      return;
    }
    case "text":{
      const at=P[0];
      S.pending=[];
      requestString("Text", "", s=>{
        if(s){ snap(); S.ents.push({t:"text",li,p:at,h:S.textHeight,s,rot:0}); echo("Text added"); }
        setPrompt(); draw();
      });
      return;
    }
  }
  if(e){ snap(); S.ents.push(e); echo(TOOLS[S.tool].label+" added"); }
  S.pending=[]; setPrompt(); draw();
}
function finishPline(){
  if((S.tool==="pline"||S.tool==="spline")&&S.pending.length>1) commit();
  else { S.pending=[]; setPrompt(); draw(); }
}
function finishChain(){
  S.pending=[]; S.chainPrev=null; setPrompt(); draw();
}
function cancel(){
  if(S.x&&S.x.surferPick){S.x.surferPick=false;cv.classList.remove("picking");}
  if(S.ask){ S.ask=null; setPrompt(); echo(""); return; }
  if(isMeasureTool(S.tool)){
    const active=S.pending.length||S.measureSegs.length||S.measureTotal>0;
    if(active){ clearMeasurement(true); S.measureEscArmed=true; setPrompt(); paintOptbar(); draw(); echo("Measurement cleared · Esc again to exit Measure"); return; }
    if(S.measureEscArmed){ S.measureEscArmed=false; setTool("select"); echo(""); return; }
    S.measureEscArmed=true; echo("Esc again to exit Measure"); return;

function eraseSel(){
  if(!S.sel.size) return;
  snap();
  const keep=S.ents.filter((_,i)=>!S.sel.has(i));
  const n=S.sel.size; S.ents=keep; S.sel.clear(); resetNudge();
  const orphans=flowPrune();

  echo("Erased "+n+" object(s)"+(orphans?"  ("+orphans+" connector"+(orphans>1?"s":"")+" dropped)":""));

/* ============================================================ intersections */
function lineLineInt(p1,p2,p3,p4){
  const d1=sub(p2,p1), d2=sub(p4,p3), den=d1.x*d2.y-d1.y*d2.x;
  if(Math.abs(den)<1e-12) return null;
  const dp=sub(p3,p1);
  const t=(dp.x*d2.y-dp.y*d2.x)/den, u=(dp.x*d1.y-dp.y*d1.x)/den;
  return {p:add(p1,mul(d1,t)), t, u};
}
function lineCircleInt(p1,p2,c,r){
  const d=sub(p2,p1), f=sub(p1,c);
  const A=d.x*d.x+d.y*d.y, B=2*(f.x*d.x+f.y*d.y), C=f.x*f.x+f.y*f.y-r*r;
  let disc=B*B-4*A*C; if(disc<0||A<1e-18) return [];
  disc=Math.sqrt(disc);
  const ts=[(-B-disc)/(2*A)];
  if(disc>1e-12) ts.push((-B+disc)/(2*A));
  return ts.map(t=>({t,p:add(p1,mul(d,t))}));
}
function circleCircleInt(c1,r1,c2,r2){
  const D=dist(c1,c2);
  if(D<1e-12 || D>r1+r2+1e-12 || D<Math.abs(r1-r2)-1e-12) return [];
  const a=(r1*r1-r2*r2+D*D)/(2*D), h=Math.sqrt(Math.max(0,r1*r1-a*a));
  const u=norm(sub(c2,c1)), pm=add(c1,mul(u,a)), n=perp(u);
  return h<1e-12 ? [pm] : [add(pm,mul(n,h)), sub(pm,mul(n,h))];
}
function curvesOf(e){
  switch(e.t){
    case "line":   return [{k:"seg",a:e.a,b:e.b}];
    case "circle": return [{k:"circ",c:e.c,r:e.r}];
    case "arc":    return [{k:"arc",c:e.c,r:e.r,a0:e.a0,a1:e.a1}];
    case "pline":{
      const out=[], n=e.pts.length;
      for(let i=0;i<n-1;i++) out.push({k:"seg",a:e.pts[i],b:e.pts[i+1]});
      if(e.closed&&n>2) out.push({k:"seg",a:e.pts[n-1],b:e.pts[0]});
      return out;
    }
    case "ellipse": case "spline":{
      const P=flatten(e), out=[];
      for(let i=0;i<P.length-1;i++) out.push({k:"seg",a:P[i],b:P[i+1]});
      if(e.t==="spline"&&e.closed&&P.length>2) out.push({k:"seg",a:P[P.length-1],b:P[0]});
      return out;
    }
  }
  return [];
}
function onCurve(C,p,ext){
  if(ext) return true;
  if(C.k==="seg"){
    const d=sub(C.b,C.a), L2=d.x*d.x+d.y*d.y||1;
    const t=((p.x-C.a.x)*d.x+(p.y-C.a.y)*d.y)/L2;
    return t>=-1e-7 && t<=1+1e-7;
  }
  if(C.k==="circ") return true;
  if(C.k==="arc")  return arcContains({a0:C.a0,a1:C.a1}, wrap(ang(C.c,p)));
  return false;
}
function curveInt(A,B,extA,extB){
  let pts=[];
  if(A.k==="seg"&&B.k==="seg"){ const r=lineLineInt(A.a,A.b,B.a,B.b); if(r) pts=[r.p]; }
  else if(A.k==="seg") pts=lineCircleInt(A.a,A.b,B.c,B.r).map(o=>o.p);
  else if(B.k==="seg") pts=lineCircleInt(B.a,B.b,A.c,A.r).map(o=>o.p);
  else pts=circleCircleInt(A.c,A.r,B.c,B.r);
  return pts.filter(p=>onCurve(A,p,extA)&&onCurve(B,p,extB));
}
function entInt(e1,e2,ext1,ext2){
  const out=[];
  for(const A of curvesOf(e1)) for(const B of curvesOf(e2)) out.push(...curveInt(A,B,ext1,ext2));
  return out;
}
function paramOn(e,p){
  if(e.t==="line"){ const d=sub(e.b,e.a); return ((p.x-e.a.x)*d.x+(p.y-e.a.y)*d.y)/(d.x*d.x+d.y*d.y||1); }
  if(e.t==="circle") return wrap(ang(e.c,p));
  if(e.t==="arc")    return wrap(ang(e.c,p)-e.a0);
  return 0;
}
function projOnLine(e,p){
  const d=sub(e.b,e.a), t=((p.x-e.a.x)*d.x+(p.y-e.a.y)*d.y)/(d.x*d.x+d.y*d.y||1);
  return add(e.a,mul(d,t));
}
function drawingSpan(){
  if(!S.ents.length) return 1000;
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  for(const e of S.ents){const b=entBox(e);
    x0=Math.min(x0,b.x0);y0=Math.min(y0,b.y0);x1=Math.max(x1,b.x1);y1=Math.max(y1,b.y1);}
  return Math.max(1000, Math.hypot(x1-x0,y1-y0)*20);
}
function others(idx){
  return S.ents.map((e,j)=>({e,j})).filter(o=>o.j!==idx && (S.layers[o.e.li]||{on:true}).on);
}

/* ============================================================ welding */
/* Coincident points move together: this is what makes attached walls and
   their dimensions follow when one wall is moved. */
function nodeRefs(e){
  const out=[];
  const R=(get,set)=>out.push({p:get,set});
  switch(e.t){
    case "line": case "dim": R(e.a,v=>e.a=v); R(e.b,v=>e.b=v); break;
    case "text": R(e.p,v=>e.p=v); break;
    case "circle": case "arc": R(e.c,v=>e.c=v); break;
    case "pline": case "spline": e.pts.forEach((p,i)=>R(p,v=>e.pts[i]=v)); break;
    case "ellipse": R(e.c,v=>e.c=v); break;
  }
  return out;
}
const WELD_TOL=1e-6;
function applyDelta(indices,d,weld){
  const idx=new Set(laneExpand(indices));
  const anchors=[];
  for(const i of idx){ const e=S.ents[i]; if(!e) continue;
    anchors.push(...entPoints(e), ...entCenters(e)); }
  for(const i of idx) if(S.ents[i]) moveEnt(S.ents[i],d);
  if(!weld || !S.weld) return 0;
  let welded=0;
  S.ents.forEach((e,j)=>{
    if(idx.has(j)) return;
    if((S.layers[e.li]||{}).lock) return;
    for(const ref of nodeRefs(e)){
      if(anchors.some(a=>Math.abs(a.x-ref.p.x)<WELD_TOL && Math.abs(a.y-ref.p.y)<WELD_TOL)){
        ref.set(add(ref.p,d)); welded++;
      }
    }
  });
  return welded;
}

/* ============================================================ transforms */
function mapEnt(e,M){
  if(e.a) e.a=M(e.a); if(e.b) e.b=M(e.b);
  if(e.c) e.c=M(e.c); if(e.p) e.p=M(e.p);
  if(e.pts) e.pts=e.pts.map(M);
  if(e.lead) e.lead=M(e.lead);
  if(e.t==="edge"){
    if(e.from&&e.from.pt) e.from.pt=M(e.from.pt);
    if(e.to&&e.to.pt)     e.to.pt=M(e.to.pt);
  }
  return e;
}
function rotEnt(e,base,th){
  const c=Math.cos(th), s=Math.sin(th);
  mapEnt(e,p=>{const v=sub(p,base); return add(base,V(v.x*c-v.y*s, v.x*s+v.y*c));});
  if(e.t==="arc"){ e.a0=wrap(e.a0+th); e.a1=wrap(e.a1+th); }
  if(e.t==="ellipse") e.rot=(e.rot||0)+th;
  if(e.t==="text") e.rot=(e.rot||0)+th;
  return e;
}
function sclEnt(e,base,k){
  mapEnt(e,p=>add(base,mul(sub(p,base),k)));
  if(e.r!=null) e.r*=Math.abs(k);
  if(e.rx!=null){ e.rx*=Math.abs(k); e.ry*=Math.abs(k); }
  if(e.h!=null) e.h*=Math.abs(k);
  if(e.off!=null) e.off*=k;
  if(e.mk && e.mk.w) e.mk.w*=Math.abs(k);
  if(e.bump) e.bump*=Math.abs(k);
  if(e.hl) e.hl*=Math.abs(k);
  if(e.t==="node"){ e.w*=Math.abs(k); e.fs*=Math.abs(k); }
  if(e.t==="edge" && e.fs) e.fs*=Math.abs(k);
  return e;
}
function mirEnt(e,A,B){
  const phi=ang(A,B), c2=Math.cos(2*phi), s2=Math.sin(2*phi);
  mapEnt(e,p=>{const v=sub(p,A); return add(A,V(v.x*c2+v.y*s2, v.x*s2-v.y*c2));});
  if(e.t==="arc"){ const a0=wrap(2*phi-e.a1), a1=wrap(2*phi-e.a0); e.a0=a0; e.a1=a1; }
  if(e.t==="ellipse"){ const sw=e.sw==null?TAU:e.sw; e.a0=-( (e.a0||0)+sw ); e.rot=2*phi-(e.rot||0); }
  if(e.t==="text") e.rot=wrap(2*phi-(e.rot||0));
  if(e.t==="dim")  e.off=-e.off;
  return e;
}
const clone=e=>JSON.parse(JSON.stringify(e));
function freshGroupId(){ return "G"+(S.groupSeq++); }
function cloneEntitiesFreshGroups(src){
  const remap=new Map();
  const copies=src.map(e=>{
    const c=clone(e);
    if(c.gid){ if(!remap.has(c.gid)) remap.set(c.gid,freshGroupId()); c.gid=remap.get(c.gid); }
    return c;
  });
  return cloneFlowFreshIds(src, copies);
}
/* A duplicated node needs a duplicated identity, or both copies answer to the
   same connectors. Edges inside the batch follow the copies; edges pointing at
   nodes outside it stay pointed at the originals. */
function cloneFlowFreshIds(src, copies){
  const idmap=new Map();
  src.forEach((e,i)=>{
    if(e.t==="node"){ const id=flowNewId(); idmap.set(e.id,id); copies[i].id=id; }
  });
  if(!idmap.size) return copies;
  for(const c of copies){
    if(c.t!=="edge") continue;
    if(c.from&&c.from.id!=null&&idmap.has(c.from.id)) c.from={id:idmap.get(c.from.id)};
    if(c.to&&c.to.id!=null&&idmap.has(c.to.id))       c.to={id:idmap.get(c.to.id)};
  }
  return copies;
}
function groupIndices(gid){
  const out=[]; if(!gid) return out;
  S.ents.forEach((e,i)=>{if(e.gid===gid)out.push(i)}); return out;
}
function expandSelectionGroups(){
  const gids=new Set([...S.sel].map(i=>S.ents[i]&&S.ents[i].gid).filter(Boolean));
  for(const gid of gids) for(const i of groupIndices(gid)) S.sel.add(i);
}
function groupSelection(){
  if(S.sel.size<2) return echo("Select two or more objects to group","warn");
  requestString("Group name", "Group "+S.groupSeq, name=>{
    snap();
    const gid=freshGroupId(), nm=(name||gid).trim()||gid;
    for(const i of S.sel){ if(S.ents[i]){S.ents[i].gid=gid;S.ents[i].gname=nm;} }
    draw(); updateProps(); echo("Grouped "+S.sel.size+" objects as "+nm);
  });
}
function ungroupSelection(){
  if(!S.sel.size) return echo("Select a group first","warn");
  expandSelectionGroups(); let n=0; snap();
  for(const i of S.sel){ const e=S.ents[i]; if(e&&e.gid){delete e.gid;delete e.gname;n++;} }
  draw(); updateProps(); echo(n?"Ungrouped "+n+" objects":"Selection is not grouped");
}

/* ============================================================ modify ops */
/* Revit's Trim/Extend to Corner: pick the part of each of two elements you want
   to keep, and both get pulled in or pushed out - whichever each one needs - to
   meet at a single clean joint. This is fillet with a zero radius: filletPair's
   cut() already sets each near endpoint to the corner regardless of whether that
   endpoint currently falls short of it (extend) or past it (trim). */
function cornerCut(e,pick,q){
  const tp=paramOn(e,pick), tq=paramOn(e,q);
  if(e.t==="line"){ if(tp<tq) e.b=q; else e.a=q; return true; }
  if(e.t==="arc"){ const a=wrap(ang(e.c,q)); if(tp<tq) e.a1=a; else e.a0=a; return true; }
  return false;
}
function trimExtendCorner(i1,p1,i2,p2){
  const e1=S.ents[i1], e2=S.ents[i2];
  /* Two lines keep the proven fillet-at-zero-radius path. */
  if(e1.t==="line" && e2.t==="line"){
    const ok=filletPair(i1,p1,i2,p2,0,false);
    if(ok) echo("Joined at corner");
    return ok;
  }
  /* Anything involving an arc: find the crossing nearest both picks, then move
     each element's far end onto it - trim or extend, whichever it needs. */
  const okType=t=>t==="line"||t==="arc";
  if(!okType(e1.t)||!okType(e2.t)) return echo("Trim to Corner works on lines and arcs","warn");
  const cand=entInt(e1,e2,true,true);
  if(!cand.length) return echo("Those elements do not meet, even extended","warn");
  let q=null, bd=1e18;
  for(const c of cand){ const d=dist(c,p1)+dist(c,p2); if(d<bd){ bd=d; q=c; } }
  if(dist(q,p1)<1e-9 || dist(q,p2)<1e-9) return echo("Pick away from the corner","warn");
  snap();
  cornerCut(e1,p1,q); cornerCut(e2,p2,q);
  S.sel.clear(); draw(); updateProps(); echo("Joined at corner");
  return true;
}

/* Shared by Trim/Extend Single Element and Trim/Extend Multiple Elements: move
   the picked-near end of a line or arc to meet ONE boundary reference. Also
   auto-detects trim vs extend from geometry - there is no separate mode. */
function trimExtendToBoundary(ti,bi,pickPt){
  const e=S.ents[ti], b=S.ents[bi];
  if(ti===bi) return echo("Pick a different element as the target","warn");
  if(!(e.t==="line"||e.t==="arc")) return echo("Trim/Extend works on lines and arcs","warn");
  const cand=entInt(e,b,true,true);
  if(!cand.length) return echo("That boundary does not reach this element","warn");
  const tp=paramOn(e,pickPt);
  let best=null, bd=1e18;
  for(const q of cand){ const d=Math.abs(paramOn(e,q)-tp); if(d<bd){ bd=d; best=q; } }
  /* Which end moves depends on which side of the BOUNDARY's own crossing point the
     pick falls on - not a fixed midpoint of the target's current extent. Comparing
     against 0.5 only ever looked right for extend (target entirely on one side); a
     boundary crossing off-centre needs the comparison to be against its own param. */
  const tBoundary=paramOn(e,best);
  snap();
  if(e.t==="line"){
    if(tp<tBoundary) e.b=best; else e.a=best;
  } else {
    const a0new=wrap(ang(e.c,best));
    if(tp<tBoundary) e.a1=a0new; else e.a0=a0new;
  }
  S.sel.clear(); draw(); updateProps(); echo("Trimmed/extended to boundary");
  return true;
}
function offsetEnt(e,d,side){
  if(e.t==="line"){
    const n=perp(norm(sub(e.b,e.a)));
    const sg=Math.sign(sub(side,e.a).x*n.x+sub(side,e.a).y*n.y)||1;
    const o=mul(n,d*sg);
    return {t:"line",li:e.li,si:e.si,a:add(e.a,o),b:add(e.b,o)};
  }
  if(e.t==="circle"||e.t==="arc"){
    const sg = dist(side,e.c)>e.r ? 1 : -1;
    const r=e.r+d*sg;
    if(r<=1e-9) return null;
    return e.t==="circle" ? {t:"circle",li:e.li,si:e.si,c:e.c,r}
                          : {t:"arc",li:e.li,si:e.si,c:e.c,r,a0:e.a0,a1:e.a1};
  }
  if(e.t==="pline"){
    const segs=curvesOf(e);
    if(!segs.length) return null;
    let nearest=0, nd=1e18;
    segs.forEach((C,i)=>{const q=ptSegDist(side,C.a,C.b); if(q<nd){nd=q;nearest=i;}});
    const C0=segs[nearest], n0=perp(norm(sub(C0.b,C0.a)));
    const sg=Math.sign(sub(side,C0.a).x*n0.x+sub(side,C0.a).y*n0.y)||1;
    const off=segs.map(C=>{const n=perp(norm(sub(C.b,C.a))), o=mul(n,d*sg);
      return {a:add(C.a,o), b:add(C.b,o)};});
    const pts=[];
    const closed=!!e.closed;
    if(!closed) pts.push(off[0].a);
    for(let i=0;i<off.length-(closed?0:1);i++){
      const A=off[i], B=off[(i+1)%off.length];
      const X=lineLineInt(A.a,A.b,B.a,B.b);
      pts.push(X? X.p : A.b);
    }
    if(!closed) pts.push(off[off.length-1].b);
    if(closed) pts.unshift(pts.pop());
    return {t:"pline",li:e.li,si:e.si,closed,pts};
  }
  return null;
}
function filletPair(i1,p1,i2,p2,r,chamfer,silent){
  const e1=S.ents[i1], e2=S.ents[i2];
  const bail=msg=>{ if(!silent) echo(msg,"warn"); return false; };
  if(e1.t!=="line"||e2.t!=="line") return bail((chamfer?"Chamfer":"Fillet")+" works on two lines");
  const X=lineLineInt(e1.a,e1.b,e2.a,e2.b);
  if(!X) return bail("Those lines are parallel");
  const P=X.p;
  const u1=norm(sub(projOnLine(e1,p1),P)), u2=norm(sub(projOnLine(e2,p2),P));
  if(!isFinite(u1.x)||!isFinite(u2.x)) return bail("Pick away from the corner");
  let th=Math.acos(Math.max(-1,Math.min(1,u1.x*u2.x+u1.y*u2.y)));
  if(th<1e-6||Math.abs(th-Math.PI)<1e-6) return bail("Those lines are collinear");
  let t = chamfer ? r : r/Math.tan(th/2);
  const room = Math.min(dist(e1.a,e1.b), dist(e2.a,e2.b)) * 0.95;
  if(t>room){ if(silent) return bail("Radius too large for that corner"); t=Math.max(0,room); r = chamfer? t : t*Math.tan(th/2); }
  const T1=add(P,mul(u1,t)), T2=add(P,mul(u2,t));
  const cut=(e,u,T)=>{
    const da=sub(e.a,P).x*u.x+sub(e.a,P).y*u.y, db=sub(e.b,P).x*u.x+sub(e.b,P).y*u.y;
    if(da>db) e.b=T; else e.a=T;
  };
  snap();
  cut(e1,u1,T1); cut(e2,u2,T2);
  if(r>1e-9){
    if(chamfer) S.ents.push({t:"line",li:e1.li,si:e1.si,a:T1,b:T2});
    else{
      const bis=norm(add(u1,u2)), cen=add(P,mul(bis,r/Math.sin(th/2)));
      const mid=add(cen,mul(norm(sub(P,cen)),r));
      const A=arc3(T1,mid,T2);
      if(A) S.ents.push({t:"arc",li:e1.li,si:e1.si,...A});
    }
  }
  if(!silent){ S.sel.clear(); draw(); updateProps(); echo(chamfer?"Chamfered":"Filleted"); }
  return true;
}
function explodeSel(){
  if(!S.sel.size) return echo("Select objects first","warn");
  snap();
  const out=[], idx=new Set(S.sel);
  let n=0;
  S.ents.forEach((e,i)=>{
    if(!idx.has(i)) return out.push(e);
    if(e.t==="pline"||e.t==="ellipse"||e.t==="spline"){
      const segs=curvesOf(e);
      segs.forEach(C=>out.push({t:"line",li:e.li,si:e.si,a:C.a,b:C.b}));
      n++;
    } else if(e.t==="dim"){
      const {d,p1,p2,o}=dimGeom(e), nn=norm(o), h=e.h||S.textHeight;
      out.push({t:"line",li:e.li,a:add(e.a,mul(o,.06)),b:add(p1,mul(nn,h*.6))});
      out.push({t:"line",li:e.li,a:add(e.b,mul(o,.06)),b:add(p2,mul(nn,h*.6))});
      out.push({t:"line",li:e.li,a:p1,b:p2});
      const tk=h*.6;
      for(const q of [p1,p2])
        out.push({t:"line",li:e.li,a:add(q,mul(add(d,perp(d)),tk)),b:sub(q,mul(add(d,perp(d)),tk))});
      out.push({t:"text",li:e.li,p:mul(add(p1,p2),.5),h,s:dist(e.a,e.b).toFixed(1),rot:0});
      n++;
    } else out.push(e);
  });
  S.ents=out; S.sel.clear(); draw(); updateProps();
  echo(n?("Exploded "+n+" object(s)"):"Nothing there to explode");
}

/* ---- arrow-key nudge ---------------------------------------------------- */
const fmt = n => { const s=n.toFixed(4).replace(/\.?0+$/,""); return s==="-0"?"0":s; };
let nudgeAt=0, nudgeSum=null;
function resetNudge(){ nudgeAt=0; nudgeSum=null; }
function nudgeStep(e){
  let s = S.gridSnap ? gridPitch() : Math.max(1e-9, S.gridStep);
  if(e.shiftKey) s*=10;
  if(e.ctrlKey||e.metaKey) s/=10;
  return s;
}
function nudge(dx,dy,e){
  if(!S.sel.size) return;
  const live=[...S.sel].filter(i=>S.ents[i] && !(S.layers[S.ents[i].li]||{}).lock);
  if(!live.length) return echo("Selection is on a locked layer","warn");
  const st=nudgeStep(e), d=V(dx*st, dy*st);
  const now=Date.now();
  if(now-nudgeAt>700 || !nudgeSum){ snap(); nudgeSum=V(0,0); }   // one undo per burst
  nudgeAt=now;
  const w=applyDelta(live, d, true);
  nudgeSum=add(nudgeSum,d);
  if(w) echo("Nudge "+fmt(nudgeSum.x)+", "+fmt(nudgeSum.y)+"   "+w+" joined point"+(w>1?"s":"")+" followed");
  draw(); updateProps();
  if(!w) echo("Nudge "+fmt(nudgeSum.x)+", "+fmt(nudgeSum.y)+"   step "+fmt(st));
}

/* ============================================================ render */
function draw(){
  if(!S.exporting){
    const cnt=document.getElementById("counts");
    if(cnt) cnt.textContent=S.ents.length+" objects \u00B7 "+S.layers.length+" layers"
      +(S.refImage?(" \u00B7 reference"+(S.refImage.locked?" locked":"")):"")
      +(autoStamp?(" \u00B7 "+autoStamp):"");
  }
  ctx.clearRect(0,0,W,H);
  if(S.exporting && S.exporting.bg && S.exporting.bg!=="transparent"){
    ctx.fillStyle=S.exporting.bg; ctx.fillRect(0,0,W,H);
  }
  drawReferenceImage();
  drawGrid();
  /* Lanes are the backdrop a diagram stands on, so they are painted before
     everything else regardless of the order they were drawn in. */
  S.ents.forEach((e,i)=>{
    if(!(e.t==="node" && e.k==="lane")) return;
    const L=S.layers[e.li]||S.layers[0];
    if(!L.on) return;
    flowPaintEnt(e, S.sel.has(i), i===S.hover);
  });
  const tol=px(tolPx(6));
  S.ents.forEach((e,i)=>{
    const L=S.layers[e.li]||S.layers[0];
    if(!L.on) return;
    if(e.t==="node" && e.k==="lane") return;
    const selected=S.sel.has(i);
    const hot = i===S.hover || i===S.op.first;
    if(flowIsEnt(e)){ flowPaintEnt(e,selected,hot); return; }
    if(mkIsEnt(e)){
      const doomed = mkDraw && mkDraw.doomed && mkDraw.doomed.has(i);
      if(doomed){ ctx.save(); ctx.globalAlpha=.2; mkPaintEnt(e); ctx.restore(); }
      else mkPaintEnt(e);
      if(selected||hot) mkPaintSelection(e);
      if(selected) paintGrips(e);
      return;
    }
    const st = styleOf(e);
    ctx.strokeStyle = selected ? getCSS("--pen") : hot ? getCSS("--snap")
                    : aciColor(st? st.aci : L.aci);
    ctx.fillStyle   = ctx.strokeStyle;
    ctx.lineWidth   = (selected||hot) ? 2 : (st? Math.max(1, st.w*MM) : 1.15);
    ctx.setLineDash(selected?[6,3]:hot?[3,3]:(st&&st.pat? st.pat.map(v=>v*MM) : []));
    paintEnt(e);
    ctx.setLineDash([]);
    if(selected) grips(e);
  });
  if(S.exporting) return;
  drawPreview();
  paintMeasurement();
  mkPaintLive();
  flowPaintLive();
  drawBand();
  drawSnapMarker();
  drawCross();
  mobilePaint();
  xPaint();
}
function drawReferenceImage(){
  const R=S.refImage;
  if(!R||!R.visible||!R.img||!R.img.complete) return;
  ctx.save();
  ctx.globalAlpha=Math.max(0.05,Math.min(1,R.opacity));
  ctx.imageSmoothingEnabled=true;
  const filters={normal:"none",fade:"grayscale(.25) contrast(.8) brightness(1.12)",gray:"grayscale(1) contrast(1.08)",contrast:"grayscale(1) contrast(1.65) brightness(1.05)",invert:"grayscale(1) invert(1) contrast(1.15)"};
  ctx.filter=filters[R.mode||"normal"]||"none";
  ctx.translate(X(R.x),Y(R.y)); ctx.rotate(-(R.rot||0));
  const sc=S.view.s, nw=R.img.naturalWidth, nh=R.img.naturalHeight;
  if(R.crop){
    const c=R.crop, dx=(-R.w/2+c.sx/nw*R.w)*sc, dy=(-R.h/2+c.sy/nh*R.h)*sc;
    ctx.drawImage(R.img,c.sx,c.sy,c.sw,c.sh,dx,dy,c.sw/nw*R.w*sc,c.sh/nh*R.h*sc);
  } else ctx.drawImage(R.img,-R.w*sc/2,-R.h*sc/2,R.w*sc,R.h*sc);
  ctx.restore();
}
function styleOf(e){ return (e.si!=null && S.styles[e.si]) ? S.styles[e.si] : null; }
function getCSS(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}

function drawGrid(){
  if(!S.gridShow) return;
  if(S.exporting && !S.exporting.grid) return;
  const g=gridPitch();
  const x0=wX(0), x1=wX(W), y0=wY(H), y1=wY(0);
  ctx.lineWidth=1;
  for(let pass=0;pass<2;pass++){
    const step = pass? g*10 : g;
    if(step*S.view.s < (pass?24:6)) continue;
    ctx.strokeStyle = pass? getCSS("--grid-major") : getCSS("--grid-minor");
    ctx.beginPath();
    for(let x=Math.ceil(x0/step)*step; x<=x1; x+=step){
      if(!pass && Math.abs(x/(step*10) - Math.round(x/(step*10)))<1e-6) continue;
      const sx=Math.round(X(x))+.5; ctx.moveTo(sx,0); ctx.lineTo(sx,H);
    }
    for(let y=Math.ceil(y0/step)*step; y<=y1; y+=step){
      if(!pass && Math.abs(y/(step*10) - Math.round(y/(step*10)))<1e-6) continue;
      const sy=Math.round(Y(y))+.5; ctx.moveTo(0,sy); ctx.lineTo(W,sy);
    }
    ctx.stroke();
  }
  ctx.strokeStyle=getCSS("--axis"); ctx.beginPath();
  const ax=Math.round(X(0))+.5, ay=Math.round(Y(0))+.5;
  if(ax>0&&ax<W){ctx.moveTo(ax,0);ctx.lineTo(ax,H);}
  if(ay>0&&ay<H){ctx.moveTo(0,ay);ctx.lineTo(W,ay);}
  ctx.stroke();
}
function paintEnt(e){
  ctx.beginPath();
  switch(e.t){
    case "line": ctx.moveTo(X(e.a.x),Y(e.a.y)); ctx.lineTo(X(e.b.x),Y(e.b.y)); ctx.stroke(); break;
    case "pline":{
      e.pts.forEach((p,i)=> i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y)));

function pickAt(w, additive){
  resetNudge();
  const tol=px(tolPx(7));
  for(let i=S.ents.length-1;i>=0;i--){
    const e=S.ents[i], L=S.layers[e.li];
    if(!L||!L.on||L.lock) continue;
    if(entHit(e,w,tol)){
      if(!additive) S.sel.clear();
      const ids=e.gid?groupIndices(e.gid):[i], removing=additive && ids.every(j=>S.sel.has(j));
      for(const j of ids){ if(removing) S.sel.delete(j); else S.sel.add(j); }
      return true;
    }
  }
  if(!additive) S.sel.clear();
  return false;
}
function pickBox(a,b,additive){
  resetNudge();
  const cross=b.x<a.x;
  const x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y);
  if(!additive) S.sel.clear();
  S.ents.forEach((e,i)=>{
    const L=S.layers[e.li]; if(!L||!L.on||L.lock) return;
    const bb=entBox(e);
    const inside = bb.x0>=x0&&bb.x1<=x1&&bb.y0>=y0&&bb.y1<=y1;
    const overlap= !(bb.x1<x0||bb.x0>x1||bb.y1<y0||bb.y0>y1);
    if(cross?overlap:inside) S.sel.add(i);
  });
  expandSelectionGroups();
}

function hitIndex(p){
  const tol=px(tolPx(7));
  for(let i=S.ents.length-1;i>=0;i--){
    const e=S.ents[i], L=S.layers[e.li];
    if(!L||!L.on||L.lock) continue;
    if(entHit(e,p,tol)) return i;

}

  const tol=px(tolPx(7));
